<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Anatomia de un invierno de la inteligencia artificial: ciclo de promesa publica, financiamiento, tope tecnico y recorte, instanciado con los datos de 1974 y de 1987">
<rect x="0" y="0" width="1100" height="520" rx="16" fill="#211033"/>
<text x="550.0" y="34.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Anatomia de un invierno</text>
<text x="550.0" y="54.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="400" text-anchor="middle">El mismo ciclo, dos veces: 1974 y 1987</text>
<rect x="462.0" y="102.0" width="176" height="56" rx="12" fill="#211033" stroke="#f04cff" stroke-width="2"/>
<text x="550.0" y="135.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Promesa publica</text>
<rect x="637.0" y="232.0" width="176" height="56" rx="12" fill="#211033" stroke="#f04cff" stroke-width="2"/>
<text x="725.0" y="265.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Financiamiento</text>
<rect x="462.0" y="362.0" width="176" height="56" rx="12" fill="#211033" stroke="#f04cff" stroke-width="2"/>
<text x="550.0" y="395.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Tope tecnico</text>
<rect x="287.0" y="232.0" width="176" height="56" rx="12" fill="#211033" stroke="#f04cff" stroke-width="2"/>
<text x="375.0" y="265.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Recorte</text>
<line x1="594.1" y1="162.8" x2="672.9" y2="221.3" stroke="#f04cff" stroke-width="2.5"/>
<polygon points="680.9,227.2 676.1,216.9 669.6,225.7" fill="#f04cff"/>
<line x1="680.9" y1="292.8" x2="602.1" y2="351.3" stroke="#f04cff" stroke-width="2.5"/>
<polygon points="594.1,357.2 605.4,355.7 598.9,346.9" fill="#f04cff"/>
<line x1="505.9" y1="357.2" x2="427.1" y2="298.7" stroke="#f04cff" stroke-width="2.5"/>
<polygon points="419.1,292.8 423.9,303.1 430.4,294.3" fill="#f04cff"/>
<line x1="419.1" y1="227.2" x2="497.9" y2="168.7" stroke="#f04cff" stroke-width="2.5"/>
<polygon points="505.9,162.8 494.6,164.3 501.1,173.1" fill="#f04cff"/>
<text x="550.0" y="265.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle" opacity="0.7">y vuelta a</text>
<text x="550.0" y="278.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10" font-weight="400" text-anchor="middle" opacity="0.7">empezar</text>
<text x="40.0" y="100.0" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">1974</text>
<text x="40.0" y="140.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">Promesa publica</text>
<text x="40.0" y="157.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">Optimismo de los 60:</text>
<text x="40.0" y="172.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">traduccion automatica y</text>
<text x="40.0" y="187.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">razonamiento general &quot;en</text>
<text x="40.0" y="202.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">una generacion&quot;.</text>
<text x="40.0" y="229.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">Financiamiento</text>
<text x="40.0" y="246.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">DARPA y el Science Research</text>
<text x="40.0" y="261.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">Council britanico sostienen</text>
<text x="40.0" y="276.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">la investigacion simbolica</text>
<text x="40.0" y="291.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">y conexionista.</text>
<text x="40.0" y="318.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">Tope tecnico</text>
<text x="40.0" y="335.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">Perceptrons (1969): Minsky</text>
<text x="40.0" y="350.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">y Papert prueban los</text>
<text x="40.0" y="365.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">limites de los perceptrones</text>
<text x="40.0" y="380.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">de una capa.</text>
<text x="40.0" y="407.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">Recorte</text>
<text x="40.0" y="424.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">Informe Lighthill (1973) y</text>
<text x="40.0" y="439.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">recorte de fondos de DARPA</text>
<text x="40.0" y="454.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="start">para IA.</text>
<text x="1060.0" y="100.0" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="end">1987</text>
<text x="1060.0" y="140.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">Promesa publica</text>
<text x="1060.0" y="157.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">Los sistemas expertos van a</text>
<text x="1060.0" y="172.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">capturar el conocimiento de</text>
<text x="1060.0" y="187.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">cualquier especialista.</text>
<text x="1060.0" y="214.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">Financiamiento</text>
<text x="1060.0" y="231.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">El Proyecto Quinta</text>
<text x="1060.0" y="246.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">Generacion japones (1982)</text>
<text x="1060.0" y="261.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">dispara la inversion en EE.</text>
<text x="1060.0" y="276.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">UU. y Europa.</text>
<text x="1060.0" y="303.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">Tope tecnico</text>
<text x="1060.0" y="320.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">Los sistemas expertos no</text>
<text x="1060.0" y="335.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">escalan: reglas caras de</text>
<text x="1060.0" y="350.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">mantener, fragiles fuera de</text>
<text x="1060.0" y="365.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">su dominio.</text>
<text x="1060.0" y="392.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="end">Recorte</text>
<text x="1060.0" y="409.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">El mercado de maquinas LISP</text>
<text x="1060.0" y="424.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="end">colapsa hacia 1987.</text>
<line x1="300" y1="260" x2="287.0" y2="260" stroke="#78419e" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
<line x1="800" y1="260" x2="813.0" y2="260" stroke="#78419e" stroke-width="1" stroke-dasharray="2,4" opacity="0.5"/>
</svg>