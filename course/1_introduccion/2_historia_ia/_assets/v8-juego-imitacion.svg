<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="El juego de la imitacion de Turing: un interrogador intercambia texto con dos interlocutores ocultos tras una barrera, uno humano y uno maquina, sin saber cual es cual">
<rect x="0" y="0" width="900" height="420" rx="16" fill="#211033"/>
<text x="450.0" y="34.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">El juego de la imitacion</text>
<rect x="60" y="150" width="190" height="110" rx="14" fill="#211033" stroke="#f04cff" stroke-width="2.5"/>
<text x="155.0" y="195.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Interrogador</text>
<text x="155.0" y="215.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="400" text-anchor="middle">(C)</text>
<text x="155.0" y="238.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">solo ve texto</text>
<rect x="430" y="60" width="18" height="300" rx="4" fill="#78419e" opacity="0.7"/>
<text x="439.0" y="50.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">barrera</text>
<rect x="630" y="80" width="210" height="100" rx="14" fill="#211033" stroke="#ffd166" stroke-width="2.5"/>
<text x="735.0" y="120.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Interlocutor A</text>
<text x="735.0" y="142.0" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">humano</text>
<text x="735.0" y="164.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle">oculto tras la barrera</text>
<rect x="630" y="240" width="210" height="100" rx="14" fill="#211033" stroke="#55ddff" stroke-width="2.5"/>
<text x="735.0" y="280.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Interlocutor B</text>
<text x="735.0" y="302.0" fill="#55ddff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">maquina</text>
<text x="735.0" y="324.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle">oculto tras la barrera</text>
<line x1="250.8" y1="185.9" x2="630.8" y2="135.9" stroke="#ffd166" stroke-width="2"/>
<polygon points="639.7,134.8 628.1,131.3 629.5,141.2" fill="#ffd166"/>
<line x1="629.2" y1="124.1" x2="249.2" y2="174.1" stroke="#ffd166" stroke-width="2" opacity="0.75"/>
<polygon points="240.3,175.2 250.5,168.8 251.9,178.7" fill="#ffd166" opacity="0.75"/>
<line x1="249.3" y1="251.0" x2="629.3" y2="296.0" stroke="#55ddff" stroke-width="2"/>
<polygon points="638.2,297.0 627.9,290.8 626.7,300.7" fill="#55ddff"/>
<line x1="630.7" y1="284.0" x2="250.7" y2="239.0" stroke="#55ddff" stroke-width="2" opacity="0.75"/>
<polygon points="241.8,238.0 253.3,234.3 252.1,244.2" fill="#55ddff" opacity="0.75"/>
<text x="450.0" y="405.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">El interrogador solo ve texto</text>
</svg>