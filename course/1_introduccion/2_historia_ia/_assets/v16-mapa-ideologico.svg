<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-label="Mapa esquematico y disputado de posiciones ideologicas sobre la inteligencia artificial, en dos ejes: frenar contra acelerar, y beneficio de mercado contra beneficio colectivo. TESCREAL se marca como una franja punteada que atraviesa varias regiones, no como una region propia"><rect x="0" y="0" width="1000" height="720" rx="16" fill="#211033"/>

<text x="500" y="38" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Las ideologias que empujan la inteligencia artificial</text>
<text x="500" y="60" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Regiones, no puntos: cada postura es una zona borrosa, no una coordenada exacta</text>

<!-- Axes -->
<line x1="90" y1="365" x2="920" y2="365" stroke="#78419e" stroke-width="2"/>
<line x1="510" y1="100" x2="510" y2="640" stroke="#78419e" stroke-width="2"/>
<polygon points="920,365 906,358 906,372" fill="#78419e"/>
<polygon points="90,365 104,358 104,372" fill="#78419e"/>
<polygon points="510,100 503,114 517,114" fill="#78419e"/>
<polygon points="510,640 503,626 517,626" fill="#78419e"/>

<text x="98" y="390" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">Frenar</text>
<text x="912" y="390" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">Acelerar</text>
<text x="510" y="92" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Beneficio colectivo</text>
<text x="510" y="658" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Beneficio de mercado</text>

<!-- Region 1: Seguridad y riesgo existencial (cyan) -->
<rect x="145" y="130" width="290" height="170" rx="26" fill="#55ddff" opacity="0.16" stroke="#55ddff" stroke-width="1.5"/>
<text x="290" y="165" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Seguridad y riesgo</text>
<text x="290" y="184" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">existencial</text>
<text x="290" y="208" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">alineamiento, control,</text>
<text x="290" y="223" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">pausas y regulacion;</text>
<text x="290" y="238" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">supervivencia de la</text>
<text x="290" y="253" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">especie como marco</text>

<!-- Region 2: Critica de danos presentes (green) -->
<rect x="90" y="440" width="300" height="170" rx="26" fill="#a8ff5a" opacity="0.16" stroke="#a8ff5a" stroke-width="1.5"/>
<text x="240" y="475" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Critica de danos</text>
<text x="240" y="494" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">presentes</text>
<text x="240" y="518" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">sesgo algoritmico,</text>
<text x="240" y="533" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">trabajo de anotacion,</text>
<text x="240" y="548" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">extraccion de datos;</text>
<text x="240" y="563" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">danos ya ocurridos,</text>
<text x="240" y="578" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">no hipoteticos</text>

<!-- Region 3: Aceleracionismo de izquierda (yellow) -->
<rect x="600" y="130" width="300" height="150" rx="26" fill="#ffd166" opacity="0.16" stroke="#ffd166" stroke-width="1.5"/>
<text x="750" y="165" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Aceleracionismo</text>
<text x="750" y="184" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">de izquierda</text>
<text x="750" y="208" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">automatizar para</text>
<text x="750" y="223" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">liberar tiempo, no</text>
<text x="750" y="238" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">para acumular capital</text>

<!-- Region 4: Aceleracionismo eficaz e/acc (accent) -->
<rect x="580" y="400" width="270" height="150" rx="26" fill="#f04cff" opacity="0.16" stroke="#f04cff" stroke-width="1.5"/>
<text x="715" y="435" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Aceleracionismo eficaz</text>
<text x="715" y="454" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">(e/acc)</text>
<text x="715" y="478" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">tecnooptimismo,</text>
<text x="715" y="493" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">mercado como motor,</text>
<text x="715" y="508" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">crecer es el imperativo</text>

<!-- Region 5: Linaje de Nick Land (purple/axis color) -->
<rect x="760" y="500" width="200" height="150" rx="26" fill="#78419e" opacity="0.30" stroke="#78419e" stroke-width="1.5"/>
<text x="860" y="535" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Linaje de</text>
<text x="860" y="553" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Nick Land</text>
<text x="860" y="576" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">capital como fuerza</text>
<text x="860" y="590" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">impersonal e inevitable,</text>
<text x="860" y="604" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">giro neorreaccionario</text>

<!-- TESCREAL: dashed band crossing regions, not a region of its own -->
<line x1="230" y1="195" x2="740" y2="465" stroke="#f04cff" stroke-width="64" stroke-dasharray="16 12" stroke-linecap="round" fill="none" opacity="0.4"/>
<text x="470" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(25 470 330)">TESCREAL</text>
<text x="470" y="349" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle" transform="rotate(25 470 330)">acronimo acunado por sus criticos</text>

<!-- Legend -->
<rect x="90" y="628" width="18" height="18" rx="4" fill="#c8b9d8" opacity="0.25" stroke="#c8b9d8" stroke-width="1"/>
<text x="116" y="642" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">region = comunidad o postura</text>
<line x1="330" y1="637" x2="366" y2="637" stroke="#f04cff" stroke-width="10" stroke-dasharray="5 4" opacity="0.6"/>
<text x="374" y="642" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="start">franja punteada = categoria atribuida, atraviesa regiones</text>

<text x="500" y="695" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Mapa esquemático y disputado. Las posiciones reales no caben en dos ejes.</text>
</svg>
