<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="El mismo grafo de seis ciudades dibujado dos veces. A la izquierda la pregunta del camino mas corto entre dos ciudades, que se resuelve en milisegundos con Dijkstra. A la derecha la pregunta del tour mas corto que pasa por todas, que es NP-completa"><rect x="0" y="0" width="960" height="440" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El mismo grafo, dos preguntas</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La entrada es idéntica. Lo único que cambia es qué se pregunta.</text><rect x="40" y="92" width="420" height="302" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><rect x="192" y="104" width="116" height="28" rx="14" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><text x="250" y="123" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">P</text><text x="250" y="156" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">«¿Cuál es el camino más corto de A a C?»</text><line x1="154.0" y1="213.4" x2="256.0" y2="191.32" stroke="#78419e" stroke-width="1.5"/><line x1="256.0" y1="191.32" x2="358.0" y2="218.92000000000002" stroke="#78419e" stroke-width="1.5"/><line x1="358.0" y1="218.92000000000002" x2="340.0" y2="276.88" stroke="#78419e" stroke-width="1.5"/><line x1="340.0" y1="276.88" x2="238.0" y2="296.2" stroke="#78419e" stroke-width="1.5"/><line x1="238.0" y1="296.2" x2="142.0" y2="265.84000000000003" stroke="#78419e" stroke-width="1.5"/><line x1="142.0" y1="265.84000000000003" x2="154.0" y2="213.4" stroke="#78419e" stroke-width="1.5"/><line x1="154.0" y1="213.4" x2="340.0" y2="276.88" stroke="#78419e" stroke-width="1.5"/><line x1="256.0" y1="191.32" x2="238.0" y2="296.2" stroke="#78419e" stroke-width="1.5"/><line x1="358.0" y1="218.92000000000002" x2="142.0" y2="265.84000000000003" stroke="#78419e" stroke-width="1.5"/><line x1="154.0" y1="213.4" x2="256.0" y2="191.32" stroke="#a8ff5a" stroke-width="4"/><line x1="256.0" y1="191.32" x2="358.0" y2="218.92000000000002" stroke="#a8ff5a" stroke-width="4"/><circle cx="154.0" cy="213.4" r="15" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><text x="154.0" y="218.4" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">A</text><circle cx="256.0" cy="191.32" r="15" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><text x="256.0" y="196.32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">B</text><circle cx="358.0" cy="218.92000000000002" r="15" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><text x="358.0" y="223.92000000000002" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">C</text><circle cx="340.0" cy="276.88" r="15" fill="#211033" stroke="#c8b9d8" stroke-width="2"/><text x="340.0" y="281.88" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">D</text><circle cx="238.0" cy="296.2" r="15" fill="#211033" stroke="#c8b9d8" stroke-width="2"/><text x="238.0" y="301.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">E</text><circle cx="142.0" cy="265.84000000000003" r="15" fill="#211033" stroke="#c8b9d8" stroke-width="2"/><text x="142.0" y="270.84000000000003" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">F</text><line x1="64" y1="324" x2="436" y2="324" stroke="#78419e" stroke-width="1.2" stroke-dasharray="4 4"/><text x="250" y="348" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Dijkstra</text><text x="250" y="368" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">O(m + n log n)</text><text x="250" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">milisegundos con un millón de nodos</text><rect x="500" y="92" width="420" height="302" rx="10" fill="none" stroke="#ff5a7a" stroke-width="2"/><rect x="652" y="104" width="116" height="28" rx="14" fill="none" stroke="#ff5a7a" stroke-width="1.5"/><text x="710" y="123" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">NP-completo</text><text x="710" y="156" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">«¿Cuál es el tour más corto que pasa por todas?»</text><line x1="614.0" y1="213.4" x2="716.0" y2="191.32" stroke="#78419e" stroke-width="1.5"/><line x1="716.0" y1="191.32" x2="818.0" y2="218.92000000000002" stroke="#78419e" stroke-width="1.5"/><line x1="818.0" y1="218.92000000000002" x2="800.0" y2="276.88" stroke="#78419e" stroke-width="1.5"/><line x1="800.0" y1="276.88" x2="698.0" y2="296.2" stroke="#78419e" stroke-width="1.5"/><line x1="698.0" y1="296.2" x2="602.0" y2="265.84000000000003" stroke="#78419e" stroke-width="1.5"/><line x1="602.0" y1="265.84000000000003" x2="614.0" y2="213.4" stroke="#78419e" stroke-width="1.5"/><line x1="614.0" y1="213.4" x2="800.0" y2="276.88" stroke="#78419e" stroke-width="1.5"/><line x1="716.0" y1="191.32" x2="698.0" y2="296.2" stroke="#78419e" stroke-width="1.5"/><line x1="818.0" y1="218.92000000000002" x2="602.0" y2="265.84000000000003" stroke="#78419e" stroke-width="1.5"/><line x1="614.0" y1="213.4" x2="716.0" y2="191.32" stroke="#ff5a7a" stroke-width="4"/><line x1="716.0" y1="191.32" x2="818.0" y2="218.92000000000002" stroke="#ff5a7a" stroke-width="4"/><line x1="818.0" y1="218.92000000000002" x2="800.0" y2="276.88" stroke="#ff5a7a" stroke-width="4"/><line x1="800.0" y1="276.88" x2="698.0" y2="296.2" stroke="#ff5a7a" stroke-width="4"/><line x1="698.0" y1="296.2" x2="602.0" y2="265.84000000000003" stroke="#ff5a7a" stroke-width="4"/><line x1="602.0" y1="265.84000000000003" x2="614.0" y2="213.4" stroke="#ff5a7a" stroke-width="4"/><circle cx="614.0" cy="213.4" r="15" fill="#211033" stroke="#ff5a7a" stroke-width="2"/><text x="614.0" y="218.4" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">A</text><circle cx="716.0" cy="191.32" r="15" fill="#211033" stroke="#ff5a7a" stroke-width="2"/><text x="716.0" y="196.32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">B</text><circle cx="818.0" cy="218.92000000000002" r="15" fill="#211033" stroke="#ff5a7a" stroke-width="2"/><text x="818.0" y="223.92000000000002" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">C</text><circle cx="800.0" cy="276.88" r="15" fill="#211033" stroke="#ff5a7a" stroke-width="2"/><text x="800.0" y="281.88" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">D</text><circle cx="698.0" cy="296.2" r="15" fill="#211033" stroke="#ff5a7a" stroke-width="2"/><text x="698.0" y="301.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">E</text><circle cx="602.0" cy="265.84000000000003" r="15" fill="#211033" stroke="#ff5a7a" stroke-width="2"/><text x="602.0" y="270.84000000000003" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">F</text><line x1="524" y1="324" x2="896" y2="324" stroke="#78419e" stroke-width="1.2" stroke-dasharray="4 4"/><text x="710" y="348" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">nadie sabe</text><text x="710" y="368" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">ningún algoritmo polinomial conocido</text><text x="710" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">y no lo hay para 40 ciudades</text><text x="480.0" y="420" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">«Difícil» no es una propiedad del tamaño de la entrada. Es una propiedad de la pregunta.</text></svg>