<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Dos filas comparadas: arriba, ocho pasos de tiempo que se consumen uno tras otro y no se recuperan; abajo, tres celdas de memoria que se sobrescriben una y otra vez a lo largo de esos mismos ocho pasos"><rect x="0" y="0" width="960" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">El tiempo se gasta; la memoria se reusa</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Toda la diferencia entre las dos medidas está en esta asimetría.</text><text x="170" y="138" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">TIEMPO</text><text x="170" y="158" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">8 pasos</text><rect x="200" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="230.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">1</text><rect x="268" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="298.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2</text><rect x="336" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="366.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">3</text><rect x="404" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="434.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">4</text><rect x="472" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="502.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">5</text><rect x="540" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="570.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">6</text><rect x="608" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="638.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">7</text><rect x="676" y="118" width="60" height="46" rx="7" fill="#ffd166" stroke="#ffd166" stroke-width="2"/><text x="706.0" y="147" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">8</text><text x="472" y="190" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">cada uno se paga una vez y no vuelve</text><text x="170" y="258" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">MEMORIA</text><text x="170" y="278" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="end">3 celdas</text><rect x="200" y="238" width="60" height="46" rx="7" fill="none" stroke="#55ddff" stroke-width="2"/><text x="230.0" y="267" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">a</text><rect x="268" y="238" width="60" height="46" rx="7" fill="none" stroke="#55ddff" stroke-width="2"/><text x="298.0" y="267" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">b</text><rect x="336" y="238" width="60" height="46" rx="7" fill="none" stroke="#55ddff" stroke-width="2"/><text x="366.0" y="267" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">c</text><path d="M 212.0 232 C 200.0 206, 260.0 206, 248.0 232" fill="none" stroke="#55ddff" stroke-width="1.6" marker-end="url(#s)"/><path d="M 280.0 232 C 268.0 206, 328.0 206, 316.0 232" fill="none" stroke="#55ddff" stroke-width="1.6" marker-end="url(#s)"/><path d="M 348.0 232 C 336.0 206, 396.0 206, 384.0 232" fill="none" stroke="#55ddff" stroke-width="1.6" marker-end="url(#s)"/><text x="472" y="267" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">las mismas tres celdas, escritas ocho veces</text><rect x="130" y="306" width="340" height="58" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="300" y="330" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Espacio ≤ Tiempo</text><text x="300" y="352" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">en t pasos no puedes tocar más de t celdas</text><rect x="530" y="306" width="340" height="58" rx="9" fill="none" stroke="#ff5a7a" stroke-width="2"/><text x="700" y="330" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Tiempo NO ≤ Espacio</text><text x="700" y="352" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">con poca memoria puedes tardar muchísimo</text><text x="480.0" y="388" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Por eso PSPACE contiene a NP: con memoria acotada puedes probar todos los certificados, uno tras otro, reusando el mismo espacio.</text></svg>