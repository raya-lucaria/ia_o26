<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Cuatro barras que comparan que tamano de entrada se vuelve alcanzable al duplicar la velocidad de la maquina: n lineal duplica el tamano, n al cuadrado lo multiplica por 1.41, n al cubo por 1.26 y dos a la n solo suma uno"><rect x="0" y="0" width="960" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Compras una máquina el doble de rápida</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">¿Cuánto más grande puede ser la entrada que alcanzas a resolver?</text><text x="276" y="138" fill="#55ddff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="end">n</text><rect x="300" y="116" width="400" height="34" rx="7" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="300" y="116" width="400" height="34" rx="7" fill="#55ddff" opacity="0.85"/><text x="718" y="132" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">n × 2</text><text x="718" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">el doble de entrada</text><text x="276" y="198" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="end">n²</text><rect x="300" y="176" width="400" height="34" rx="7" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="300" y="176" width="248" height="34" rx="7" fill="#a8ff5a" opacity="0.85"/><text x="718" y="192" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">n × 1,41</text><text x="718" y="208" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">un 41 % más</text><text x="276" y="258" fill="#ffd166" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="end">n³</text><rect x="300" y="236" width="400" height="34" rx="7" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="300" y="236" width="176" height="34" rx="7" fill="#ffd166" opacity="0.85"/><text x="718" y="252" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">n × 1,26</text><text x="718" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">un 26 % más</text><text x="276" y="318" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="end">2ⁿ</text><rect x="300" y="296" width="400" height="34" rx="7" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="300" y="296" width="20" height="34" rx="7" fill="#ff5a7a" opacity="0.85"/><text x="718" y="312" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">n + 1</text><text x="718" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">UNA unidad más. Una.</text><text x="480.0" y="384" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Un polinomio gana un FACTOR con mejor hardware. Un exponencial gana un SUMANDO.</text><text x="480.0" y="406" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Por eso la frontera se traza en «polinomial», y no en «tarda menos de una hora»: la primera sobrevive al progreso.</text></svg>