80" y="292" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="normal" text-anchor="middle">i = 3        j = 14</text><text x="480" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">dos índices: ⌈log₂ n⌉ bits cada uno</text><text x="480.0" y="364" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Con n = un millón, la libreta son 40 bits. Eso es la clase L.</text></svg>