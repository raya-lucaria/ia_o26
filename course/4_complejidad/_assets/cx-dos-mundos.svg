<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Dos columnas: el mundo si P fuera igual a NP, con criptografia rota y optimizacion resuelta, y el mundo si P es distinto de NP, que es el que casi todo el mundo cree y en el que ya vivimos"><rect x="0" y="0" width="960" height="430" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Los dos mundos posibles</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La respuesta no cambia qué algoritmos tienes hoy. Cambia qué puedes esperar que exista.</text><rect x="40" y="96" width="420" height="268" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="250" y="128" fill="#f04cff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Si P = NP</text><text x="250" y="160" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Buscar cuesta lo mismo que comprobar.</text><text x="250" y="183" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Toda la criptografía de clave pública</text><text x="250" y="206" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">se cae: factorizar deja de proteger nada.</text><text x="250" y="229" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Optimización, diseño de fármacos y</text><text x="250" y="252" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">demostración automática se vuelven</text><text x="250" y="275" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">problemas resueltos.</text><text x="250" y="321" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Casi nadie cree que sea este mundo.</text><rect x="500" y="96" width="420" height="268" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="710" y="128" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Si P ≠ NP</text><text x="710" y="160" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Hay problemas cuya respuesta reconoces</text><text x="710" y="183" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">al verla y no puedes encontrar.</text><text x="710" y="206" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">La criptografía descansa en algo real.</text><text x="710" y="229" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Y sigue habiendo mucho que hacer:</text><text x="710" y="252" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aproximar, acotar, usar heurísticas,</text><text x="710" y="275" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">atacar los casos que sí aparecen.</text><text x="710" y="321" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Es lo que casi todo el mundo cree,</text><text x="710" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">y nadie ha podido demostrar.</text><text x="480.0" y="396" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Y ojo con la trampa: incluso P = NP con un algoritmo de tiempo n¹⁰⁰ no cambiaría nada en la práctica.</text><text x="480.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">«Polinomial» y «rápido» no son sinónimos. Solo se parecen mucho en la práctica.</text></svg>