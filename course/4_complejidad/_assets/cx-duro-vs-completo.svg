<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Arriba, las dos definiciones enfrentadas. Abajo, un ovalo que representa NP con P dentro y los NP-completos en su zona mas dificil; fuera del ovalo, el problema de la parada, que es NP-duro sin estar en NP"><rect x="0" y="0" width="960" height="500" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">NP-duro y NP-completo</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Se diferencian en una sola condición, y no es la que suena más difícil.</text><rect x="50" y="92" width="400" height="96" rx="10" fill="none" stroke="#ff5a7a" stroke-width="2"/><text x="250" y="120" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">NP-duro</text><text x="250" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">todo problema de NP se reduce a él</text><text x="250" y="172" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">puede estar FUERA de NP</text><rect x="510" y="92" width="400" height="96" rx="10" fill="none" stroke="#ffd166" stroke-width="2"/><text x="710" y="120" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">NP-completo</text><text x="710" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">NP-duro   Y   además está en NP</text><text x="710" y="172" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">los problemas más difíciles DE NP</text><text x="478" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">≠</text><ellipse cx="400" cy="330" rx="278" ry="118" fill="none" stroke="#f04cff" stroke-width="2.5"/><text x="400" y="232" fill="#f04cff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">NP</text><ellipse cx="286" cy="344" rx="122" ry="62" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="286" y="326" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">P</text><text x="286" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Dijkstra</text><text x="286" y="370" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2-SAT</text><ellipse cx="540" cy="332" rx="106" ry="80" fill="none" stroke="#ffd166" stroke-width="2.5"/><text x="540" y="292" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">NP-completos</text><text x="540" y="316" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">SAT · 3-SAT</text><text x="540" y="336" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">hamiltoniano</text><text x="540" y="356" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">TSP (decisión)</text><text x="540" y="376" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">clique</text><rect x="716" y="396" width="224" height="76" rx="10" fill="none" stroke="#ff5a7a" stroke-width="2" stroke-dasharray="6 5"/><text x="828" y="422" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">el problema de la parada</text><text x="828" y="442" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">NP-duro, y NI SIQUIERA</text><text x="828" y="460" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">está en NP: es indecidible</text><line x1="716" y1="410" x2="652" y2="372" stroke="#ff5a7a" stroke-width="1.8" marker-end="url(#p)"/><text x="364" y="470" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Un NP-completo resuelto en tiempo polinomial resolvería TODOS</text><text x="364" y="490" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">los de NP. Por eso vale un millón de dólares.</text></svg>