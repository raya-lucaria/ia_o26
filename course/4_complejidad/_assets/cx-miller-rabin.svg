<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-label="Dos cadenas de cuadrados sucesivos modulo n. Arriba, n igual a 97 que es primo: la cadena pasa por n menos uno antes de llegar a uno. Abajo, n igual a 561 que es compuesto: la cadena llega a uno saltando desde 67, que no es ni 1 ni menos 1, y eso lo delata"><rect x="0" y="0" width="980" height="470" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="490.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">La cadena de cuadrados, en dos casos</text><text x="490.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Escribes n − 1 = 2ˢ·d, calculas a^d y elevas al cuadrado s veces. Mira cómo llega cada cadena al 1.</text><text x="60" y="170" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">n = 97,  a = 2</text><text x="60" y="190" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">n − 1 = 96 = 2^5 · 3</text><rect x="250" y="144" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="296.0" y="174" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">8</text><text x="296.0" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">a^3</text><line x1="345" y1="167" x2="365" y2="167" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="368" y="144" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="414.0" y="174" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">64</text><text x="414.0" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="463" y1="167" x2="483" y2="167" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="486" y="144" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="532.0" y="174" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">22</text><text x="532.0" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="581" y1="167" x2="601" y2="167" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="604" y="144" width="92" height="46" rx="8" fill="none" stroke="#a8ff5a" stroke-width="2.4"/><text x="650.0" y="174" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="normal" text-anchor="middle">96 = −1</text><text x="650.0" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="699" y1="167" x2="719" y2="167" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="722" y="144" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="768.0" y="174" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">1</text><text x="768.0" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="817" y1="167" x2="837" y2="167" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="840" y="144" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="886.0" y="174" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">1</text><text x="886.0" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><text x="60" y="216" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">pasa la prueba</text><text x="250" y="216" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la cadena toca −1 antes del 1: es lo que un primo obliga a hacer</text><line x1="60" y1="250" x2="920" y2="250" stroke="#78419e" stroke-width="1.2" stroke-dasharray="5 6"/><text x="60" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">n = 561,  a = 2</text><text x="60" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">n − 1 = 560 = 2^4 · 35</text><rect x="250" y="304" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="296.0" y="334" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">263</text><text x="296.0" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">a^35</text><line x1="345" y1="327" x2="365" y2="327" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="368" y="304" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="414.0" y="334" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">166</text><text x="414.0" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="463" y1="327" x2="483" y2="327" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="486" y="304" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="532.0" y="334" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">67</text><text x="532.0" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="581" y1="327" x2="601" y2="327" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="604" y="304" width="92" height="46" rx="8" fill="none" stroke="#ff5a7a" stroke-width="2.4"/><text x="650.0" y="334" fill="#ff5a7a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">1</text><text x="650.0" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><line x1="699" y1="327" x2="719" y2="327" stroke="#c8b9d8" stroke-width="1.8" marker-end="url(#s)"/><rect x="722" y="304" width="92" height="46" rx="8" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="768.0" y="334" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">1</text><text x="768.0" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">↑²</text><text x="60" y="376" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">COMPUESTO</text><text x="250" y="376" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">67² ≡ 1 con 67 ≠ ±1: módulo un primo eso es imposible</text><text x="490.0" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">561 = 3·11·17 es un número de Carmichael: engaña al test de Fermat, porque su cadena SÍ termina en 1.</text><text x="490.0" y="450" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Mirar la cadena entera, y no solo su final, es todo lo que Miller-Rabin agrega — y es suficiente.</text></svg>