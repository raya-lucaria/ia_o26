<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Dos escenas con la misma formula logica: a la izquierda hay que buscar una asignacion entre dos a la n posibles; a la derecha alguien te la entrega y solo hay que sustituir y comprobar"><rect x="0" y="0" width="960" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Buscar la respuesta, o comprobarla</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">NP no es «difícil». NP es «si alguien te da la respuesta, la compruebas rápido».</text><rect x="180" y="92" width="600" height="44" rx="9" fill="none" stroke="#78419e" stroke-width="1.4"/><text x="480" y="120" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="middle">(x₁ ∨ ¬x₂ ∨ x₃) ∧ (¬x₁ ∨ x₂ ∨ x₄) ∧ (x₂ ∨ ¬x₃ ∨ ¬x₄)</text><rect x="40" y="156" width="420" height="196" rx="10" fill="none" stroke="#ff5a7a" stroke-width="2"/><text x="250" y="184" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">BUSCAR</text><text x="250" y="206" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">«¿existe alguna asignación que la satisfaga?»</text><rect x="108" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="144" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="180" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="216" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="252" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="288" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="324" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="360" y="224" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="108" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="144" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="180" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="216" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="252" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="288" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="324" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="360" y="250" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="108" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="144" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="180" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="216" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="252" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="288" y="276" width="28" height="18" rx="4" fill="#a8ff5a" stroke="#a8ff5a" stroke-width="1"/><rect x="324" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="360" y="276" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="108" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="144" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="180" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="216" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="252" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="288" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="324" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><rect x="360" y="302" width="28" height="18" rx="4" fill="none" stroke="#78419e" stroke-width="1"/><text x="250" y="340" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">2ⁿ candidatas. Una sirve. ¿Cuál?</text><rect x="500" y="156" width="420" height="196" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="710" y="184" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">VERIFICAR</text><text x="710" y="206" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">«te doy ésta: compruébala»</text><rect x="560" y="222" width="300" height="40" rx="8" fill="none" stroke="#a8ff5a" stroke-width="1.6"/><text x="710" y="248" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="middle">x₁=1  x₂=1  x₃=0  x₄=1</text><text x="710" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">sustituyes y lees: ✓ ✓ ✓</text><text x="710" y="308" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tres cláusulas, tres comprobaciones</text><text x="710" y="340" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Tiempo polinomial. Sin dudas.</text><text x="480.0" y="388" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Esa asignación que te entregan se llama certificado, y tiene que ser de tamaño polinomial.</text><text x="480.0" y="410" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">P vs NP es exactamente esto: ¿buscar cuesta lo mismo que comprobar?</text></svg>