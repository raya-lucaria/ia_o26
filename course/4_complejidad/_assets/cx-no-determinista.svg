<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="A la izquierda, una maquina determinista: una sola cadena de configuraciones. A la derecha, una no determinista: un arbol que se abre en dos en cada paso, y acepta si alguna hoja acepta"><rect x="0" y="0" width="960" height="440" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Una línea, o un árbol</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La máquina no determinista no adivina bien: prueba todo a la vez, y le cobramos solo la profundidad.</text><rect x="40" y="96" width="320" height="296" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="200" y="124" fill="#55ddff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Determinista</text><text x="200" y="145" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">en cada paso, una sola opción</text><circle cx="200" cy="172" r="13" fill="#211033" stroke="#55ddff" stroke-width="2"/><line x1="200" y1="186" x2="200" y2="199" stroke="#55ddff" stroke-width="1.8" marker-end="url(#p)"/><circle cx="200" cy="214" r="13" fill="#211033" stroke="#55ddff" stroke-width="2"/><line x1="200" y1="228" x2="200" y2="241" stroke="#55ddff" stroke-width="1.8" marker-end="url(#p)"/><circle cx="200" cy="256" r="13" fill="#211033" stroke="#55ddff" stroke-width="2"/><line x1="200" y1="270" x2="200" y2="283" stroke="#55ddff" stroke-width="1.8" marker-end="url(#p)"/><circle cx="200" cy="298" r="13" fill="#211033" stroke="#55ddff" stroke-width="2"/><line x1="200" y1="312" x2="200" y2="325" stroke="#55ddff" stroke-width="1.8" marker-end="url(#p)"/><circle cx="200" cy="340" r="13" fill="#211033" stroke="#55ddff" stroke-width="2"/><text x="200" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">5 pasos = 5 configuraciones</text><rect x="400" y="96" width="520" height="296" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="660" y="124" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">No determinista</text><text x="660" y="145" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">en cada paso, varias opciones a la vez</text><circle cx="660.0" cy="172" r="10" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><line x1="660.0" y1="182" x2="550.0" y2="218" stroke="#a8ff5a" stroke-width="2.4"/><line x1="660.0" y1="182" x2="770.0" y2="218" stroke="#78419e" stroke-width="1.2"/><circle cx="550.0" cy="228" r="10" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><line x1="550.0" y1="238" x2="495.0" y2="274" stroke="#78419e" stroke-width="1.2"/><line x1="550.0" y1="238" x2="605.0" y2="274" stroke="#a8ff5a" stroke-width="2.4"/><circle cx="770.0" cy="228" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><line x1="770.0" y1="238" x2="715.0" y2="274" stroke="#78419e" stroke-width="1.2"/><line x1="770.0" y1="238" x2="825.0" y2="274" stroke="#78419e" stroke-width="1.2"/><circle cx="495.0" cy="284" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><line x1="495.0" y1="294" x2="467.5" y2="330" stroke="#78419e" stroke-width="1.2"/><line x1="495.0" y1="294" x2="522.5" y2="330" stroke="#78419e" stroke-width="1.2"/><circle cx="605.0" cy="284" r="10" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><line x1="605.0" y1="294" x2="577.5" y2="330" stroke="#78419e" stroke-width="1.2"/><line x1="605.0" y1="294" x2="632.5" y2="330" stroke="#a8ff5a" stroke-width="2.4"/><circle cx="715.0" cy="284" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><line x1="715.0" y1="294" x2="687.5" y2="330" stroke="#78419e" stroke-width="1.2"/><line x1="715.0" y1="294" x2="742.5" y2="330" stroke="#78419e" stroke-width="1.2"/><circle cx="825.0" cy="284" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><line x1="825.0" y1="294" x2="797.5" y2="330" stroke="#78419e" stroke-width="1.2"/><line x1="825.0" y1="294" x2="852.5" y2="330" stroke="#78419e" stroke-width="1.2"/><circle cx="467.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="522.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="577.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="632.5" cy="340" r="10" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><circle cx="687.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="742.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="797.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="852.5" cy="340" r="10" fill="#211033" stroke="#78419e" stroke-width="2"/><text x="660" y="372" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">acepta si ALGUNA rama acepta</text><text x="480.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">El tiempo es la PROFUNDIDAD del árbol, no su tamaño. Por eso «NP = no determinista en tiempo polinomial» no es hacer trampa: es cobrar solo una rama.</text></svg>