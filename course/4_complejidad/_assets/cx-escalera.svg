<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Cuatro escalones ascendentes, uno por algoritmo: busqueda binaria con log n, busqueda lineal con n, multiplicacion de matrices con n al cubo y todos los subconjuntos con dos a la n. Cada uno dice que pasa al duplicar n"><rect x="0" y="0" width="960" height="430" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">La escalera, y qué pasa si duplicas n</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La fórmula se olvida. La columna de la derecha, no.</text><rect x="60" y="290" width="240" height="52" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="78" y="320" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Búsqueda binaria</text><text x="282" y="320" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="end">log n</text><text x="316" y="315" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">un paso más</text><text x="316" y="333" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">al duplicar n</text><rect x="60" y="224" width="360" height="52" rx="9" fill="none" stroke="#55ddff" stroke-width="2"/><text x="78" y="254" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Búsqueda lineal</text><text x="402" y="254" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="end">n</text><text x="436" y="249" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">el doble de trabajo</text><text x="436" y="267" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">al duplicar n</text><rect x="60" y="158" width="480" height="52" rx="9" fill="none" stroke="#ffd166" stroke-width="2"/><text x="78" y="188" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Multiplicar matrices</text><text x="522" y="188" fill="#ffd166" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="end">n³</text><text x="556" y="183" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">ocho veces más</text><text x="556" y="201" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">al duplicar n</text><rect x="60" y="92" width="600" height="52" rx="9" fill="none" stroke="#ff5a7a" stroke-width="2"/><text x="78" y="122" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">Todos los subconjuntos</text><text x="642" y="122" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="end">2ⁿ</text><text x="676" y="117" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">el trabajo AL CUADRADO</text><text x="676" y="135" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start">al duplicar n</text><text x="480.0" y="380" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Los tres primeros escalones son el mismo mundo. El cuarto es otro.</text><text x="480.0" y="404" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Esa frontera —polinomio contra exponencial— es de lo que trata el resto de la unidad.</text></svg>