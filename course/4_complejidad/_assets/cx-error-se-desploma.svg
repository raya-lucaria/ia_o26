<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="Una tabla de cinco filas: con una ronda el error es de uno en cuatro, con cinco de uno en mil, con diez de uno en un millon, con veinte de uno en un billon y con cuarenta de uno en 10 elevado a 24"><rect x="0" y="0" width="940" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="470.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Repetir k veces: el error se desploma</text><text x="470.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cada ronda usa una base a nueva e independiente. Basta con que UNA delate al compuesto.</text><text x="226" y="130" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">k = 1</text><rect x="250" y="108" width="340" height="32" rx="6" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="250" y="108" width="340" height="32" rx="6" fill="#ffd166" opacity="0.85"/><text x="608" y="129" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">1 en 4</text><text x="722" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">una de cada cuatro bases falla</text><text x="226" y="180" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">k = 5</text><rect x="250" y="158" width="340" height="32" rx="6" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="250" y="158" width="211" height="32" rx="6" fill="#ffd166" opacity="0.85"/><text x="608" y="179" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">1 en 1 000</text><text x="226" y="230" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">k = 10</text><rect x="250" y="208" width="340" height="32" rx="6" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="250" y="208" width="143" height="32" rx="6" fill="#a8ff5a" opacity="0.85"/><text x="608" y="229" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">1 en 1 000 000</text><text x="226" y="280" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">k = 20</text><rect x="250" y="258" width="340" height="32" rx="6" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="250" y="258" width="82" height="32" rx="6" fill="#a8ff5a" opacity="0.85"/><text x="608" y="279" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">1 en 10¹²</text><text x="226" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="end">k = 40</text><rect x="250" y="308" width="340" height="32" rx="6" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="250" y="308" width="27" height="32" rx="6" fill="#55ddff" opacity="0.85"/><text x="608" y="329" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">1 en 10²⁴</text><text x="722" y="348" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">menos que un fallo del procesador</text><text x="470.0" y="372" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">El error es de un solo lado: «compuesto» es certeza; «primo» es una apuesta que puedes hacer tan segura como quieras.</text></svg>