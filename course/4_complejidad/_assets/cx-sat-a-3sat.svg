<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="Una clausula de cinco literales se parte en tres clausulas de tres literales, encadenadas por dos variables nuevas y1 e y2 que aparecen negadas en la siguiente clausula"><rect x="0" y="0" width="980" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="490.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">De SAT a 3-SAT, en tiempo polinomial</text><text x="490.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Una cláusula larga se parte en cláusulas de tres, encadenadas por variables nuevas.</text><text x="490.0" y="122" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una cláusula de 5 literales</text><rect x="280" y="136" width="420" height="48" rx="9" fill="none" stroke="#55ddff" stroke-width="2"/><text x="490" y="166" fill="#55ddff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="normal" text-anchor="middle">( x₁ ∨ x₂ ∨ x₃ ∨ x₄ ∨ x₅ )</text><line x1="490" y1="194" x2="490" y2="224" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="516" y="214" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">se convierte en</text><rect x="60" y="240" width="262" height="48" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="191" y="270" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="normal" text-anchor="middle">( x₁ ∨ x₂ ∨ y₁ )</text><rect x="360" y="240" width="262" height="48" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="491" y="270" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="normal" text-anchor="middle">( ¬y₁ ∨ x₃ ∨ y₂ )</text><rect x="660" y="240" width="262" height="48" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="791" y="270" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="normal" text-anchor="middle">( ¬y₂ ∨ x₄ ∨ x₅ )</text><text x="342" y="270" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">∧</text><text x="642" y="270" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">∧</text><text x="191" y="312" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">y₁</text><text x="491" y="312" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">y₂</text><path d="M 240 292 C 260 322, 340 322, 360 292" fill="none" stroke="#ffd166" stroke-width="1.8" stroke-dasharray="5 4"/><path d="M 540 292 C 560 322, 640 322, 660 292" fill="none" stroke="#ffd166" stroke-width="1.8" stroke-dasharray="5 4"/><text x="490.0" y="348" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Una cláusula de k literales da k−2 cláusulas y k−3 variables nuevas: crecimiento lineal, no explosión.</text><text x="490.0" y="372" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Y las nuevas fórmulas son satisfacibles exactamente cuando lo era la vieja. Por eso 3-SAT es tan difícil como SAT.</text></svg>