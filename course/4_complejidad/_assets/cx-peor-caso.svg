<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="Una nube de puntos: cada punto es una entrada distinta de tamano n y su altura es lo que tarda. Tres lineas horizontales marcan el mejor caso abajo, el caso promedio en medio y el peor caso arriba"><rect x="0" y="0" width="940" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="470.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Muchas entradas del mismo tamaño</text><text x="470.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Fijas n y todavía te quedan millones de entradas. Cada punto es una; su altura es lo que tarda.</text><line x1="90" y1="320" x2="650" y2="320" stroke="#c8b9d8" stroke-width="2"/><line x1="90" y1="100" x2="90" y2="320" stroke="#c8b9d8" stroke-width="2"/><text x="370.0" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">todas las entradas de tamaño n</text><text x="64" y="210.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 64 210.0)">pasos que tarda</text><circle cx="112.4" cy="276.0" r="4.5" fill="#c8b9d8"/><circle cx="140.4" cy="258.4" r="4.5" fill="#c8b9d8"/><circle cx="162.8" cy="289.2" r="4.5" fill="#c8b9d8"/><circle cx="185.2" cy="245.20000000000002" r="4.5" fill="#c8b9d8"/><circle cx="207.6" cy="271.6" r="4.5" fill="#c8b9d8"/><circle cx="230.0" cy="232.0" r="4.5" fill="#c8b9d8"/><circle cx="252.39999999999998" cy="282.6" r="4.5" fill="#c8b9d8"/><circle cx="274.8" cy="256.2" r="4.5" fill="#c8b9d8"/><circle cx="297.2" cy="221.0" r="4.5" fill="#c8b9d8"/><circle cx="319.6" cy="267.2" r="4.5" fill="#c8b9d8"/><circle cx="342.0" cy="240.8" r="4.5" fill="#c8b9d8"/><circle cx="364.4" cy="293.6" r="4.5" fill="#c8b9d8"/><circle cx="386.8" cy="227.6" r="4.5" fill="#c8b9d8"/><circle cx="409.2" cy="262.8" r="4.5" fill="#c8b9d8"/><circle cx="431.59999999999997" cy="249.60000000000002" r="4.5" fill="#c8b9d8"/><circle cx="454.0" cy="278.20000000000005" r="4.5" fill="#c8b9d8"/><circle cx="476.4" cy="236.4" r="4.5" fill="#c8b9d8"/><circle cx="498.8" cy="254.0" r="4.5" fill="#c8b9d8"/><circle cx="521.2" cy="214.4" r="4.5" fill="#c8b9d8"/><circle cx="543.6" cy="273.8" r="4.5" fill="#c8b9d8"/><circle cx="566.0" cy="247.4" r="4.5" fill="#c8b9d8"/><circle cx="588.4000000000001" cy="260.6" r="4.5" fill="#c8b9d8"/><circle cx="610.8000000000001" cy="234.2" r="4.5" fill="#c8b9d8"/><circle cx="633.1999999999999" cy="284.79999999999995" r="4.5" fill="#c8b9d8"/><circle cx="263.6" cy="148.4" r="4.5" fill="#ff5a7a"/><circle cx="437.2" cy="130.8" r="4.5" fill="#ff5a7a"/><circle cx="582.8" cy="157.2" r="4.5" fill="#ff5a7a"/><circle cx="151.6" cy="166.0" r="4.5" fill="#ff5a7a"/><line x1="90" y1="130.8" x2="650" y2="130.8" stroke="#ff5a7a" stroke-width="2" stroke-dasharray="6 5"/><text x="666" y="126.80000000000001" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">peor caso</text><text x="666" y="145.8" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">lo que garantiza el análisis</text><line x1="90" y1="254.0" x2="650" y2="254.0" stroke="#ffd166" stroke-width="2" stroke-dasharray="6 5"/><text x="666" y="250.0" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">caso promedio</text><text x="666" y="269.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">necesita saber qué entradas llegan</text><line x1="90" y1="302.4" x2="650" y2="302.4" stroke="#55ddff" stroke-width="2" stroke-dasharray="6 5"/><text x="666" y="298.4" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="start">mejor caso</text><text x="666" y="317.4" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">no sirve para nada</text><text x="470.0" y="372" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">En este curso, «complejidad» significa siempre el peor caso: es la única de las tres que promete algo.</text></svg>