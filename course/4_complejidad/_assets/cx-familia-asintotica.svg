59.5 221.8 L 367.0 218.4 L 374.5 214.7 L 382.0 210.7 L 389.5 206.3 L 397.0 201.6 L 404.5 196.5 L 412.0 191.0 L 419.5 185.2 L 427.0 179.1 L 434.5 172.6 L 442.0 165.7" fill="none" stroke="#f04cff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="367.0" y="262" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">f crece al menos como g</text><rect x="272" y="274" width="190" height="30" rx="7" fill="none" stroke="#a8ff5a" stroke-width="1.4"/><text x="367.0" y="294" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" text-anchor="middle">lím inf f/g  &gt;  0</text><rect x="490" y="96" width="218" height="214" rx="10" fill="none" stroke="#ffd166" stroke-width="2"/><text x="599.0" y="126" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Θ(g)</text><text x="599.0" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">las dos</text><line x1="524" y1="236" x2="674" y2="236" stroke="#c8b9d8" stroke-width="1.5"/><line x1="524" y1="162" x2="524" y2="236" stroke="#c8b9d8" stroke-width="1.5"/><path d="M 524.0 236.0 L 531.5 235.8 L 539.0 235.3 L 546.5 234.3 L 554.0 233.0 L 561.5 231.4 L 569.0 229.3 L 576.5 226.9 L 584.0 224.2 L 591.5 221.0 L 599.0 217.5 L 606.5 213.6 L 614.0 209.4 L 621.5 204.7 L 629.0 199.7 L 636.5 194.4 L 644.0 188.6 L 651.5 182.5 L 659.0 176.1 L 666.5 169.2 L 674.0 162.0" fill="none" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M 524.0 236.0 L 531.5 235.9 L 539.0 235.7 L 546.5 235.3 L 554.0 234.8 L 561.5 234.1 L 569.0 233.2 L 576.5 232.2 L 584.0 231.0 L 591.5 229.7 L 599.0 228.2 L 606.5 226.6 L 614.0 224.8 L 621.5 222.9 L 629.0 220.8 L 636.5 218.5 L 644.0 216.1 L 651.5 213.5 L 659.0 210.8 L 666.5 208.0 L 674.0 204.9" fill="none" stroke=