<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-label="Cuatro paneles: O grande como techo, Omega como piso, Theta como las dos cosas a la vez, y o pequena como un techo del que f se despega. Cada uno con su definicion por limites"><rect x="0" y="0" width="980" height="430" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="490.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Los cuatro, y cuál dice qué</text><text x="490.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Lee el dibujo para acordarte de cuál es cuál; usa el límite para decidir un caso concreto.</text><rect x="26" y="96" width="218" height="214" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="135.0" y="126" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">O(g)</text><text x="135.0" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">techo</text><line x1="60" y1="236" x2="210" y2="236" stroke="#c8b9d8" stroke-width="1.5"/><line x1="60" y1="162" x2="60" y2="236" stroke="#c8b9d8" stroke-width="1.5"/><path d="M 60.0 236.0 L 67.5 235.8 L 75.0 235.3 L 82.5 234.3 L 90.0 233.0 L 97.5 231.4 L 105.0 229.3 L 112.5 226.9 L 120.0 224.2 L 127.5 221.0 L 135.0 217.5 L 142.5 213.6 L 150.0 209.4 L 157.5 204.7 L 165.0 199.7 L 172.5 194.4 L 180.0 188.6 L 187.5 182.5 L 195.0 176.1 L 202.5 169.2 L 210.0 162.0" fill="none" stroke="#55ddff" stroke-width="2.4" stroke-linecap