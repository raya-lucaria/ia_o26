nos de orden menor.</text><text x="470.0" y="410" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Con c = 4 basta, y f nunca vuelve a pasar de 4n² desde n₀ = 39.</text></svg>