<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="Una instancia del problema A pasa por un traductor de tiempo polinomial que la convierte en una instancia del problema B; el solucionador de B contesta y esa misma respuesta vale para A"><rect x="0" y="0" width="960" height="430" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Reducción: A ≤ₚ B</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">«Traduzco cualquier pregunta sobre A en una pregunta sobre B, barato, y sin cambiar la respuesta.»</text><rect x="46" y="110" width="190" height="118" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="141.0" y="142" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">instancia de A</text><text x="141.0" y="176" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">«¿hay un ciclo</text><text x="141.0" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">hamiltoniano?»</text><rect x="300" y="110" width="190" height="118" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="395.0" y="142" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">TRADUCTOR</text><text x="395.0" y="176" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tiempo polinomial</text><rect x="554" y="110" width="190" height="118" rx="10" fill="none" stroke="#ffd166" stroke-width="2"/><text x="649.0" y="142" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">instancia de B</text><text x="649.0" y="176" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">«¿hay un tour</text><text x="649.0" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">de costo ≤ k?»</text><rect x="812" y="110" width="132" height="118" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="878.0" y="142" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15.5" font-weight="600" text-anchor="middle">sí / no</text><text x="878.0" y="176" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">la MISMA respuesta</text><line x1="240" y1="169" x2="292" y2="169" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="494" y1="169" x2="546" y2="169" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="748" y1="169" x2="804" y2="169" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="80" y="264" width="800" height="50" rx="9" fill="none" stroke="#55ddff" stroke-width="2"/><text x="158" y="294" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Se lee así</text><text x="520" y="294" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">«A no es más difícil que B»</text><rect x="80" y="326" width="800" height="50" rx="9" fill="none" stroke="#ff5a7a" stroke-width="2"/><text x="158" y="356" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Se USA así</text><text x="520" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="normal" text-anchor="middle">si B es fácil, A también.  Si A es difícil, B también.</text><text x="480.0" y="406" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">La segunda lectura es la que se usa todo el tiempo, y es la que todo el mundo invierte la primera vez.</text></svg>