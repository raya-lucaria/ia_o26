<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Una maquina con una moneda: la misma entrada fija entra muchas veces y la maquina responde distinto segun las tiradas. Dos barras muestran que al menos dos tercios de las tiradas dan la respuesta correcta"><rect x="0" y="0" width="960" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Una máquina que tira una moneda</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La entrada es fija. El azar está DENTRO de la máquina, y la probabilidad se toma sobre sus tiradas.</text><rect x="50" y="130" width="150" height="90" rx="9" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="125" y="162" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una entrada</text><text x="125" y="190" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="normal" text-anchor="middle">x</text><line x1="206" y1="175" x2="254" y2="175" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="260" y="122" width="210" height="106" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="365" y="152" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">M</text><text x="365" y="178" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">tiempo polinomial</text><circle cx="312" cy="204" r="11" fill="none" stroke="#ffd166" stroke-width="1.8"/><text x="312" y="209" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">?</text><circle cx="354" cy="204" r="11" fill="none" stroke="#ffd166" stroke-width="1.8"/><text x="354" y="209" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">?</text><circle cx="396" cy="204" r="11" fill="none" stroke="#ffd166" stroke-width="1.8"/><text x="396" y="209" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">?</text><text x="365" y="246" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">sus monedas: r₁ r₂ r₃ …</text><line x1="476" y1="175" x2="524" y2="175" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="720.0" y="122" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sobre TODAS las tiradas posibles</text><text x="540" y="140" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la respuesta correcta</text><rect x="540" y="146" width="360" height="36" rx="7" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="540" y="146" width="240" height="36" rx="7" fill="#a8ff5a" opacity="0.85"/><text x="660.0" y="170" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">≥ ⅔</text><text x="540" y="206" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">la respuesta equivocada</text><rect x="540" y="212" width="360" height="36" rx="7" fill="none" stroke="#78419e" stroke-width="1.2"/><rect x="540" y="212" width="120" height="36" rx="7" fill="#ff5a7a" opacity="0.85"/><text x="600.0" y="236" fill="#211033" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">≤ ⅓</text><line x1="780.0" y1="138" x2="780.0" y2="256" stroke="#f7f2ff" stroke-width="1.6" stroke-dasharray="5 5"/><text x="780.0" y="274" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">la brecha</text><text x="480.0" y="328" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Esa brecha entre ⅔ y ⅓ es toda la definición de BPP. Y el ⅔ no tiene nada de especial:</text><text x="480.0" y="352" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cualquier ventaja fija sobre ½ sirve, porque repetir y votar la amplifica tanto como quieras.</text><text x="480.0" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Si la brecha depende de n y se encoge, deja de servir. Ahí está la letra B de «bounded».</text></svg>