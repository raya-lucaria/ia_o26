<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Tres regiones anidadas: P dentro de NP dentro de EXP. El borde entre P y NP va punteado porque no se sabe si son distintas; el de EXP va solido porque si se sabe que P es estrictamente menor que EXP"><rect x="0" y="0" width="960" height="480" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Quién vive en cada clase</text><ellipse cx="480" cy="252" rx="430" ry="176" fill="none" stroke="#ffd166" stroke-width="2.5"/><text x="480" y="104" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">EXP · tiempo exponencial</text><ellipse cx="440" cy="262" rx="316" ry="132" fill="none" stroke="#f04cff" stroke-width="2.5" stroke-dasharray="8 6"/><text x="440" y="156" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">NP · verificable en polinomial</text><ellipse cx="330" cy="272" rx="180" ry="88" fill="none" stroke="#a8ff5a" stroke-width="2.5"/><text x="330" y="208" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">P · resoluble en polinomial</text><text x="330" y="236" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Dijkstra</text><text x="330" y="258" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">árbol generador mínimo</text><text x="330" y="280" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">2-SAT</text><text x="330" y="302" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">programación lineal</text><text x="330" y="324" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">primalidad</text><text x="628" y="250" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">SAT · 3-SAT</text><text x="628" y="273" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ciclo hamiltoniano</text><text x="628" y="296" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">TSP (decisión)</text><text x="628" y="319" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">clique · coloreo · mochila</text><text x="628" y="226" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">en NP, no se sabe si en P</text><text x="838" y="262" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ajedrez n×n</text><text x="838" y="240" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">solo en EXP</text><rect x="142" y="398" width="216" height="32" rx="16" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><text x="250" y="419" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">P ⊆ NP: seguro</text><rect x="372" y="398" width="216" height="32" rx="16" fill="none" stroke="#f04cff" stroke-width="1.5"/><text x="480" y="419" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">P = NP: nadie sabe</text><rect x="622" y="398" width="216" height="32" rx="16" fill="none" stroke="#ffd166" stroke-width="1.5"/><text x="730" y="419" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">P ⊊ EXP: demostrado</text><text x="480.0" y="462" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">El borde punteado es el que no se sabe cerrar. Es el problema abierto más famoso de la computación.</text></svg>