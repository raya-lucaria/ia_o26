<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="Tres paneles con la misma pregunta '¿cuanto mide la entrada?': una lista de numeros mide n elementos, un grafo mide dos numeros (n vertices y m aristas), y un entero mide sus digitos, no su valor"><rect x="0" y="0" width="980" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="490.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">¿Cuánto mide la entrada?</text><text x="490.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">La misma pregunta, tres respuestas distintas. Equivocarse aquí invalida todo lo que venga después.</text><rect x="40" y="96" width="280" height="216" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="180" y="126" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Una lista</text><rect x="76" y="152" width="36" height="36" rx="6" fill="none" stroke="#c8b9d8" stroke-width="1.5"/><text x="94" y="177" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">7</text><rect x="118" y="152" width="36" height="36" rx="6" fill="none" stroke="#c8b9d8" stroke-width="1.5"/><text x="136" y="177" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">2</text><rect x="160" y="152" width="36" height="36" rx="6" fill="none" stroke="#c8b9d8" stroke-width="1.5"/><text x="178" y="177" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">9</text><rect x="202" y="152" width="36" height="36" rx="6" fill="none" stroke="#c8b9d8" stroke-width="1.5"/><text x="220" y="177" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">4</text><rect x="244" y="152" width="36" height="36" rx="6" fill="none" stroke="#c8b9d8" stroke-width="1.5"/><text x="262" y="177" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="180" y="224" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">n = 5</text><text x="180" y="250" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cuántos elementos hay</text><text x="180" y="288" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Sin sorpresa.</text><rect x="350" y="96" width="280" height="216" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="490" y="126" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Un grafo</text><line x1="420" y1="168" x2="490" y2="148" stroke="#c8b9d8" stroke-width="1.5"/><line x1="490" y1="148" x2="560" y2="172" stroke="#c8b9d8" stroke-width="1.5"/><line x1="420" y1="168" x2="455" y2="214" stroke="#c8b9d8" stroke-width="1.5"/><line x1="455" y1="214" x2="535" y2="216" stroke="#c8b9d8" stroke-width="1.5"/><line x1="535" y1="216" x2="560" y2="172" stroke="#c8b9d8" stroke-width="1.5"/><line x1="490" y1="148" x2="535" y2="216" stroke="#c8b9d8" stroke-width="1.5"/><circle cx="420" cy="168" r="7" fill="#a8ff5a"/><circle cx="490" cy="148" r="7" fill="#a8ff5a"/><circle cx="560" cy="172" r="7" fill="#a8ff5a"/><circle cx="455" cy="214" r="7" fill="#a8ff5a"/><circle cx="535" cy="216" r="7" fill="#a8ff5a"/><text x="490" y="254" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">n = 5   y   m = 6</text><text x="490" y="288" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Son DOS números.</text><rect x="660" y="96" width="280" height="216" rx="10" fill="none" stroke="#ff5a7a" stroke-width="2"/><text x="800" y="126" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Un número entero</text><text x="800" y="168" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="normal" text-anchor="middle">N = 8 675 309</text><text x="800" y="200" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">n = 7,  no 8 675 309</text><text x="800" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lo que se escribe son los dígitos</text><rect x="676" y="244" width="248" height="54" rx="8" fill="none" stroke="#ff5a7a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="800" y="265" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">n ≈ log N</text><text x="800" y="286" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">el número es exponencial en n</text><text x="490.0" y="352" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">Un algoritmo que recorre de 1 a N no es lineal: es exponencial en el tamaño de su entrada.</text><text x="490.0" y="376" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Ese es el error clásico, y se llama complejidad pseudopolinomial.</text></svg>