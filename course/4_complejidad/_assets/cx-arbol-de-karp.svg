<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Un arbol de reducciones: de SAT sale 3-SAT, y de 3-SAT salen clique, ciclo hamiltoniano, coloreo y suma de subconjuntos; de clique sale cubierta de vertices, de hamiltoniano sale TSP y de suma de subconjuntos sale la mochila"><rect x="0" y="0" width="960" height="440" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="480.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">Cómo se pobló la lista</text><text x="480.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Cook y Levin lo demostraron una vez, desde cero. Todo lo demás son flechas.</text><rect x="405.0" y="101" width="150" height="42" rx="9" fill="none" stroke="#f04cff" stroke-width="2"/><text x="480" y="127" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">SAT</text><text x="480" y="156" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle">Cook–Levin, 1971: el primero, a mano</text><line x1="480" y1="148" x2="480" y2="182" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="405.0" y="185" width="150" height="42" rx="9" fill="none" stroke="#f04cff" stroke-width="2"/><text x="480" y="211" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">3-SAT</text><path d="M 480 228 C 480 268, 150 258, 150 296" fill="none" stroke="#ffd166" stroke-width="1.8" marker-end="url(#p)"/><rect x="50.0" y="297" width="200" height="42" rx="9" fill="none" stroke="#ffd166" stroke-width="2"/><text x="150" y="323" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">clique</text><path d="M 480 228 C 480 268, 370 258, 370 296" fill="none" stroke="#ffd166" stroke-width="1.8" marker-end="url(#p)"/><rect x="270.0" y="297" width="200" height="42" rx="9" fill="none" stroke="#ffd166" stroke-width="2"/><text x="370" y="323" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">ciclo hamiltoniano</text><path d="M 480 228 C 480 268, 590 258, 590 296" fill="none" stroke="#ffd166" stroke-width="1.8" marker-end="url(#p)"/><rect x="490.0" y="297" width="200" height="42" rx="9" fill="none" stroke="#ffd166" stroke-width="2"/><text x="590" y="323" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">coloreo</text><path d="M 480 228 C 480 268, 820 258, 820 296" fill="none" stroke="#ffd166" stroke-width="1.8" marker-end="url(#p)"/><rect x="720.0" y="297" width="200" height="42" rx="9" fill="none" stroke="#ffd166" stroke-width="2"/><text x="820" y="323" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">suma de subconjuntos</text><line x1="150" y1="340" x2="150" y2="368" stroke="#a8ff5a" stroke-width="1.8" marker-end="url(#p)"/><rect x="50.0" y="371" width="200" height="42" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="150" y="397" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">cubierta de vértices</text><line x1="370" y1="340" x2="370" y2="368" stroke="#a8ff5a" stroke-width="1.8" marker-end="url(#p)"/><rect x="270.0" y="371" width="200" height="42" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="370" y="397" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">TSP</text><line x1="820" y1="340" x2="820" y2="368" stroke="#a8ff5a" stroke-width="1.8" marker-end="url(#p)"/><rect x="720.0" y="371" width="200" height="42" rx="9" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="820" y="397" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle">mochila</text><text x="480.0" y="428" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Demostrar que algo es NP-completo = encontrar UNA flecha desde algo que ya lo es. Karp encontró 21 en 1972.</text></svg>