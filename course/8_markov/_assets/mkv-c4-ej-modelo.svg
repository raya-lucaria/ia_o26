<svg xmlns="http://www.w3.org/2000/svg" width="300" height="803" viewBox="0 0 300 803" role="img" aria-label="Lo cumple: B del paraguas: cada fila suma 1. Arriba, los estados ocultos lluvia y sol, en nodos con borde punteado. Lluvia se queda con 7/10 y pasa a sol con 3/10. Sol pasa a lluvia con 3/10 y se queda con 7/10. Abajo, las señales que se ven, paraguas y sin paraguas, en nodos con borde sólido. De lluvia salen flechas de emisión: a paraguas con 9/10, a sin paraguas con 1/10. De sol salen flechas de emisión: a paraguas con 2/10, a sin paraguas con 8/10. B por filas: 9/10, 1/10; 2/10, 8/10. lluvia suma 1, sol suma 1. No lo cumple: La misma B, copiada por columnas. Arriba, los estados ocultos lluvia y sol, en nodos con borde punteado. Lluvia se queda con 7/10 y pasa a sol con 3/10. Sol pasa a lluvia con 3/10 y se queda con 7/10. Abajo, las señales que se ven, paraguas y sin paraguas, en nodos con borde sólido. De lluvia salen flechas de emisión: a paraguas con 9/10, a sin paraguas con 2/10. De sol salen flechas de emisión: a paraguas con 1/10, a sin paraguas con 8/10. B por filas: 9/10, 2/10; 1/10, 8/10. lluvia suma 11/10, sol suma 9/10."><title>Ejemplo y contraejemplo un modelo oculto</title><desc>Lo cumple: B del paraguas: cada fila suma 1. Arriba, los estados ocultos lluvia y sol, en nodos con borde punteado. Lluvia se queda con 7/10 y pasa a sol con 3/10. Sol pasa a lluvia con 3/10 y se queda con 7/10. Abajo, las señales que se ven, paraguas y sin paraguas, en nodos con borde sólido. De lluvia salen flechas de emisión: a paraguas con 9/10, a sin paraguas con 1/10. De sol salen flechas de emisión: a paraguas con 2/10, a sin paraguas con 8/10. B por filas: 9/10, 1/10; 2/10, 8/10. lluvia suma 1, sol suma 1. No lo cumple: La misma B, copiada por columnas. Arriba, los estados ocultos lluvia y sol, en nodos con borde punteado. Lluvia se queda con 7/10 y pasa a sol con 3/10. Sol pasa a lluvia con 3/10 y se queda con 7/10. Abajo, las señales que se ven, paraguas y s