<svg xmlns="http://www.w3.org/2000/svg" width="300" height="589" viewBox="0 0 300 589" role="img" aria-label="Lo cumple: Codiciosa de V*: caminar–correr. Con U = V*, U(1) = −5 y U(2) = −2: en 1, caminar vale −5; en 1, correr vale −19/2; en 2, caminar vale −3; en 2, correr vale −2. La codiciosa elige caminar–correr. No lo cumple: Codiciosa de U: caminar–caminar. Con U equivocado, U(1) = −8 y U(2) = −8: en 1, caminar vale −11; en 1, correr vale −14; en 2, caminar vale −3; en 2, correr vale −5. La codiciosa elige caminar–caminar."><title>Ejemplo y contraejemplo la codiciosa de V*</title><desc>Lo cumple: Codiciosa de V*: caminar–correr. Con U = V*, U(1) = −5 y U(2) = −2: en 1, caminar vale −5; en 1, correr vale −19/2; en 2, caminar vale −3; en 2, correr vale −2. La codiciosa elige caminar–correr. No lo cumple: Codiciosa de U: caminar–caminar. Con U equivocado, U(1) = −8 y U(2) = −8: en 1, caminar vale −11; en 1, correr vale −14; en 2, caminar vale −3; en 2, correr vale −5. La codiciosa elige caminar–caminar.</desc><rect x="0" y="0" width="300" height="589" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">la codiciosa de V*</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d