<svg xmlns="http://www.w3.org/2000/svg" width="300" height="409" viewBox="0 0 300 409" role="img" aria-label="Cuadro de dos por dos. Columnas: estado visible y estado oculto. Renglones: modelo conocido y modelo desconocido. Arriba a la izquierda, Planificar un MDP, con la marca clase 3: Bellman, iterar valores y políticas. Arriba a la derecha, POMDP, con la marca clase 4: creencia, filtrar, decidir con b. Estas dos casillas van rellenas: ya se vieron. Abajo a la izquierda, Refuerzo clásico, con falta: el modelo; se aprende de episodios. Abajo a la derecha, Refuerzo con observación parcial, con falta: el modelo y el estado. Las dos de abajo van solo con borde punteado: no se han visto. Una flecha horizontal en el renglón de arriba dice se deja de ver el estado; una vertical en la columna izquierda dice se deja de conocer el modelo."><title>El mapa de dos ejes lo visto y lo que falta</title><desc>Cuadro de dos por dos. Columnas: estado visible y estado oculto. Renglones: modelo conocido y modelo desconocido. Arriba a la izquierda, Planificar un MDP, con la marca clase 3: Bellman, iterar valores y políticas. Arriba a la derecha, POMDP, con la marca clase 4: creencia, filtrar, decidir con b. Estas dos casillas van rellenas: ya se vieron. Abajo a la izquierda, Refuerzo clásico, con falta: el modelo; se aprende de episodios. Abajo a la derecha, Refuerzo con observación parcial, con falta: el modelo y el estado. Las dos de abajo van solo con borde punteado: no se han visto. Una flecha horizontal en el renglón de arriba dice se deja de ver el estado; una vertical en la columna izquierda dice se deja de conocer el modelo.</desc><rect x="0" y="0" width="300" height="409" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">El mapa de dos ejes</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">lo visto y lo que falta</text><text x="115" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">estado visible</text><text x="229" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">estado oculto</text><text x="172" y="109" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">se deja de ver el estado</text><line x1="135" y1="117" x2="209" y2="117" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="60" y="127" width="110" height="104" rx="10" fill="#2c3d60" stroke="#55ddff" stroke-width="2"/><text x="115" y="147" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Planificar</text><text x="115" y="163" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">un MDP</text><text x="115" y="182" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">clase 3: Bellman,</text><text x="115" y="197" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">iterar valores</text><text x="115" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">y políticas</text><rect x="174" y="127" width="110" height="104" rx="10" fill="#2c3d60" stroke="#55ddff" stroke-width="2"/><text x="229" y="147" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">POMDP</text><text x="229" y="166" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">clase 4: creencia,</text><text x="229" y="181" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">filtrar,</text><text x="229" y="196" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">decidir con b</text><rect x="60" y="243" width="110" height="104" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="5 4"/><text x="115" y="263" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Refuerzo</text><text x="115" y="279" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">clásico</text><text x="115" y="298" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">falta: el modelo;</text><text x="115" y="313" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">se aprende de</text><text x="115" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">episodios</text><rect x="174" y="243" width="110" height="104" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="5 4"/><text x="229" y="263" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Refuerzo con</text><text x="229" y="279" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">observación</text><text x="229" y="295" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">parcial</text><text x="229" y="314" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">falta: el modelo</text><text x="229" y="329" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">y el estado</text><text x="12" y="179" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 12 179)">modelo</text><text x="27" y="179" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 27 179)">conocido</text><text x="12" y="295" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 12 295)">modelo</text><text x="27" y="295" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 27 295)">desconocido</text><line x1="54" y1="179" x2="54" y2="293" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="45" y="237" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" transform="rotate(-90 45 237)">se deja de conocer el modelo</text><text x="16" y="369" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Relleno: ya se vio.</text><text x="16" y="389" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Punteado: falta por ver.</text></svg>