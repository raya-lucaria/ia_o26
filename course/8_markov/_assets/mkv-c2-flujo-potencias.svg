<svg xmlns="http://www.w3.org/2000/svg" width="300" height="831" viewBox="0 0 300 831" role="img" aria-label="Diagrama de flujo de la iteración de potencias, en palabras. 1: Empieza: μ ← μ₀ y pasos = 1. 2: Multiplica: nuevo = μP. 3: Mide d = ‖nuevo − μ‖₁ y avanza: μ ← nuevo. 4, pregunta: ¿d ≤ tol? Si no, sigue abajo. 5, pregunta: ¿pasos llegó al tope? Si no, sigue abajo. 6: Suma 1 a pasos. 7: Devuelve (μ, «no paró»). 8: Devuelve (μ, pasos). Desde el paso 6, si otra vuelta, vuelve al paso 2. Desde el paso 4, si sí, salta al paso 8. Desde el paso 5, si sí, salta al paso 7. «No paró» no prueba que no converja: solo que no cumplió tol a tiempo. Cada vuelta cuesta k² productos."><title>Iteración de potencias, en palabras</title><desc>Diagrama de flujo de la iteración de potencias, en palabras. 1: Empieza: μ ← μ₀ y pasos = 1. 2: Multiplica: nuevo = μP. 3: Mide d = ‖nuevo − μ‖₁ y avanza: μ ← nuevo. 4, pregunta: ¿d ≤ tol? Si no, sigue abajo. 5, pregunta: ¿pasos llegó al tope? Si no, sigue abajo. 6: Suma 1 a pasos. 7: Devuelve (μ, «no paró»). 8: Devuelve (μ, pasos). Desde el paso 6, si otra vuelta, vuelve al paso 2. Desde el paso 4, si sí, salta al paso 8. Desde el paso 5, si sí, salta al paso 7. «No paró» no prueba que no converja: solo que no cumplió tol a tiempo. Cada vuelta cuesta k² productos.</desc><rect x="0" y="0" width="300" height="831" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Iteración de potencias,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza: μ ← μ₀</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y pasos = 1</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Multiplica:</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">nuevo = μP</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Mide d = ‖nuevo − μ‖₁</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y avanza: μ ← nuevo</text><line x1="112" y1="317" x2="112" y2="348" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,351 182,386 112,421 42,386" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿d ≤ tol?</text><line x1="112" y1="421" x2="112" y2="452" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="440" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><polygon points="112,455 182,499 112,543 42,499" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="495" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿pasos llegó</text><text x="112" y="513" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">al tope?</text><line x1="112" y1="543" x2="112" y2="574" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="562" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><rect x="40" y="577" width="244" height="36" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="600" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Suma 1 a pasos</text><rect x="40" y="647" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="670" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve (μ, «no paró»)</text><rect x="40" y="717" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="740" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve (μ, pasos)</text><polyline points="40,595 22,595 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="397" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 397)">otra vuelta</text><polyline points="182,386 297,386 297,735" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="297" y1="735" x2="287" y2="735" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="378" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><polyline points="182,499 290,499 290,665" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="290" y1="665" x2="287" y2="665" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="491" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><text x="16" y="779" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">«No paró» no prueba que no converja:</text><text x="16" y="799" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">solo que no cumplió tol a tiempo.</text><text x="16" y="819" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada vuelta cuesta k² productos.</text></svg>