<svg xmlns="http://www.w3.org/2000/svg" width="300" height="689" viewBox="0 0 300 689" role="img" aria-label="Diagrama de flujo de la iteración de potencias, en palabras. 1: Empieza con μ₀ y t = 0. 2: Multiplica: μ′ = μP y suma 1 a t. 3, pregunta: ¿‖μ′ − μ‖₁ ≤ tol? Si no, sigue abajo. 4, pregunta: ¿t llegó al tope? Si no, sigue abajo. 5: Avanza: μ ← μ′. 6: Devuelve μ′ y t. Desde el paso 5, si otra vuelta, vuelve al paso 2. Desde el paso 3, si sí, salta al paso 6. Desde el paso 4, si sí, salta al paso 6. Si para por el tope, avisa: no convergió (la alternante desde A). Cada vuelta cuesta k² productos."><title>Iteración de potencias, en palabras</title><desc>Diagrama de flujo de la iteración de potencias, en palabras. 1: Empieza con μ₀ y t = 0. 2: Multiplica: μ′ = μP y suma 1 a t. 3, pregunta: ¿‖μ′ − μ‖₁ ≤ tol? Si no, sigue abajo. 4, pregunta: ¿t llegó al tope? Si no, sigue abajo. 5: Avanza: μ ← μ′. 6: Devuelve μ′ y t. Desde el paso 5, si otra vuelta, vuelve al paso 2. Desde el paso 3, si sí, salta al paso 6. Desde el paso 4, si sí, salta al paso 6. Si para por el tope, avisa: no convergió (la alternante desde A). Cada vuelta cuesta k² productos.</desc><rect x="0" y="0" width="300" height="689" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Iteración de potencias,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza con μ₀</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y t = 0</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Multiplica: μ′ = μP</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y suma 1 a t</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,261 182,305 112,349 42,305" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="301" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿‖μ′ − μ‖₁</text><text x="112" y="319" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">≤ tol?</text><line x1="112" y1="349" x2="112" y2="380" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="368" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><polygon points="112,383 182,427 112,471 42,427" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="423" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿t llegó</text><text x="112" y="441" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">al tope?</text><line x1="112" y1="471" x2="112" y2="502" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="490" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><rect x="40" y="505" width="244" height="36" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="528" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Avanza: μ ← μ′</text><rect x="40" y="575" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="598" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve μ′ y t</text><polyline points="40,523 22,523 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="361" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 361)">otra vuelta</text><polyline points="182,305 293,305 293,593" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="593" x2="287" y2="593" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="297" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><polyline points="182,427 293,427 293,593" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="593" x2="287" y2="593" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="419" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><text x="16" y="637" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Si para por el tope, avisa: no</text><text x="16" y="657" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">convergió (la alternante desde A).</text><text x="16" y="677" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada vuelta cuesta k² productos.</text></svg>