<svg xmlns="http://www.w3.org/2000/svg" width="300" height="483" viewBox="0 0 300 483" role="img" aria-label="Escala logarítmica, rondas 1 a 10 de la iteración de valores en el pasillo. Residuo: 3, 1, 1/2, 1/4, 1/8, 1/16, 1/32, 1/64, 1/128, 1/256. Error máximo contra V*: 2, 1, 1/2, 1/4, 1/8, 1/16, 1/32, 1/64, 1/128, 1/256. Cota con m = 3 y β = 1/2: 6 × residuo, siempre por encima del error."><title>Residuo, error y cota escala log</title><desc>Escala logarítmica, rondas 1 a 10 de la iteración de valores en el pasillo. Residuo: 3, 1, 1/2, 1/4, 1/8, 1/16, 1/32, 1/64, 1/128, 1/256. Error máximo contra V*: 2, 1, 1/2, 1/4, 1/8, 1/16, 1/32, 1/64, 1/128, 1/256. Cota con m = 3 y β = 1/2: 6 × residuo, siempre por encima del error.</desc><rect x="0" y="0" width="300" height="483" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Residuo, error y cota</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">escala log</text><polyline points="17,77 41,77" fill="none" stroke="#55ddff" stroke-width="2"/><circle cx="29" cy="77" r="4.5" fill="#211033" stroke="#55ddff" stroke-width="2"/><text x="50" y="81" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">residuo res⁽ᵏ⁾</text><polyline points="17,97 41,97" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="5 4"/><rect x="25" y="93" width="8" height="8" fill="#ffd166" stroke="#ffd166" stroke-width="1"/><text x="50" y="101" fill="#f7f2ff" font-family