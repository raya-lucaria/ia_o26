<svg xmlns="http://www.w3.org/2000/svg" width="300" height="587" viewBox="0 0 300 587" role="img" aria-label="Diagrama de flujo de la iteración de valores, en palabras. 1: Empieza: V(s) = 0 en todo estado. 2: En cada s, el máximo sobre a de r + Σ P V. 3: Mide el residuo: el mayor cambio; V ← nuevo. 4, pregunta: ¿residuo ≤ tol? Si sí, sigue abajo. 5: Devuelve V y la codiciosa de V. Desde el paso 4, si no: otra ronda, vuelve al paso 2. Cada ronda usa los valores de la anterior en todos los estados."><title>Iteración de valores, en palabras</title><desc>Diagrama de flujo de la iteración de valores, en palabras. 1: Empieza: V(s) = 0 en todo estado. 2: En cada s, el máximo sobre a de r + Σ P V. 3: Mide el residuo: el mayor cambio; V ← nuevo. 4, pregunta: ¿residuo ≤ tol? Si sí, sigue abajo. 5: Devuelve V y la codiciosa de V. Desde el paso 4, si no: otra ronda, vuelve al paso 2. Cada ronda usa los valores de la anterior en todos los estados.</desc><rect x="0" y="0" width="300" height="587" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Iteración de valores,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza: V(s) = 0</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">en todo estado</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">En cada s, el máximo</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">sobre a de r + Σ P V</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Mide el residuo: el</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">mayor cambio; V ← nuevo</text><line x1="112" y1="317" x2="112" y2="348" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,351 182,395 112,439 42,395" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿residuo</text><text x="112" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">≤ tol?</text><line x1="112" y1="439" x2="112" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="458" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="473" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve V y la</text><text x="50" y="516" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">codiciosa de V</text><polyline points="42,395 22,395 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="297" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 297)">no: otra ronda</text><text x="16" y="555" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada ronda usa los valores de la</text><text x="16" y="575" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">anterior en todos los estados.</text></svg>