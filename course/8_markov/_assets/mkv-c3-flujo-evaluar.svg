<svg xmlns="http://www.w3.org/2000/svg" width="300" height="657" viewBox="0 0 300 657" role="img" aria-label="Diagrama de flujo de evaluar una política, en palabras. 1: Toma la política π. 2: Elige filas: la fila s de P y r con la acción π(s). 3: Arma (I − P) V = r sin la columna de la meta. 4, pregunta: ¿Tiene solución única? Si sí, sigue abajo. 5: Resuélvelo y devuelve el valor de π. 6: Avisa: desde algún estado no termina. Desde el paso 4, si no, salta al paso 6. Cada renglón dice: lo que pagas ahora más lo que vale donde caes."><title>Evaluar una política, en palabras</title><desc>Diagrama de flujo de evaluar una política, en palabras. 1: Toma la política π. 2: Elige filas: la fila s de P y r con la acción π(s). 3: Arma (I − P) V = r sin la columna de la meta. 4, pregunta: ¿Tiene solución única? Si sí, sigue abajo. 5: Resuélvelo y devuelve el valor de π. 6: Avisa: desde algún estado no termina. Desde el paso 4, si no, salta al paso 6. Cada renglón dice: lo que pagas ahora más lo que vale donde caes.</desc><rect x="0" y="0" width="300" height="657" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Evaluar una política,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="36" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Toma la política π</text><line x1="112" y1="117" x2="112" y2="148" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="151" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="174" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Elige filas: la fila s</text><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">de P y r con la acción π(s)</text><line x1="112" y1="207" x2="112" y2="238" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="241" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="264" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Arma (I − P) V = r</text><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">sin la columna de la meta</text><line x1="112" y1="297" x2="112" y2="328" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,331 182,375 112,419 42,375" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="371" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Tiene solución</text><text x="112" y="389" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">única?</text><line x1="112" y1="419" x2="112" y2="450" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="438" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="453" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="476" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Resuélvelo y devuelve</text><text x="50" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">el valor de π</text><rect x="40" y="543" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="566" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Avisa: desde algún</text><text x="50" y="586" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">estado no termina</text><polyline points="182,375 293,375 293,571" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="571" x2="287" y2="571" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><text x="16" y="625" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada renglón dice: lo que pagas</text><text x="16" y="645" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ahora más lo que vale donde caes.</text></svg>