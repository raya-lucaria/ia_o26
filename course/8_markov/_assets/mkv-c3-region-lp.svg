<svg xmlns="http://www.w3.org/2000/svg" width="300" height="469" viewBox="0 0 300 469" role="img" aria-label="Plano V(1)–V(2) con las cuatro restricciones del programa lineal del pasillo, una recta por par (estado, acción): caminar en 1: 1 V(1) − 1 V(2) ≥ −3; correr en 1: 1/2 V(1) − 1/2 V(2) ≥ −6; caminar en 2: 0 V(1) + 1 V(2) ≥ −3; correr en 2: 0 V(1) + 1/2 V(2) ≥ −1. La región donde se cumplen todas está sombreada; minimizar V(1) + V(2) lleva a la esquina (−5, −2), que es V*."><title>El MDP como programa lineal: la región</title><desc>Plano V(1)–V(2) con las cuatro restricciones del programa lineal del pasillo, una recta por par (estado, acción): caminar en 1: 1 V(1) − 1 V(2) ≥ −3; correr en 1: 1/2 V(1) − 1/2 V(2) ≥ −6; caminar en 2: 0 V(1) + 1 V(2) ≥ −3; correr en 2: 0 V(1) + 1/2 V(2) ≥ −1. La región donde se cumplen todas está sombreada; minimizar V(1) + V(2) lleva a la esquina (−5, −2), que es V*.</desc><rect x="0" y="0" width="300" height="469" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">El MDP como programa</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">lineal: la región</text><line x1="58" y1="303" x2="280" y2="303" stroke="#4c2868" stroke-width="1"/><text x="50" y="307" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">−4</text><line x1="58" y1="269.7" x2="280" y2="269.7" stroke="#4c2868" stroke-width="1"/><text x="50" y="273.7" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">−3</text><line x1="58" y1="236.3" x2="280" y2="236.3" stroke="#4c2868" stroke-width="1"/><text x="50" y="240.3" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">−2</text><line x1="58" y1="203" x2="280" y2="203" stroke="#4c2868" stroke-width="1"/><text x="50" y="207" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">−1</text><line x1="58" y1="169.7" x2="280" y2="169.7" stroke="#4c2868" stroke-width="1"/><text x="50" y="173.7" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><line x1="58" y1="136.3" x2="280" y2="136.3" stroke="#4c2868" stroke-width="1"/><text x="50" y="140.3" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><line x1="58" y1="103" x2="280" y2="103" stroke="#4c2868" stroke-width="1"/><text x="50" y="107" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><line x1="85.8" y1="103" x2="85.8" y2="303" stroke="#4c2868" stroke-width="1"/><text x="85.8" y="320" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">−12</text><line x1="141.2" y1="103" x2="141.2" y2="303" stroke="#4c2868" stroke-width="1"/><text x="141.2" y="320" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">−8</text><line x1="196.8" y1="103" x2="196.8" y2="303" stroke="#4c2868" stroke-width="1"/><text x="196.8" y="320" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">−4</text><line x1="252.2" y1="103" x2="252.2" y2="303" stroke="#4c2868" stroke-width="1"/><text x="252.2" y="320" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><text x="169" y="339" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">V(1)</text><text x="16" y="91" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">V(2)</text><polygon points="280,236.3 280,103 238.4,103 182.9,236.3" fill="#4a583f" stroke="none"/><line x1="155.1" y1="303" x2="238.4" y2="103" stroke="#f7f2ff" stroke-width="1.5"/><line x1="58" y1="236.3" x2="113.5" y2="103" stroke="#f7f2ff" stroke-width="1.5"/><line x1="58" y1="269.7" x2="280" y2="269.7" stroke="#f7f2ff" stroke-width="1.5"/><line x1="58" y1="236.3" x2="280" y2="236.3" stroke="#f7f2ff" stroke-width="1.5"/><polyline points="210.6,303 127.4,103" fill="none" stroke="#f04cff" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="182.9" cy="236.3" r="6" fill="#f04cff" stroke="#f04cff" stroke-width="1"/><text x="238.4" y="95" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">caminar en 1</text><text x="113.5" y="95" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">correr en 1</text><text x="63.6" y="284.7" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">caminar en 2</text><text x="63.6" y="230.3" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">correr en 2</text><rect x="19" y="352" width="20" height="14" fill="#4a583f"/><text x="50" y="363" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">donde se cumplen las cuatro</text><polyline points="17,379 41,379" fill="none" stroke="#f04cff" stroke-width="1.5" stroke-dasharray="4 3"/><text x="50" y="383" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">V(1) + V(2) constante, la menor</text><circle cx="29" cy="399" r="5" fill="#f04cff"/><text x="50" y="403" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el mínimo: (−5, −2) = V*</text><text x="16" y="429" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Una recta por cada par (estado, acción):</text><text x="16" y="449" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">V(s) ≥ r(s, a) + Σ P(s′ | s, a) V(s′).</text></svg>