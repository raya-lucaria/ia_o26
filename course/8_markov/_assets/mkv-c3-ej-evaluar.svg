<svg xmlns="http://www.w3.org/2000/svg" width="300" height="667" viewBox="0 0 300 667" role="img" aria-label="Lo cumple: caminar–correr: una sola solución. Política caminar–correr: en 1, caminar (r = −3): a 2 con 1; en 2, correr (r = −1): se queda con 1/2, a meta con 1/2. I − P π,𝒯 = 1, −1; 0, 1/2, invertible; V(1) = −5, V(2) = −2. No lo cumple: esperar siempre: I − P es cero. Política esperar siempre (gratis): en 1, esperar (r = 0): se queda con 1; en 2, esperar (r = 0): se queda con 1. I − P π,𝒯 = 0, 0; 0, 0, la matriz cero: no se puede invertir y toda V resuelve el sistema."><title>Ejemplo y contraejemplo evaluar una política</title><desc>Lo cumple: caminar–correr: una sola solución. Política caminar–correr: en 1, caminar (r = −3): a 2 con 1; en 2, correr (r = −1): se queda con 1/2, a meta con 1/2. I − P π,𝒯 = 1, −1; 0, 1/2, invertible; V(1) = −5, V(2) = −2. No lo cumple: esperar siempre: I − P es cero. Política esperar siempre (gratis): en 1, esperar (r = 0): se queda con 1; en 2, esperar (r = 0): se queda con 1. I − P π,𝒯 = 0, 0; 0, 0, la matriz cero: no se puede invertir y toda V resuelve el sistema.</desc><rect x="0" y="0" width="300" height="667" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">evaluar una política</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">caminar–correr: una sola solución</text><path d="M 59.7 185.4 Q 72 175 94.2 156.2" fill="none" stroke="#c8b9d8" stroke-width="2"/><path d="M 101.8 156.2 Q 124 175 134.7 184.1" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="128.9" y="167.4" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text><circle cx="98" cy="153" r="5" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="98" y="129" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">caminar</text><text x="98" y="143" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">r = −3</text><path d="M 166 205.3 Q 179.1 212.1 188.3 238.3" fill="none" stroke="#c8b9d8" stroke-width="2"/><path d="M 185.6 240.7 Q 160.9 227.9 156.7 215.9" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="157" y="239.9" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1/2</text><path d="M 194.1 240.1 Q 222 220 233.7 211.6" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="224.9" y="236.7" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1/2</text><circle cx="190" cy="243" r="5" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="190" y="265" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">correr</text><text x="190" y="280" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">r = −1</text><circle cx="46" cy="197" r="18" fill="#2a3558" stroke="#55ddff" stroke-width="2"/