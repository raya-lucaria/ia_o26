<svg xmlns="http://www.w3.org/2000/svg" width="300" height="829" viewBox="0 0 300 829" role="img" aria-label="Lo cumple: Cada fila de P caminar y P correr suma 1. en 1, caminar (r = −3): a 2 con 1; en 1, correr (r = −6): se queda con 1/2, a 2 con 1/2; en 2, caminar (r = −3): a meta con 1; en 2, correr (r = −1): se queda con 1/2, a meta con 1/2. Filas de P correr suman 1 y 1. No lo cumple: Fila 1 de P correr: 1/2 + 1 = 3/2. en 1, caminar (r = −3): a 2 con 1; en 1, correr (r = −6): se queda con 1/2, a 2 con 1; en 2, caminar (r = −3): a meta con 1; en 2, correr (r = −1): se queda con 1/2, a meta con 1/2. Filas de P correr suman 3/2 y 1."><title>Ejemplo y contraejemplo un MDP</title><desc>Lo cumple: Cada fila de P caminar y P correr suma 1. en 1, caminar (r = −3): a 2 con 1; en 1, correr (r = −6): se queda con 1/2, a 2 con 1/2; en 2, caminar (r = −3): a meta con 1; en 2, correr (r = −1): se queda con 1/2, a meta con 1/2. Filas de P correr suman 1 y 1. No lo cumple: Fila 1 de P correr: 1/2 + 1 = 3/2. en 1, caminar (r = −3): a 2 con 1; en 1, correr (r = −6): se queda con 1/2, a 2 con 1; en 2, caminar (r = −3): a meta con 1; en 2, correr (r = −1): se queda con 1/2, a meta con 1/2. Filas de P correr suman 3/2 y 1.</desc><rect x="0" y="0" width="300" height="829" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">un MDP</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e"