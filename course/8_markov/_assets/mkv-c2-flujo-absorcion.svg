<svg xmlns="http://www.w3.org/2000/svg" width="300" height="677" viewBox="0 0 300 677" role="img" aria-label="Diagrama de flujo del tiempo medio de llegada, en palabras. 1: Marca la meta A: m = 0 en A. 2: Quita de P las filas y columnas de A. 3: Arma el sistema (I − P𝒯) m = 1. 4, pregunta: ¿Tiene una solución? Si sí, sigue abajo. 5: Resuélvelo y devuelve m. 6: Avisa: desde algún estado no se llega. Desde el paso 4, si no, salta al paso 6. Cada renglón dice: un turno más lo que falta desde donde caes."><title>Tiempo medio de llegada, en palabras</title><desc>Diagrama de flujo del tiempo medio de llegada, en palabras. 1: Marca la meta A: m = 0 en A. 2: Quita de P las filas y columnas de A. 3: Arma el sistema (I − P𝒯) m = 1. 4, pregunta: ¿Tiene una solución? Si sí, sigue abajo. 5: Resuélvelo y devuelve m. 6: Avisa: desde algún estado no se llega. Desde el paso 4, si no, salta al paso 6. Cada renglón dice: un turno más lo que falta desde donde caes.</desc><rect x="0" y="0" width="300" height="677" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Tiempo medio de llegada,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Marca la meta A:</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">m = 0 en A</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Quita de P las filas</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y columnas de A</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Arma el sistema</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">(I − P𝒯) m = 1</text><line x1="112" y1="317" x2="112" y2="348" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,351 182,395 112,439 42,395" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Tiene una</text><text x="112" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">solución?</text><line x1="112" y1="439" x2="112" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="458" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="473" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Resuélvelo y</text><text x="50" y="516" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">devuelve m</text><rect x="40" y="563" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="586" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Avisa: desde algún</text><text x="50" y="606" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">estado no se llega</text><polyline points="182,395 293,395 293,591" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="591" x2="287" y2="591" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="387" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><text x="16" y="645" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada renglón dice: un turno más</text><text x="16" y="665" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lo que falta desde donde caes.</text></svg>