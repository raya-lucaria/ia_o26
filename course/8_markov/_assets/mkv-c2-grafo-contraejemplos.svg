<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1023" viewBox="0 0 300 1023" role="img" aria-label="Tres cadenas apiladas, cada una con lo que cumple y lo que rompe. Primera, alternante: A va a B con 1 y B a A con 1; una clase cerrada de periodo 2. Sí: μ = (1/2, 1/2) es única y la fracción del tiempo tiende a 1/2. No: desde A, μₜ alterna 1, 0, 1 y no converge; lo rompe el periodo 2. Segunda, identidad: s1 y s2 se quedan con 1; dos clases cerradas. Sí: μₜ converge, porque nunca cambia. No: toda distribución es estacionaria y cada inicio se queda con su límite. Tercera: s1 se queda con 1/2 y va a s2 con 1/4 y a s3 con 1/4; s2 y s3 se quedan con 1; s1 es transitorio (marco punteado). Sí: μₜ converge, a un límite que depende del inicio; desde s1, a (0, 1/2, 1/2). No: (0, p, 1 − p) es estacionaria para todo p, y una sola trayectoria pasa 1 o 0 del tiempo en s2, nunca 1/2."><title>Tres contraejemplos pequeños</title><desc>Tres cadenas apiladas, cada una con lo que cumple y lo que rompe. Primera, alternante: A va a B con 1 y B a A con 1; una clase cerrada de periodo 2. Sí: μ = (1/2, 1/2) es única y la fracción del tiempo tiende a 1/2. No: desde A, μₜ alterna 1, 0, 1 y no converge; lo rompe el periodo 2. Segunda, identidad: s1 y s2 se quedan con 1; dos clases cerradas. Sí: μₜ converge, porque nunca cambia. No: toda distribución es estacionaria y cada inicio se queda con su límite. Tercera: s1 se queda con 1/2 y va a s2 con 1/4 y a s3 con 1/4; s2 y s3 se quedan con 1; s1 es transitorio (marco punteado). Sí: μₜ converge, a un límite que depende del inicio; desde s1, a (0, 1/2, 1/2). No: (0, p, 1 − p) es estacionaria para todo p, y una sola trayectoria pasa 1 o 0 del tiempo en s2, nunca 1/2.</desc><rect x="0" y="0" width="300" height="1023" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Tres contraejemplos</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">pequeños</text><text x="16" y="83" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Alternante: periodo 2</text><rect x="62" y="101" width="176" height="68" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 118.8 128.2 Q 150 117 179.3 127.5" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="149.5" y="115" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><path d="M 181.2 141.8 Q 150 153 120.7 142.5" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150.5" y="164.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="100" cy="135" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="100" y="140.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">A</text><circle cx="200" cy="135" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="200" y="140.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">B</text><text x="16" y="193" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Sí: μ = (1/2, 1/2) es única.</text><text x="16" y="213" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Sí: fracción del tiempo → 1/2.</text><text x="16" y="233" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">No: desde A, μₜ alterna 1, 0, 1, …</text><text x="16" y="253" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">y no converge. Lo rompe el periodo 2.</text><text x="16" y="287" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Identidad: dos clases cerradas</text><rect x="60" y="303" width="80" height="110" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 91.3 365 C 57.5 332.5 142.5 332.5 109.6 363.2" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="100" y="321.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="100" cy="383" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="100" y="388.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s1</text><rect x="160" y="303" width="80" height="110" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 191.3 365 C 157.5 332.5 242.5 332.5 209.6 363.2" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="200" y="321.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="200" cy="383" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="200" y="388.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s2</text><text x="16" y="437" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Nadie sale de donde empieza.</text><text x="16" y="457" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Sí: μₜ converge (nunca cambia).</text><text x="16" y="477" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">No es única: toda distribución es</text><text x="16" y="497" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">estacionaria. Cada inicio se queda</text><text x="16" y="517" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">con su límite. Lo rompen dos clases.</text><text x="16" y="551" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Transitorio entre dos cerradas</text><rect x="108" y="565" width="84" height="116" rx="10" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 4"/><path d="M 141.3 629 C 107.5 596.5 192.5 596.5 159.6 627.2" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150" y="585.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/2</text><path d="M 141.7 665.2 Q 125 702 109.1 737" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="114.3" y="701.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/4</text><path d="M 158.3 665.2 Q 175 702 190.9 737" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="185.7" y="701.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/4</text><rect x="22" y="725" width="112" height="64" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 82 765.7 C 49.5 799.5 49.5 714.5 80.2 747.4" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="38" y="761.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">1</text><circle cx="100" cy="757" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="100" y="762.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s2</text><rect x="166" y="725" width="112" height="64" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 218 748.3 C 250.5 714.5 250.5 799.5 219.8 766.6" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="262" y="761.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1</text><circle cx="200" cy="757" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="200" y="762.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s3</text><circle cx="150" cy="647" r="20" fill="#49333c" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 3"/><text x="150" y="652.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s1</text><text x="16" y="817" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Desde s1 cae en s2 o en s3, al azar.</text><text x="16" y="837" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Sí: μₜ converge, pero a un límite</text><text x="16" y="857" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">que depende del inicio. Desde s1,</text><text x="16" y="877" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">a (0, 1/2, 1/2): la mitad de las</text><text x="16" y="897" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">réplicas acaba en cada cerrada.</text><text x="16" y="917" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">No es única: (0, p, 1 − p) lo es.</text><text x="16" y="937" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">No: una sola trayectoria pasa 1 o 0</text><text x="16" y="957" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">del tiempo en s2, nunca 1/2.</text><text x="16" y="983" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Marco continuo: clase cerrada.</text><text x="16" y="1003" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Punteado: abierta.</text></svg>