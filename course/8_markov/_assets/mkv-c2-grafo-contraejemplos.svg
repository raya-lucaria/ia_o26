<svg xmlns="http://www.w3.org/2000/svg" width="300" height="823" viewBox="0 0 300 823" role="img" aria-label="Tres cadenas apiladas. Primera, alternante: A va a B con 1 y B a A con 1; una clase cerrada de periodo 2; μ = (1/2, 1/2) única, pero desde A oscila. Segunda, identidad: s1 y s2 se quedan con 1; dos clases cerradas; toda distribución es estacionaria. Tercera: s1 se queda con 1/2 y va a s2 con 1/4 y a s3 con 1/4; s2 y s3 se quedan con 1; s1 es transitorio (marco punteado) y la fracción del tiempo en s2 tiende a 1 o a 0 según la réplica."><title>Tres contraejemplos pequeños</title><desc>Tres cadenas apiladas. Primera, alternante: A va a B con 1 y B a A con 1; una clase cerrada de periodo 2; μ = (1/2, 1/2) única, pero desde A oscila. Segunda, identidad: s1 y s2 se quedan con 1; dos clases cerradas; toda distribución es estacionaria. Tercera: s1 se queda con 1/2 y va a s2 con 1/4 y a s3 con 1/4; s2 y s3 se quedan con 1; s1 es transitorio (marco punteado) y la fracción del tiempo en s2 tiende a 1 o a 0 según la réplica.</desc><rect x="0" y="0" width="300" height="823" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Tres contraejemplos</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">pequeños</text><text x="16" y="83" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Alternante: periodo 2</text><rect x="62" y="101" width="176" height="68" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 118.8 128.2 Q 150 117 179.3 127.5" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="149.5" y="115" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><path d="M 181.2 141.8 Q 150 153 120.7 142.5" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150.5" y="164.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="100" cy="135" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="100" y="140.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">A</text><circle cx="200" cy="135" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="200" y="140.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">B</text><text x="16" y="193" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">μ = (1/2, 1/2) es única, pero desde A</text><text x="16" y="213" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la cadena oscila: A, B, A, B, …</text><text x="16" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Identidad: dos clases cerradas</text><rect x="60" y="263" width="80" height="110" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 91.3 325 C 57.5 292.5 142.5 292.5 109.6 323.2" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="100" y="281.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="100" cy="343" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="100" y="348.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s1</text><rect x="160" y="263" width="80" height="110" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 191.3 325 C 157.5 292.5 242.5 292.5 209.6 323.2" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="200" y="281.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="200" cy="343" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="200" y="348.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s2</text><text x="16" y="397" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Nadie sale de donde empieza: toda</text><text x="16" y="417" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">distribución es estacionaria.</text><text x="16" y="451" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Transitorio entre dos cerradas</text><rect x="108" y="465" width="84" height="116" rx="10" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 4"/><path d="M 141.3 529 C 107.5 496.5 192.5 496.5 159.6 527.2" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150" y="485.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/2</text><path d="M 141.7 565.2 Q 125 602 109.1 637" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="114.3" y="601.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/4</text><path d="M 158.3 565.2 Q 175 602 190.9 637" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="185.7" y="601.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/4</text><rect x="22" y="625" width="112" height="64" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 82 665.7 C 49.5 699.5 49.5 614.5 80.2 647.4" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="38" y="661.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">1</text><circle cx="100" cy="657" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="100" y="662.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s2</text><rect x="166" y="625" width="112" height="64" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 218 648.3 C 250.5 614.5 250.5 699.5 219.8 666.6" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="262" y="661.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1</text><circle cx="200" cy="657" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="200" y="662.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s3</text><circle cx="150" cy="547" r="20" fill="#49333c" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 3"/><text x="150" y="552.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s1</text><text x="16" y="717" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Desde s1 cae en s2 o en s3, al azar:</text><text x="16" y="737" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la fracción del tiempo en s2 tiende</text><text x="16" y="757" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">a 1 o a 0 según la réplica.</text><text x="16" y="783" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Marco continuo: clase cerrada.</text><text x="16" y="803" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Punteado: abierta.</text></svg>