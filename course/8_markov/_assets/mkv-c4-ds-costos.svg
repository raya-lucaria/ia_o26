<svg xmlns="http://www.w3.org/2000/svg" width="300" height="491" viewBox="0 0 300 491" role="img" aria-label="Gráfica con la creencia b = Pr(lluvia) de 0 a 1 en el eje horizontal y el costo esperado del día de 0 a 2 en el vertical. Tres rectas sólidas, cada una con su marca: llevar, horizontal en 1; no llevar, 4b, que sube desde 0; mirar, 1/2 + b, que sube desde 1/2. Una recta punteada, y = b, marca ver gratis. Una banda ancha marca el menor de los tres. Abajo, tres regiones: no llevar de 0 a 1/6, mirar entre 1/6 y 1/2, llevar de 1/2 a 1. Puntos marcados: en 1/6, no llevar y mirar valen 2/3; en 1/4, llevar y no llevar valen 1 y mirar 3/4; en 1/2, mirar y llevar valen 1. Una marca en b = 9/11 dice llevar."><title>Los tres costos según la creencia b</title><desc>Gráfica con la creencia b = Pr(lluvia) de 0 a 1 en el eje horizontal y el costo esperado del día de 0 a 2 en el vertical. Tres rectas sólidas, cada una con su marca: llevar, horizontal en 1; no llevar, 4b, que sube desde 0; mirar, 1/2 + b, que sube desde 1/2. Una recta punteada, y = b, marca ver gratis. Una banda ancha marca el menor de los tres. Abajo, tres regiones: no llevar de 0 a 1/6, mirar entre 1/6 y 1/2, llevar de 1/2 a 1. Puntos marcados: en 1/6, no llevar y mirar valen 2/3; en 1/4, llevar y no llevar valen 1 y mirar 3/4; en 1/2, mirar y llevar valen 1. Una marca en b = 9/11 dice llevar.</desc><rect x="0" y="0" width="300" height="491" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Los tres costos</text><text x="16" y="54" fill="#c8b9d8" font-family="sys