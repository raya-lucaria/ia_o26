tem-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><line x1="17" y1="387" x2="41" y2="387" stroke="#55ddff" stroke-width="2.5"/><polygon points="29,381 35,387 29,393 23,387" fill="#211033" stroke="#55ddff" stroke-width="2"/><text x="50" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">llevar = 1</text><line x1="17" y1="407" x2="41" y2="407" stroke="#ffd166" stroke-width="2.5"/><polygon points="29,401 35,412 23,412" fill="#ffd166" stroke="#ffd166" stroke-width="1"/><text x="50" y="411" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no llevar = 4b</text><line x1="17" y1="427" x2="41" y2="427" stroke="#a8ff5a" stroke-width="2.5"/><rect x="24" y="422" width="10" height="10" fill="#a8ff5a" stroke="#a8ff5a" stroke-width="1"/><text x="50" y="431" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">mirar = 1/2 + b</text><line x1="17" y1="447" x2="41" y2="447" stroke="#f7f2ff" stroke-width="2" stroke-dasharray="2 4"/><text x="50" y="451" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">y = b: ver gratis</text><line x1="17" y1="467" x2="41" y2="467" stroke="#7e2b8f" stroke-width="9"/><text x="50" y="471" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el menor de los tres</text></svg>