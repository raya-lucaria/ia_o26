<svg xmlns="http://www.w3.org/2000/svg" width="300" height="472" viewBox="0 0 300 472" role="img" aria-label="Lo cumple: Finita: abierta = transitoria. s1 se queda con 1/2 y a s2 con 1/2; s2 se queda con 1/2 y a s3 con 1/2; s3 a s2 con 1. Matriz por filas: 1/2, 1/2, 0; 0, 1/2, 1/2; 0, 1, 0. No lo cumple: Infinita: cerrada y aun así transitoria. En los enteros, cada k va a k + 1 con 2/3 y a k − 1 con 1/3. Matriz infinita: P(k, k+1) = 2/3, P(k, k−1) = 1/3."><title>Ejemplo y contraejemplo recurrente equivale a cerrada</title><desc>Lo cumple: Finita: abierta = transitoria. s1 se queda con 1/2 y a s2 con 1/2; s2 se queda con 1/2 y a s3 con 1/2; s3 a s2 con 1. Matriz por filas: 1/2, 1/2, 0; 0, 1/2, 1/2; 0, 1, 0. No lo cumple: Infinita: cerrada y aun así transitoria. En los enteros, cada k va a k + 1 con 2/3 y a k − 1 con 1/3. Matriz infinita: P(k, k+1) = 2/3, P(k, k−1) = 1/3.</desc><rect x="0" y="0" width="300" height="472" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">recurrente equivale a cerrada</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Finita: abierta = transitoria</