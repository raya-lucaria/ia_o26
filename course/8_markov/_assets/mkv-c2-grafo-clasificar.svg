amily="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s2</text><circle cx="78" cy="323" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="78" y="328.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s3</text><circle cx="198" cy="223" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="198" y="228.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s4</text><circle cx="198" cy="323" r="20" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="198" y="328.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">s5</text><text x="200" y="109" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">transitoria</text><text x="200" y="125" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">(abierta)</text><text x="78" y="383" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">cerrada</text><text x="78" y="401" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">periodo 2</text><text x="214" y="383" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">cerrada</text><text x="214" y="401" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aperiódica</text><text x="16" y="431" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Marco continuo: clase cerrada (no sale</text><text x="16" y="451" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ninguna flecha). Punteado: abierta;</text><text x="16" y="471" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de s1 se sale y no se vuelve.</text></svg>