<svg xmlns="http://www.w3.org/2000/svg" width="300" height="491" viewBox="0 0 300 491" role="img" aria-label="Grafo de cinco estados. s1 va a s2 con 1/2 y a s4 con 1/2. s2 va a s3 con 1 y s3 a s2 con 1. s4 se queda con 1/2 (lazo) y va a s5 con 1/2; s5 va a s4 con 1. Tres clases: {s1} transitoria (abierta, marco punteado); {s2, s3} cerrada de periodo 2; {s4, s5} cerrada aperiódica (el lazo de s4). Las cerradas llevan marco continuo."><title>Clasificar cinco estados tres clases</title><desc>Grafo de cinco estados. s1 va a s2 con 1/2 y a s4 con 1/2. s2 va a s3 con 1 y s3 a s2 con 1. s4 se queda con 1/2 (lazo) y va a s5 con 1/2; s5 va a s4 con 1. Tres clases: {s1} transitoria (abierta, marco punteado); {s2, s3} cerrada de periodo 2; {s4, s5} cerrada aperiódica (el lazo de s4). Las cerradas llevan marco continuo.</desc><rect x="0" y="0" width="300" height="491" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Clasificar cinco estados</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">tres clases</text><rect x="108" y="89" width="84" height="56" rx="10" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 4"/><rect x="22" y="185" width="112" height="178" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><rect x="150" y="185" width="128" height="178" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><path d="M 138.8 133.5 Q 114 170 90.4 204.8" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="104.4" y