<svg xmlns="http://www.w3.org/2000/svg" width="300" height="639" viewBox="0 0 300 639" role="img" aria-label="Diagrama de flujo de la pasada hacia atrás, en palabras. 1: Empieza arriba: costo(5) = 0, s = 4. 2: Para cada brinco: pisar el destino + su costo. 3: costo(s) = el menor; guarda ese brinco. 4, pregunta: ¿s = 0? Si no, sigue abajo. 5: Baja: s ← s − 1. 6: Devuelve costo y, brinco a brinco, la ruta. Desde el paso 5, si otro escalón, vuelve al paso 2. Desde el paso 4, si sí, salta al paso 6. Funciona porque cada brinco sube: el costo de arriba ya está listo."><title>Hacia atrás, en palabras</title><desc>Diagrama de flujo de la pasada hacia atrás, en palabras. 1: Empieza arriba: costo(5) = 0, s = 4. 2: Para cada brinco: pisar el destino + su costo. 3: costo(s) = el menor; guarda ese brinco. 4, pregunta: ¿s = 0? Si no, sigue abajo. 5: Baja: s ← s − 1. 6: Devuelve costo y, brinco a brinco, la ruta. Desde el paso 5, si otro escalón, vuelve al paso 2. Desde el paso 4, si sí, salta al paso 6. Funciona porque cada brinco sube: el costo de arriba ya está listo.</desc><rect x="0" y="0" width="300" height="639" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Hacia atrás,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza arriba:</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">costo(5) = 0, s = 4</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Para cada brinco: pisar</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">el destino + su costo</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">costo(s) = el menor;</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">guarda ese brinco</text><line x1="112" y1="317" x2="112" y2="348" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,351 182,386 112,421 42,386" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿s = 0?</text><line x1="112" y1="421" x2="112" y2="452" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="440" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><rect x="40" y="455" width="244" height="36" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="478" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Baja: s ← s − 1</text><rect x="40" y="525" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="548" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve costo y,</text><text x="50" y="568" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">brinco a brinco, la ruta</text><polyline points="40,473 22,473 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="336" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 336)">otro escalón</text><polyline points="182,386 293,386 293,553" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="553" x2="287" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="378" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><text x="16" y="607" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Funciona porque cada brinco sube:</text><text x="16" y="627" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el costo de arriba ya está listo.</text></svg>