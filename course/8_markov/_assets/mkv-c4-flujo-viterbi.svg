<svg xmlns="http://www.w3.org/2000/svg" width="300" height="737" viewBox="0 0 300 737" role="img" aria-label="Diagrama de flujo de VITERBI, en palabras. 1: Día 0: mejor₀ = μ₀ · B de la primera señal. 2: Pasa al día siguiente. 3: Para cada estado: prueba cada estado de ayer, guarda el máximo y de dónde vino; multiplica por la emisión. 4, pregunta: ¿Quedan días? Si no, sigue abajo. 5: Elige el estado con mayor mejor al final; si vale 0: señal imposible. 6: Sigue los apuntadores hacia atrás; devuelve la ruta y su conjunta. Desde el paso 4, si sí: otro día, vuelve al paso 2. Mismo recorrido que FILTRAR, pero con máximo y apuntadores."><title>VITERBI, en palabras máximo en lugar de suma</title><desc>Diagrama de flujo de VITERBI, en palabras. 1: Día 0: mejor₀ = μ₀ · B de la primera señal. 2: Pasa al día siguiente. 3: Para cada estado: prueba cada estado de ayer, guarda el máximo y de dónde vino; multiplica por la emisión. 4, pregunta: ¿Quedan días? Si no, sigue abajo. 5: Elige el estado con mayor mejor al final; si vale 0: señal imposible. 6: Sigue los apuntadores hacia atrás; devuelve la ruta y su conjunta. Desde el paso 4, si sí: otro día, vuelve al paso 2. Mismo recorrido que FILTRAR, pero con máximo y apuntadores.</desc><rect x="0" y="0" width="300" height="737" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">VITERBI, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">máximo en lugar de suma</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Día 0: mejor₀ = μ₀ · B</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">de la primera señal</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="36" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Pasa al día siguiente</text><line x1="112" y1="207" x2="112" y2="238" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="241" width="244" height="96" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="264" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Para cada estado: prueba</text><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">cada estado de ayer, guarda</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">el máximo y de dónde vino;</text><text x="50" y="324" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">multiplica por la emisión</text><line x1="112" y1="337" x2="112" y2="368" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,371 182,415 112,459 42,415" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="411" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Quedan</text><text x="112" y="429" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">días?</text><line x1="112" y1="459" x2="112" y2="490" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="478" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><rect x="40" y="493" width="244" height="76" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="516" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Elige el estado con mayor</text><text x="50" y="536" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">mejor al final; si vale 0:</text><text x="50" y="556" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">señal imposible</text><line x1="112" y1="569" x2="112" y2="600" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="603" width="244" height="76" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="626" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Sigue los apuntadores hacia</text><text x="50" y="646" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">atrás; devuelve la ruta</text><text x="50" y="666" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y su conjunta</text><polyline points="42,415 22,415 22,189" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="189" x2="37" y2="189" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="302" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 302)">sí: otro día</text><text x="16" y="705" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Mismo recorrido que FILTRAR, pero</text><text x="16" y="725" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">con máximo y apuntadores.</text></svg>