<svg xmlns="http://www.w3.org/2000/svg" width="300" height="439" viewBox="0 0 300 439" role="img" aria-label="Lo cumple: b₀ tras ver paraguas, prior (1/2, 1/2). Barras de la creencia del día 0 tras paraguas: lluvia 9/11, aproximadamente 0.818, y sol 2/11, aproximadamente 0.182; suman 1. No lo cumple: El clima real, que no se ve. Arriba, en barras con borde punteado y marcado como oculto, el clima real del día 6: lluvia 1 y sol 0. Debajo, en gris, la creencia de ese día con las siete señales: lluvia aproximadamente 0.194 y sol aproximadamente 0.806."><title>Ejemplo y contraejemplo una creencia</title><desc>Lo cumple: b₀ tras ver paraguas, prior (1/2, 1/2). Barras de la creencia del día 0 tras paraguas: lluvia 9/11, aproximadamente 0.818, y sol 2/11, aproximadamente 0.182; suman 1. No lo cumple: El clima real, que no se ve. Arriba, en barras con borde punteado y marcado como oculto, el clima real del día 6: lluvia 1 y sol 0. Debajo, en gris, la creencia de ese día con las siete señales: lluvia aproximadamente 0.194 y sol aproximadamente 0.806.</desc><rect x="0" y="0" width="300" height="439" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">una creencia</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">b₀ tras ver paraguas, prior (1/2, 1/2)</text><text x="58" y="129" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">lluvia</text><rect x="66" y="117" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="117" width="81.8" height="16" rx="3" fill="#314e70" stroke="#55ddff" stroke-width="2"/><text x="174" y="129" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">9/11 ≈ 0.818</text><text x="58" y="153" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">sol</text><rect x="66" y="141" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="141" width="18.2" height="16" rx="3" fill="#644a42" stroke="#ffd166" stroke-width="2"/><text x="174" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">2/11 ≈ 0.182</text><text x="16" y="179" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">suma = 1</text><line x1="16" y1="189" x2="284" y2="189" stroke="#78419e" stroke-width="1"/><text x="16" y="209" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✗ No lo cumple</text><text x="16" y="228" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">El clima real, que no se ve</text><text x="16" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">Clima real del día 6 (oculto)</text><text x="58" y="269" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">lluvia</text><rect x="66" y="257" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="257" width="100" height="16" rx="3" fill="#314e70" stroke="#55ddff" stroke-width="2" stroke-dasharray="4 3"/><text x="174" y="269" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">1</text><text x="58" y="293" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">sol</text><rect x="66" y="281" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><line x1="66" y1="281" x2="66" y2="297" stroke="#ffd166" stroke-width="3"/><text x="174" y="293" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">0</text><text x="16" y="321" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">Creencia del día 6, siete señales</text><text x="58" y="343" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">lluvia</text><rect x="66" y="331" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="331" width="19.4" height="16" rx="3" fill="#534364" stroke="#c8b9d8" stroke-width="2"/><text x="174" y="343" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">≈ 0.194</text><text x="58" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">sol</text><rect x="66" y="355" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="355" width="80.6" height="16" rx="3" fill="#534364" stroke="#c8b9d8" stroke-width="2"/><text x="174" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">≈ 0.806</text><text x="16" y="399" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Borde punteado: oculto.</text><text x="16" y="419" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Gris: lo que sí sabes.</text></svg>