<svg xmlns="http://www.w3.org/2000/svg" width="300" height="709" viewBox="0 0 300 709" role="img" aria-label="Diagrama de flujo de generar texto, en palabras. 1: Empieza con un contexto de h símbolos. 2, pregunta: ¿Faltan símbolos? Si sí, sigue abajo. 3, pregunta: ¿Se vio el contexto? Si no: usa la fila suavizada, y sigue abajo. Si sí, sigue abajo. 4: Muestrea su fila con un u nuevo. 5: Escribe el símbolo y desliza el contexto. 6: Devuelve el texto. Desde el paso 5, si otro símbolo, vuelve al paso 2. Desde el paso 2, si no, salta al paso 6. Un contexto nunca visto no se reinicia: su fila suavizada da 1/|Σ| a cada símbolo."><title>Generar, en palabras con memoria h</title><desc>Diagrama de flujo de generar texto, en palabras. 1: Empieza con un contexto de h símbolos. 2, pregunta: ¿Faltan símbolos? Si sí, sigue abajo. 3, pregunta: ¿Se vio el contexto? Si no: usa la fila suavizada, y sigue abajo. Si sí, sigue abajo. 4: Muestrea su fila con un u nuevo. 5: Escribe el símbolo y desliza el contexto. 6: Devuelve el texto. Desde el paso 5, si otro símbolo, vuelve al paso 2. Desde el paso 2, si no, salta al paso 6. Un contexto nunca visto no se reinicia: su fila suavizada da 1/|Σ| a cada símbolo.</desc><rect x="0" y="0" width="300" height="709" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Generar, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">con memoria h</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza con un</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">contexto de h símbolos</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,171 182,215 112,259 42,215" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="211" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Faltan</text><text x="112" y="229" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">símbolos?</text><line x1="112" y1="259" x2="112" y2="290" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="278" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><polygon points="112,293 182,337 112,381 42,337" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="333" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Se vio el</text><text x="112" y="351" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">contexto?</text><line x1="182" y1="337" x2="201" y2="337" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="193" y="322" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">no</text><rect x="204" y="313" width="80" height="48" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="244" y="332" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">usa la fila</text><text x="244" y="350" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">suavizada</text><line x1="244" y1="361" x2="244" y2="412" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="112" y1="381" x2="112" y2="412" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="400" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="415" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="438" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Muestrea su fila</text><text x="50" y="458" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">con un u nuevo</text><line x1="112" y1="471" x2="112" y2="502" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="505" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="528" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Escribe el símbolo</text><text x="50" y="548" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y desliza el contexto</text><rect x="40" y="595" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="618" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve el texto</text><polyline points="40,533 22,533 22,215" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="215" x2="39" y2="215" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="374" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 374)">otro símbolo</text><polyline points="182,215 293,215 293,613" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="613" x2="287" y2="613" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="207" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><text x="16" y="657" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Un contexto nunca visto no se</text><text x="16" y="677" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">reinicia: su fila suavizada da</text><text x="16" y="697" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">1/|Σ| a cada símbolo.</text></svg>