f" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">con un u nuevo</text><line x1="112" y1="349" x2="112" y2="380" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="383" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="406" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Escribe el símbolo</text><text x="50" y="426" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y desliza el contexto</text><line x1="112" y1="439" x2="112" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,473 182,517 112,561 42,517" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="513" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Llegaste</text><text x="112" y="531" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">al largo?</text><line x1="112" y1="561" x2="112" y2="592" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="580" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="595" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="618" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve el texto</text><polyline points="42,517 22,517 22,215" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="215" x2="39" y2="215" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="366" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 366)">no: otro símbolo</text><text x="16" y="657" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Un contexto nunca visto no se</text><text x="16" y="677" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">reinicia: su fila suavizada da</text><text x="16" y="697" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">1/|Σ| a cada símbolo.</text></svg>