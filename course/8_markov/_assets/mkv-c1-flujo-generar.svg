<svg xmlns="http://www.w3.org/2000/svg" width="300" height="709" viewBox="0 0 300 709" role="img" aria-label="Diagrama de flujo de generar texto, en palabras. 1: Empieza con un contexto de h símbolos. 2, pregunta: ¿Se vio el contexto? Si no: usa la fila suavizada, y sigue abajo. Si sí, sigue abajo. 3: Muestrea su fila con un u nuevo. 4: Escribe el símbolo y desliza el contexto. 5, pregunta: ¿Llegaste al largo? Si sí, sigue abajo. 6: Devuelve el texto. Desde el paso 5, si no: otro símbolo, vuelve al paso 2. Un contexto nunca visto no se reinicia: su fila suavizada da 1/|Σ| a cada símbolo."><title>Generar, en palabras con memoria h</title><desc>Diagrama de flujo de generar texto, en palabras. 1: Empieza con un contexto de h símbolos. 2, pregunta: ¿Se vio el contexto? Si no: usa la fila suavizada, y sigue abajo. Si sí, sigue abajo. 3: Muestrea su fila con un u nuevo. 4: Escribe el símbolo y desliza el contexto. 5, pregunta: ¿Llegaste al largo? Si sí, sigue abajo. 6: Devuelve el texto. Desde el paso 5, si no: otro símbolo, vuelve al paso 2. Un contexto nunca visto no se reinicia: su fila suavizada da 1/|Σ| a cada símbolo.</desc><rect x="0" y="0" width="300" height="709" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Generar, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">con memoria h</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" f