<svg xmlns="http://www.w3.org/2000/svg" width="300" height="443" viewBox="0 0 300 443" role="img" aria-label="Árbol de dos pasos desde C con la matriz de la frase. Primer paso: a V con 2/3, a C con 1/3. Desde V: a V con 2/11, a C con 9/11; desde C: a V con 2/3, a C con 1/3. Caminos: C, V, V: 4/33; C, V, C: 6/11; C, C, V: 2/9; C, C, C: 1/9. Pr(S₂ = V) = 4/33 + 2/9 = 34/99."><title>Dos pasos desde C con la matriz de la frase</title><desc>Árbol de dos pasos desde C con la matriz de la frase. Primer paso: a V con 2/3, a C con 1/3. Desde V: a V con 2/11, a C con 9/11; desde C: a V con 2/3, a C con 1/3. Caminos: C, V, V: 4/33; C, V, C: 6/11; C, C, V: 2/9; C, C, C: 1/9. Pr(S₂ = V) = 4/33 + 2/9 = 34/99.</desc><rect x="0" y="0" width="300" height="443" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Dos pasos desde C</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">con la matriz de la frase</text><text x="150" y="81" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">S₀ = C</text><line x1="150" y1="125" x2="80" y2="179" stroke="#c8b9d8" stroke-width="2"/><text x="101" y="152" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">2/3</text><line x1="80" y1="215" x2="40" y2="277" stroke="#c8b9d8" stroke-width="2"/><text x="53" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">2/11</text><line x1="80" y1="215" x2="120" y2="277" stroke="#c8b9d8" stroke-width="2"/><text x="107" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">9/11</text><line x1="150" y1="125" x2="220" y2="179" stroke="#c8b9d8" stroke-width="2"/><text x="199" y="152" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">1/3</text><line x1="220" y1="215" x2="180" y2="277" stroke="#c8b9d8" stroke-width="2"/><text x="193" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">2/3</text><line x1="220" y1="215" x2="260" y2="277" stroke="#c8b9d8" stroke-width="2"/><text x="247" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">1/3</text><rect x="132" y="89" width="36" height="36" rx="6" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="150" y="114" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">C</text><circle cx="80" cy="197" r="18" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="80" y="204" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">V</text><rect x="202" y="179" width="36" height="36" rx="6" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="220" y="204" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">C</text><circle cx="40" cy="293" r="16" fill="#2a3558" stroke="#55ddff" stroke-width="3"/><text x="40" y="300" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">V</text><text x="40" y="331" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4/33</text><rect x="104" y="277" width="32" height="32" rx="6" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="120" y="300" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">C</text><text x="120" y="331" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">6/11</text><circle cx="180" cy="293" r="16" fill="#2a3558" stroke="#55ddff" stroke-width="3"/><text x="180" y="300" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">V</text><text x="180" y="331" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2/9</text><rect x="244" y="277" width="32" height="32" rx="6" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="260" y="300" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">C</text><text x="260" y="331" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1/9</text><text x="16" y="275" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">S₂</text><text x="16" y="202" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">S₁</text><text x="16" y="363" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Bajo cada hoja, su camino: el producto</text><text x="16" y="383" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de sus dos flechas. Las hojas V</text><text x="16" y="403" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(borde grueso) suman Pr(S₂ = V) =</text><text x="16" y="423" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">4/33 + 2/9 = 34/99.</text></svg>