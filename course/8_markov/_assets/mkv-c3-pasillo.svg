<svg xmlns="http://www.w3.org/2000/svg" width="300" height="361" viewBox="0 0 300 361" role="img" aria-label="Pasillo: inicio, casilla 1, casilla 2 y la meta, en fila. Junto a la casilla 1 hay un hueco sin barandal; junto a la 2, un barandal. Caminar avanza seguro y cuesta 3. Correr cuesta 1: con 1/2 avanza y con 1/2 resbala de lado y se queda en su casilla; en la 1, al resbalar cae al hueco y cuesta 10 más."><title>El robot en el pasillo mojado</title><desc>Pasillo: inicio, casilla 1, casilla 2 y la meta, en fila. Junto a la casilla 1 hay un hueco sin barandal; junto a la 2, un barandal. Caminar avanza seguro y cuesta 3. Correr cuesta 1: con 1/2 avanza y con 1/2 resbala de lado y se queda en su casilla; en la 1, al resbalar cae al hueco y cuesta 10 más.</desc><rect x="0" y="0" width="300" height="361" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">El robot en el pasillo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">mojado</text><text x="36" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">inicio</text><line x1="60" y1="117" x2="77" y2="117" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="82" y="91" width="64" height="52" rx="6" fill="#293154" stroke="#55ddff" stroke-width="2"/><text x="114" y="123" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><rect x="158" y="91" width="64" height="52" rx="6" fill="#293154" stroke="#55ddff" stroke-width="2"/><text x="190" y="123" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><rect x="234" y="91" width="64" height="52" rx="6" fill="#373639" stroke="#a8ff5a" stroke-width="2"/><text x="266" y="123" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">meta</text><line x1="147" y1="117" x2="155" y2="117" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="223" y1="117" x2="231" y2="117" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="86" y="153" width="56" height="26" rx="13" fill="#000000" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/><text x="114" y="197" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">hueco</text><text x="114" y="213" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sin barandal</text><line x1="162" y1="159" x2="218" y2="159" stroke="#c8b9d8" stroke-width="3"/><line x1="166" y1="159" x2="166" y2="175" stroke="#c8b9d8" stroke-width="2"/><line x1="181" y1="159" x2="181" y2="175" stroke="#c8b9d8" stroke-width="2"/><line x1="196" y1="159" x2="196" y2="175" stroke="#c8b9d8" stroke-width="2"/><line x1="211" y1="159" x2="211" y2="175" stroke="#c8b9d8" stroke-width="2"/><text x="190" y="197" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">barandal</text><text x="16" y="241" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Caminar: avanza seguro; cuesta 3.</text><text x="16" y="261" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Correr: cuesta 1; con 1/2 avanza,</text><text x="16" y="281" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">con 1/2 resbala de lado y se queda.</text><text x="16" y="301" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">En la 1, resbalar es caer al hueco:</text><text x="16" y="321" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lo levantan y cuesta 10 más.</text><text x="16" y="341" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">En la 2, el barandal lo detiene.</text></svg>