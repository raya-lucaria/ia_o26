<svg xmlns="http://www.w3.org/2000/svg" width="300" height="959" viewBox="0 0 300 959" role="img" aria-label="Diagrama de flujo de FILTRAR, en palabras. 1: Arranca: la predicción es μ₀. 2: Corrige: multiplica cada estado por B de la señal. 3: Suma los pesos: esa suma es la evidencia. 4, pregunta: ¿La evidencia es 0? Si no, sigue abajo. 5: Normaliza: divide entre la evidencia y guarda b. 6, pregunta: ¿Quedan días? Si sí, sigue abajo. 7: Predice con P y pasa al día siguiente. 8: Devuelve las creencias y las evidencias. 9: Para: señal imposible. Desde el paso 7, si otro día, vuelve al paso 2. Desde el paso 4, si sí, salta al paso 9. Desde el paso 6, si no, salta al paso 8. Una señal que ningún estado emite no se puede normalizar."><title>FILTRAR, en palabras predecir, corregir, normalizar</title><desc>Diagrama de flujo de FILTRAR, en palabras. 1: Arranca: la predicción es μ₀. 2: Corrige: multiplica cada estado por B de la señal. 3: Suma los pesos: esa suma es la evidencia. 4, pregunta: ¿La evidencia es 0? Si no, sigue abajo. 5: Normaliza: divide entre la evidencia y guarda b. 6, pregunta: ¿Quedan días? Si sí, sigue abajo. 7: Predice con P y pasa al día siguiente. 8: Devuelve las creencias y las evidencias. 9: Para: señal imposible. Desde el paso 7, si otro día, vuelve al paso 2. Desde el paso 4, si sí, salta al paso 9. Desde el paso 6, si no, salta al paso 8. Una señal que ningún estado emite no se puede normalizar.</desc><rect x="0" y="0" width="300" height="959" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">FILTRAR, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">predecir, corregir, normalizar</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Arranca: la predicción</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">es μ₀</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Corrige: multiplica cada</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">estado por B de la señal</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Suma los pesos:</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">esa suma es la evidencia</text><line x1="112" y1="317" x2="112" y2="348" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,351 182,395 112,439 42,395" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿La evidencia</text><text x="112" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">es 0?</text><line x1="112" y1="439" x2="112" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="458" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><rect x="40" y="473" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Normaliza: divide entre</text><text x="50" y="516" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">la evidencia y guarda b</text><line x1="112" y1="529" x2="112" y2="560" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,563 182,607 112,651 42,607" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="603" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Quedan</text><text x="112" y="621" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">días?</text><line x1="112" y1="651" x2="112" y2="682" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="670" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="685" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="708" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Predice con P</text><text x="50" y="728" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y pasa al día siguiente</text><rect x="40" y="775" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="798" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve las creencias</text><text x="50" y="818" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">y las evidencias</text><rect x="40" y="865" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="888" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Para: señal imposible</text><polyline points="40,713 22,713 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="456" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 456)">otro día</text><polyline points="182,395 297,395 297,883" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="297" y1="883" x2="287" y2="883" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="387" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><polyline points="182,607 290,607 290,803" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="290" y1="803" x2="287" y2="803" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="599" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><text x="16" y="927" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Una señal que ningún estado</text><text x="16" y="947" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">emite no se puede normalizar.</text></svg>