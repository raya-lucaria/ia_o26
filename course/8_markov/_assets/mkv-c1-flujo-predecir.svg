<svg xmlns="http://www.w3.org/2000/svg" width="300" height="477" viewBox="0 0 300 477" role="img" aria-label="Diagrama de flujo de predecir, en palabras. 1: Empieza con μ₀ (un vector fila). 2, pregunta: ¿Faltan pasos? Si sí, sigue abajo. 3: Multiplica por P̂: μ ← μ P̂. 4: Devuelve μₜ. Desde el paso 3, si otro paso, vuelve al paso 2. Desde el paso 2, si no, salta al paso 4. Cada paso cuesta k² productos con k estados."><title>Predecir, en palabras t multiplicaciones</title><desc>Diagrama de flujo de predecir, en palabras. 1: Empieza con μ₀ (un vector fila). 2, pregunta: ¿Faltan pasos? Si sí, sigue abajo. 3: Multiplica por P̂: μ ← μ P̂. 4: Devuelve μₜ. Desde el paso 3, si otro paso, vuelve al paso 2. Desde el paso 2, si no, salta al paso 4. Cada paso cuesta k² productos con k estados.</desc><rect x="0" y="0" width="300" height="477" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Predecir, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">t multiplicaciones</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza con μ₀</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">(un vector fila)</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,171 182,215 112,259 42,215" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="211" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Faltan</text><text x="112" y="229" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">pasos?</text><line x1="112" y1="259" x2="112" y2="290" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="278" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="293" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="316" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Multiplica por P̂:</text><text x="50" y="336" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">μ ← μ P̂</text><rect x="40" y="383" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="406" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve μₜ</text><polyline points="40,321 22,321 22,215" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="215" x2="39" y2="215" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 268)">otro paso</text><polyline points="182,215 293,215 293,401" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="293" y1="401" x2="287" y2="401" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="192" y="207" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><text x="16" y="445" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada paso cuesta k² productos</text><text x="16" y="465" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">con k estados.</text></svg>