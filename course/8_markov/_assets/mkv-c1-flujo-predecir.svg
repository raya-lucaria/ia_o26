<svg xmlns="http://www.w3.org/2000/svg" width="300" height="477" viewBox="0 0 300 477" role="img" aria-label="Diagrama de flujo de predecir, en palabras. 1: Empieza con μ₀ (un vector fila). 2: Multiplica por P̂: μ ← μ P̂. 3, pregunta: ¿Ya van t pasos? Si sí, sigue abajo. 4: Devuelve μₜ. Desde el paso 3, si no: otro paso, vuelve al paso 2. Cada paso cuesta k² productos con k estados."><title>Predecir, en palabras t multiplicaciones</title><desc>Diagrama de flujo de predecir, en palabras. 1: Empieza con μ₀ (un vector fila). 2: Multiplica por P̂: μ ← μ P̂. 3, pregunta: ¿Ya van t pasos? Si sí, sigue abajo. 4: Devuelve μₜ. Desde el paso 3, si no: otro paso, vuelve al paso 2. Cada paso cuesta k² productos con k estados.</desc><rect x="0" y="0" width="300" height="477" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Predecir, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">t multiplicaciones</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza con μ₀</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">(un vector fila)</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Multiplica por P̂:</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">μ ← μ P̂</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,261 182,305 112,349 42,305" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="301" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Ya van</text><text x="112" y="319" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">t pasos?</text><line x1="112" y1="349" x2="112" y2="380" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="368" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="383" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="406" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve μₜ</text><polyline points="42,305 22,305 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="252" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 252)">no: otro paso</text><text x="16" y="445" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada paso cuesta k² productos</text><text x="16" y="465" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">con k estados.</text></svg>