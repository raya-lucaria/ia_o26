<svg xmlns="http://www.w3.org/2000/svg" width="300" height="529" viewBox="0 0 300 529" role="img" aria-label="Lo cumple: Sin ciclos: costo(s) sale de arriba. Escalera sin ciclos, escalones 0 a 5, brincos de 1 y de 2; pisar cuesta 1, 2, 9, 1, 1. Lo que falta, de 0 a 5: 4, 4, 2, 1, 1, 0; una pasada de 5 hacia 0 basta. Ruta óptima marcada: 0 → 2 → 4 → 5. No lo cumple: Resbalón en 3: costo(3) usa costo(3). La misma escalera, pero en el escalón 3 un brinco falla con 1/2 y te deja donde estás (lazo): costo(3) depende de sí mismo, y de 3 hacia abajo la pasada no puede llenar la tabla."><title>Ejemplo y contraejemplo una pasada hacia atrás</title><desc>Lo cumple: Sin ciclos: costo(s) sale de arriba. Escalera sin ciclos, escalones 0 a 5, brincos de 1 y de 2; pisar cuesta 1, 2, 9, 1, 1. Lo que falta, de 0 a 5: 4, 4, 2, 1, 1, 0; una pasada de 5 hacia 0 basta. Ruta óptima marcada: 0 → 2 → 4 → 5. No lo cumple: Resbalón en 3: costo(3) usa costo(3). La misma escalera, pero en el escalón 3 un brinco falla con 1/2 y te deja donde estás (lazo): costo(3) depende de sí mismo, y de 3 hacia abajo la pasada no puede llenar la tabla.</desc><rect x="0" y="0" width="300" height="529" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">una pasada hacia atrás</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans