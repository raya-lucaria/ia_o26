<svg xmlns="http://www.w3.org/2000/svg" width="300" height="592" viewBox="0 0 300 592" role="img" aria-label="Grafo de tres estados ocultos con borde punteado: determinante, sustantivo, verbo. Flechas: de determinante a sustantivo 1; de sustantivo a determinante 1/4; de sustantivo a verbo 3/4; de verbo a determinante 1/2; de verbo a sustantivo 1/2. Los cuatro ceros van marcados con una cruz y el rótulo 0 sobre una línea punteada sin punta: determinante a determinante; determinante a verbo; sustantivo a sustantivo; verbo a verbo. Debajo, las palabras de cada estado con su probabilidad: determinante la 1/2, una 1/4, esta 1/8, mi 1/8; sustantivo niña 1/4, gata 1/4, casa 1/4, sopa 1/8, luna 1/8; verbo casa 1/4, come 1/4, ve 1/4, duerme 1/4. La palabra casa aparece bajo sustantivo y bajo verbo, en recuadro. Al pie, μ₀ = (1/2, 1/4, 1/4)."><title>El lenguaje pequeño como modelo oculto</title><desc>Grafo de tres estados ocultos con borde punteado: determinante, sustantivo, verbo. Flechas: de determinante a sustantivo 1; de sustantivo a determinante 1/4; de sustantivo a verbo 3/4; de verbo a determinante 1/2; de verbo a sustantivo 1/2. Los cuatro ceros van marcados con una cruz y el rótulo 0 sobre una línea punteada sin punta: determinante a determinante; determinante a verbo; sustantivo a sustantivo; verbo a verbo. Debajo, las palabras de cada estado con su probabilidad: determinante la 1/2, una 1/4, esta 1/8, mi 1/8; sustantivo niña 1/4, gata 1/4, casa 1/4, sopa 1/8, luna 1/8; verbo casa 1/4, come 1/4, ve 1/4, duerme 1/4. La palabra casa aparece bajo sustantivo y bajo verbo, en recuadro. Al pie, μ₀ = (1/2, 1/4, 1/4).</desc><rect x="0" y="0" width="300" height="592" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">El lenguaje pequeño</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">como modelo oculto</text><line x1="118" y1="141" x2="182" y2="141" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150" y="135" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><line x1="182" y1="157" x2="118" y2="157" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150" y="175" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/4</text><line x1="258" y1="171" x2="196" y2="245" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="235" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">3/4</text><line x1="112" y1="245" x2="86" y2="171" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="107" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1/2</text><line x1="176" y1="245" x2="222" y2="171" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="191" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">1/2</text><path d="M 40 127 C 36 85 88 85 84 127" fill="none" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="58" y1="92" x2="66" y2="100" stroke="#ff5a7a" stroke-width="2"/><line x1="58" y1="100" x2="66" y2="92" stroke="#ff5a7a" stroke-width="2"/><text x="80" y="95" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0</text><line x1="36" y1="171" x2="96" y2="261" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="62" y1="212" x2="70" y2="220" stroke="#ff5a7a" stroke-width="2"/><line x1="62" y1="220" x2="70" y2="212" stroke="#ff5a7a" stroke-width="2"/><text x="56" y="220" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">0</text><path d="M 216 127 C 212 85 264 85 260 127" fill="none" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="234" y1="92" x2="242" y2="100" stroke="#ff5a7a" stroke-width="2"/><line x1="234" y1="100" x2="242" y2="92" stroke="#ff5a7a" stroke-width="2"/><text x="256" y="95" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0</text><path d="M 128 289 C 124 331 176 331 172 289" fill="none" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="146" y1="316" x2="154" y2="324" stroke="#ff5a7a" stroke-width="2"/><line x1="146" y1="324" x2="154" y2="316" stroke="#ff5a7a" stroke-width="2"/><text x="168" y="329" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0</text><rect x="8" y="127" width="108" height="44" rx="14" fill="#49333c" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/><text x="62" y="147" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">determinante</text><text x="62" y="163" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">oculto</text><rect x="184" y="127" width="108" height="44" rx="14" fill="#49333c" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/><text x="238" y="147" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">sustantivo</text><text x="238" y="163" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">oculto</text><rect x="96" y="245" width="108" height="44" rx="14" fill="#49333c" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/><text x="150" y="265" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">verbo</text><text x="150" y="281" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">oculto</text><text x="16" y="351" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Lo que emite cada estado:</text><text x="62" y="373" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">determinante</text><text x="31" y="395" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la 1/2</text><text x="31" y="416" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">una 1/4</text><text x="31" y="437" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">esta 1/8</text><text x="31" y="458" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">mi 1/8</text><text x="150" y="373" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">verbo</text><rect x="112" y="380" width="76" height="21" rx="6" fill="none" stroke="#f04cff" stroke-width="2"/><text x="119" y="395" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">casa 1/4</text><text x="119" y="416" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">come 1/4</text><text x="119" y="437" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ve 1/4</text><text x="119" y="458" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">duerme 1/4</text><text x="238" y="373" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">sustantivo</text><text x="207" y="395" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">niña 1/4</text><text x="207" y="416" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">gata 1/4</text><rect x="200" y="422" width="76" height="21" rx="6" fill="none" stroke="#f04cff" stroke-width="2"/><text x="207" y="437" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">casa 1/4</text><text x="207" y="458" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sopa 1/8</text><text x="207" y="479" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">luna 1/8</text><text x="16" y="512" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">μ₀ = (1/2, 1/4, 1/4)</text><text x="16" y="532" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">orden: determinante, sustantivo, verbo</text><text x="16" y="552" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Punteado: oculto. ×: cero de P.</text><text x="16" y="572" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Recuadro: casa, de dos estados.</text></svg>