<svg xmlns="http://www.w3.org/2000/svg" width="300" height="511" viewBox="0 0 300 511" role="img" aria-label="Tablero de casillas 0 a 5 con moneda: avanza 1 o 2 con probabilidad 1/2. Escalera en 2 que sube a 4; serpiente en 3 que baja a 1; si te pasas de 5 llegas a 5. Las casillas 2 y 3 no son estados. Grafo de estados al final del turno: 0 va a 1 con 1/2 y a 4 con 1/2; 1 se queda con 1/2 (cae en 3 y baja) y va a 4 con 1/2; 4 va a 5 con 1; 5 es la meta. Turnos medios que faltan: m(0) = 3, m(1) = 3, m(4) = 1, m(5) = 0."><title>Un tablero de 6 casillas moneda: avanza 1 o 2</title><desc>Tablero de casillas 0 a 5 con moneda: avanza 1 o 2 con probabilidad 1/2. Escalera en 2 que sube a 4; serpiente en 3 que baja a 1; si te pasas de 5 llegas a 5. Las casillas 2 y 3 no son estados. Grafo de estados al final del turno: 0 va a 1 con 1/2 y a 4 con 1/2; 1 se queda con 1/2 (cae en 3 y baja) y va a 4 con 1/2; 4 va a 5 con 1; 5 es la meta. Turnos medios que faltan: m(0) = 3, m(1) = 3, m(4) = 1, m(5) = 0.</desc><rect x="0" y="0" width="300" height="511" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Un tablero de 6 casillas</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">moneda: avanza 1 o 2</text><rect x="20" y="127" width="40" height="40" rx="6" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="40" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">0</text><rect x="64" y="127" width="40" height="40" rx="6" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="84" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><rect x="108" y="127" width="40" height="40" rx="6" fill="#2b1640" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="3 3"/><text x="128" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><rect x="152" y="127" width="40" height="40" rx="6" fill="#2b1640" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="3 3"/><text x="172" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="196" y="127" width="40" height="40" rx="6" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="216" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="240" y="127" width="40" height="40" rx="6" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="260" y="153" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text><path d="M 128 125 Q 172 83 216 123" fill="none" stroke="#a8ff5a" stroke-width="3" marker-end="url(#s)"/><text x="172" y="97" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">escalera 2 → 4</text><path d="M 172 169 Q 128 211 84 171" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#s)"/><text x="128" y="207" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">serpiente 3 → 1</text><text x="16" y="239" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Punteadas (2 y 3): al caer ahí te mueves;</text><text x="16" y="259" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no son estados. Si te pasas, llegas a 5.</text><text x="16" y="289" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Estados al final del turno</text><path d="M 58 369 Q 75 369 90 369" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="74.5" y="361.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/2</text><path d="M 55.3 359.6 Q 115 323 173 358.5" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="114.6" y="333.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/2</text><path d="M 117.8 385.2 C 151.2 417.9 68.8 417.9 101.3 387" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="437.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/2</text><path d="M 128 369 Q 150 369 170 369" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="149.5" y="361.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1/2</text><path d="M 208 369 Q 226 369 242 369" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="225.5" y="361.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="40" cy="369" r="18" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="40" y="374.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">0</text><circle cx="110" cy="369" r="18" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="110" y="374.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">1</text><circle cx="190" cy="369" r="18" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="190" y="374.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">4</text><circle cx="262" cy="369" r="18" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="262" y="374.2" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">5</text><circle cx="262" cy="369" r="23" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="262" y="413" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">meta</text><text x="16" y="461" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">Turnos que faltan, en promedio:</text><text x="40" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">m = 3</text><text x="110" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">m = 3</text><text x="190" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">m = 1</text><text x="262" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">m = 0</text></svg>