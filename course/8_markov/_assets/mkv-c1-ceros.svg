<svg xmlns="http://www.w3.org/2000/svg" width="300" height="547" viewBox="0 0 300 547" role="img" aria-label="Fracción de las transiciones de la segunda mitad del corpus cuyo (contexto, siguiente) nunca apareció en la primera mitad, por memoria. memoria 0: 0 % (0 de 998 564), contextos vistos 1 de 1; memoria 1: 0.003 % (29 de 998 563), contextos vistos 27 de 28; memoria 2: 0.072 % (718 de 998 562), contextos vistos 379 de 784; memoria 3: 0.570 % (5 694 de 998 561), contextos vistos 3 328 de 21 952."><title>Lo que nunca se vio, por memoria</title><desc>Fracción de las transiciones de la segunda mitad del corpus cuyo (contexto, siguiente) nunca apareció en la primera mitad, por memoria. memoria 0: 0 % (0 de 998 564), contextos vistos 1 de 1; memoria 1: 0.003 % (29 de 998 563), contextos vistos 27 de 28; memoria 2: 0.072 % (718 de 998 562), contextos vistos 379 de 784; memoria 3: 0.570 % (5 694 de 998 561), contextos vistos 3 328 de 21 952.</desc><rect x="0" y="0" width="300" height="547" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Lo que nunca se vio,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">por memoria</text><text x="16" y="77" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Se cuenta con la primera mitad del</text><text x="16" y="97" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">corpus y se mide en la segunda:</text><text x="16" y="117" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">¿qué fracción de las transiciones</text><text x="16" y="137" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">nunca apareció al contar?</text><text x="16" y="184" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">memoria 0</text><rect x="106" y="171" width="112" height="18" fill="none" stroke="#673789" stroke-width="1"/><text x="224" y="185" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0 %</text><text x="16" y="209" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">no vistas: 0 de 998 564</text><text x="16" y="227" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">contextos vistos: 1 de 1</text><text x="16" y="262" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">memoria 1</text><rect x="106" y="249" width="112" height="18" fill="none" stroke="#673789" stroke-width="1"/><rect x="106" y="249" width="1.5" height="18" fill="#f04cff"/><text x="224" y="263" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0.003 %</text><text x="16" y="287" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">no vistas: 29 de 998 563</text><text x="16" y="305" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">contextos vistos: 27 de 28</text><text x="16" y="340" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">memoria 2</text><rect x="106" y="327" width="112" height="18" fill="none" stroke="#673789" stroke-width="1"/><rect x="106" y="327" width="14.1" height="18" fill="#f04cff"/><text x="224" y="341" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0.072 %</text><text x="16" y="365" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">no vistas: 718 de 998 562</text><text x="16" y="383" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">contextos vistos: 379 de 784</text><text x="16" y="418" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">memoria 3</text><rect x="106" y="405" width="112" height="18" fill="none" stroke="#673789" stroke-width="1"/><rect x="106" y="405" width="112" height="18" fill="#f04cff"/><text x="224" y="419" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">0.570 %</text><text x="16" y="443" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">no vistas: 5 694 de 998 561</text><text x="16" y="461" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">contextos vistos: 3 328 de 21 952</text><text x="16" y="487" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">La barra llena es la mayor fracción;</text><text x="16" y="507" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">solo diagnostica escasez,</text><text x="16" y="527" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no elige la memoria.</text></svg>