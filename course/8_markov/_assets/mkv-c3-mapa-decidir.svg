<svg xmlns="http://www.w3.org/2000/svg" width="300" height="635" viewBox="0 0 300 635" role="img" aria-label="Mapa de la clase en tres filas. ¿Sin ciclos? Ecuación: costo(s) = mín (pisar + costo). Algoritmo: HACIA-ATRÁS: una pasada. ¿Cuánto vale π? Ecuación: V = r + P V, con las filas de π. Algoritmo: EVALUAR-POLÍTICA: un sistema lineal. ¿Cuál es la mejor? Ecuación: V*(s) = máx (r + Σ P V*). Algoritmo: iteración de valores, iteración de políticas o programa lineal."><title>Decidir: pregunta, ecuación, algoritmo</title><desc>Mapa de la clase en tres filas. ¿Sin ciclos? Ecuación: costo(s) = mín (pisar + costo). Algoritmo: HACIA-ATRÁS: una pasada. ¿Cuánto vale π? Ecuación: V = r + P V, con las filas de π. Algoritmo: EVALUAR-POLÍTICA: un sistema lineal. ¿Cuál es la mejor? Ecuación: V*(s) = máx (r + Σ P V*). Algoritmo: iteración de valores, iteración de políticas o programa lineal.</desc><rect x="0" y="0" width="300" height="635" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Decidir: pregunta,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">ecuación, algoritmo</text><rect x="16" y="73" width="268" height="30" rx="6" fill="#282d50" stroke="#55ddff" stroke-width="1.5"/><text x="150" y="93" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Sin ciclos?</text><line x1="150" y1="104" x2="150" y2="119" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="121" width="268" height="30" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="141" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">costo(s) = mín (pisar + costo)</text><line x1="150" y1="152" x2="150" y2="167" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="169" width="268" height="48" rx="6" fill="#3e1850" stroke="#f04cff" stroke-width="2"/><text x="150" y="189" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">HACIA-ATRÁS:</text><text x="150" y="207" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">una pasada</text><rect x="16" y="243" width="268" height="30" rx="6" fill="#282d50" stroke="#55ddff" stroke-width="1.5"/><text x="150" y="263" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Cuánto vale π?</text><line x1="150" y1="274" x2="150" y2="289" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="291" width="268" height="30" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="311" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">V = r + P V, con las filas de π</text><line x1="150" y1="322" x2="150" y2="337" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="339" width="268" height="48" rx="6" fill="#3e1850" stroke="#f04cff" stroke-width="2"/><text x="150" y="359" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">EVALUAR-POLÍTICA:</text><text x="150" y="377" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">un sistema lineal</text><rect x="16" y="413" width="268" height="30" rx="6" fill="#282d50" stroke="#55ddff" stroke-width="1.5"/><text x="150" y="433" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Cuál es la mejor?</text><line x1="150" y1="444" x2="150" y2="459" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="461" width="268" height="30" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="481" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">V*(s) = máx (r + Σ P V*)</text><line x1="150" y1="492" x2="150" y2="507" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="509" width="268" height="66" rx="6" fill="#3e1850" stroke="#f04cff" stroke-width="2"/><text x="150" y="529" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">iteración de valores,</text><text x="150" y="547" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">iteración de políticas</text><text x="150" y="565" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">o programa lineal</text><text x="16" y="595" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Lo que rompe la pasada hacia atrás</text><text x="16" y="615" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">es el ciclo, no el azar.</text></svg>