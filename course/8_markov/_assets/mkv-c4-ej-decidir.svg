<svg xmlns="http://www.w3.org/2000/svg" width="300" height="606" viewBox="0 0 300 606" role="img" aria-label="Lo cumple: b = 1/3; mirar revela el clima. Árbol de decisión con b = 1/3 y precio 1/2: mirar revela el clima; rama lluvia con probabilidad 1/3 lleva a llevar, costo 1; rama sol con 2/3 lleva a no llevar, costo 0; total 1/2 + 1/3 = 5/6, menor que actuar ya, 1. No lo cumple: b = 1/3; ventana con niebla. Árbol con la ventana empañada, que muestra solo una señal: rama paraguas con 13/30 deja la lluvia en 9/13 y lleva a llevar, costo 1; rama sin paraguas con 17/30 deja la lluvia en 1/17 y lleva a no llevar, costo 4/17; total 16/15, mayor que 1."><title>Ejemplo y contraejemplo pagar por mirar</title><desc>Lo cumple: b = 1/3; mirar revela el clima. Árbol de decisión con b = 1/3 y precio 1/2: mirar revela el clima; rama lluvia con probabilidad 1/3 lleva a llevar, costo 1; rama sol con 2/3 lleva a no llevar, costo 0; total 1/2 + 1/3 = 5/6, menor que actuar ya, 1. No lo cumple: b = 1/3; ventana con niebla. Árbol con la ventana empañada, que muestra solo una señal: rama paraguas con 13/30 deja la lluvia en 9/13 y lleva a llevar, costo 1; rama sin paraguas con 17/30 deja la lluvia en 1/17 y lleva a no llevar, costo 4/17; total 16/15, mayor que 1.</desc><rect x="0" y="0" width="300" height="606" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">pagar por mirar</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">b = 1/3; mirar revela el clima</text><rect x="80" y="121" width="140" height="28" rx="8" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="150" y="140" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">mirar: cuesta 1/2</text><line x1="126.6" y1="149" x2="81.4" y2="201" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="91.3" y="171" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">lluvia 1/3</text><rect x="8" y="205" width="128" height="70" rx="8" fill="#27294b" stroke="#c8b9d8" stroke-width="1.5"/><text x="72" y="227" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lluvia: b = 1</text><text x="72" y="245" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">llevar</text><text x="72" y="263" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">costo 1</text><line x1="173.4" y1="149" x2="218.6" y2="201" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="208.7" y="171" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">sol 2/3</text><rect x="164" y="205" width="128" height="70" rx="8" fill="#27294b" stroke="#c8b9d8" stroke-width="1.5"/><text x="228" y="227" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sol: b = 0</text><text x="228" y="245" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">no llevar</text><text x="228" y="263" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">costo 0</text><text x="16" y="295" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1/2 + 1/3·1 + 2/3·0 = 5/6</text><text x="16" y="314" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">5/6 &lt; 1: mirar gana</text><line x1="16" y1="324" x2="284" y2="324" stroke="#78419e" stroke-width="1"/><text x="16" y="344" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✗ No lo cumple</text><text x="16" y="363" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">b = 1/3; ventana con niebla</text><rect x="80" y="378" width="140" height="28" rx="8" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="150" y="397" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">mirar: cuesta 1/2</text><line x1="126.6" y1="406" x2="81.4" y2="458" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="91.3" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">paraguas</text><text x="91.3" y="442" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">13/30</text><rect x="8" y="462" width="128" height="70" rx="8" fill="#27294b" stroke="#c8b9d8" stroke-width="1.5"/><text x="72" y="484" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lluvia: b = 9/13</text><text x="72" y="502" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">llevar</text><text x="72" y="520" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">costo 1</text><line x1="173.4" y1="406" x2="218.6" y2="458" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="208.7" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">sin paraguas</text><text x="208.7" y="442" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">17/30</text><rect x="164" y="462" width="128" height="70" rx="8" fill="#27294b" stroke="#c8b9d8" stroke-width="1.5"/><text x="228" y="484" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lluvia: b = 1/17</text><text x="228" y="502" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">no llevar</text><text x="228" y="520" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">costo 4/17</text><text x="16" y="552" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1/2 + 13/30·1 + 17/30·4/17</text><text x="16" y="571" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">= 16/15</text><text x="16" y="590" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">16/15 &gt; 1: mirar pierde</text></svg>