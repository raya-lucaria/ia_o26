<svg xmlns="http://www.w3.org/2000/svg" width="300" height="367" viewBox="0 0 300 367" role="img" aria-label="Retícula de tres columnas, días 0, 1 y 2, con las señales sin paraguas, paraguas, sin paraguas arriba de cada una; dos filas, lluvia arriba y sol abajo. Día 0: lluvia 1/20 y sol 2/5. Día 1: lluvia 27/250 y sol 7/125. Cada uno con flecha gruesa desde sol del día 0 y sol del día 0, las flechas que perdieron punteadas. Día 2, nuevo, con borde grueso: lluvia 189/25000 y sol 98/3125. Cada uno con flecha gruesa desde lluvia del día 1 y sol del día 1, las flechas que perdieron punteadas. El camino de regreso sol, sol, sol va con línea doble gruesa. Al pie: conjunta 98/3125."><title>Retícula de Viterbi, tramo 3: el día 2</title><desc>Retícula de tres columnas, días 0, 1 y 2, con las señales sin paraguas, paraguas, sin paraguas arriba de cada una; dos filas, lluvia arriba y sol abajo. Día 0: lluvia 1/20 y sol 2/5. Día 1: lluvia 27/250 y sol 7/125. Cada uno con flecha gruesa desde sol del día 0 y sol del día 0, las flechas que perdieron punteadas. Día 2, nuevo, con borde grueso: lluvia 189/25000 y sol 98/3125. Cada uno con flecha gruesa desde lluvia del día 1 y sol del día 1, las flechas que perdieron punteadas. El camino de regreso sol, sol, sol va con línea doble gruesa. Al pie: conjunta 98/3125.</desc><rect x="0" y="0" width="300" height="367" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Retícula de Viterbi,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">tramo 3: el día 2</text><text x="54" y="85" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">día 0</text><text x="54" y="102" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sin paraguas</text><text x="150" y="85" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">día 1</text><text x="150" y="102" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">paraguas</text><text x="246" y="85" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">día 2</text><text x="246" y="102" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sin paraguas</text><line x1="91" y1="128" x2="113" y2="128" stroke="#c8b9d8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#s)"/><line x1="91" y1="146" x2="113" y2="190" stroke="#c8b9d8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#s)"/><line x1="91" y1="190" x2="109.4" y2="153.2" stroke="#f04cff" stroke-width="3.0"/><polygon points="113,146 113.9,155.4 105,150.9" fill="#f04cff"/><line x1="187" y1="190" x2="209" y2="146" stroke="#c8b9d8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#s)"/><line x1="187" y1="146" x2="209" y2="190" stroke="#c8b9d8" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#s)"/><line x1="187" y1="128" x2="201" y2="128" stroke="#f04cff" stroke-width="3.0"/><polygon points="209,128 201,133 201,123" fill="#f04cff"/><line x1="91" y1="208" x2="112" y2="208" stroke="#f04cff" stroke-width="7"/><line x1="91" y1="208" x2="112" y2="208" stroke="#211033" stroke-width="3"/><polygon points="90,208 100,214 100,202" fill="#f04cff"/><line x1="187" y1="208" x2="208" y2="208" stroke="#f04cff" stroke-width="7"/><line x1="187" y1="208" x2="208" y2="208" stroke="#211033" stroke-width="3"/><polygon points="186,208 196,214 196,202" fill="#f04cff"/><rect x="17" y="117" width="74" height="40" rx="7" fill="#2a3558" stroke="#55ddff" stroke-width="1.5"/><text x="54" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">lluvia</text><text x="54" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1/20</text><rect x="17" y="179" width="74" height="40" rx="7" fill="#2a3558" stroke="#55ddff" stroke-width="1.5"/><text x="54" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sol ★</text><text x="54" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2/5</text><rect x="113" y="117" width="74" height="40" rx="7" fill="#2a3558" stroke="#55ddff" stroke-width="1.5"/><text x="150" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">lluvia ★</text><text x="150" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">27/250</text><rect x="113" y="179" width="74" height="40" rx="7" fill="#2a3558" stroke="#55ddff" stroke-width="1.5"/><text x="150" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sol</text><text x="150" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">7/125</text><rect x="209" y="117" width="74" height="40" rx="7" fill="#2a3558" stroke="#f04cff" stroke-width="3.5"/><text x="246" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">lluvia</text><text x="246" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">189/25000</text><rect x="209" y="179" width="74" height="40" rx="7" fill="#2a3558" stroke="#f04cff" stroke-width="3.5"/><text x="246" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sol ★</text><text x="246" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">98/3125</text><text x="16" y="245" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Borde grueso: lo nuevo. ★: el mayor</text><text x="16" y="265" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de su columna.</text><text x="16" y="285" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Flecha gruesa: de dónde viene el</text><text x="16" y="305" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">máximo. Punteada: la que perdió.</text><text x="16" y="325" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Doble línea: el camino de regreso.</text><text x="16" y="349" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">conjunta 98/3125</text></svg>