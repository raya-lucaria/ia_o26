<svg xmlns="http://www.w3.org/2000/svg" width="300" height="341" viewBox="0 0 300 341" role="img" aria-label="Grafo de dos estados, V (vocal) y C (consonante), con la matriz estimada de la frase «Con la iglesia hemos dado, Sancho». Desde V: a V con 2/11 (lazo) y a C con 9/11. Desde C: a V con 2/3 y a C con 1/3 (lazo). Cada fila suma 1."><title>El grafo de la frase V = vocal, C = consonante</title><desc>Grafo de dos estados, V (vocal) y C (consonante), con la matriz estimada de la frase «Con la iglesia hemos dado, Sancho». Desde V: a V con 2/11 (lazo) y a C con 9/11. Desde C: a V con 2/3 y a C con 1/3 (lazo). Cada fila suma 1.</desc><rect x="0" y="0" width="300" height="341" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">El grafo de la frase</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">V = vocal, C = consonante</text><path d="M 79 158.5 C 50 99 134 99 107 158" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="92" y="105" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2/11</text><path d="M 195 158.5 C 166 99 250 99 223 158" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="208" y="105" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1/3</text><path d="M 116 171 Q 150 143 180 171" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150" y="149" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">9/11</text><path d="M 184 191 Q 150 219 120 191" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="150" y="225" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2/3</text><circle cx="92" cy="181" r="26" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="92" y="188" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">V</text><rect x="182" y="155" width="52" height="52" rx="6" fill="#49333c" stroke="#ffd166" stroke-width="2"/><text x="208" y="188" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">C</text><text x="16" y="261" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Una flecha por cada entrada de P̂;</text><text x="16" y="281" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">las de una misma salida suman 1:</text><text x="16" y="301" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">desde V, 2/11 + 9/11 = 1;</text><text x="16" y="321" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">desde C, 2/3 + 1/3 = 1.</text></svg>