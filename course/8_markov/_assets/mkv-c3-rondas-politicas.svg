<svg xmlns="http://www.w3.org/2000/svg" width="300" height="523" viewBox="0 0 300 523" role="img" aria-label="Iteración de políticas en el pasillo de dos casillas. Desde caminar–caminar: ronda 1: caminar–caminar, V = (−6, −3); ronda 2: caminar–correr, V = (−5, −2). Desde correr–correr: ronda 1: correr–correr, V = (−14, −2); ronda 2: caminar–correr, V = (−5, −2). En el pasillo de 200 casillas, la iteración de valores hace 451 rondas hasta un residuo de 10⁻⁹ y la de políticas, 2 rondas desde caminar siempre: una mejora y una que confirma."><title>Iteración de políticas, ronda a ronda</title><desc>Iteración de políticas en el pasillo de dos casillas. Desde caminar–caminar: ronda 1: caminar–caminar, V = (−6, −3); ronda 2: caminar–correr, V = (−5, −2). Desde correr–correr: ronda 1: correr–correr, V = (−14, −2); ronda 2: caminar–correr, V = (−5, −2). En el pasillo de 200 casillas, la iteración de valores hace 451 rondas hasta un residuo de 10⁻⁹ y la de políticas, 2 rondas desde caminar siempre: una mejora y una que confirma.</desc><rect x="0" y="0" width="300" height="523" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Iteración de políticas,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">ronda a ronda</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Desde caminar–caminar</text><rect x="16" y="99" width="268" height="40" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="26" y="116" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">ronda 1: caminar–caminar</text><text x="26" y="132" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">V = (−6, −3)</text><line x1="150" y1="141" x2="150" y2="155" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="159" width="268" height="40" rx="6" fill="#3e1850" stroke="#f04cff" stroke-width="2"/><text x="26" y="176" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">ronda 2: caminar–correr</text><text x="26" y="192" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">V = (−5, −2); la mejora no cambia nada</text><line x1="16" y1="215" x2="284" y2="215" stroke="#78419e" stroke-width="1"/><text x="16" y="235" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Desde correr–correr</text><rect x="16" y="247" width="268" height="40" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="26" y="264" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">ronda 1: correr–correr</text><text x="26" y="280" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">V = (−14, −2)</text><line x1="150" y1="289" x2="150" y2="303" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="16" y="307" width="268" height="40" rx="6" fill="#3e1850" stroke="#f04cff" stroke-width="2"/><text x="26" y="324" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">ronda 2: caminar–correr</text><text x="26" y="340" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">V = (−5, −2); la mejora no cambia nada</text><line x1="16" y1="363" x2="284" y2="363" stroke="#78419e" stroke-width="1"/><text x="16" y="383" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">El pasillo de 200 casillas</text><text x="16" y="412" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">valores</text><rect x="96" y="399" width="110" height="18" fill="#3e81a3" stroke="#55ddff" stroke-width="1"/><text x="212" y="413" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">451 rondas</text><text x="16" y="440" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">políticas</text><rect x="96" y="427" width="2" height="18" fill="#9331a3" stroke="#f04cff" stroke-width="1"/><text x="104" y="441" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">2 rondas</text><text x="16" y="463" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Valores: hasta residuo ≤ 10⁻⁹, desde 0.</text><text x="16" y="483" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Políticas: desde caminar siempre; la</text><text x="16" y="503" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">última ronda solo confirma.</text></svg>