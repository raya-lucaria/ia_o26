<svg xmlns="http://www.w3.org/2000/svg" width="300" height="455" viewBox="0 0 300 455" role="img" aria-label="Gráfica de la creencia de lluvia contra el día, 0 a 2, con las señales paraguas, paraguas, sin paraguas al pie. Por día, un punto hueco con la predicción y un punto lleno con la creencia, unidos por una flecha. Día 0: de 1/2 a 9/11, aproximadamente 0.818. Día 1: de 69/110 a 621/703, aproximadamente 0.883. Día 2: de 4593/7030 a 4593/24089, aproximadamente 0.191. Una línea punteada horizontal marca 1/2."><title>La creencia de lluvia, día por día</title><desc>Gráfica de la creencia de lluvia contra el día, 0 a 2, con las señales paraguas, paraguas, sin paraguas al pie. Por día, un punto hueco con la predicción y un punto lleno con la creencia, unidos por una flecha. Día 0: de 1/2 a 9/11, aproximadamente 0.818. Día 1: de 69/110 a 621/703, aproximadamente 0.883. Día 2: de 4593/7030 a 4593/24089, aproximadamente 0.191. Una línea punteada horizontal marca 1/2.</desc><rect x="0" y="0" width="300" height="455" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">La creencia de lluvia,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">día por día</text><text x="16" y="83" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">Pr(lluvia)</text><line x1="58" y1="265" x2="284" y2="265" stroke="#4c2868" stroke-width="1"/><text x="50" y="269" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><line x1="58" y1="180" x2="284" y2="180" stroke="#4c2868" stroke-width="1" stroke-dasharray="5 4"/><text x="50" y="184" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">1/2</text><line x1="58" y1="95" x2="284" y2="95" stroke="#4c2868" stroke-width="1"/><text x="50" y="99" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><line x1="89.7" y1="180" x2="101.7" y2="125.9" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><circle cx="82.7" cy="180" r="5" fill="#211033" stroke="#55ddff" stroke-width="2"/><circle cx="108.7" cy="125.9" r="5" fill="#55ddff" stroke="#55ddff" stroke-width="2"/><text x="82.7" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0.500</text><text x="108.7" y="115.9" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0.818</text><text x="95.7" y="282" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">día 0</text><text x="95.7" y="299" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">paraguas</text><line x1="165" y1="158.4" x2="177" y2="114.8" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><circle cx="158" cy="158.4" r="5" fill="#211033" stroke="#55ddff" stroke-width="2"/><circle cx="184" cy="114.8" r="5" fill="#55ddff" stroke="#55ddff" stroke-width="2"/><text x="158" y="176.4" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0.627</text><text x="184" y="104.8" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0.883</text><text x="171" y="282" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">día 1</text><text x="171" y="299" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">paraguas</text><line x1="240.3" y1="153.9" x2="252.3" y2="232.6" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><circle cx="233.3" cy="153.9" r="5" fill="#211033" stroke="#55ddff" stroke-width="2"/><circle cx="259.3" cy="232.6" r="5" fill="#55ddff" stroke="#55ddff" stroke-width="2"/><text x="233.3" y="143.9" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0.653</text><text x="259.3" y="250.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">0.191</text><text x="246.3" y="282" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">día 2</text><text x="246.3" y="299" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">sin paraguas</text><text x="50" y="299" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">señal</text><circle cx="29" cy="325" r="5" fill="#211033" stroke="#55ddff" stroke-width="2"/><text x="50" y="329" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">predicción, antes de la señal</text><circle cx="29" cy="345" r="5" fill="#55ddff" stroke="#55ddff" stroke-width="2"/><text x="50" y="349" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">creencia, después de corregir</text><line x1="17" y1="365" x2="41" y2="365" stroke="#c8b9d8" stroke-width="1" stroke-dasharray="5 4"/><text x="50" y="369" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">1/2: lo que creías al empezar</text><text x="16" y="395" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Día 0: 1/2 → 9/11</text><text x="16" y="415" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Día 1: 69/110 → 621/703</text><text x="16" y="435" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Día 2: 4593/7030 → 4593/24089</text></svg>