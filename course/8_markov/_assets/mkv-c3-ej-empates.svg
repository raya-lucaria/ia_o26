<svg xmlns="http://www.w3.org/2000/svg" width="300" height="545" viewBox="0 0 300 545" role="img" aria-label="Lo cumple: En empate conserva: termina. Iteración de políticas desde caminar–caminar, con caminar a costo 2 en la casilla 2: allí caminar vale −2 y correr vale −2. Rondas: caminar–caminar, y para. No lo cumple: En empate cambia: alterna. Iteración de políticas desde caminar–caminar, con caminar a costo 2 en la casilla 2: allí caminar vale −2 y correr vale −2. Rondas: caminar–caminar, caminar–correr, caminar–caminar, caminar–correr, caminar–caminar, y sigue alternando."><title>Ejemplo y contraejemplo empates en la mejora</title><desc>Lo cumple: En empate conserva: termina. Iteración de políticas desde caminar–caminar, con caminar a costo 2 en la casilla 2: allí caminar vale −2 y correr vale −2. Rondas: caminar–caminar, y para. No lo cumple: En empate cambia: alterna. Iteración de políticas desde caminar–caminar, con caminar a costo 2 en la casilla 2: allí caminar vale −2 y correr vale −2. Rondas: caminar–caminar, caminar–correr, caminar–caminar, caminar–correr, caminar–caminar, y sigue alternando.</desc><rect x="0" y="0" width="300" height="545" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">empates en la mejora</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">En empate conserva: termina</text><text x="16" y="119" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">En 2: caminar vale −2, correr vale −2</text><rect x="40" y="131" width="220" height="26" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="149" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ronda 0: caminar–caminar</text><text x="150" y="177" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">para: la mejora no cambia nada</text><line x1="16" y1="193" x2="284" y2="193" stroke="#78419e" stroke-width="1"/><text x="16" y="213" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✗ No lo cumple</text><text x="16" y="232" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">En empate cambia: alterna</text><text x="16" y="245" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">En 2: caminar vale −2, correr vale −2</text><rect x="40" y="257" width="220" height="26" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="275" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ronda 0: caminar–caminar</text><line x1="150" y1="285" x2="150" y2="297" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="301" width="220" height="26" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="319" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ronda 1: caminar–correr</text><line x1="150" y1="329" x2="150" y2="341" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="345" width="220" height="26" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="363" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ronda 2: caminar–caminar</text><line x1="150" y1="373" x2="150" y2="385" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="389" width="220" height="26" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="407" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ronda 3: caminar–correr</text><line x1="150" y1="417" x2="150" y2="429" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="433" width="220" height="26" rx="6" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="150" y="451" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ronda 4: caminar–caminar</text><text x="150" y="479" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">… y así sin fin</text><text x="16" y="505" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Caminar cuesta 2 en la casilla 2;</text><text x="16" y="525" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">allí caminar y correr empatan.</text></svg>