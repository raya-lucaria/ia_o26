<svg xmlns="http://www.w3.org/2000/svg" width="300" height="587" viewBox="0 0 300 587" role="img" aria-label="Diagrama de flujo de muestrear una fila, en palabras. 1: Sortea u uniforme entre 0 y 1. 2: Empieza en el primer estado, con suma = 0. 3: Suma la probabilidad de ese estado. 4, pregunta: ¿u es menor que la suma? Si sí, sigue abajo. 5: El siguiente estado es ese estado. Desde el paso 4, si no: el que sigue, vuelve al paso 3. Un solo u por paso. Es lo que usa toda simulación de la clase."><title>Muestrear una fila, en palabras</title><desc>Diagrama de flujo de muestrear una fila, en palabras. 1: Sortea u uniforme entre 0 y 1. 2: Empieza en el primer estado, con suma = 0. 3: Suma la probabilidad de ese estado. 4, pregunta: ¿u es menor que la suma? Si sí, sigue abajo. 5: El siguiente estado es ese estado. Desde el paso 4, si no: el que sigue, vuelve al paso 3. Un solo u por paso. Es lo que usa toda simulación de la clase.</desc><rect x="0" y="0" width="300" height="587" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Muestrear una fila,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Sortea u</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">uniforme entre 0 y 1</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza en el primer</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">estado, con suma = 0</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Suma la probabilidad</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">de ese estado</text><line x1="112" y1="317" x2="112" y2="348" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,351 182,395 112,439 42,395" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿u es menor</text><text x="112" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">que la suma?</text><line x1="112" y1="439" x2="112" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="458" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="473" width="244" height="56" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">El siguiente estado</text><text x="50" y="516" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">es ese estado</text><polyline points="42,395 22,395 22,289" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="289" x2="37" y2="289" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="342" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 342)">no: el que sigue</text><text x="16" y="555" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Un solo u por paso. Es lo que usa</text><text x="16" y="575" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">toda simulación de la clase.</text></svg>