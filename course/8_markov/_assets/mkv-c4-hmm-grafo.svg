<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420" role="img" aria-label="Arriba, los estados ocultos lluvia y sol, en nodos con borde punteado. Lluvia se queda con 7/10 y pasa a sol con 3/10. Sol pasa a lluvia con 3/10 y se queda con 7/10. Abajo, las señales que se ven, paraguas y sin paraguas, en nodos con borde sólido. De lluvia salen flechas de emisión: a paraguas con 9/10, a sin paraguas con 1/10. De sol salen flechas de emisión: a paraguas con 2/10, a sin paraguas con 8/10. Al pie, μ₀ = (1/2, 1/2)."><title>El paraguas oculto, estados arriba, señales abajo</title><desc>Arriba, los estados ocultos lluvia y sol, en nodos con borde punteado. Lluvia se queda con 7/10 y pasa a sol con 3/10. Sol pasa a lluvia con 3/10 y se queda con 7/10. Abajo, las señales que se ven, paraguas y sin paraguas, en nodos con borde sólido. De lluvia salen flechas de emisión: a paraguas con 9/10, a sin paraguas con 1/10. De sol salen flechas de emisión: a paraguas con 2/10, a sin paraguas con 8/10. Al pie, μ₀ = (1/2, 1/2).</desc><rect x="0" y="0" width="300" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">El paraguas oculto,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">estados arriba, señales abajo</text><path d="M 71.8 117.8 C 46.6 98.6 121.4 98.6 97 116" fill="none" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="84" y="89.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" 