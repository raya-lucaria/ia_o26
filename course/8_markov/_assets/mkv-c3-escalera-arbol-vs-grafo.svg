<svg xmlns="http://www.w3.org/2000/svg" width="300" height="589" viewBox="0 0 300 589" role="img" aria-label="Arriba, el árbol de llamadas de rutas(0): 20 nodos y 8 hojas, todas en el escalón 5; el escalón 3 aparece 3 veces y el 4, 5. Abajo, el grafo de la escalera: 6 nodos, de 0 a 5, con un brinco de 1 a s + 1 y uno de 2 a s + 2. Rutas desde cada escalón, de 0 a 5: 8, 5, 3, 2, 1, 1."><title>Contar rutas: árbol contra grafo</title><desc>Arriba, el árbol de llamadas de rutas(0): 20 nodos y 8 hojas, todas en el escalón 5; el escalón 3 aparece 3 veces y el 4, 5. Abajo, el grafo de la escalera: 6 nodos, de 0 a 5, con un brinco de 1 a s + 1 y uno de 2 a s + 2. Rutas desde cada escalón, de 0 a 5: 8, 5, 3, 2, 1, 1.</desc><rect x="0" y="0" width="300" height="589" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Contar rutas: árbol</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">contra grafo</text><text x="16" y="79" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">El árbol de rutas(0): 20 nodos</text><line x1="176.9" y1="120" x2="109.1" y2="138" stroke="#c8b9d8" stroke-width="1.5"/><line x1="109.1" y1="160" x2="69.8" y2="178" stroke="#c8b9d8" stroke-width="1.5"/><line x1="69.8" y1="200" x2="43.5" y2="218" stroke="#c8b9d8" stroke-width="1.5"/><line x1="43.5" y1="240" x2="26" y2="258" stroke="#c8b9d8" stroke-width="1.5"/><line x1="26" y1="280" x2="26" y2="298" stroke="#c8b9d8" stroke-width="1.5"