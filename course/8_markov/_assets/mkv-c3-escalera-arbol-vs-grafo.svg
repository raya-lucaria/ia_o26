ont-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">El grafo: 6 nodos, uno por escalón</text><path d="M 78 449 Q 85.5 449 91 449" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 75.5 441 Q 107 419 136.9 439.8" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 121 449 Q 128.5 449 134 449" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 118.5 457 Q 150 479 179.9 458.2" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 164 449 Q 171.5 449 177 449" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 161.5 441 Q 193 419 222.9 439.8" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 207 449 Q 214.5 449 220 449" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 204.5 457 Q 236 479 265.9 458.2" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><path d="M 250 449 Q 257.5 449 263 449" fill="none" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><circle cx="64" cy="449" r="14" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="64" y="453.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text><circle cx="107" cy="449" r="14" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="107" y="453.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><circle cx="150" cy="449" r="14" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="150" y="453.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><circle cx="193" cy="449" r="14" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="193" y="453.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><circle cx="236" cy="449" r="14" fill="#2a3558" stroke="#55ddff" stroke-width="2"/><text x="236" y="453.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><circle cx="279" cy="449" r="14" fill="#393b3a" stroke="#a8ff5a" stroke-width="2"/><text x="279" y="453.6" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="16" y="499" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">rutas</text><text x="64" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">8</text><text x="107" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="150" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="193" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="236" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="279" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="16" y="529" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Hacia atrás: rutas(s) = rutas(s + 1) +</text><text x="16" y="549" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">rutas(s + 2); cada escalón se cuenta</text><text x="16" y="569" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">una sola vez.</text></svg>