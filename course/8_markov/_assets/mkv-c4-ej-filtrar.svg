<svg xmlns="http://www.w3.org/2000/svg" width="300" height="477" viewBox="0 0 300 477" role="img" aria-label="Lo cumple: El paraguas: paraguas, paraguas. Día 0, con paraguas: la creencia de lluvia b₀ vale 9/11 y la evidencia 11/20. Flecha predecir con P: la barra pasa a 69/110. Flecha corregir con B, con paraguas: la evidencia es 703/1100 y la barra sube a 621/703, aproximadamente 0.883. No lo cumple: P = B = I; paraguas, sin paraguas. Día 0, con paraguas: la creencia de lluvia b₀ vale 1 y la evidencia 1/2. Flecha predecir con P: la barra pasa a 1. Flecha corregir con B, con sin paraguas: los pesos son 0, 0, la evidencia es 0 y la última barra aparece tachada con el letrero señal imposible."><title>Ejemplo y contraejemplo el filtrado recursivo</title><desc>Lo cumple: El paraguas: paraguas, paraguas. Día 0, con paraguas: la creencia de lluvia b₀ vale 9/11 y la evidencia 11/20. Flecha predecir con P: la barra pasa a 69/110. Flecha corregir con B, con paraguas: la evidencia es 703/1100 y la barra sube a 621/703, aproximadamente 0.883. No lo cumple: P = B = I; paraguas, sin paraguas. Día 0, con paraguas: la creencia de lluvia b₀ vale 1 y la evidencia 1/2. Flecha predecir con P: la barra pasa a 1. Flecha corregir con B, con sin paraguas: los pesos son 0, 0, la evidencia es 0 y la última barra aparece tachada con el letrero señal imposible.</desc><rect x="0" y="0" width="300" height="477" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Ejemplo y contraejemplo</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">el filtrado recursivo</text><line x1="16" y1="67" x2="284" y2="67" stroke="#78419e" stroke-width="1"/><text x="16" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✓ Lo cumple</text><text x="16" y="106" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">El paraguas: paraguas, paraguas</text><text x="16" y="127" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Día 0, ve paraguas: ev₀ = 11/20</text><text x="58" y="151" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">b₀</text><rect x="66" y="139" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="139" width="81.8" height="16" rx="3" fill="#314e70" stroke="#55ddff" stroke-width="2"/><text x="174" y="151" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">9/11 ≈ 0.818</text><line x1="34" y1="158" x2="34" y2="178" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="46" y="173" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">predecir con P</text><text x="58" y="193" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">b₁|₀</text><rect x="66" y="181" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="181" width="62.7" height="16" rx="3" fill="#314e70" stroke="#55ddff" stroke-width="2"/><text x="174" y="193" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">69/110 ≈ 0.627</text><line x1="34" y1="200" x2="34" y2="220" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="46" y="215" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">corregir con B · ev₁ = 703/1100</text><text x="58" y="235" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">b₁</text><rect x="66" y="223" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="223" width="88.3" height="16" rx="3" fill="#314e70" stroke="#55ddff" stroke-width="2"/><text x="174" y="235" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">621/703 ≈ 0.883</text><line x1="16" y1="247" x2="284" y2="247" stroke="#78419e" stroke-width="1"/><text x="16" y="267" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">✗ No lo cumple</text><text x="16" y="286" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">P = B = I; paraguas, sin paraguas</text><text x="16" y="307" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Día 0, ve paraguas: ev₀ = 1/2</text><text x="58" y="331" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">b₀</text><rect x="66" y="319" width="100" height="16" rx="3" fill="none" stroke="#78419e" stroke-width="1"/><rect x="66" y="319" width="100" height="16" rx="3" fill="#314e70" stroke="#55ddff" stroke-width="2"/><text x="174" y="331" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">1</text><line x1="34" y1="338" x2="34" y2="358" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="46" y="353" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">predecir con P</text><text x="58" y="373" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">b₁|₀</text><rec