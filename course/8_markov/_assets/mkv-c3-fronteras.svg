<svg xmlns="http://www.w3.org/2000/svg" width="300" height="489" viewBox="0 0 300 489" role="img" aria-label="Mapa de la mejor política del pasillo según el costo de caminar (de 0 a 6) y el castigo del hueco (de 0 a 12). Raya vertical en costo = 2: a la derecha conviene correr en 2. Raya inclinada castigo = costo − 2: debajo conviene correr también en 1. Regiones: caminar–caminar; caminar–correr; correr–correr. El pasillo (costo 3, castigo 10) cae en caminar–correr. En las rayas, empatan."><title>¿Correr o caminar? según costo y castigo</title><desc>Mapa de la mejor política del pasillo según el costo de caminar (de 0 a 6) y el castigo del hueco (de 0 a 12). Raya vertical en costo = 2: a la derecha conviene correr en 2. Raya inclinada castigo = costo − 2: debajo conviene correr también en 1. Regiones: caminar–caminar; caminar–correr; correr–correr. El pasillo (costo 3, castigo 10) cae en caminar–correr. En las rayas, empatan.</desc><rect x="0" y="0" width="300" height="489" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">¿Correr o caminar?</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">según costo y castigo</text><line x1="58" y1="327" x2="280" y2="327" stroke="#4c2868" stroke-width="1"/><text x="50" y="331" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">0</text><line x1="58" y1="290.3" x2="280" y2="290.3" stroke="#4c2868" stroke-width="1"/><text x="50" y="294.3" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><line x1="58" y1="253.7" x2="280" y2="253.7" stroke="#4c2868" stroke-width="1"/><text x="50" y="257.7" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><line x1="58" y1="217" x2="280" y2="217" stroke="#4c2868" stroke-width="1"/><text x="50" y="221" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">6</text><line x1="58" y1="180.3" x2="280" y2="180.3" stroke="#4c2868" stroke-width="1"/><text x="50" y="184.3" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">8</text><line x1="58" y1="143.7" x2="280" y2="143.7" stroke="#4c2868" stroke-width="1"/><text x="50" y="147.7" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><line x1="58" y1="107" x2="280" y2="107" stroke="#4c2868" stroke-width="1"/><text x="50" y="111" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">12</text><line x1="58" y1="107" x2="58" y2="327" stroke="#4c2868" stroke-width="1"/><text x="58" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">0</text><line x1="95" y1="107" x2="95" y2="327" stroke="#4c2868" stroke-width="1"/><text x="95" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><line x1="132" y1="107" x2="132" y2="327" stroke="#4c2868" stroke-width="1"/><text x="132" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><line x1="169" y1="107" x2="169" y2="327" stroke="#4c2868" stroke-width="1"/><text x="169" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">3</text><line x1="206" y1="107" x2="206" y2="327" stroke="#4c2868" stroke-width="1"/><text x="206" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><line x1="243" y1="107" x2="243" y2="327" stroke="#4c2868" stroke-width="1"/><text x="243" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">5</text><line x1="280" y1="107" x2="280" y2="327" stroke="#4c2868" stroke-width="1"/><text x="280" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text x="169" y="363" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">costo de caminar</text><text x="16" y="95" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">castigo del hueco</text><line x1="132" y1="107" x2="132" y2="327" stroke="#f7f2ff" stroke-width="2"/><line x1="132" y1="327" x2="280" y2="253.7" stroke="#f7f2ff" stroke-width="2"/><text x="95" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">caminar–</text><text x="95" y="177" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">caminar</text><text x="220.8" y="207.8" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">caminar–</text><text x="220.8" y="222.8" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">correr</text><text x="243" y="310.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">correr–</text><text x="243" y="325.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">correr</text><circle cx="169" cy="143.7" r="6" fill="#f04cff" stroke="#f04cff" stroke-width="1"/><text x="179" y="165.7" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">el pasillo</text><text x="16" y="389" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Raya vertical: costo de caminar = 2;</text><text x="16" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">a la derecha conviene correr en 2.</text><text x="16" y="429" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Raya inclinada: castigo = costo − 2;</text><text x="16" y="449" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">debajo conviene correr también en 1.</text><text x="16" y="469" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">El pasillo: costo 3, castigo 10.</text></svg>