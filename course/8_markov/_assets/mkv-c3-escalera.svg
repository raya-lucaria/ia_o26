<svg xmlns="http://www.w3.org/2000/svg" width="300" height="413" viewBox="0 0 300 413" role="img" aria-label="Escalera de escalones 0 a 5 que suben a la derecha; desde cada escalón se brinca 1 o 2 sin pasarse del 5. Pisar los escalones 1 a 5 cuesta 1, 2, 9, 1, 1 (el 3 está flojo). Lo que falta pagar desde cada escalón, de 0 a 5: 4, 4, 2, 1, 1, 0. La ruta óptima, marcada, es 0 → 2 → 4 → 5 y paga 4; la codiciosa, que pisa el siguiente más barato, es 0 → 1 → 2 → 4 → 5 y paga 5."><title>La escalera brinca 1 o 2; pisar cuesta</title><desc>Escalera de escalones 0 a 5 que suben a la derecha; desde cada escalón se brinca 1 o 2 sin pasarse del 5. Pisar los escalones 1 a 5 cuesta 1, 2, 9, 1, 1 (el 3 está flojo). Lo que falta pagar desde cada escalón, de 0 a 5: 4, 4, 2, 1, 1, 0. La ruta óptima, marcada, es 0 → 2 → 4 → 5 y paga 4; la codiciosa, que pisa el siguiente más barato, es 0 → 1 → 2 → 4 → 5 y paga 5.</desc><rect x="0" y="0" width="300" height="413" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">La escalera</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">brinca 1 o 2; pisar cuesta</text><rect x="72" y="203" width="35" height="20" rx="2" fill="#371c4e" stroke="#c8b9d8" stroke-width="1.5"/><text x="89.5" y="218" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text><rect x="107" y="183" width="35" height="40" rx="2" fill="#371c4e" stroke="#c8b9d8" stroke-width="1.5"/><text x="124.5" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><rect x="142" y="163" width="35" height="60" rx="2" fill="#371c4e" stroke="#c8b9d8" stroke-width="1.5"/><text x="159.5" y="178" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><rect x="177" y="143" width="35" height="80" rx="2" fill="#584040" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="4 3"/><text x="194.5" y="158" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="194.5" y="215" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">flojo</text><rect x="212" y="123" width="35" height="100" rx="2" fill="#371c4e" stroke="#c8b9d8" stroke-width="1.5"/><text x="229.5" y="138" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><rect x="247" y="103" width="35" height="120" rx="2" fill="#371c4e" stroke="#c8b9d8" stroke-width="1.5"/><text x="264.5" y="118" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5</text><path d="M 89.5 199 Q 124.5 125 159.5 155" fill="none" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><path d="M 159.5 159 Q 194.5 85 229.5 115" fill="none" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><path d="M 229.5 119 Q 247 65 264.5 95" fill="none" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="16" y="95" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="start">ruta óptima</text><text x="16" y="247" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">escalón</text><text x="89.5" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text>