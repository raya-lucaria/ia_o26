i, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="159.5" y="287" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="194.5" y="287" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="229.5" y="287" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="264.5" y="287" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text><text x="16" y="313" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Fila «falta»: lo que falta pagar desde</text><text x="16" y="333" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ese escalón, de 5 hacia atrás.</text><text x="16" y="353" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Óptima: 0 → 2 → 4 → 5, paga 4.</text><text x="16" y="373" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">La codiciosa (pisa el más barato):</text><text x="16" y="393" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">0 → 1 → 2 → 4 → 5, paga 5.</text></svg>