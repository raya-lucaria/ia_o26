<svg xmlns="http://www.w3.org/2000/svg" width="300" height="491" viewBox="0 0 300 491" role="img" aria-label="Número de rachas de consonantes de cada largo ℓ, de 1 a 5, en escala logarítmica: las reales del corpus (barras) contra la mediana de 10 réplicas del largo del corpus de una cadena con q = 0.290 (rombos) y de letras independientes con q = 0.536 (triángulos). ℓ = 1: reales 384 971, cadena 438 112, independientes 187 124; ℓ = 2: reales 212 310, cadena 126 722, independientes 100 176; ℓ = 3: reales 19 027, cadena 36 729, independientes 53 611; ℓ = 4: reales 323, cadena 10 684, independientes 28 819; ℓ = 5: reales 3, cadena 3 072, independientes 15 360. La franja del 5 % al 95 % de las réplicas es más angosta que la marca."><title>Rachas de consonantes reales contra simuladas</title><desc>Número de rachas de consonantes de cada largo ℓ, de 1 a 5, en escala logarítmica: las reales del corpus (barras) contra la mediana de 10 réplicas del largo del corpus de una cadena con q = 0.290 (rombos) y de letras independientes con q = 0.536 (triángulos). ℓ = 1: reales 384 971, cadena 438 112, independientes 187 124; ℓ = 2: reales 212 310, cadena 126 722, independientes 100 176; ℓ = 3: reales 19 027, cadena 36 729, independientes 53 611; ℓ = 4: reales 323, cadena 10 684, independientes 28 819; ℓ = 5: reales 3, cadena 3 072, independientes 15 360. La franja del 5 % al 95 % de las réplicas es más angosta que la marca.</desc><rect x="0" y="0" width="300" height="491" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Rachas de consonantes</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">reales contra simuladas</text><rect x="22" y="69" width="14" height="16" fill="#506441" stroke="#a8ff5a" stroke-width="1.5"/><text x="50" y="81" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">reales, en el corpus</text><polygon points="29,91.5 34.5,97 29,102.5 23.5,97" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="50" y="101" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cadena (q = 0.290)</text><polygon points="29,112 34,121 24,121" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="50" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">independientes (q = 0.536)</text><text x="16" y="157" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">número de rachas (escala log)</text><line x1="58" y1="349" x2="284" y2="349" stroke="#4c2868" stroke-width="1"/><text x="52" y="353" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">1</text><line x1="58" y1="289" x2="284" y2="289" stroke="#4c2868" stroke-width="1"/><text x="52" y="293" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10²</text><line x1="58" y1="229" x2="284" y2="229" stroke="#4c2868" stroke-width="1"/><text x="52" y="233" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10⁴</text><line x1="58" y1="169" x2="284" y2="169" stroke="#4c2868" stroke-width="1"/><text x="52" y="173" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10⁶</text><rect x="67" y="181.4" width="14" height="167.6" fill="#506441" stroke="#a8ff5a" stroke-width="1.5"/><line x1="88" y1="179.7" x2="88" y2="179.8" stroke="#f04cff" stroke-width="1.5"/><polygon points="88,174.3 93.5,179.8 88,185.3 82.5,179.8" fill="#211033" stroke="#f04cff" stroke-width="2"/><line x1="98" y1="190.8" x2="98" y2="190.9" stroke="#f7f2ff" stroke-width="1.5"/><polygon points="98,185.8 103,194.8 93,194.8" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="82" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">1</text><rect x="112" y="189.2" width="14" height="159.8" fill="#506441" stroke="#a8ff5a" stroke-width="1.5"/><line x1="133" y1="195.9" x2="133" y2="195.9" stroke="#f04cff" stroke-width="1.5"/><polygon points="133,190.4 138.5,195.9 133,201.4 127.5,195.9" fill="#211033" stroke="#f04cff" stroke-width="2"/><line x1="143" y1="198.9" x2="143" y2="199" stroke="#f7f2ff" stroke-width="1.5"/><polygon points="143,194 148,203 138,203" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="127" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><rect x="157" y="220.6" width="14" height="128.4" fill="#506441" stroke="#a8ff5a" stroke-width="1.5"/><line x1="178" y1="212" x2="178" y2="212.2" stroke="#f04cff" stroke-width="1.5"/><polygon points="178,206.5 183.5,212 178,217.5 172.5,212" fill="#211033" stroke="#f04cff" stroke-width="2"/><line x1="188" y1="207" x2="188" y2="207.2" stroke="#f7f2ff" stroke-width="1.5"/><polygon points="188,202.1 193,211.1 183,211.1" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="172" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">3</text><rect x="202" y="273.7" width="14" height="75.3" fill="#506441" stroke="#a8ff5a" stroke-width="1.5"/><line x1="223" y1="228" x2="223" y2="228.3" stroke="#f04cff" stroke-width="1.5"/><polygon points="223,222.6 228.5,228.1 223,233.6 217.5,228.1" fill="#211033" stroke="#f04cff" stroke-width="2"/><line x1="233" y1="215.1" x2="233" y2="215.3" stroke="#f7f2ff" stroke-width="1.5"/><polygon points="233,210.2 238,219.2 228,219.2" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="217" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><rect x="247" y="334.7" width="14" height="14.3" fill="#506441" stroke="#a8ff5a" stroke-width="1.5"/><line x1="268" y1="244" x2="268" y2="244.7" stroke="#f04cff" stroke-width="1.5"/><polygon points="268,238.9 273.5,244.4 268,249.9 262.5,244.4" fill="#211033" stroke="#f04cff" stroke-width="2"/><line x1="278" y1="223.3" x2="278" y2="223.5" stroke="#f7f2ff" stroke-width="1.5"/><polygon points="278,218.4 283,227.4 273,227.4" fill="#f7f2ff" stroke="#f7f2ff" stroke-width="1"/><text x="262" y="367" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">5</text><text x="170" y="387" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">largo ℓ de la racha</text><text x="16" y="411" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Marcas: mediana de 10 réplicas del largo</text><text x="16" y="431" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">del corpus. Su franja del 5 % al 95 %</text><text x="16" y="451" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">es más angosta que la marca:</text><text x="16" y="471" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la diferencia no es azar.</text></svg>