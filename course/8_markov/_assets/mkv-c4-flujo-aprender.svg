<svg xmlns="http://www.w3.org/2000/svg" width="300" height="767" viewBox="0 0 300 767" role="img" aria-label="Diagrama de flujo del ciclo de Baum-Welch, en palabras. 1: Modelo de hoy: μ₀, P, B. 2: Reparte cada día y cada par de días entre los estados, con toda la secuencia. 3: Conteos esperados: fracciones en lugar de enteros. 4: Cuenta: cada fila entre su total. 5: Modelo nuevo. 6, pregunta: ¿La verosimilitud dejó de subir? Si sí, sigue abajo. 7: Termina. Desde el paso 6, si no: otra vuelta, vuelve al paso 1. Cada vuelta no baja la verosimilitud, pero puede parar en un modelo que no es el mejor."><title>Baum-Welch, en palabras contar con fracciones</title><desc>Diagrama de flujo del ciclo de Baum-Welch, en palabras. 1: Modelo de hoy: μ₀, P, B. 2: Reparte cada día y cada par de días entre los estados, con toda la secuencia. 3: Conteos esperados: fracciones en lugar de enteros. 4: Cuenta: cada fila entre su total. 5: Modelo nuevo. 6, pregunta: ¿La verosimilitud dejó de subir? Si sí, sigue abajo. 7: Termina. Desde el paso 6, si no: otra vuelta, vuelve al paso 1. Cada vuelta no baja la verosimilitud, pero puede parar en un modelo que no es el mejor.</desc><rect x="0" y="0" width="300" height="767" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Baum-Welch, en palabras</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">contar con fracciones</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Modelo de hoy:</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">μ₀, P, B</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="76" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Reparte cada día y cada par</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">de días entre los estados,</text><text x="50" y="234" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">con toda la secuencia</text><line x1="112" y1="247" x2="112" y2="278" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="281" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Conteos esperados:</text><text x="50" y="324" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">fracciones en lugar de enteros</text><line x1="112" y1="337" x2="112" y2="368" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="371" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="394" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Cuenta: cada fila</text><text x="50" y="414" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">entre su total</text><line x1="112" y1="427" x2="112" y2="458" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="461" width="244" height="36" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="484" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Modelo nuevo</text><line x1="112" y1="497" x2="112" y2="528" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,531 202,575 112,619 22,575" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="571" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿La verosimilitud</text><text x="112" y="589" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">dejó de subir?</text><line x1="112" y1="619" x2="112" y2="650" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="638" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">sí</text><rect x="40" y="653" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="676" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Termina</text><polyline points="22,575 22,575 22,109" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="109" x2="37" y2="109" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="342" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 342)">no: otra vuelta</text><text x="16" y="715" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada vuelta no baja la verosimilitud,</text><text x="16" y="735" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">pero puede parar en un modelo</text><text x="16" y="755" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">que no es el mejor.</text></svg>