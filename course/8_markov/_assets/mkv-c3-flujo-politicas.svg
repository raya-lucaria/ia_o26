<svg xmlns="http://www.w3.org/2000/svg" width="300" height="587" viewBox="0 0 300 587" role="img" aria-label="Diagrama de flujo de la iteración de políticas, en palabras. 1: Empieza con una π que termina. 2: Evalúa: resuelve el sistema del valor de π. 3: Mejora: en cada s, la codiciosa de ese valor; en empate, conserva π(s). 4, pregunta: ¿Cambió alguna? Si no, sigue abajo. 5: Devuelve π y su valor. Desde el paso 4, si sí: otra ronda, vuelve al paso 2. Cada ronda mejora o deja igual; hay un número finito de políticas."><title>Iteración de políticas, en palabras</title><desc>Diagrama de flujo de la iteración de políticas, en palabras. 1: Empieza con una π que termina. 2: Evalúa: resuelve el sistema del valor de π. 3: Mejora: en cada s, la codiciosa de ese valor; en empate, conserva π(s). 4, pregunta: ¿Cambió alguna? Si no, sigue abajo. 5: Devuelve π y su valor. Desde el paso 4, si sí: otra ronda, vuelve al paso 2. Cada ronda mejora o deja igual; hay un número finito de políticas.</desc><rect x="0" y="0" width="300" height="587" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">Iteración de políticas,</text><text x="16" y="54" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">en palabras</text><rect x="40" y="81" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza con una π</text><text x="50" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">que termina</text><line x1="112" y1="137" x2="112" y2="168" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="171" width="244" height="56" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Evalúa: resuelve el</text><text x="50" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">sistema del valor de π</text><line x1="112" y1="227" x2="112" y2="258" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="261" width="244" height="76" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="284" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Mejora: en cada s, la</text><text x="50" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">codiciosa de ese valor;</text><text x="50" y="324" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">en empate, conserva π(s)</text><line x1="112" y1="337" x2="112" y2="368" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="112,371 182,415 112,459 42,415" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="112" y="411" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">¿Cambió</text><text x="112" y="429" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">alguna?</text><line x1="112" y1="459" x2="112" y2="490" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="120" y="478" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">no</text><rect x="40" y="493" width="244" height="36" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="516" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Devuelve π y su valor</text><polyline points="42,415 22,415 22,199" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="22" y1="199" x2="37" y2="199" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="14" y="307" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" transform="rotate(-90 14 307)">sí: otra ronda</text><text x="16" y="555" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Cada ronda mejora o deja igual;</text><text x="16" y="575" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">hay un número finito de políticas.</text></svg>