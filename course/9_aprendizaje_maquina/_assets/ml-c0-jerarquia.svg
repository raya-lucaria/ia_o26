<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500" role="img" aria-label="Cinco ramas hermanas de la inteligencia artificial; la del aprendizaje de máquina se amplía y adentro muestra tres rectángulos anidados: aprendizaje de máquina con la regresión logística, aprendizaje de representaciones con un autoencoder poco profundo y aprendizaje profundo con una red de varias capas."><title>El aprendizaje de máquina, visto de cerca dentro de la IA</title><desc>Cinco ramas hermanas de la inteligencia artificial; la del aprendizaje de máquina se amplía y adentro muestra tres rectángulos anidados: aprendizaje de máquina con la regresión logística, aprendizaje de representaciones con un autoencoder poco profundo y aprendizaje profundo con una red de varias capas.</desc><rect x="0" y="0" width="300" height="500" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><rect x="8" y="8" width="284" height="204" rx="12" fill="none" stroke="#78419e" stroke-width="2"/><text x="20" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">Inteligencia artificial</text><rect x="20" y="44" width="126" height="44" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="83" y="63" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Búsqueda y</text><text x="83" y="78" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">planificación</text><rect x="154" y="44" width="126" height="44" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="217" y="63" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Lógica y</text><text x="217" y="78" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">GOFAI</text><rect x="20" y="96" width="126" height="44" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="83" y="115" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Teoría de</text><text x="83" y="130" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">juegos</text><rect x="154" y="96" width="126" height="44" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="217" y="115" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Sistemas</text><text x="217" y="130" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">expertos</text><rect x="87" y="152" width="126" height="44" rx="8" fill="#2e1945" stroke="#f04cff" stroke-width="2.5"/><text x="150" y="171" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Aprendizaje</text><text x="150" y="186" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">máquina</text><line x1="87" y1="196" x2="8" y2="246" stroke="#f04cff" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="213" y1="196" x2="292" y2="246" stroke="#f04cff" stroke-width="1.5" stroke-dasharray="5 4"/><text x="150" y="234" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">de cerca:</text><rect x="8" y="246" width="284" height="180" rx="10" fill="#2f1441" stroke="#f04cff" stroke-width="2"/><text x="18" y="267" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">aprendizaje de máquina</text><text x="18" y="285" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ej.: regresión logística</text><rect x="18" y="302" width="264" height="116" rx="10" fill="#401952" stroke="#f04cff" stroke-width="2"/><text x="28" y="323" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">aprendizaje de representaciones</text><text x="28" y="341" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ej.: autoencoder poco profundo</text><rect x="28" y="358" width="244" height="52" rx="10" fill="#511e62" stroke="#f04cff" stroke-width="2"/><text x="38" y="379" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">aprendizaje profundo</text><text x="38" y="397" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ej.: red profunda de varias capas</text><text x="150" y="450" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">Solo aquí dentro hay anidamiento.</text><text x="150" y="470" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Las cinco ramas de arriba son hermanas:</text><text x="150" y="486" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ninguna contiene a las demás.</text></svg>