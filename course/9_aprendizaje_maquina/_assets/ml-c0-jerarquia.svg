<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-label="Cinco ramas hermanas de la inteligencia artificial; la del aprendizaje de máquina se amplía y adentro muestra tres rectángulos anidados: aprendizaje de máquina con la regresión logística, aprendizaje de representaciones con un autoencoder poco profundo y aprendizaje profundo con una red de varias capas."><title>El aprendizaje de máquina, visto de cerca dentro de la IA</title><desc>Cinco ramas hermanas de la inteligencia artificial; la del aprendizaje de máquina se amplía y adentro muestra tres rectángulos anidados: aprendizaje de máquina con la regresión logística, aprendizaje de representaciones con un autoencoder poco profundo y aprendizaje profundo con una red de varias capas.</desc><rect x="0" y="0" width="600" height="500" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><rect x="12" y="12" width="576" height="112" rx="12" fill="none" stroke="#78419e" stroke-width="2"/><text x="26" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">Inteligencia artificial</text><rect x="26" y="50" width="104" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="78" y="74" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Búsqueda y</text><text x="78" y="90" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">planificación</text><rect x="138" y="50" width="104" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="190" y="74" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Lógica y</text><text x="190" y="90" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">GOFAI</text><rect x="250" y="50" width="104" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="302" y="74" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Teoría de</text><text x="302" y="90" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">juegos</text><rect x="362" y="50" width="104" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="1.5"/><text x="414" y="74" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Sistemas</text><text x="414" y="90" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">expertos</text><rect x="474" y="50" width="104" height="60" rx="8" fill="#2e1945" stroke="#f04cff" stroke-width="2.5"/><text x="526" y="74" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">Aprendizaje</text><text x="526" y="90" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">máquina</text><line x1="474" y1="110" x2="26" y2="160" stroke="#f04cff" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="578" y1="110" x2="574" y2="160" stroke="#f04cff" stroke-width="1.5" stroke-dasharray="5 4"/><text x="300" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">de cerca:</text><rect x="26" y="160" width="548" height="270" rx="10" fill="#2f1441" stroke="#f04cff" stroke-width="2"/><text x="40" y="184" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">aprendizaje de máquina</text><text x="40" y="202" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ej.: regresión logística</text><rect x="56" y="222" width="488" height="188" rx="10" fill="#401952" stroke="#f04cff" stroke-width="2"/><text x="70" y="246" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">aprendizaje de representaciones</text><text x="70" y="264" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ej.: autoencoder poco profundo</text><rect x="86" y="284" width="428" height="106" rx="10" fill="#511e62" stroke="#f04cff" stroke-width="2"/><text x="100" y="308" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">aprendizaje profundo</text><text x="100" y="326" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ej.: red profunda de varias capas</text><text x="300" y="456" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">Solo aquí dentro hay anidamiento.</text><text x="300" y="476" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Las cinco ramas de arriba son hermanas: ninguna contiene a las demás.</text></svg>