<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-label="Diagrama de las cuatro fuentes del error. Al centro, lo mejor que se puede predecir con lo que mides, rodeado de dos halos: 1, el azar, y 2, lo que no mides, que puede encogerse al medir otra variable; las dos fijan el piso. A la derecha, el óvalo de la familia: la mejor de la familia, en su borde, está a una distancia de aproximación (3) del centro, y f gorro con n datos está a una distancia de estimación (4) de la mejor de la familia. Junto a f gorro, un punto hueco: lo que devuelve el optimizador; la distancia entre los dos es el error de optimización, aparte, punteado y fuera de las cuatro."><title>Las cuatro fuentes del error</title><desc>Diagrama de las cuatro fuentes del error. Al centro, lo mejor que se puede predecir con lo que mides, rodeado de dos halos: 1, el azar, y 2, lo que no mides, que puede encogerse al medir otra variable; las dos fijan el piso. A la derecha, el óvalo de la familia: la mejor de la familia, en su borde, está a una distancia de aproximación (3) del centro, y f gorro con n datos está a una distancia de estimación (4) de la mejor de la familia. Junto a f gorro, un punto hueco: lo que devuelve el optimizador; la distancia entre los dos es el error de optimización, aparte, punteado y fuera de las cuatro.</desc><rect x="0" y="0" width="600" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Las cuatro fuentes del error</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">distancias hasta lo mejor que se puede hacer con lo que mides</text><circle cx="128" cy="206" r="78" fill="#322144" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="128" cy="206" r="40" fill="#49395b" stroke="#c8b9d8" stroke-width="1.5"/><circle cx="128" cy="206" r="7" fill="#a9e88f" stroke="#f7f2ff" stroke-width="1.2"/><text x="128" y="190" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">1 · azar</text><text x="128" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">2 · lo que</text><text x="128" y="164" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">no mides</text><text x="128" y="308" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">lo mejor con</text><text x="128" y="324" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">lo que mides</text><text x="128" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">1 y 2 fijan el piso</text><text x="16" y="82" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">medir otra variable</text><text x="16" y="98" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">puede encoger el halo 2</text><line x1="52" y1="106" x2="78" y2="150" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><ellipse cx="462" cy="200" rx="126" ry="100" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="492" y="126" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">la familia</text><circle cx="336" cy="206" r="6" fill="#f7f2ff"/><text x="348" y="232" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">la mejor de</text><text x="348" y="248" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">la familia</text><line x1="328" y1="206" x2="138" y2="206" stroke="#f04cff" stroke-width="2.5" marker-end="url(#p)"/><text x="271" y="194" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">3 · aproximación</text><circle cx="512" cy="170" r="6" fill="#64dce3"/><text x="512" y="156" fill="#64dce3" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-style="italic">f̂</tspan> con <tspan font-style="italic">n</tspan> datos</text><line x1="504" y1="174" x2="348" y2="202" stroke="#f04cff" stroke-width="2.5" marker-end="url(#p)"/><text x="428" y="174" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">4 · estimación</text><rect x="334" y="330" width="256" height="64" rx="8" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="462" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">lo que devuelve el optimizador</text><text x="462" y="369" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">y además: optimización</text><text x="462" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">(fuera de las cuatro)</text><line x1="517" y1="174" x2="547" y2="200" stroke="#c8b9d8" stroke-width="1.2" stroke-dasharray="2 3"/><circle cx="552" cy="204" r="5" fill="#211033" stroke="#c8b9d8" stroke-width="1.8"/><line x1="552" y1="328" x2="552" y2="211" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 4"/></svg>