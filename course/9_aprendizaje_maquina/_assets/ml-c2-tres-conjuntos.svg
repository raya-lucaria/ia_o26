<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="Una barra con la muestra partida en tres: entrenamiento, 60 por ciento, con círculo, ajusta beta gorro de N para cada candidato; validación, 20 por ciento, con triángulo, elige N gorro; prueba, 20 por ciento, con cuadrado y candado, se abre una vez, al final. Una llave junta entrenamiento y validación en la casilla del modelo final: el elegido, reajustado con entrenamiento unión validación; una flecha lleva el modelo final a la prueba, que estima su riesgo R."><title>Tres conjuntos, tres decisiones</title><desc>Una barra con la muestra partida en tres: entrenamiento, 60 por ciento, con círculo, ajusta beta gorro de N para cada candidato; validación, 20 por ciento, con triángulo, elige N gorro; prueba, 20 por ciento, con cuadrado y candado, se abre una vez, al final. Una llave junta entrenamiento y validación en la casilla del modelo final: el elegido, reajustado con entrenamiento unión validación; una flecha lleva el modelo final a la prueba, que estima su riesgo R.</desc><rect x="0" y="0" width="580" height="330" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Tres conjuntos, tres decisiones</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">la misma muestra, partida antes de mirar nada</text><rect x="25" y="78" width="317.2" height="56" rx="6" fill="#3d5071" stroke="#64dce3" stroke-width="2"/><circle cx="157.6" cy="118" r="6" fill="#64dce3"/><text x=