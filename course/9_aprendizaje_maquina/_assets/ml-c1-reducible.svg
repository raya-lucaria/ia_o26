<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" role="img" aria-label="Una observación y, en la misma x, la f verdadera y el ajuste f gorro. El residual y menos f gorro de x, lo único que se ve, se parte en dos segmentos: f de x menos f gorro de x, la parte reducible, que baja si estimas mejor, y épsilon, el azar, que ningún ajuste baja."><title>El residual se parte en dos</title><desc>Una observación y, en la misma x, la f verdadera y el ajuste f gorro. El residual y menos f gorro de x, lo único que se ve, se parte en dos segmentos: f de x menos f gorro de x, la parte reducible, que baja si estimas mejor, y épsilon, el azar, que ningún ajuste baja.</desc><rect x="0" y="0" width="560" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">El residual se parte en dos</text><rect x="56" y="52" width="476" height="266" rx="6" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="64" y="340" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">distancia <tspan font-style="italic">x</tspan></text><text x="524" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">tiempo <tspan font-style="italic">y</tspan></text><line x1="60" y1="264.4" x2="528" y2="95.9" stroke="#a9e88f" stroke-width="3.5"/><line x1="60" y1="300.8" x2="528" y2="174.4" stroke="#64dce3" stroke-width="1.8"/><rect x="67" y="234.8" width="95.3" height="18.9" rx="3" fill="#2e1945"/><text x="70" y="248.8" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="14" text-anchor="start"><tspan font-style="italic">f</tspan>: la regla</text><rect x="149" y="253" width="111.6" height="18.9" rx="3" fill="#2e1945"/><text x="152" y="267" fill="#64dce3" font-family="system-ui, sans-serif" font-size="14" text-anchor="start"><tspan font-style="italic">f̂</tspan>: tu ajuste</text><line x1="300" y1="56" x2="300" y2="314" stroke="#78419e" stroke-width="1.2" stroke-dasharray="3 4"/><circle cx="300" cy="92" r="7" fill="#64dce3" stroke="#f7f2ff" stroke-width="1.5"/><text x="300" y="76" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">lo que observas: <tspan font-style="italic">y</tspan></text><circle cx="300" cy="178" r="4" fill="#a9e88f"/><circle cx="300" cy="236" r="4" fill="#64dce3"/><line x1="326" y1="94" x2="326" y2="176" stroke="#a9e88f" stroke-width="3"/><line x1="320" y1="94" x2="332" y2="94" stroke="#a9e88f" stroke-width="2"/><line x1="320" y1="176" x2="332" y2="176" stroke="#a9e88f" stroke-width="2"/><line x1="326" y1="180" x2="326" y2="234" stroke="#f04cff" stroke-width="3"/><line x1="320" y1="180" x2="332" y2="180" stroke="#f04cff" stroke-width="2"/><line x1="320" y1="234" x2="332" y2="234" stroke="#f04cff" stroke-width="2"/><rect x="337" y="117" width="87.2" height="18.9" rx="3" fill="#2e1945"/><text x="340" y="131" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700"><tspan font-style="italic">ε</tspan>: el azar</text><rect x="337" y="137" width="164.3" height="17.6" rx="3" fill="#2e1945"/><text x="340" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">ningún ajuste lo baja</text><rect x="337" y="191" width="192.8" height="18.9" rx="3" fill="#2e1945"/><text x="340" y="205" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700"><tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) − <tspan font-style="italic">f̂</tspan>(<tspan font-style="italic">x</tspan>): reducible</text><rect x="337" y="211" width="164.3" height="17.6" rx="3" fill="#2e1945"/><text x="340" y="224" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">baja si estimas mejor</text><line x1="270" y1="94" x2="270" y2="234" stroke="#f7f2ff" stroke-width="2.5"/><line x1="264" y1="94" x2="276" y2="94" stroke="#f7f2ff" stroke-width="2"/><line x1="264" y1="234" x2="276" y2="234" stroke="#f7f2ff" stroke-width="2"/><text x="258" y="163" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="end" font-weight="700"><tspan font-style="italic">y</tspan> − <tspan font-style="italic">f̂</tspan>(<tspan font-style="italic">x</tspan>): el residual</text><text x="258" y="182" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">lo único que ves</text><text x="16" y="364" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Con datos reales no conoces <tspan font-style="italic">f</tspan>: ves el residual, nunca sus dos partes.</text></svg>