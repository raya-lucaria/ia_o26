<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Tres requisitos de un modelo exitoso: error de entrenamiento pequeño y brecha entrenamiento–prueba pequeña, atenuados, se vieron en las clases 1 a 4; el tercero, encendido, la prueba imita la realidad, es el de la clase 5"><title>Tres requisitos de un modelo exitoso</title><desc>Tres requisitos de un modelo exitoso: error de entrenamiento pequeño y brecha entrenamiento–prueba pequeña, atenuados, se vieron en las clases 1 a 4; el tercero, encendido, la prueba imita la realidad, es el de la clase 5</desc><rect x="0" y="0" width="600" height="300" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Un modelo exitoso: tres requisitos</text><text x="16" y="52" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">la clase 2 lo puso en un recuadro; aquí la tercera tarjeta es el tema</text><rect x="16" y="76" width="176" height="170" rx="12" fill="#211033" stroke="#5b4b6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="104" y="114" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="26" text-anchor="middle" font-weight="700">1</text><text x="104" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">error de</text><text x="104" y="168" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">entrenamiento</text><text x="104" y="188" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">pequeño</text><text x="104" y="232" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">clases 1 a 4</text><rect x="202" y="76" width="176" height="170" rx="12" fill="#211033" stroke="#5b4b6d" stroke-width="1.5" stroke-dasharray="5 4"/><text x="290" y="114" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="26" text-anchor="middle" font-weight="700">2</text><text x="290" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">brecha</text><text x="290" y="168" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">entrenamiento–prueba</text><text x="290" y="188" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">pequeña</text><text x="290" y="232" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">clases 1 a 4</text><rect x="388" y="76" width="176" height="170" rx="12" fill="#2e1945" stroke="#f04cff" stroke-width="3"/><text x="476" y="114" fill="#f04cff" font-family="system-ui, sans-serif" font-size="26" text-anchor="middle" font-weight="700">3</text><text x="476" y="148" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">la prueba</text><text x="476" y="168" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">imita la</text><text x="476" y="188" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">realidad</text><text x="476" y="232" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">clase 5</text><text x="16" y="278" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">las dos primeras comparan números de tus datos; la tercera compara tus datos con el uso</text></svg>