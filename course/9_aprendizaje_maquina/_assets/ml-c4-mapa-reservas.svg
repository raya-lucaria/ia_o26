<svg xmlns="http://www.w3.org/2000/svg" width="600" height="505" viewBox="0 0 600 505" role="img" aria-label="Qué conjunto ajusta cada pieza: ent ajusta el modelo, mu y los pesos; val_a la recalibración y el umbral; val_b el diagnóstico y la elección; cal solo el corte conformal, y se aparta primero; la prueba, la evaluación final, una vez. Al azar, garantía marginal; estratificada, por clase"><title>Qué conjunto ajusta cada pieza</title><desc>Qué conjunto ajusta cada pieza: ent ajusta el modelo, mu y los pesos; val_a la recalibración y el umbral; val_b el diagnóstico y la elección; cal solo el corte conformal, y se aparta primero; la prueba, la evaluación final, una vez. Al azar, garantía marginal; estratificada, por clase</desc><rect x="0" y="0" width="600" height="505" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Qué conjunto ajusta cada pieza</text><text x="16" y="52" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">cada cosa que se ajusta necesita datos que no tocó otra</text><rect x="16" y="92" width="281" height="40" rx="6" fill="#385771" stroke="#64dce3" stroke-width="2"/><text x="156.5" y="118" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="700">ent</text><rect x="300" y="92" width="53.8" height="40" rx="6" fill="#6f5445" stroke="#ffd166" stroke-width="2"/><text x="326.9" y="118" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="700">val_a</text><rect x="356.8" y="92" width="53.8" height="40" rx="6" fill="#6f5445" stroke="#ffd166" stroke-width="2"/><text x="383.7" y="118" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="700">val_b</text><rect x="413.6" y="92" width="53.8" height="40" rx="6" fill="#515c53" stroke="#a9e88f" stroke-width="2"/><text x="440.5" y="118" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="700">cal</text><rect x="470.4" y="92" width="110.6" height="40" rx="6" fill="#6f3a5e" stroke="#ff87ad" stroke-width="2"/><text x="525.7" y="118" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle" font-weight="700">prueba</text><text x="441" y="80" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">se aparta primero</text><text x="385.2" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">la validación, partida en tres</text><rect x="16" y="184" width="568" height="44" rx="6" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="28" y="211" fill="#64dce3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" font-weight="700">ent</text><text x="110" y="203" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">β₀, β y la φ estandarizada;</text><text x="110" y="220" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">μ y los pesos por CV dentro de ent</text><rect x="16" y="234" width="568" height="44" rx="6" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><text x="28" y="261" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" font-weight="700">val_a</text><text x="110" y="253" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">la recalibración</text><text x="110" y="270" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">y el umbral τ</text><rect x="16" y="284" width="568" height="44" rx="6" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><text x="28" y="311" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" font-weight="700">val_b</text><text x="110" y="303" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">benchmark, diagnóstico</text><text x="110" y="320" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">y elección de lo que queda</text><rect x="16" y="334" width="568" height="44" rx="6" fill="#2e1945" stroke="#a9e88f" stroke-width="2"/><text x="28" y="361" fill="#a9e88f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" font-weight="700">cal</text><text x="110" y="353" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">solo el corte conformal ĉ:</text><text x="110" y="370" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">no elige ni diagnostica nada</text><rect x="16" y="384" width="568" height="44" rx="6" fill="#2e1945" stroke="#ff87ad" stroke-width="2"/><text x="28" y="411" fill="#ff87ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start" font-weight="700">prueba</text><text x="110" y="403" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">se abre una vez:</text><text x="110" y="420" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">las cifras finales</text><text x="16" y="448" fill="#a9e88f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start">cal, resto = ml.partir(datos.val, 1/3, como=C, semilla=S)</text><text x="16" y="466" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="start">val_a, val_b = ml.partir(resto, 0.5, como=C, semilla=S + 1)</text><text x="16" y="493" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">al azar: garantía marginal · estratificada: por clase</text></svg>