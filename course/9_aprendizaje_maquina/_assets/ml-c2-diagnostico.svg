<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Árbol de diagnóstico con cuatro preguntas que se leen de arriba abajo. Uno: la brecha entre validación, o CV, y entrenamiento es grande; si sí, sobreajuste: menos capacidad o más datos. Dos: le gana al benchmark, la media de entrenamiento; en una validación que no eligió el modelo, la diferencia pareada baja de cero a más de dos errores estándar; con CV solo da señal o falta evidencia; si no, no aprende: otras variables o familias. Tres: subir el grado baja la CV más de un error estándar, una heurística; si sí, subajuste: más capacidad o mejor phi. Cuatro: la prueba imita el despliegue; si sí, listo; si no, rehacer la separación."><title>Diagnosticar con dos curvas y un benchmark</title><desc>Árbol de diagnóstico con cuatro preguntas que se leen de arriba abajo. Uno: la brecha entre validación, o CV, y entrenamiento es grande; si sí, sobreajuste: menos capacidad o más datos. Dos: le gana al benchmark, la media de entrenamiento; en una validación que no eligió el modelo, la diferencia pareada baja de cero a más de dos errores estándar; con CV solo da señal o falta evidencia; si no, no aprende: otras variables o familias. Tres: subir el grado baja la CV más de un error estándar, una heurística; si sí, subajuste: más capacidad o mejor phi. Cuatro: la prueba imita el despliegue; si sí, listo; si no, rehacer la separación.</desc><rect x="0" y="0" width="600" height="600" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Diagnosticar con dos curvas y un benchmark</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">se lee de arriba abajo; cada pregunta se contesta con datos reales</text><rect x="16" y="66" width="350" height="42" rx="10" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="30" y="90" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">1 · ¿Brecha <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">val</tspan> − <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">ent</tspan> (o CV − <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">ent</tspan>) grande?</text><rect x="398" y="62" width="186" height="50" rx="8" fill="#5c315c" stroke="#ff87ad" stroke-width="2"/><text x="491" y="83" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">sobreajuste</text><text x="491" y="102" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">menos capacidad, más datos</text><line x1="366" y1="87" x2="394" y2="87" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="382" y="79" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">sí</text><rect x="16" y="160" width="350" height="94" rx="10" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="30" y="184" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">2 · ¿Le gana al benchmark (la media de ent)?</text><text x="30" y="202" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">(a) en validación que no eligió: la</text><text x="30" y="220" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">diferencia pareada baja de 0 a más de 2 EE</text><text x="30" y="238" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">(b) con CV solo da señal o «falta evidencia»</text><rect x="398" y="182" width="186" height="50" rx="8" fill="#59246e" stroke="#f04cff" stroke-width="2"/><text x="491" y="203" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">no aprende</text><text x="491" y="222" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">otras variables o familias</text><line x1="366" y1="207" x2="394" y2="207" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="382" y="199" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">no</text><rect x="16" y="300" width="350" height="58" rx="10" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="30" y="324" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">3 · ¿Subir el grado baja la CV más de un EE?</text><text x="30" y="342" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">heurística, como la regla de un EE</text><rect x="398" y="304" width="186" height="50" rx="8" fill="#5c414c" stroke="#ffd166" stroke-width="2"/><text x="491" y="325" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">subajuste</text><text x="491" y="344" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">más capacidad, mejor φ</text><line x1="366" y1="329" x2="394" y2="329" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="382" y="321" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">sí</text><rect x="16" y="400" width="350" height="42" rx="10" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="30" y="424" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">4 · ¿Tu prueba imita el despliegue?</text><rect x="398" y="396" width="186" height="50" rx="8" fill="#494755" stroke="#a9e88f" stroke-width="2"/><text x="491" y="417" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">listo</text><text x="491" y="436" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">lo que queda: ruido o familia</text><line x1="366" y1="421" x2="394" y2="421" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="382" y="413" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">sí</text><line x1="76" y1="108" x2="76" y2="156" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="84" y="138" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">no</text><line x1="76" y1="254" x2="76" y2="296" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="84" y="281" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">sí</text><line x1="76" y1="358" x2="76" y2="396" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="84" y="383" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">no</text><line x1="76" y1="442" x2="76" y2="494" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="84" y="486" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">no</text><rect x="16" y="498" width="260" height="50" rx="8" fill="#59246e" stroke="#f04cff" stroke-width="2"/><text x="146" y="519" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">rehacer la separación</text><text x="146" y="538" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">página 1, §5: imitar el despliegue</text><text x="16" y="566" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">El subajuste se reconoce porque una familia más flexible</text><text x="16" y="586" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">baja el error honesto; el piso solo se ve en el simulador.</text></svg>