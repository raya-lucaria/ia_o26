<svg xmlns="http://www.w3.org/2000/svg" width="580" height="360" viewBox="0 0 580 360" role="img" aria-label="Dos cajas anidadas. La de afuera elige el grado N comparando los candidatos con la pérdida de validación, y su flecha va al conjunto de validación, que solo mide. La de adentro elige beta con N fijo minimizando la pérdida de entrenamiento con grado a lo más N, y su flecha va al conjunto de entrenamiento, que ajusta; devuelve un beta gorro por candidato. Al pie: si afuera se mirara el entrenamiento, ganaría siempre la caja más grande."><title>Dos decisiones, dos conjuntos</title><desc>Dos cajas anidadas. La de afuera elige el grado N comparando los candidatos con la pérdida de validación, y su flecha va al conjunto de validación, que solo mide. La de adentro elige beta con N fijo minimizando la pérdida de entrenamiento con grado a lo más N, y su flecha va al conjunto de entrenamiento, que ajusta; devuelve un beta gorro por candidato. Al pie: si afuera se mirara el entrenamiento, ganaría siempre la caja más grande.</desc><rect x="0" y="0" width="580" height="360" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Dos decisiones, dos conjuntos</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">una optimización dentro de otra: mira qué datos usa cada una</text><rect x="24" y="70" width="360" height="222" rx="12" fill="#2e1945" stroke="#ffd166" stroke-width="2.2"/><text x="40" y="96" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">afuera: elige el grado <tspan font-style="italic">N</tspan></text><text x="40" y="118" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">compara los <tspan font-style="italic">N</tspan> candidatos con <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">val</tspan></text><rect x="48" y="140" width="312" height="128" rx="10" fill="#211033" stroke="#64dce3" stroke-width="2"/><text x="64" y="166" fill="#64dce3" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">adentro: elige <tspan font-style="italic">β</tspan> con <tspan font-style="italic">N</tspan> fijo</text><text x="64" y="188" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">minimiza <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">ent</tspan>(<tspan font-style="italic">β</tspan>) con grado ≤ <tspan font-style="italic">N</tspan></text><text x="64" y="212" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">devuelve <tspan font-style="italic">β̂</tspan>(<tspan font-style="italic">N</tspan>), uno por candidato</text><text x="64" y="236" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">afuera recibe los <tspan font-style="italic">β̂</tspan>(<tspan font-style="italic">N</tspan>) ya ajustados</text><rect x="420" y="86" width="148" height="52" rx="8" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><polygon points="436,101 443.6,114.6 428.4,114.6" fill="#ffd166"/><text x="450" y="113" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">validación</text><text x="494" y="131" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">solo mide</text><rect x="420" y="184" width="148" height="52" rx="8" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><circle cx="436" cy="207" r="7" fill="#64dce3"/><text x="450" y="211" fill="#64dce3" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">entrenamiento</text><text x="494" y="229" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ajusta</text><line x1="384" y1="112" x2="416" y2="112" stroke="#f04cff" stroke-width="2.2" marker-end="url(#p)"/><line x1="360" y1="210" x2="416" y2="210" stroke="#f04cff" stroke-width="2.2" marker-end="url(#p)"/><text x="16" y="318" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Si afuera mirara <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">ent</tspan>, ganaría siempre la caja más grande:</text><text x="16" y="338" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">con familias anidadas, <tspan font-style="italic">L</tspan><tspan baseline-shift="sub" font-size="12">ent</tspan> nunca sube con <tspan font-style="italic">N</tspan>.</text></svg>