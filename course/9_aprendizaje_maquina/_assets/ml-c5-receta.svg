<svg xmlns="http://www.w3.org/2000/svg" width="600" height="560" viewBox="0 0 600 560" role="img" aria-label="La receta en siete pasos; el lazo usa validación; las reservas se apartan con la prueba, como se usará el modelo: cal primero, que solo da el corte conformal; val_a ajusta la recalibración y elige el umbral, y no reporta ninguna cifra; val_b elige el método de recalibración, diagnostica y mide el benchmark; el reajuste final no toca las reservas; la prueba se abre una vez al final"><title>La receta, de punta a punta</title><desc>La receta en siete pasos; el lazo usa validación; las reservas se apartan con la prueba, como se usará el modelo: cal primero, que solo da el corte conformal; val_a ajusta la recalibración y elige el umbral, y no reporta ninguna cifra; val_b elige el método de recalibración, diagnostica y mide el benchmark; el reajuste final no toca las reservas; la prueba se abre una vez al final</desc><rect x="0" y="0" width="600" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="28" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">La receta, de punta a punta</text><rect x="96" y="48" width="240" height="37" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="106" y="63" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 0</text><text x="106" y="78" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">¿dónde y cuándo se usará?</text><rect x="96" y="97" width="240" height="37" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="106" y="112" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 1</text><text x="106" y="127" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">métrica y meta</text><rect x="96" y="146" width="240" height="52" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="106" y="161" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 2</text><text x="106" y="176" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">separar como se usará y</text><text x="106" y="191" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">apartar la prueba</text><rect x="96" y="210" width="240" height="37" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="106" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 3</text><text x="106" y="240" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">benchmark</text><rect x="96" y="259" width="240" height="52" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="106" y="274" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 4</text><text x="106" y="289" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">tubería de punta a punta,</text><text x="106" y="304" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">modelo simple</text><rect x="96" y="323" width="240" height="52" rx="8" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><text x="106" y="338" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 5</text><text x="106" y="353" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">analizar el error</text><text x="106" y="368" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">en validación</text><rect x="96" y="387" width="240" height="37" rx="8" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><text x="106" y="402" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 6</text><text x="106" y="417" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">cambiar una cosa</text><rect x="96" y="436" width="240" height="67" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="106" y="451" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">paso 7</text><text x="106" y="466" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">fijar; reajustar sin las reservas;</text><text x="106" y="481" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">recalibración, τ y corte</text><text x="106" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">en su reserva</text><rect x="96" y="515" width="240" height="37" rx="8" fill="#2e1945" stroke="#ff87ad" stroke-width="2"/><text x="106" y="530" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">al final</text><text x="106" y="545" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">abrir la prueba una vez</text><line x1="216" y1="85" x2="216" y2="95" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="134" x2="216" y2="144" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="198" x2="216" y2="208" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="247" x2="216" y2="257" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="311" x2="216" y2="321" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="375" x2="216" y2="385" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="424" x2="216" y2="434" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="216" y1="503" x2="216" y2="513" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><path d="M 96 405.5 C 62 405.5 62 349.0 92 349.0" fill="none" stroke="#ffd166" stroke-width="2" marker-end="url(#s)"/><text x="16" y="327" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">lazo:</text><text x="16" y="342" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">validación</text><text x="16" y="357" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">o CV ▲</text><rect x="352" y="146" width="232" height="34" rx="8" fill="#211033" stroke="#ff87ad" stroke-width="2.5"/><text x="362" y="168" fill="#ff87ad" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">■ prueba: cerrada</text><line x1="338" y1="163" x2="348" y2="163" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="352" y="202" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">reservas (si las usas), cerradas</text><rect x="352" y="212" width="232" height="44" rx="6" fill="#2e1945" stroke="#a9e88f" stroke-width="2"/><text x="360" y="230" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start"><tspan font-weight="700" fill="#a9e88f">cal</tspan> · se aparta primero</text><text x="360" y="247" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">solo el corte conformal</text><rect x="352" y="262" width="232" height="44" rx="6" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><text x="360" y="280" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start"><tspan font-weight="700" fill="#ffd166">val_a</tspan> · recalibración y τ</text><text x="360" y="297" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">no reporta ninguna cifra</text><rect x="352" y="312" width="232" height="44" rx="6" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="360" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start"><tspan font-weight="700" fill="#64dce3">val_b</tspan> · método de recalibración</text><text x="360" y="347" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">diagnóstico y benchmark</text><text x="352" y="370" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">al azar · por grupos · por tiempo:</text><text x="352" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">las reservas también</text><line x1="338" y1="405.5" x2="348" y2="284" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)" stroke-dasharray="2 4"/><line x1="338" y1="405.5" x2="348" y2="334" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)" stroke-dasharray="2 4"/><text x="352" y="403" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">τ en val_a, sobre la probabilidad</text><text x="352" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ya recalibrada; método y</text><text x="352" y="433" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">diagnóstico en val_b</text><line x1="468" y1="453" x2="340" y2="469.5" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)" stroke-dasharray="6 4"/></svg>