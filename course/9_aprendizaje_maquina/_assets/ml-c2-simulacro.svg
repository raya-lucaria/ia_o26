<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-label="Cuatro contratos de uso, uno por fila, cada uno con la barra de la muestra y sus celdas de prueba marcadas con cuadrados. Más de lo mismo: celdas sueltas al azar; separación correcta, al azar. El mes que viene: el último tramo del eje de tiempo; separación correcta, el último tramo de tiempo. Pacientes nuevos: un paciente entero a prueba; separación correcta, pacientes enteros a un lado. Otra ciudad: ninguna fila de la muestra es de la otra ciudad; ninguna separación la imita, se declara el alcance."><title>La prueba imita cómo se usará el modelo</title><desc>Cuatro contratos de uso, uno por fila, cada uno con la barra de la muestra y sus celdas de prueba marcadas con cuadrados. Más de lo mismo: celdas sueltas al azar; separación correcta, al azar. El mes que viene: el último tramo del eje de tiempo; separación correcta, el último tramo de tiempo. Pacientes nuevos: un paciente entero a prueba; separación correcta, pacientes enteros a un lado. Otra ciudad: ninguna fila de la muestra es de la otra ciudad; ninguna separación la imita, se declara el alcance.</desc><rect x="0" y="0" width="600" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">La prueba imita cómo se usará el modelo</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">cada fila es un contrato de uso; ■ marca lo que va a prueba</text><text x="24" y="80" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">¿cómo se usará?</text><text x="176" y="80" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">la muestra (y la prueba)</text><text x="398" y="80" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">separación correcta</text><text x="24" y="120" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">más de lo mismo</text><rect x="177" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="194" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="211" y="100" width="15" height="30" rx="2" fill="#8c4a74" stroke="#ff87ad" stroke-width="1.6"/><rect x="214" y="110.5" width="9" height="9" fill="#ff87ad"/><rect x="228" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="245" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="262" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="279" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="296" y="100" width="15" height="30" rx="2" fill="#8c4a74" stroke="#ff87ad" stroke-width="1.6"/><rect x="299" y="110.5" width="9" height="9" fill="#ff87ad"/><rect x="313" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="330" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><rect x="347" y="100" width="15" height="30" rx="2" fill="#8c4a74" stroke="#ff87ad" stroke-width="1.6"/><rect x="350" y="110.5" width="9" height="9" fill="#ff87ad"/><rect x="364" y="100" width="15" height="30" rx="2" fill="#3a4468" stroke="#78419e" stroke-width="1"/><text x="398" y="120" fill="#f7f2ff"