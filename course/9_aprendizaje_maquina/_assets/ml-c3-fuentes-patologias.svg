<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Cuatro fuentes del error y sus patologías: azar, el ruido de siempre; variables que no medimos, la variable omitida; familia equivocada, la interacción omitida; pocos datos, la colinealidad. Aparte, la optimización (escalas que la entorpecen) y la endogeneidad, que no se ve en el error"><title>Cuatro fuentes y sus patologías</title><desc>Cuatro fuentes del error y sus patologías: azar, el ruido de siempre; variables que no medimos, la variable omitida; familia equivocada, la interacción omitida; pocos datos, la colinealidad. Aparte, la optimización (escalas que la entorpecen) y la endogeneidad, que no se ve en el error</desc><rect x="0" y="0" width="600" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Cuatro fuentes del error y lo que esta página rompe</text><text x="16" y="52" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">las cuatro fuentes de la clase 1; debajo, su patología</text><rect x="16" y="70" width="134" height="62" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="83" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">1 · azar</text><line x1="83" y1="134" x2="83" y2="168" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="16" y="172" width="134" height="62" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="83" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">el ruido</text><text x="83" y="216" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">de siempre</text><rect x="158" y="70" width="134" height="62" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="225" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">2 · variables que</text><text x="225" y="114" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">no medimos</text><line x1="225" y1="134" x2="225" y2="168" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="158" y="172" width="134" height="62" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="225" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">variable</text><text x="225" y="216" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">omitida</text><rect x="300" y="70" width="134" height="62" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="367" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">3 · una familia</text><text x="367" y="114" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">equivocada</text><line x1="367" y1="134" x2="367" y2="168" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="300" y="172" width="134" height="62" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="367" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">interacción</text><text x="367" y="216" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">omitida</text><rect x="442" y="70" width="134" height="62" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="509" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">4 · pocos datos</text><line x1="509" y1="134" x2="509" y2="168" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="442" y="172" width="134" height="62" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="509" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">colinealidad</text><text x="16" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">aparte, fuera de las cuatro:</text><rect x="16" y="280" width="276" height="96" rx="8" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="154" y="308" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">optimización</text><text x="154" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">escalas que entorpecen</text><text x="154" y="346" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">al optimizador</text><rect x="308" y="280" width="276" height="96" rx="8" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="446" y="308" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">endogeneidad</text><text x="446" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">no se ve en el error:</text><text x="446" y="346" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">rompe el coeficiente,</text><text x="446" y="364" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">no la predicción</text></svg>