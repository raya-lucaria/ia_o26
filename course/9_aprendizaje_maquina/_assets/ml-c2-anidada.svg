<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420" role="img" aria-label="Validación cruzada anidada. Arriba, cinco pliegues externos; en la vuelta externa 2, el pliegue externo 2 mide. Dentro de esa vuelta, una validación cruzada interna con los otros cuatro pliegues, que no ve el pliegue externo 2, elige el grado N gorro 2 y lo reajusta con los cuatro; una flecha lleva al elegido al pliegue externo, que lo evalúa. Afuera, la pérdida del elegido en cada pliegue externo se promedia en las cinco vueltas. Rótulo: afuera se estima, adentro se elige. La prueba sigue cerrada."><title>Afuera se estima; adentro se elige</title><desc>Validación cruzada anidada. Arriba, cinco pliegues externos; en la vuelta externa 2, el pliegue externo 2 mide. Dentro de esa vuelta, una validación cruzada interna con los otros cuatro pliegues, que no ve el pliegue externo 2, elige el grado N gorro 2 y lo reajusta con los cuatro; una flecha lleva al elegido al pliegue externo, que lo evalúa. Afuera, la pérdida del elegido en cada pliegue externo se promedia en las cinco vueltas. Rótulo: afuera se estima, adentro se elige. La prueba sigue cerrada.</desc><rect x="0" y="0" width="600" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Afuera se estima; adentro se elige</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">validación cruzada anidada: el número de afuera mide todo el procedimiento</text><rect x="25" y="74" width="108.4" height="34" rx="4" fill="#3c4a6c" stroke="#78419e" stroke-width="1"/><text x="79.2" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">pliegue 1</text><rect x="135.4" y="74" width="108.4" height="34" rx="4" fill="#8c6c54" stroke="#ffd166" stroke-width="2"/><text x="189.6" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="700">externo 2</text><rect x="245.8" y="74" width="108.4" height="34" rx="4" fill="#3c4a6c" stroke="#78419e" stroke-width="1"/><text x="300" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">pliegue 3</text><rect x="356.2" y="74" width="108.4" height="34" rx="4" fill="#3c4a6c" stroke="#78419e" stroke-width="1"/><text x="410.4" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">pliegue 4</text><rect x="466.6" y="74" width="108.4" height="34" rx="4" fill="#3c4a6c" stroke="#78419e" stroke-width="1"/><text x="520.8" y="96" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">pliegue 5</text><text x="199.6" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">el elegido <tspan font-style="italic">N̂</tspan>₂ se mide aquí</text><rect x="24" y="148" width="340" height="196" rx="12" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="40" y="172" fill="#64dce3" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">adentro: CV interna con los otros cuatro</text><text x="40" y="192" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">no ve el pliegue externo 2</text><rect x="47" y="209" width="28" height="18" rx="3" fill="#8c6c54" stroke="#ffd166" stroke-width="2"/><polygon points="61,213 66.7,223.2 55.3,223.2" fill="#ffd166"/><rect x="77" y="209" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="91" cy="218" r="4.5" fill="#64dce3"/><rect x="107" y="209" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="121" cy="218" r="4.5" fill="#64dce3"/><rect x="137" y="209" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="151" cy="218" r="4.5" fill="#64dce3"/><rect x="47" y="229" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="61" cy="238" r="4.5" fill="#64dce3"/><rect x="77" y="229" width="28" height="18" rx="3" fill="#8c6c54" stroke="#ffd166" stroke-width="2"/><polygon points="91,233 96.7,243.2 85.3,243.2" fill="#ffd166"/><rect x="107" y="229" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="121" cy="238" r="4.5" fill="#64dce3"/><rect x="137" y="229" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="151" cy="238" r="4.5" fill="#64dce3"/><rect x="47" y="249" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="61" cy="258" r="4.5" fill="#64dce3"/><rect x="77" y="249" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="91" cy="258" r="4.5" fill="#64dce3"/><rect x="107" y="249" width="28" height="18" rx="3" fill="#8c6c54" stroke="#ffd166" stroke-width="2"/><polygon points="121,253 126.7,263.2 115.3,263.2" fill="#ffd166"/><rect x="137" y="249" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="151" cy="258" r="4.5" fill="#64dce3"/><rect x="47" y="269" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="61" cy="278" r="4.5" fill="#64dce3"/><rect x="77" y="269" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="91" cy="278" r="4.5" fill="#64dce3"/><rect x="107" y="269" width="28" height="18" rx="3" fill="#3e5474" stroke="#78419e" stroke-width="1"/><circle cx="121" cy="278" r="4.5" fill="#64dce3"/><rect x="137" y="269" width="28" height="18" rx="3" fill="#8c6c54" stroke="#ffd166" stroke-width="2"/><polygon points="151,273 156.7,283.2 145.3,283.2" fill="#ffd166"/><text x="184" y="240" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">CV interna de cada <tspan font-style="italic">N</tspan></text><text x="184" y="260" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">→ elige <tspan font-style="italic">N̂</tspan>₂ y reajusta</text><text x="184" y="280" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">con los cuatro pliegues</text><text x="40" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">elegir es parte del procedimiento</text><line x1="189.6" y1="146" x2="189.6" y2="112" stroke="#f04cff" stroke-width="2.2" marker-end="url(#p)"/><rect x="392" y="168" width="184" height="128" rx="10" fill="#211033" stroke="#ffd166" stroke-width="2"/><text x="484" y="196" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">afuera:</text><text x="484" y="220" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">la pérdida del elegido</text><text x="484" y="238" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">en el pliegue externo,</text><text x="484" y="256" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">promediada en las cinco</text><text x="484" y="274" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">vueltas externas</text><text x="16" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">Vuelta externa 2; las otras cuatro son iguales, con otro pliegue que mide.</text><text x="16" y="406" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">La prueba sigue cerrada: la anidada usa solo el desarrollo.</text></svg>