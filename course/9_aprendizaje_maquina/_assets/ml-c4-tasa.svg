<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="La tasa de interés de equilibrio crece con la probabilidad anunciada; el cliente típico sin pesos recibe 0.05 y pagaría 0.053; con pesos recibe 0.5 y pagaría cien por ciento"><title>Una probabilidad que se usa como precio</title><desc>La tasa de interés de equilibrio crece con la probabilidad anunciada; el cliente típico sin pesos recibe 0.05 y pagaría 0.053; con pesos recibe 0.5 y pagaría cien por ciento</desc><rect x="0" y="0" width="600" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Una probabilidad que se usa como precio</text><text x="16" y="52" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">tasa de equilibrio = p̂ / (1 − p̂): prestar 1 y cobrar 1 + tasa si paga</text><line x1="80" y1="320" x2="570" y2="320" stroke="#c8b9d8" stroke-width="1.5"/><line x1="80" y1="320" x2="80" y2="80" stroke="#c8b9d8" stroke-width="1.5"/><text x="80" y="340" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0</text><text x="161.7" y="340" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.1</text><text x="243.3" y="340" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.2</text><text x="325" y="340" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.3</text><text x="406.7" y="340" fill="#c8b9d8" font-family="system-ui, sans-