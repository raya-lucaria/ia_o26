<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Línea del tiempo de un pedido: se recibe, sale, llega, el cliente califica. Cinco columnas: tres se conocen antes de predecir (distancia, hora, lluvia) y dos después (minutos reales y calificación)"><title>Cada columna tiene un momento en que se conoce</title><desc>Línea del tiempo de un pedido: se recibe, sale, llega, el cliente califica. Cinco columnas: tres se conocen antes de predecir (distancia, hora, lluvia) y dos después (minutos reales y calificación)</desc><rect x="0" y="0" width="600" height="300" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="28" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Cada columna tiene un momento en que se conoce</text><line x1="24" y1="120" x2="580" y2="120" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><circle cx="60" cy="120" r="6" fill="#f7f2ff"/><text x="60" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">se recibe</text><circle cx="220" cy="120" r="6" fill="#f7f2ff"/><text x="220" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">sale</text><circle cx="360" cy="120" r="6" fill="#f7f2ff"/><text x="360" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">llega</text><circle cx="500" cy="120" r="6" fill="#f7f2ff"/><text x="500" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">el cliente califica</text><line x1="110" y1="60" x2="110" y2="270" stroke="#f04cff" stroke-width="3"/><text x="116" y="72" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start" font-weight="700">aquí se predice</text><rect x="20" y="160" width="80" height="26" rx="6" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="60" y="178" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">distancia</text><rect x="20" y="194" width="80" height="26" rx="6" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="60" y="212" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">hora</text><rect x="20" y="228" width="80" height="26" rx="6" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="60" y="246" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">lluvia</text><text x="60" y="268" fill="#64dce3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">antes</text><line x1="360" y1="126" x2="360" y2="180" stroke="#ff87ad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="298" y="182" width="124" height="28" rx="6" fill="#211033" stroke="#ff87ad" stroke-width="2" stroke-dasharray="6 4"/><text x="360" y="201" fill="#ff87ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">minutos_reales</text><line x1="500" y1="126" x2="500" y2="180" stroke="#ff87ad" stroke-width="1.5" stroke-dasharray="4 3"/><rect x="438" y="182" width="124" height="28" rx="6" fill="#211033" stroke="#ff87ad" stroke-width="2" stroke-dasharray="6 4"/><text x="500" y="201" fill="#ff87ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" text-anchor="middle">calificacion</text><text x="430" y="240" fill="#ff87ad" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="700">después: no existen cuando predices</text></svg>