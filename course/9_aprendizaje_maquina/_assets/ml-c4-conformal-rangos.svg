<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Cinco puntajes de calibración, 0.1, 0.2, 0.4, 0.6 y 0.8, el cuarto menor como corte 0.6, y los tres puntajes de un mensaje nuevo, 0.55, 0.65 y 0.8: solo una clase entra"><title>Cinco puntajes y un corte</title><desc>Cinco puntajes de calibración, 0.1, 0.2, 0.4, 0.6 y 0.8, el cuarto menor como corte 0.6, y los tres puntajes de un mensaje nuevo, 0.55, 0.65 y 0.8: solo una clase entra</desc><rect x="0" y="0" width="600" height="330" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Cinco puntajes y un corte</text><text x="16" y="52" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">δ = 1/3: el ⌈(5 + 1)(1 − δ)⌉ = 4.º menor es el corte</text><line x1="50" y1="130" x2="560" y2="130" stroke="#c8b9d8" stroke-width="2"/><line x1="50" y1="125" x2="50" y2="135" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0</text><line x1="152" y1="125" x2="152" y2="135" stroke="#c8b9d8" stroke-width="1.5"/><text x="152" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.2</text><line x1="254" y1="125" x2="254" y2="135" stroke="#c8b9d8" stroke-width="1.5"/><text x="254" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.4</text><line x1="356" y1="125" x2="356" y2="135" stroke="#c8b9d8" stroke-width="1.5"/><text x="356" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.6</text><line x1="458" y1="125" x2="458" y2="135" stroke="#c8b9d8" stroke-width="1.5"/><text x="458" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.8</text><line x1="560" y1="125" x2="560" y2="135" stroke="#c8b9d8" stroke-width="1.5"/><text x="560" y="154" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1</text><circle cx="101.0" cy="130" r="8" fill="#64dce3"/><text x="101" y="114" fill="#64dce3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1.º</text><circle cx="152.0" cy="130" r="8" fill="#64dce3"/><text x="152" y="114" fill="#64dce3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">2.º</text><circle cx="254.0" cy="130" r="8" fill="#64dce3"/><text x="254" y="114" fill="#64dce3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">3.º</text><circle cx="356.0" cy="130" r="8" fill="#f04cff"/><text x="356" y="114" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">4.º</text><circle cx="458.0" cy="130" r="8" fill="#64dce3"/><text x="458" y="114" fill="#64dce3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">5.º</text><line x1="356" y1="140" x2="356" y2="242" stroke="#f04cff" stroke-width="2" stroke-dasharray="6 4"/><text x="362" y="84" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">ĉ = 0.6</text><text x="16" y="190" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">mensaje nuevo, sus tres puntajes 1 − p̂ᵧ:</text><line x1="50" y1="230" x2="560" y2="230" stroke="#c8b9d8" stroke-width="1"/><rect x="323.5" y="223" width="14" height="14" fill="#a9e88f"/><text x="330.5" y="258" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">clase 0</text><text x="330.5" y="274" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.55</text><rect x="374.5" y="223" width="14" height="14" fill="#7d6d8e"/><text x="381.5" y="258" fill="#7d6d8e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">clase 1</text><text x="381.5" y="274" fill="#7d6d8e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.65</text><rect x="451.0" y="223" width="14" height="14" fill="#7d6d8e"/><text x="458" y="258" fill="#7d6d8e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">clase 2</text><text x="458" y="274" fill="#7d6d8e" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.8</text><text x="16" y="312" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Solo la clase 0 queda a la izquierda del corte: C(x) = {0}.</text></svg>