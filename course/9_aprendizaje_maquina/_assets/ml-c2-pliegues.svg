<svg xmlns="http://www.w3.org/2000/svg" width="600" height="362" viewBox="0 0 600 362" role="img" aria-label="Una rejilla de cinco por cinco: cada fila es una vuelta de la validación cruzada. En la vuelta m, el pliegue m, en oro con triángulo, valida, y los otros cuatro, en cian con círculo, ajustan beta gorro sin el pliegue m. A la derecha de cada fila, la pérdida en su pliegue de validación; una llave junta las cinco en CV 5, su promedio. Aparte, debajo, la prueba, con cuadrado y candado: cerrada, nunca rota. Cada observación de desarrollo valida exactamente una vez."><title>Validación cruzada con cinco pliegues</title><desc>Una rejilla de cinco por cinco: cada fila es una vuelta de la validación cruzada. En la vuelta m, el pliegue m, en oro con triángulo, valida, y los otros cuatro, en cian con círculo, ajustan beta gorro sin el pliegue m. A la derecha de cada fila, la pérdida en su pliegue de validación; una llave junta las cinco en CV 5, su promedio. Aparte, debajo, la prueba, con cuadrado y candado: cerrada, nunca rota. Cada observación de desarrollo valida exactamente una vez.</desc><rect x="0" y="0" width="600" height="362" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Validación cruzada con cinco pliegues</text><text x="16" y="50" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">cada fila es un ajuste completo; la prueba no entra</text><text x="115" y="82" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">1</text><text x="161" y="82" fi