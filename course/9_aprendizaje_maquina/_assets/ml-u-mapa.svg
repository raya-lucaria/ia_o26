<svg xmlns="http://www.w3.org/2000/svg" width="360" height="918" viewBox="0 0 360 918" role="img" aria-label="Mapa de la unidad de aprendizaje de máquina: seis clases en orden. Clase 0, Qué es aprender: repaso · sin notebook. Clase 1, El problema: notebooks 01–02 · tarea 1. Clase 2, Separar los datos: notebooks 03–05 · tarea 2. Clase 3, Leer el error y regularizar: notebooks 06–07 · tarea 3. Clase 4, Clasificación: notebooks 08–09 · tarea 4. Clase 5, Supuestos y metodología: notebook 10 · tareas 5a–5c. En todas: el lagrangeano; siempre contra un benchmark; la muestra enorme: cuánto miente cada cifra."><title>La unidad en seis clases</title><desc>Mapa de la unidad de aprendizaje de máquina: seis clases en orden. Clase 0, Qué es aprender: repaso · sin notebook. Clase 1, El problema: notebooks 01–02 · tarea 1. Clase 2, Separar los datos: notebooks 03–05 · tarea 2. Clase 3, Leer el error y regularizar: notebooks 06–07 · tarea 3. Clase 4, Clasificación: notebooks 08–09 · tarea 4. Clase 5, Supuestos y metodología: notebook 10 · tareas 5a–5c. En todas: el lagrangeano; siempre contra un benchmark; la muestra enorme: cuánto miente cada cifra.</desc><rect x="0" y="0" width="360" height="918" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="start" font-weight="700">La unidad en seis clases</text><text x="16" y="55" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">de qué es aprender a trabajar sin engañarse</text><rect x="16" y="73" width="328" height="100" rx="10" fill="#2e1945" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><circle cx="42" cy="103" r="15" fill="#211033" stroke="#c8b9d8" stroke-width="2"/><text x="42" y="108.5" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">0</text><text x="68" y="99" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">Clase 0</text><text x="68" y="118" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">Qué es aprender</text><text x="30" y="139" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">tarea, experiencia y desempeño;</text><text x="30" y="156" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">supervisado o no supervisado</text><text x="332" y="99" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">repaso · sin notebook</text><line x1="42" y1="175" x2="42" y2="196" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="16" y="199" width="328" height="100" rx="10" fill="#2e1945" stroke="#78419e" stroke-width="2"/><circle cx="42" cy="229" r="15" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="42" y="234.5" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">1</text><text x="68" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">Clase 1</text><text x="68" y="244" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">El problema</text><text x="30" y="265" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">la <tspan font-style="italic">f</tspan> que no vemos: <tspan font-style="italic">y</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">x</tspan>) + ε,</text><text x="30" y="282" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">el error que nadie baja</text><text x="332" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">notebooks 01–02 · tarea 1</text><line x1="42" y1="301" x2="42" y2="322" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="16" y="325" width="328" height="100" rx="10" fill="#2e1945" stroke="#78419e" stroke-width="2"/><circle cx="42" cy="355" r="15" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="42" y="360.5" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">2</text><text x="68" y="351" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">Clase 2</text><text x="68" y="370" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">Separar los datos</text><text x="30" y="391" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">entrenamiento, validación y prueba:</text><text x="30" y="408" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">medir lo que no vemos</text><text x="332" y="351" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">notebooks 03–05 · tarea 2</text><line x1="42" y1="427" x2="42" y2="448" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="16" y="451" width="328" height="100" rx="10" fill="#2e1945" stroke="#78419e" stroke-width="2"/><circle cx="42" cy="481" r="15" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="42" y="486.5" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">3</text><text x="68" y="477" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">Clase 3</text><text x="68" y="496" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">Leer el error y regularizar</text><text x="30" y="517" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">analizar el error; limitar la</text><text x="30" y="534" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">capacidad con un lagrangeano</text><text x="332" y="477" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">notebooks 06–07 · tarea 3</text><line x1="42" y1="553" x2="42" y2="574" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="16" y="577" width="328" height="100" rx="10" fill="#2e1945" stroke="#78419e" stroke-width="2"/><circle cx="42" cy="607" r="15" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="42" y="612.5" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">4</text><text x="68" y="603" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">Clase 4</text><text x="68" y="622" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">Clasificación</text><text x="30" y="643" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">se entrena con una pérdida y se</text><text x="30" y="660" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">juzga con una métrica; desbalanceo</text><text x="332" y="603" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">notebooks 08–09 · tarea 4</text><line x1="42" y1="679" x2="42" y2="700" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="16" y="703" width="328" height="100" rx="10" fill="#2e1945" stroke="#78419e" stroke-width="2"/><circle cx="42" cy="733" r="15" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="42" y="738.5" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">5</text><text x="68" y="729" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="700">Clase 5</text><text x="68" y="748" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="start" font-weight="700">Supuestos y metodología</text><text x="30" y="769" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">¿son iid?, fugas, y un orden de</text><text x="30" y="786" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">trabajo que evita casi todo error</text><text x="332" y="729" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">notebook 10 · tareas 5a–5c</text><text x="16" y="833" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">En todas las clases</text><text x="20" y="858" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">·  el lagrangeano</text><text x="20" y="877" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">·  siempre contra un benchmark</text><text x="20" y="896" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">·  la muestra enorme: cuánto miente cada cifra</text></svg>