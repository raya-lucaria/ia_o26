<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-label="Arriba, todo se ajusta antes de separar: imputar, escalar y elegir variables con todas las filas. Abajo, dentro de cada pliegue: se ajusta con su entrenamiento y se aplica sin reajustar a su validación"><title>Dónde se ajusta cada pieza</title><desc>Arriba, todo se ajusta antes de separar: imputar, escalar y elegir variables con todas las filas. Abajo, dentro de cada pliegue: se ajusta con su entrenamiento y se aplica sin reajustar a su validación</desc><rect x="0" y="0" width="600" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="28" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Dónde se ajusta cada pieza</text><text x="16" y="62" fill="#ff87ad" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">mal: todo se ajusta antes de separar</text><rect x="16" y="76" width="110" height="50" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="71" y="98" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">todas</text><text x="71" y="114" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">las filas</text><rect x="156" y="76" width="150" height="50" rx="8" fill="#2e1945" stroke="#ff87ad" stroke-width="2"/><text x="231" y="98" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">imputar, escalar,</text><text x="231" y="114" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">elegir variables</text><rect x="336" y="76" width="100" height="34" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="386" y="98" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">separar</text><rect x="466" y="76" width="118" height="34" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="525" y="98" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">modelo</text><line x1="128" y1="96" x2="152" y2="96" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="308" y1="96" x2="332" y2="96" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="438" y1="96" x2="462" y2="96" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="16" y="168" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">bien: separar primero; en cada pliegue, ajustar con su entrenamiento</text><rect x="16" y="186" width="100" height="34" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="66" y="208" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">separar</text><rect x="140" y="180" width="444" height="150" rx="12" fill="none" stroke="#a9e88f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="152" y="198" fill="#a9e88f" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">en cada pliegue m</text><rect x="156" y="208" width="120" height="50" rx="8" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="216" y="230" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">entrenamiento</text><text x="216" y="246" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">del pliegue</text><rect x="316" y="208" width="252" height="50" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="442" y="230" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">imputar, escalar, elegir</text><text x="442" y="246" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">variables y el modelo</text><rect x="156" y="280" width="120" height="34" rx="8" fill="#2e1945" stroke="#ffd166" stroke-width="2"/><text x="216" y="302" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">su validación</text><line x1="118" y1="210" x2="152" y2="226" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="278" y1="228" x2="312" y2="228" stroke="#f04cff" stroke-width="2.5" marker-end="url(#p)"/><text x="296" y="252" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">ajustar</text><line x1="440" y1="262" x2="280" y2="296" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)" stroke-dasharray="6 4"/><text x="420" y="300" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">aplicar sin reajustar</text><line x1="24" y1="352" x2="64" y2="352" stroke="#f04cff" stroke-width="2.5"/><text x="70" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">ajustar (sólida)</text><line x1="210" y1="352" x2="250" y2="352" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 4"/><text x="256" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">aplicar (discontinua)</text></svg>