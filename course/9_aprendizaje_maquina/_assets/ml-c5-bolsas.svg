<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-label="Cuatro maneras de sacar bolas: tres sobre la muestra (iid, a puñados, una bolsa que cambia de color) y una sobre el uso (otra bolsa)"><title>Cuatro maneras de sacar bolas</title><desc>Cuatro maneras de sacar bolas: tres sobre la muestra (iid, a puñados, una bolsa que cambia de color) y una sobre el uso (otra bolsa)</desc><rect x="0" y="0" width="600" height="440" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="28" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Cuatro maneras de sacar bolas</text><rect x="10" y="44" width="580" height="236" rx="12" fill="none" stroke="#64dce3" stroke-width="1.5"/><text x="22" y="64" fill="#64dce3" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">¿tu muestra es iid?</text><rect x="10" y="290" width="580" height="140" rx="12" fill="none" stroke="#ffd166" stroke-width="1.5"/><text x="22" y="310" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">¿el uso sale de la misma bolsa?</text><text x="106" y="92" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">(a) iid</text><rect x="54" y="100" width="104" height="80" rx="22" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="70" cy="120" r="7" fill="#ff87ad"/><circle cx="88" cy="120" r="7" fill="#a9e88f"/><circle cx="106" cy="120" r="7" fill="#a9e88f"/><circle cx="124" cy="120" r="7" fill="#ff87ad"/><circle cx="142" cy="120" r="7" fill="#a9e88f"/><circle cx="70" cy="138" r="7" fill="#ff87ad"/><circle cx="88" cy="138" r="7" fill="#a9e88f"/><circle cx="106" cy="138" r="7" fill="#a9e88f"/><circle cx="124" cy="138" r="7" fill="#ff87ad"/><circle cx="142" cy="138" r="7" fill="#a9e88f"/><circle cx="70" cy="156" r="7" fill="#a9e88f"/><circle cx="88" cy="156" r="7" fill="#ff87ad"/><circle cx="106" cy="156" r="7" fill="#a9e88f"/><circle cx="124" cy="156" r="7" fill="#ff87ad"/><circle cx="142" cy="156" r="7" fill="#a9e88f"/><text x="106" y="210" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">cada bola sale de la</text><text x="106" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">misma bolsa y se devuelve</text><text x="300" y="92" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">(c) grupos</text><rect x="248" y="100" width="104" height="80" rx="22" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="264" cy="120" r="7" fill="#ff87ad"/><circle cx="282" cy="120" r="7" fill="#ff87ad"/><circle cx="300" cy="120" r="7" fill="#ff87ad"/><circle cx="318" cy="120" r="7" fill="#a9e88f"/><circle cx="336" cy="120" r="7" fill="#a9e88f"/><circle cx="264" cy="138" r="7" fill="#a9e88f"/><circle cx="282" cy="138" r="7" fill="#a9e88f"/><circle cx="300" cy="138" r="7" fill="#a9e88f"/><circle cx="318" cy="138" r="7" fill="#ff87ad"/><circle cx="336" cy="138" r="7" fill="#ff87ad"/><circle cx="264" cy="156" r="7" fill="#ff87ad"/><circle cx="282" cy="156" r="7" fill="#ff87ad"/><circle cx="300" cy="156" r="7" fill="#a9e88f"/><circle cx="318" cy="156" r="7" fill="#a9e88f"/><circle cx="336" cy="156" r="7" fill="#a9e88f"/><text x="300" y="210" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">se sacan puñados: las de</text><text x="300" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">un puñado se parecen</text><text x="494" y="92" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">(d) tiempo</text><rect x="442" y="100" width="104" height="80" rx="22" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="458" cy="120" r="7" fill="#a9e88f"/><circle cx="476" cy="120" r="7" fill="#a9e88f"/><circle cx="494" cy="120" r="7" fill="#a9e88f"/><circle cx="512" cy="120" r="7" fill="#a9e88f"/><circle cx="530" cy="120" r="7" fill="#a9e88f"/><circle cx="458" cy="138" r="7" fill="#a9e88f"/><circle cx="476" cy="138" r="7" fill="#a9e88f"/><circle cx="494" cy="138" r="7" fill="#ff87ad"/><circle cx="512" cy="138" r="7" fill="#a9e88f"/><circle cx="530" cy="138" r="7" fill="#ff87ad"/><circle cx="458" cy="156" r="7" fill="#ff87ad"/><circle cx="476" cy="156" r="7" fill="#ff87ad"/><circle cx="494" cy="156" r="7" fill="#ff87ad"/><circle cx="512" cy="156" r="7" fill="#ff87ad"/><circle cx="530" cy="156" r="7" fill="#ff87ad"/><text x="494" y="210" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">la bolsa se tiñe poco</text><text x="494" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">a poco: las seguidas</text><text x="494" y="240" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">se parecen</text><text x="578" y="310" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="end" font-weight="700">(b) otra población</text><rect x="118" y="322" width="104" height="80" rx="22" fill="#211033" stroke="#78419e" stroke-width="2"/><circle cx="134" cy="342" r="7" fill="#ff87ad"/><circle cx="152" cy="342" r="7" fill="#a9e88f"/><circle cx="170" cy="342" r="7" fill="#a9e88f"/><circle cx="188" cy="342" r="7" fill="#ff87ad"/><circle cx="206" cy="342" r="7" fill="#a9e88f"/><circle cx="134" cy="360" r="7" fill="#ff87ad"/><circle cx="152" cy="360" r="7" fill="#a9e88f"/><circle cx="170" cy="360" r="7" fill="#a9e88f"/><circle cx="188" cy="360" r="7" fill="#ff87ad"/><circle cx="206" cy="360" r="7" fill="#a9e88f"/><text x="170" y="420" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">tu muestra: puede ser iid</text><rect x="378" y="322" width="104" height="80" rx="22" fill="#211033" stroke="#ffd166" stroke-width="2"/><circle cx="394" cy="342" r="7" fill="#ff87ad"/><circle cx="412" cy="342" r="7" fill="#ff87ad"/><circle cx="430" cy="342" r="7" fill="#ff87ad"/><circle cx="448" cy="342" r="7" fill="#a9e88f"/><circle cx="466" cy="342" r="7" fill="#ff87ad"/><circle cx="394" cy="360" r="7" fill="#ff87ad"/><circle cx="412" cy="360" r="7" fill="#a9e88f"/><circle cx="430" cy="360" r="7" fill="#ff87ad"/><circle cx="448" cy="360" r="7" fill="#ff87ad"/><circle cx="466" cy="360" r="7" fill="#ff87ad"/><text x="430" y="420" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">el uso: otra bolsa, otra mezcla</text><line x1="236" y1="370" x2="364" y2="370" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="300" y="360" fill="#ffd166" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700">≠</text></svg>