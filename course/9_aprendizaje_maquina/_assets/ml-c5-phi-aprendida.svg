<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-label="Arriba, en las clases 1 a 4, la φ la eliges tú; abajo, unidades sigmoides se aprenden; con ellas fijas, la salida es lineal en β"><title>De la φ a mano a la φ aprendida</title><desc>Arriba, en las clases 1 a 4, la φ la eliges tú; abajo, unidades sigmoides se aprenden; con ellas fijas, la salida es lineal en β</desc><rect x="0" y="0" width="600" height="320" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="28" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">De la φ a mano a la φ aprendida</text><text x="16" y="64" fill="#64dce3" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">las clases 1 a 4</text><rect x="24" y="98" width="70" height="50" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="59" y="129" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-style="italic">x</text><line x1="96" y1="123" x2="170" y2="123" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="174" y="84" width="200" height="78" rx="10" fill="#2e1945" stroke="#64dce3" stroke-width="2"/><text x="274" y="104" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" font-weight="700" font-style="italic">φ</text><text x="274" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">polares, potencias,</text><text x="274" y="140" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">dummies</text><text x="274" y="180" fill="#64dce3" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">la eliges tú</text><line x1="376" y1="123" x2="440" y2="123" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="444" y="98" width="140" height="50" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="514" y="129" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">β<tspan>ᵀ</tspan>φ(<tspan font-style="italic">x</tspan>)</text><text x="16" y="188" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" text-anchor="start" font-weight="700">una red</text><rect x="24" y="222" width="70" height="50" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="59" y="253" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-style="italic">x</text><line x1="96" y1="247" x2="170" y2="247" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="174" y="208" width="200" height="78" rx="10" fill="#551f66" stroke="#f04cff" stroke-width="2" stroke-dasharray="6 4"/><text x="274" y="228" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" font-weight="700" font-style="italic">φ</text><text x="274" y="248" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">unidades</text><text x="274" y="264" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">σ(γ₀,ₕ + γₕᵀx)</text><text x="274" y="304" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">se aprende de los datos</text><line x1="376" y1="247" x2="440" y2="247" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="444" y="222" width="140" height="50" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="514" y="253" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">β<tspan>ᵀ</tspan>φ(<tspan font-style="italic">x</tspan>)</text><text x="16" y="306" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">con los γ fijos, la salida es lineal en β</text></svg>