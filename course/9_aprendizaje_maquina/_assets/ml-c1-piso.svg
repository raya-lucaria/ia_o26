<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="667" viewBox="0 0 388.8 432" role="img" aria-label="Riesgo aproximado con 100 000 observaciones de tres predictores contra la línea del piso. Con sigma épsilon igual a 1, el piso es 1: el oráculo f da 0.99, la recta ajustada 1.02 y la media 49.1. Con sigma épsilon igual a 2, el piso es 4: el oráculo da 3.97, la recta 4.10 y la media 52.1. Duplicar sigma cuadruplica el piso. El riesgo verdadero del oráculo es justo el piso; su estimación con 100 000 observaciones puede quedar un poco abajo, a unos dos errores estándar."><title>El piso que nadie baja</title><rect x="0" y="0" width="388.8" height="432" fill="#211033"/>
