iente es <tspan font-style="italic">β</tspan>₀).</text><text x="16" y="374" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Cambia Φ, no el procedimiento de ajuste: <tspan font-style="italic">β</tspan> multiplica columnas calculadas.</text></svg>