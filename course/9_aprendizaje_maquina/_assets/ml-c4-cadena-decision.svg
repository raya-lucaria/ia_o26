<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Del dato a la etiqueta: x, sus columnas phi de x, el puntaje z, la probabilidad p gorro y la etiqueta y gorro. La pérdida se mide en la probabilidad, la métrica en la etiqueta y el umbral tau es una perilla aparte que se elige en validación"><title>Del dato a la etiqueta: tres decisiones</title><desc>Del dato a la etiqueta: x, sus columnas phi de x, el puntaje z, la probabilidad p gorro y la etiqueta y gorro. La pérdida se mide en la probabilidad, la métrica en la etiqueta y el umbral tau es una perilla aparte que se elige en validación</desc><rect x="0" y="0" width="600" height="330" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="16" y="30" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="start" font-weight="700">Del dato a la etiqueta: tres decisiones</text><rect x="16" y="150" width="92" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="62" y="178" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">x</text><text x="62" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">el mensaje</text><rect x="134" y="150" width="92" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="180" y="178" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">φ(x)</text><text x="180" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">sus columnas</text><rect x="252" y="150" width="92" height="60" rx="8" fill="#2e1945" stroke="#78419e" stroke-width="2"/><text x="298" y="178" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">z</text><text x="298" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">el puntaje</text><rect x="370" y="150" width="92" height="60" rx="8" fill="#2e1945" stroke="#f04cff" stroke-width="2"/><text x="416" y="178" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">p̂</text><text x="416" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">probabilidad</text><rect x="488" y="150" width="92" height="60" rx="8" fill="#2e1945" stroke="#f04cff" stroke-width="2"/><text x="534" y="178" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" font-weight="700" font-style="italic">ŷ</text><text x="534" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">la etiqueta</text><line x1="110" y1="180" x2="130" y2="180" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="228" y1="180" x2="248" y2="180" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="346" y1="180" x2="366" y2="180" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="464" y1="180" x2="484" y2="180" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="453" y="232" width="44" height="32" rx="16" fill="#211033" stroke="#ffd166" stroke-width="2"/><text x="475" y="254" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" font-weight="700" font-style="italic">τ</text><line x1="475" y1="232" x2="475" y2="186" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 3"/><text x="475" y="286" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">el umbral: una perilla aparte,</text><text x="475" y="302" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">se elige en validación</text><rect x="360" y="58" width="112" height="50" rx="8" fill="#211033" stroke="#64dce3" stroke-width="2"/><text x="416" y="80" fill="#64dce3" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">la pérdida</text><text x="416" y="98" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">entrenar</text><line x1="416" y1="108" x2="416" y2="148" stroke="#64dce3" stroke-width="2"/><rect x="482" y="58" width="104" height="50" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="534" y="80" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">la métrica</text><text x="534" y="98" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">juzgar</text><line x1="534" y1="108" x2="534" y2="148" stroke="#f04cff" stroke-width="2"/><text x="16" y="312" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Tres objetos que el uso diario llama «predicción».</text></svg>