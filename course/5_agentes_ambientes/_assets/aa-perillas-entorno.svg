<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Siete preguntas para diagnosticar un task environment">
<title>Siete preguntas para diagnosticar un task environment</title>
<desc>Cada eje pregunta qué información, azar, tiempo, dinámica, continuidad, agentes y conocimiento importan.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Siete preguntas para diagnosticar un task environment</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Cada eje pregunta qué información, azar, tiempo, dinámica, continuidad, agentes y conocimiento importan.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="218" width="246" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="203" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿ve todo?</text><path d="M 330 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="340" y="218" width="246" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="463" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿azar o rival?</text><path d="M 590 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="600" y="218" width="246" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="723" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿afecta después?</text><path d="M 850 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="860" y="218" width="246" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="983" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿cambia al pensar?</text><path d="M 1104 260 h 22 v 72 H 94" fill="none" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="80" y="340" width="246" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="203" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿discreto o continuo?</text><path d="M 330 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="340" y="340" width="246" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="463" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿otros deciden?</text><path d="M 590 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="600" y="340" width="246" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="723" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿conoce reglas?</text>
<text x="600" y="488" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>