<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Siete preguntas para diagnosticar un task environment">
<title>Siete preguntas para diagnosticar un task environment</title>
<desc>Cada eje pregunta qué información, azar, tiempo, dinámica, continuidad, agentes y conocimiento importan.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Siete preguntas para diagnosticar un task environment</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Cada eje pregunta qué información, azar, tiempo, dinámica, continuidad, agentes y conocimiento importan.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="148" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿ve todo?</text><path d="M 221 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="229" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="297" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿azar o rival?</text><path d="M 369 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="377" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="445" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿afecta después?</text><path d="M 518 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="526" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="594" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿cambia al pensar?</text><path d="M 666 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="674" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="743" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿discreto o continuo?</text><path d="M 815 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="823" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="891" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿otros deciden?</text><path d="M 963 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="971" y="245" width="137" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="1040" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">¿conoce reglas?</text>
<text x="600" y="445" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>