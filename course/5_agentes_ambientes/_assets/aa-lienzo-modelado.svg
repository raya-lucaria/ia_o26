<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="El lienzo de modelado en diez pasos">
<title>El lienzo de modelado en diez pasos</title>
<desc>Un recorrido de decisión, frontera, observación, acción, dinámica, información oculta, desempeño, diagnóstico y capacidades.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">El lienzo de modelado en diez pasos</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Un recorrido de decisión, frontera, observación, acción, dinámica, información oculta, desempeño, diagnóstico y capacidades.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
