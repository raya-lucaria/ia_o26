<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="El lienzo de modelado en diez pasos">
<title>El lienzo de modelado en diez pasos</title>
<desc>Un recorrido de decisión, frontera, observación, acción, dinámica, información oculta, desempeño, diagnóstico y capacidades.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">El lienzo de modelado en diez pasos</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Un recorrido de decisión, frontera, observación, acción, dinámica, información oculta, desempeño, diagnóstico y capacidades.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="126" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">1 Decisión</text><path d="M 176 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="184" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="230" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">2 Frontera</text><path d="M 280 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="288" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="334" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">3 Entorno</text><path d="M 384 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="392" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="438" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">4 Observa</text><path d="M 488 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="496" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="542" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">5 Actúa</text><path d="M 592 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="600" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="646" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">6 Cambia</text><path d="M 696 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="704" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="750" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">7 No ve</text><path d="M 800 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="808" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="854" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">8 Evalúa</text><path d="M 904 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="912" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="958" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">9 Diagnostica</text><path d="M 1008 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="1016" y="245" width="92" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="1062" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">10 Diseña</text>
<text x="600" y="445" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>