No ve</text><path d="M 486 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="496" y="340" width="194" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="593" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">8 Evalúa</text><path d="M 694 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="704" y="340" width="194" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="801" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">9 Diagnostica</text><path d="M 902 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="912" y="340" width="194" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="1009" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">10 Diseña</text>
<text x="600" y="488" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
