<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Predecir no basta para decidir">
<title>Predecir no basta para decidir</title>
<desc>Una predicción termina en una estimación; un agente cierra un bucle de observación, acción y consecuencias.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Predecir no basta para decidir</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Una predicción termina en una estimación; un agente cierra un bucle de observación, acción y consecuencias.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="218" width="194" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="177" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">entrada</text><path d="M 278 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="288" y="218" width="194" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="385" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">predictor</text><path d="M 486 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="496" y="218" width="194" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="593" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">estimación</text><path d="M 694 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="704" y="218" width="194" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="801" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">observación</text><path d="M 902 260 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="912" y="218" width="194" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="1009" y="266" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">agente</text><path d="M 1104 260 h 22 v 72 H 94" fill="none" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="80" y="340" width="194" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="177" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">acción</text><path d="M 278 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="288" y="340" width="194" height="84" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="385" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">entorno</text><path d="M 486 382 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="496" y="340" width="194" height="84" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="593" y="388" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">nueva observación</text>
<text x="600" y="488" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>