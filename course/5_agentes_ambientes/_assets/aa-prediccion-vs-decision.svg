<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Predecir no basta para decidir">
<title>Predecir no basta para decidir</title>
<desc>Una predicción termina en una estimación; un agente cierra un bucle de observación, acción y consecuencias.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Predecir no basta para decidir</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Una predicción termina en una estimación; un agente cierra un bucle de observación, acción y consecuencias.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="139" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">entrada</text><path d="M 202 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="210" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="269" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">predictor</text><path d="M 332 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="340" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="399" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">estimación</text><path d="M 462 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="470" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="529" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">observación</text><path d="M 592 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="600" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="659" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">agente</text><path d="M 722 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="730" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="789" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">acción</text><path d="M 852 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="860" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="919" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">entorno</text><path d="M 982 293 h 18" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="990" y="245" width="118" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="1049" y="288" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">nueva observación</text>
<text x="600" y="445" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>