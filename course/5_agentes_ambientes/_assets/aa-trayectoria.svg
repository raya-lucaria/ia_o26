<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Política, recompensa inmediata y retorno">
<title>Política, recompensa inmediata y retorno</title>
<desc>La política elige una acción; el entorno produce una recompensa inmediata y un siguiente estado; el retorno agrega consecuencias futuras.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Política, recompensa inmediata y retorno</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">La política elige una acción; el entorno produce una recompensa inmediata y un siguiente estado; el retorno agrega consecuencias futuras.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="245" width="159" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="160" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">estado u observación</text><path d="M 243 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="253" y="245" width="159" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="333" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">política</text><path d="M 417 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="427" y="245" width="159" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="506" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">acción</text><path d="M 590 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="600" y="245" width="159" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="680" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">recompensa inmediata</text><path d="M 763 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="773" y="245" width="159" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="853" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">siguiente estado</text><path d="M 937 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="947" y="245" width="159" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="1026" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">retorno futuro</text>
<text x="600" y="445" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>