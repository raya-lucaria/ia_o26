<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Capacidades de decisión, no una escalera obligatoria">
<title>Capacidades de decisión, no una escalera obligatoria</title>
<desc>Un controlador puede reaccionar, mantener modelo, usar objetivos o utilidad; el aprendizaje puede mejorar todas esas capacidades.</desc>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f7c948"/></marker></defs>
<rect width="1200" height="560" fill="#211033"/>
<text x="600" y="92" text-anchor="middle" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="800">Capacidades de decisión, no una escalera obligatoria</text>
<text x="600" y="140" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="18">Un controlador puede reaccionar, mantener modelo, usar objetivos o utilidad; el aprendizaje puede mejorar todas esas capacidades.</text>
<path d="M100 188 H1100" stroke="#6a3d8d" stroke-width="2"/>
<rect x="80" y="245" width="194" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="177" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">reflejo</text><path d="M 278 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="288" y="245" width="194" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="385" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">modelo</text><path d="M 486 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="496" y="245" width="194" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="593" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">objetivo</text><path d="M 694 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="704" y="245" width="194" height="96" rx="16" fill="#35164d" stroke="#55ddff" stroke-width="3"/><text x="801" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">utilidad</text><path d="M 902 293 h 17" stroke="#f7c948" stroke-width="4" marker-end="url(#flecha)"/><rect x="912" y="245" width="194" height="96" rx="16" fill="#35164d" stroke="#ff4fd8" stroke-width="3"/><text x="1009" y="299" text-anchor="middle" fill="#f7f2ff" font-size="18" font-weight="700">aprendizaje atraviesa</text>
<text x="600" y="445" text-anchor="middle" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17">Primero modela el caso; después nombra la herramienta.</text>
</svg>