content:
  title: Ver y entender el video sobre los límites de las matemáticas
  instructions: >-
    Para esta sesión hay que ver y entender un video de Veritasium sobre los
    límites de las matemáticas y de la computación. Está en dos versiones
    equivalentes, una en inglés y otra doblada al español por el canal oficial:
    eliges la que te deje entender mejor, y puedes apoyarte en subtítulos
    automáticos o en un traductor si te sirve. Son unos 34 minutos densos y la
    condición no es verlo, es entenderlo. Llega a clase pudiendo explicar con
    tus palabras ocho conceptos —máquina de Turing, axioma y teoría aritmética,
    computabilidad, el problema de la parada, diagonalización, los dos teoremas
    de incompletitud de Gödel y los axiomas de Peano—, que son sobre los que
    vamos a discutir. Los dos enlaces, las ocho preguntas completas y dos avisos
    sobre qué NO viene en el video están en la página de la unidad, arriba. No
    hay cuestionario ni nada que entregar.
  due: "2026-08-26"
  status: published
