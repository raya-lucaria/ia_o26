sans-serif" font-size="22" font-weight="normal" text-anchor="middle">1</text><rect x="232" y="310" width="54" height="54" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="259.0" y="346" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">1</text><rect x="286" y="310" width="54" height="54" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="205.0" y="302" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">▼</text><text x="70" y="384" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">dos pasos despues</text><rect x="620" y="92" width="280" height="250" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="760" y="126" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">La tabla de reglas</text><text x="760" y="150" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">es FINITA</text><text x="640" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">si lees 0 → escribe 1, avanza</text><text x="640" y="228" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">si lees 1 → no cambies, avanza</text><text x="640" y="260" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start">si lees ␣ → detente</text><text x="760" y="314" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">La cinta no lo es.</text><text x="480.0" y="405" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Sin intuición, sin comprensión, sin salto: cada paso lo decide una cantidad finita de información local.</text></svg>