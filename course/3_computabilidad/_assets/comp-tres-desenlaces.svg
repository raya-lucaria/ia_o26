<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Una maquina con tres salidas posibles: acepta, rechaza, y cicla para siempre, dibujado como una flecha que vuelve sobre si misma"><rect x="0" y="0" width="900" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Tres desenlaces, no dos</text><rect x="90" y="150" width="150" height="90" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="165" y="186" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">M</text><text x="165" y="214" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">con entrada w</text><line x1="240" y1="195" x2="470" y2="130" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><rect x="480" y="102" width="150" height="56" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="555" y="130" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">acepta</text><text x="660" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">w ∈ L(M)</text><line x1="240" y1="195" x2="470" y2="220" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><rect x="480" y="192" width="150" height="56" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="555" y="220" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">rechaza</text><text x="660" y="224" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">w ∉ L(M)</text><line x1="240" y1="215" x2="470" y2="300" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="480" y="272" width="150" height="56" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="555" y="300" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">cicla</text><path d="M 630 288 C 700 250, 700 350, 630 314" fill="none" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="712" y="304" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">para siempre</text><text x="450.0" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">El tercero es el que hace posible esta unidad. Sin él no habría nada que demostrar.</text></svg>