<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Anatomia de la maquina de Turing: una cinta con tope izquierdo que se pierde hacia la derecha, un cabezal, y un control finito con su tabla de reglas"><rect x="0" y="0" width="960" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="480.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Las tres piezas, y cuál de ellas es infinita</text><rect x="70" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="101.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0</text><rect x="132" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="163.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0</text><rect x="194" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="225.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">1</text><rect x="256" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="287.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">1</text><rect x="318" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="349.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">␣</text><rect x="380" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="411.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">␣</text><rect x="442" y="210" width="62" height="62" rx="4" fill="none" stroke="#78419e" stroke-width="2"/><text x="473.0" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">␣</text><text x="530" y="250" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">· · ·</text><line x1="64" y1="200" x2="64" y2="282" stroke="#f04cff" stroke-width="4"/><text x="58" y="306" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">tope: no hay nada</text><text x="58" y="322" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">a la izquierda</text><text x="442" y="192" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">infinita hacia la derecha</text><path d="M 209.0 194 L 241.0 194 L 225.0 214 z" fill="#f04cff"/><text x="225.0" y="184" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cabezal</text><rect x="660" y="96" width="250" height="86" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="785" y="128" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">control</text><text x="785" y="154" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">la tabla de δ — FINITA</text><line x1="785" y1="186" x2="265.0" y2="180" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><text x="480.0" y="370" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">La tabla de reglas es finita; la cinta no. Ese contraste es la máquina.</text></svg>