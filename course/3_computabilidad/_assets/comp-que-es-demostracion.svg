<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="Axiomas arriba, reglas de inferencia aplicandose, una cadena finita de formulas, y un verificador mecanico palomeando cada paso"><rect x="0" y="0" width="940" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="470.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Una demostración es un objeto finito que se puede revisar a máquina</text><rect x="60" y="84" width="200" height="54" rx="8" fill="none" stroke="#ffd166" stroke-width="2"/><text x="160" y="116" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">los axiomas</text><rect x="60" y="168" width="470" height="42" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="96" y="195" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">φ₁</text><text x="140" y="195" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">es un axioma</text><text x="556" y="195" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">✓</text><rect x="60" y="220" width="470" height="42" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="96" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">φ₂</text><text x="140" y="247" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">es un axioma</text><text x="556" y="247" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">✓</text><rect x="60" y="272" width="470" height="42" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="96" y="299" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">φ₃</text><text x="140" y="299" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de φ₁ y φ₂, modus ponens</text><text x="556" y="299" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">✓</text><rect x="60" y="324" width="470" height="42" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="96" y="351" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">φ₄</text><text x="140" y="351" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de φ₃, generalización</text><text x="556" y="351" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">✓</text><rect x="610" y="168" width="270" height="198" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="745" y="200" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">el verificador</text><text x="745" y="232" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">¿cada renglón es un axioma</text><text x="745" y="250" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">o se sigue de los de arriba</text><text x="745" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">por una regla?</text><text x="745" y="308" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Es DECIDIBLE.</text><text x="745" y="334" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Siempre termina, y no</text><text x="745" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">se equivoca nunca.</text><text x="470.0" y="386" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">De aquí cuelga todo lo que sigue: si revisar una demostración es un cómputo, un programa puede buscarlas.</text></svg>