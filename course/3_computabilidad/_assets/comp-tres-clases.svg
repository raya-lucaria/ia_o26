<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="Tres anillos anidados: los lenguajes decidibles dentro de los reconocibles, y estos dentro de todos los lenguajes, con un ejemplo con nombre en cada region"><rect x="0" y="0" width="880" height="460" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="440.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Tres clases, y las dos son contenciones estrictas</text><ellipse cx="440" cy="250" rx="330" ry="160" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="440" y="108" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">todos los lenguajes</text><ellipse cx="440" cy="250" rx="230" ry="112" fill="none" stroke="#f04cff" stroke-width="2"/><text x="440" y="158" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">reconocibles</text><ellipse cx="440" cy="250" rx="130" ry="64" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="440" y="208" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">decidibles</text><text x="440" y="258" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">0ⁿ1ⁿ</text><text x="440" y="278" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">la máquina de la pág. 2</text><text x="440" y="330" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">HALT</text><text x="440" y="348" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">reconocible, no decidible</text><text x="440" y="392" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">el complemento de HALT</text><text x="440" y="410" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">ni siquiera reconocible</text><text x="440.0" y="440" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Cada anillo tiene un habitante con nombre. Los dos de afuera se ganan en la página 5.</text></svg>