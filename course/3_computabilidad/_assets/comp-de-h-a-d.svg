<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-label="Dos paneles. A la izquierda la maquina H que decidiria el problema de la parada. A la derecha la maquina D, construida con H dentro, un duplicador a la entrada y un inversor a la salida"><rect x="0" y="0" width="980" height="440" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="245" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">1. Lo que H sería</text><text x="715" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">2. Y lo que construimos con ella</text><line x1="490" y1="70" x2="490" y2="400" stroke="#78419e" stroke-width="1" stroke-dasharray="6 6"/><text x="70" y="150" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">⟨M, w⟩</text><line x1="160" y1="145" x2="215" y2="145" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="225" y="110" width="130" height="110" rx="10" fill="none" stroke="#f04cff" stroke-width="3"/><text x="290" y="158" fill="#f04cff" font-family="system-ui, sans-serif" font-size="26" font-weight="600" text-anchor="middle">H</text><text x="290" y="182" fill="#f04cff" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">decide HALT</text><line x1="355" y1="132" x2="410" y2="122" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><text x="420" y="126" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">SÍ</text><line x1="355" y1="198" x2="410" y2="208" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="420" y="212" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">NO</text><rect x="150" y="250" width="280" height="44" rx="22" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="290" y="278" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">y SIEMPRE se detiene</text><text x="290" y="330" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Es la máquina que suponemos</text><text x="290" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">que existe. Todo lo demás</text><text x="290" y="370" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">sale de ahí.</text><text x="530" y="150" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">⟨M⟩</text><line x1="580" y1="145" x2="615" y2="145" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="605" y="92" width="340" height="210" rx="14" fill="none" stroke="#55ddff" stroke-width="3"/><text x="775" y="84" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">D</text><rect x="620" y="120" width="96" height="50" rx="6" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="668" y="142" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">duplica</text><text x="668" y="158" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">⟨M⟩ → M,⟨M⟩</text><line x1="716" y1="145" x2="748" y2="145" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="756" y="112" width="96" height="66" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="804" y="150" fill="#f04cff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">H</text><line x1="852" y1="130" x2="890" y2="122" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><text x="896" y="126" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">SÍ</text><line x1="852" y1="162" x2="890" y2="172" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="896" y="176" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">NO</text><rect x="700" y="208" width="220" height="76" rx="8" fill="none" stroke="#f04cff" stroke-width="2"/><text x="810" y="232" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">el inversor</text><text x="810" y="254" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">SÍ → cicla para siempre</text><text x="810" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">NO → se detiene</text><text x="490.0" y="424" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">D está construida CON H adentro: por eso, si H existiera, D existiría también.</text></svg>