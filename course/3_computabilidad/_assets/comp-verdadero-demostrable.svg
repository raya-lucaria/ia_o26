<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Los teoremas de F estrictamente dentro de las verdades de la aritmetica, con la oracion de Godel marcada en el hueco entre ambas"><rect x="0" y="0" width="900" height="440" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Verdadero y demostrable no son lo mismo</text><ellipse cx="450" cy="240" rx="330" ry="140" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="450" y="116" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">las verdades de la aritmética</text><text x="450" y="136" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">NO son enumerables</text><ellipse cx="390" cy="250" rx="200" ry="88" fill="none" stroke="#55ddff" stroke-width="2"/><text x="390" y="246" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">los teoremas de F</text><text x="390" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">SÍ son enumerables — el «for»</text><circle cx="660" cy="280" r="7" fill="#f04cff"/><text x="660" y="314" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">«P no termina</text><text x="660" y="332" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">con ⟨P⟩»</text><text x="660" y="354" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">verdadera, no demostrable</text><text x="450.0" y="412" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">La contención es ESTRICTA, y esa es la diferencia que importa: una lista puede enumerar los teoremas; ninguna enumera las verdades.</text></svg>