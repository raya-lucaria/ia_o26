ill="#a273d6" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Y │ Y</text><text x="471.0" y="673" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">◀</text><path d="M 776 160 C 700 60, 900 60, 824 160" fill="none" stroke="#a273d6" stroke-width="2.5" marker-end="url(#pt)"/><rect x="765.0" y="92" width="70.0" height="24" rx="5" fill="#211033" stroke="#a273d6" stroke-width="1.2"/><text x="791" y="109" fill="#a273d6" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Y │ Y</text><text x="821.0" y="109" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">▶</text><line x1="832" y1="190" x2="951" y2="190" stroke="#a8ff5a" stroke-width="2.5" marker-end="url(#pv)"/><rect x="856.0" y="176" width="70.0" height="24" rx="5" fill="#211033" stroke="#a8ff5a" stroke-width="1.2"/><text x="882" y="193" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">␣ │ ␣</text><text x="912.0" y="193" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">▶</text><text x="891" y="222" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">fin de cinta</text><line x1="96" y1="470" x2="140" y2="470" stroke="#f7f2ff" stroke-width="2.5" marker-end="url(#pt)"/><text x="60" y="452" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start">empieza aquí</text><circle cx="180" cy="470" r="32" fill="#211033" stroke="#a273d6" stroke-width="2"/><text x="180" y="476" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">q0</text><circle cx="450" cy="370" r="32" fill="#211033" stroke="#a273d6" stroke-width="2"/><text x="450" y="376" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">q1</text><circle cx="450" cy="600" r="32" fill="#211033" stroke="#a273d6" stroke-width="2"/><text x="450" y="606" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">q2</text><circle cx="800" cy="190" r="32" fill="#211033" stroke="#a273d6" stroke-width="2"/><text x="800" y="196" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">q3</text><circle cx="985" cy="190" r="32" fill="#211033" stroke="#a8ff5a" stroke-width="2"/><circle cx="985" cy="190" r="26" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="985" y="196" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">acc</text><text x="180" y="532" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">busca el siguiente</text><text x="180" y="549" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">cero sin tachar</text><text x="490" y="362" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">va a la derecha</text><text x="490" y="379" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">buscando un uno</text><text x="496" y="592" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">regresa a</text><text x="496" y="609" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la izquierda</text><text x="800" y="252" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">verifica que solo</text><text x="800" y="269" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">queden marcas</text><text x="660" y="330" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Falta un estado: qᵣₑⱼ.</text><text x="660" y="350" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Todo lo que no aparece aquí va a él —</text><text x="660" y="370" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">por eso δ es total aunque el dibujo</text><text x="660" y="390" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">se vea incompleto.</text></svg>