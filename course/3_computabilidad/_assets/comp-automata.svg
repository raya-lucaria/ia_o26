 fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">busca el siguiente</text><text x="150" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">cero sin tachar</text><text x="420" y="196" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">va a la derecha</text><text x="420" y="212" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">buscando un uno</text><text x="420" y="356" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">regresa a</text><text x="420" y="372" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">la izquierda</text><text x="690" y="256" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">verifica que solo</text><text x="690" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">queden marcas</text><text x="490.0" y="452" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Falta un estado: q_rej. Todo lo que no aparece aquí va a él — por eso δ es total aunque el dibujo se vea incompleto.</text></svg>