<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-label="Automata de la maquina que decide 0 elevado a n seguido de 1 elevado a n: cinco estados y diez transiciones, cada una etiquetada con el simbolo que lee, el que escribe y la direccion en que se mueve"><rect x="0" y="0" width="1100" height="800" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><defs><marker id="pm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><defs><marker id="pv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8ff5a"/></marker></defs><defs><marker id="pc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55ddff"/></marker></defs><defs><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a273d6"/></marker></defs><text x="300" y="40" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">La máquina de juguete, como autómata</text><rect x="620" y="22" width="452" height="46" rx="8" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="648" y="52" fill="#a273d6" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">0 │ X</text><text x="712" y="52" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="start">▶</text><text x="740" y="45" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lee 0, escribe X, se mueve a la derecha</text><text x="740" y="62" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="start">◀</text><text x="758" y="62" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">es a la izquierda</text><path d="M 178 440 C 214 258, 470 168, 768 180" fill="none" stroke="#f04cff" stroke-width="2.5" marker-end="url(#pm)"/><rect x="265.0" y="202" width="70.0" height="24" rx="5" fill="#211033" stroke="#f04cff" stroke-width="1.2"/><text x="291" y="219" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Y │ Y</text><text x="321.0" y="219" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">▶</text><text x="252" y="240" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">ya no quedan ceros que tachar</text><path d="M 209 452 C 280 412, 350 386, 419 375" fill="none" stroke="#a273d6" stroke-width="2.5" marker-end="url(#pt)"/><rect x="277.0" y="390" width="70.0" height="24" rx="5" fill="#211033" stroke="#a273d6" stroke-width="1.2"/><text x="303" y="407" fill="#a273d6" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">0 │ X</text><text x="333.0" y="407" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">▶</text><path d="M 478 396 C 528 445, 528 525, 478 574" fill="none" stroke="#55ddff" stroke-width="2.5" marker-end="url(#pc)"/><rect x="505.0" y="471" width="70.0" height="24" rx="5" fill="#211033" stroke="#55ddff" stroke-width="1.2"/><text x="531" y="488" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">1 │ Y</text><text x="561.0" y="488" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">◀</text><path d="M 419 588 C 350