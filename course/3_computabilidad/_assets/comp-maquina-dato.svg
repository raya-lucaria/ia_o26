<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="La maquina universal U recibe el codigo de una maquina M junto con una entrada w, y simula M sobre w: el programa entra como dato"><rect x="0" y="0" width="900" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Una sola máquina, y el programa entra como dato</text><rect x="70" y="140" width="200" height="100" rx="8" fill="none" stroke="#ffd166" stroke-width="2"/><text x="170" y="176" fill="#ffd166" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">⟨M, w⟩</text><text x="170" y="204" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">una cadena, nada más</text><text x="170" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">el código de M, y su entrada</text><line x1="270" y1="190" x2="360" y2="190" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="370" y="110" width="300" height="160" rx="12" fill="none" stroke="#f04cff" stroke-width="3"/><text x="520" y="146" fill="#f04cff" font-family="system-ui, sans-serif" font-size="26" font-weight="600" text-anchor="middle">U</text><text x="520" y="172" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">la máquina universal</text><rect x="410" y="190" width="220" height="62" rx="6" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="520" y="216" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">aquí adentro corre M</text><text x="520" y="238" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">paso por paso, sobre w</text><line x1="670" y1="190" x2="760" y2="190" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="830" y="186" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lo mismo que</text><text x="830" y="206" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">habría hecho M</text><text x="450.0" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">No hace falta una máquina por problema: hay una, y el programa es su entrada.</text><text x="450.0" y="356" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Es la computadora de programa almacenado, enunciada en 1936, antes de que existiera ninguna.</text></svg>