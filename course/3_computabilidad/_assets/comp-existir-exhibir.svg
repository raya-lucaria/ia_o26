<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Dos paneles: el argumento de conteo demuestra que existe algun lenguaje indecidible sin exhibir ninguno; la diagonalizacion exhibe uno concreto con nombre"><rect x="0" y="0" width="900" height="340" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Dos demostraciones distintas, y se parecen mucho</text><line x1="450" y1="76" x2="450" y2="286" stroke="#78419e" stroke-width="1" stroke-dasharray="6 6"/><text x="225" y="108" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">El conteo</text><ellipse cx="225" cy="186" rx="115" ry="52" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="8 6"/><text x="225" y="182" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">hay alguno</text><text x="225" y="204" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">ahí dentro</text><text x="225" y="262" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Demuestra que EXISTE.</text><text x="225" y="284" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">No exhibe ninguno.</text><text x="675" y="108" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">La diagonalización</text><rect x="600" y="152" width="150" height="68" rx="10" fill="none" stroke="#f04cff" stroke-width="3"/><text x="675" y="182" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">HALT</text><text x="675" y="204" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">con nombre y apellido</text><text x="675" y="262" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Exhibe UNO concreto.</text><text x="675" y="284" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Y es otra demostración.</text><text x="450.0" y="322" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle">El conteo no demuestra que HALT sea indecidible. Y HALT ni siquiera es típico de esa mayoría: HALT sí es reconocible.</text></svg>