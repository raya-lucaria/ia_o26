<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" role="img" aria-label="El programa P recibiendo su propio codigo: las dos ramas trazadas hasta su conclusion, con el mismo encuadre que la figura del problema de la parada"><rect x="0" y="0" width="980" height="590" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="340" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">¿Qué hace P con su propio código?</text><rect x="240" y="86" width="200" height="110" rx="14" fill="none" stroke="#55ddff" stroke-width="3"/><text x="340" y="138" fill="#55ddff" font-family="system-ui, sans-serif" font-size="26" font-weight="600" text-anchor="middle">P</text><text x="340" y="166" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">con su propio código</text><path d="M 240 141 C 160 141, 160 54, 340 54 C 520 54, 520 141, 440 141" fill="none" stroke="#ffd166" stroke-width="2" marker-end="url(#p)"/><text x="340" y="72" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">⟨P⟩</text><line x1="340" y1="198" x2="190" y2="220" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><rect x="70" y="230" width="270" height="78" rx="8" fill="none" stroke="#f04cff" stroke-width="2"/><text x="205" y="252" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Si suponemos que TERMINA…</text><text x="205" y="274" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">…encontró una demostración de que no termina…</text><text x="205" y="296" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">…y F solo demuestra verdades. Imposible.</text><line x1="340" y1="198" x2="490" y2="316" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><rect x="370" y="326" width="270" height="78" rx="8" fill="none" stroke="#f04cff" stroke-width="2"/><text x="505" y="348" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Luego NO termina…</text><text x="505" y="370" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">…y entonces eso es VERDAD…</text><text x="505" y="392" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">…pero si F lo demostrara, P terminaría.</text><text x="340" y="376" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Hay una verdad que F no demuestra.</text><rect x="200" y="496" width="580" height="52" rx="26" fill="none" stroke="#f04cff" stroke-width="3"/><text x="490" y="528" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">«P no termina con ⟨P⟩» es verdadera, y F no la demuestra</text><text x="490" y="572" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Mismo encuadre que la figura de la parada: es el mismo movimiento.</text></svg>