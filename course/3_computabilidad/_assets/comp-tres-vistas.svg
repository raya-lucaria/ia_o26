<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-label="Tres paneles conectados por flechas: la pregunta '¿es n primo?', la funcion caracteristica que devuelve 0 o 1, y el conjunto de cadenas que la cumplen. Los tres son el mismo objeto"><rect x="0" y="0" width="980" height="340" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="490.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El mismo objeto, visto de tres maneras</text><rect x="50" y="82" width="240" height="170" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="170" y="112" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Una pregunta</text><text x="170" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">«¿es n primo?»</text><text x="170" y="200" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">sí o no, para cada n</text><rect x="370" y="82" width="240" height="170" rx="10" fill="none" stroke="#ffd166" stroke-width="2"/><text x="490" y="112" fill="#ffd166" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Una función</text><text x="490" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">χ(n) = 1  si n es primo</text><text x="490" y="174" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">χ(n) = 0  si no</text><text x="490" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">χ : ℕ → {0,1}</text><rect x="690" y="82" width="240" height="170" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="810" y="112" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Un lenguaje</text><text x="810" y="148" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">{ 10, 11, 101, 111,</text><text x="810" y="174" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">  1011, 1101, … }</text><text x="810" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">L ⊆ Σ*</text><line x1="300" y1="167" x2="360" y2="167" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="620" y1="167" x2="680" y2="167" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="490.0" y="300" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">Por eso «este problema es indecidible» se puede decir sin ambigüedad: un problema de decisión es un conjunto de cadenas.</text></svg>