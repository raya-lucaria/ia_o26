<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="La notacion de configuracion u q v anotada: u es lo que quedo atras, q es el estado, y v empieza en el simbolo que el cabezal esta leyendo"><rect x="0" y="0" width="900" height="300" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="46" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Cómo se lee una configuración</text><text x="250" y="140" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="middle">X0</text><text x="360" y="140" fill="#f04cff" font-family="system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="middle">q₁</text><text x="450" y="140" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="34" font-weight="600" text-anchor="middle">Y1</text><path d="M 210 162 L 210 178 L 292 178 L 292 162" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="251" y="202" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lo que quedó atrás</text><path d="M 410 162 L 410 178 L 496 178 L 496 162" fill="none" stroke="#f7f2ff" stroke-width="2"/><text x="453" y="202" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">desde el cabezal en adelante</text><text x="360" y="96" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el estado</text><line x1="360" y1="104" x2="360" y2="118" stroke="#f04cff" stroke-width="2"/><line x1="440" y1="100" x2="428" y2="126" stroke="#55ddff" stroke-width="2" marker-end="url(#p)"/><text x="470" y="92" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el cabezal lee ESTE símbolo</text><text x="450.0" y="258" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El estado va escrito justo a la izquierda de lo que la máquina está leyendo. No hay más truco que ése.</text></svg>