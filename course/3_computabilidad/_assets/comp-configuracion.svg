<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470" role="img" aria-label="La misma configuracion mostrada de dos maneras: arriba la cinta con el cabezal sobre el primer uno, y abajo escrita como X0 q1 11, con llaves que marcan que quedo atras y que empieza en el cabezal"><rect x="0" y="0" width="940" height="470" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="470.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Una configuración es la cinta, el cabezal y el estado, en una sola línea</text><text x="470.0" y="84" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">1 · La máquina, tal como está</text><rect x="310.0" y="104" width="64" height="64" rx="5" fill="none" stroke="#78419e" stroke-width="2"/><text x="342.0" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">X</text><rect x="374.0" y="104" width="64" height="64" rx="5" fill="none" stroke="#78419e" stroke-width="2"/><text x="406.0" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">0</text><rect x="438.0" y="104" width="64" height="64" rx="5" fill="none" stroke="#f04cff" stroke-width="2"/><text x="470.0" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">1</text><rect x="502.0" y="104" width="64" height="64" rx="5" fill="none" stroke="#78419e" stroke-width="2"/><text x="534.0" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">1</text><rect x="566.0" y="104" width="64" height="64" rx="5" fill="none" stroke="#78419e" stroke-width="2"/><text x="598.0" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">␣</text><path d="M 455.0 82 L 485.0 82 L 470.0 101 z" fill="#f04cff"/><text x="470.0" y="72" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el cabezal está aquí</text><text x="294.0" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">estado </text><text x="294.0" y="166" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="end">q₁</text><text x="470.0" y="246" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2 · Lo mismo, escrito en una línea</text><text x="360" y="300" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="32" font-weight="600" text-anchor="middle">X0</text><text x="452" y="300" fill="#f04cff" font-family="system-ui, sans-serif" font-size="32" font-weight="600" text-anchor="middle">q₁</text><text x="534" y="300" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="32" font-weight="600" text-anchor="middle">11</text><path d="M 328 316 L 328 332 L 392 332 L 392 316" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="360" y="354" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">lo que quedó atrás</text><text x="360" y="372" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(las dos primeras casillas)</text><path d="M 502 316 L 502 332 L 566 332 L 566 316" fill="none" stroke="#f7f2ff" stroke-width="2"/><text x="534" y="354" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">desde el cabezal en adelante</text><text x="534" y="372" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(empieza en el símbolo que lee)</text><text x="452" y="260" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">el estado</text><line x1="452" y1="268" x2="452" y2="282" stroke="#f04cff" stroke-width="2"/><path d="M 470.0 180 C 470.0 230, 516 236, 516 270" fill="none" stroke="#55ddff" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#p)"/><text x="566.0" y="214" fill="#55ddff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">el mismo símbolo</text><text x="470.0" y="416" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle">El estado se escribe justo a la izquierda del símbolo que la máquina está leyendo. No hay más truco que ése.</text><text x="470.0" y="444" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Y esto no es un ejemplo inventado: es el paso 3 de la traza de 0011 que viene más abajo en esta página.</text></svg>