<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="Dos maquinas sobre la misma entrada: el decisor siempre llega a una de dos puertas; el reconocedor tiene una tercera salida que no llega a ninguna parte"><rect x="0" y="0" width="940" height="420" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="470.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">La única diferencia es la promesa de detenerse</text><text x="60" y="86" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">Un DECISOR de L</text><rect x="60" y="100" width="130" height="78" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="125" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">M</text><line x1="190" y1="126" x2="380" y2="116" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><text x="400" y="120" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">acepta</text><line x1="190" y1="152" x2="380" y2="162" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="400" y="166" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">rechaza</text><text x="560" y="142" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">siempre llega a una de las dos</text><text x="60" y="250" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="start">Un RECONOCEDOR de L</text><rect x="60" y="264" width="130" height="78" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="125" y="310" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">M</text><line x1="190" y1="290" x2="380" y2="280" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><text x="400" y="284" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">acepta</text><line x1="190" y1="316" x2="380" y2="326" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="400" y="330" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">rechaza</text><line x1="190" y1="332" x2="380" y2="370" stroke="#f04cff" stroke-width="2" stroke-dasharray="7 6"/><text x="400" y="374" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">cicla — nunca contesta</text><text x="560" y="406" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">¿cuánto espero antes de rendirme?</text><text x="470.0" y="398" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Si la respuesta es «sí», el reconocedor te lo dice. Si es «no», quizá esperas para siempre — y no hay momento en que puedas rendirte con derecho.</text></svg>