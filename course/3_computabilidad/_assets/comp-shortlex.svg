<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="El orden shortlex emparejado con los naturales: cadena vacia a 0, cero a 1, uno a 2, y asi. No es leer la cadena como numero binario"><rect x="0" y="0" width="900" height="360" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Toda cadena tiene su número, y todo número su cadena</text><rect x="90" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="124" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">ε</text><line x1="124" y1="186" x2="124" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="124" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">0</text><rect x="182" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="216" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">0</text><line x1="216" y1="186" x2="216" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="216" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">1</text><rect x="274" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="308" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">1</text><line x1="308" y1="186" x2="308" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="308" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">2</text><rect x="366" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="400" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">00</text><line x1="400" y1="186" x2="400" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="400" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">3</text><rect x="458" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="492" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">01</text><line x1="492" y1="186" x2="492" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="492" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">4</text><rect x="550" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="584" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">10</text><line x1="584" y1="186" x2="584" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="584" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">5</text><rect x="642" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="676" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">11</text><line x1="676" y1="186" x2="676" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="676" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">6</text><rect x="734" y="130" width="68" height="48" rx="6" fill="none" stroke="#78419e" stroke-width="2"/><text x="768" y="162" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">000</text><line x1="768" y1="186" x2="768" y2="216" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="768" y="242" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">7</text><text x="816" y="162" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="start">· · ·</text><rect x="150" y="268" width="600" height="56" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="450" y="292" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">No es «leer la cadena en binario»: eso no sería inyectivo,</text><text x="450" y="312" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">porque 0, 00 y 000 darían todos 0. Es la posición en el orden.</text></svg>