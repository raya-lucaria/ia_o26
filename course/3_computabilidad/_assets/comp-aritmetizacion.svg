<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="Los dos pasos de la aritmetizacion, separados: primero codificar formulas como numeros, que es lo de la pagina 4, y despues representar la relacion como una formula de la aritmetica, que es lo que Godel ademas necesita"><rect x="0" y="0" width="960" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="480.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Codificar no basta: hacen falta dos pasos, no uno</text><rect x="50" y="96" width="230" height="120" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="165" y="128" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">fórmulas y</text><text x="165" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">demostraciones</text><text x="165" y="186" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">objetos de sintaxis</text><line x1="280" y1="156" x2="360" y2="156" stroke="#c8b9d8" stroke-width="2" marker-end="url(#p)"/><text x="320" y="132" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">paso 1</text><text x="320" y="186" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">codificar</text><text x="320" y="202" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(la página 4)</text><rect x="370" y="96" width="200" height="120" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="470" y="146" fill="#55ddff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">números</text><text x="470" y="178" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">⌜φ⌝ = 34517…</text><line x1="570" y1="156" x2="650" y2="156" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><text x="610" y="132" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">paso 2</text><text x="610" y="186" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">representar</text><text x="610" y="202" fill="#f04cff" font-family="system-ui, sans-serif" font-size="11" font-weight="normal" text-anchor="middle">(lo que falta)</text><rect x="660" y="96" width="250" height="120" rx="10" fill="none" stroke="#f04cff" stroke-width="3"/><text x="785" y="134" fill="#f04cff" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Dem(x, y)</text><text x="785" y="162" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">una FÓRMULA de la</text><text x="785" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">aritmética que dice</text><text x="785" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">«x demuestra y»</text><rect x="120" y="264" width="720" height="74" rx="10" fill="none" stroke="#f04cff" stroke-width="2"/><text x="480" y="292" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">El paso 2 funciona porque revisar una demostración es un cómputo,</text><text x="480" y="314" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">y todo cómputo se puede expresar en aritmética. Ese es el teorema que damos por bueno.</text></svg>