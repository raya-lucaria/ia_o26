<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380" role="img" aria-label="El buscador de contradicciones: un programa que enumera demostraciones de F y se detiene si encuentra una de que cero es igual a uno"><rect x="0" y="0" width="940" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="470.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">La consistencia de F es un programa que no termina</text><rect x="60" y="96" width="420" height="180" rx="12" fill="none" stroke="#55ddff" stroke-width="3"/><text x="270" y="128" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">M_F — el buscador de contradicciones</text><text x="90" y="168" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">for p in shortlex:</text><text x="90" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">    if EsDemostracion(p, «0 = 1»):</text><text x="90" y="228" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">        halt</text><text x="270" y="258" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">enumera TODAS las demostraciones de F</text><rect x="530" y="120" width="360" height="64" rx="10" fill="none" stroke="#f04cff" stroke-width="3"/><text x="710" y="148" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">F es consistente</text><text x="710" y="170" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">⟺  este programa nunca se detiene</text><rect x="530" y="208" width="360" height="74" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2"/><text x="710" y="234" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Y el segundo teorema dice:</text><text x="710" y="258" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">F no puede demostrar que no se detiene</text><text x="710" y="276" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">— aunque de hecho no se detenga.</text><text x="470.0" y="340" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle">Con(F) no es una fórmula opaca: es la oración de parada de un programa que cabe en tres renglones.</text></svg>