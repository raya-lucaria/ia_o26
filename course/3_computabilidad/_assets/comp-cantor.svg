<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-label="La tabla de Cantor: una lista supuesta de todas las sucesiones binarias, con la diagonal resaltada y la sucesion nueva que se obtiene cambiando cada digito"><rect x="0" y="0" width="900" height="460" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><text x="450.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">El conteo: hay más funciones que programas</text><text x="450.0" y="72" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Supón que ESTA lista tuviera todas las sucesiones de 0 y 1:</text><text x="226" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f₁</text><rect x="236" y="112" width="32" height="32" rx="4" fill="none" stroke="#f04cff" stroke-width="2"/><text x="252" y="134" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">0</text><text x="294" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="336" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="378" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="420" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="462" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="504" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">…</text><text x="226" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f₂</text><text x="252" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><rect x="278" y="158" width="32" height="32" rx="4" fill="none" stroke="#f04cff" stroke-width="2"/><text x="294" y="180" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="336" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="378" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="420" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="462" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="504" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">…</text><text x="226" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f₃</text><text x="252" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="294" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><rect x="320" y="204" width="32" height="32" rx="4" fill="none" stroke="#f04cff" stroke-width="2"/><text x="336" y="226" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="378" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="420" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="462" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="504" y="226" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">…</text><text x="226" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f₄</text><text x="252" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="294" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="336" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><rect x="362" y="250" width="32" height="32" rx="4" fill="none" stroke="#f04cff" stroke-width="2"/><text x="378" y="272" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="420" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="462" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><text x="504" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">…</text><text x="226" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">f₅</text><text x="252" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="294" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="336" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="378" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">0</text><rect x="404" y="296" width="32" height="32" rx="4" fill="none" stroke="#f04cff" stroke-width="2"/><text x="420" y="318" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">0</text><text x="462" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">1</text><text x="504" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">…</text><text x="226" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">nueva</text><text x="252" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="294" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">0</text><text x="336" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">0</text><text x="378" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">0</text><text x="420" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">1</text><text x="462" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">…</text><text x="532" y="388" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cambia cada dígito de la diagonal</text><text x="450.0" y="420" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">La nueva no puede ser ninguna de la lista: difiere de fᵢ justo en el lugar i.</text><text x="450.0" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Luego no hay lista que las agote — y los programas sí forman una lista.</text></svg>