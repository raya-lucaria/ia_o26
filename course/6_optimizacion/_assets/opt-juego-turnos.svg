<svg xmlns="http://www.w3.org/2000/svg" width="560" height="802" viewBox="0 0 560 802" role="img" aria-label="Árbol de nueve estados. En s0 elegimos Guardar o Sacrificar. El rival responde I o D. Tras Sacrificar y D volvemos a elegir: X lleva a derrota y Y a victoria"><title>Una decisión más después de Sacrificar y D</title><desc>Cuatro estados de decisión y cinco finales, unidos por ocho acciones. s0 es nuestro turno MAX; Guardar lleva a s1 y Sacrificar a s2, ambos del rival MIN. Desde s1, I llega a t1 con utilidad +1 y D a t2 con -1. Desde s2, I llega a t3 con +1 y D a s3, nuestro turno MAX. Desde s3, X llega a t4 con -1 e Y a t5 con +1. Todas las utilidades son nuestras; los estados intermedios no llevan valores anticipados. Una partida sigue un único camino desde s0 hasta una hoja.</desc><rect x="0" y="0" width="560" height="802" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="37" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Una decisión más tras S → D</text><line x1="280" y1="161" x2="120" y2="230" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="126" y="202" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">Guardar</text><line x1="280" y1="161" x2="405" y2="230" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="433" y="202" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">Sacrificar</text><line x1="120" y1="326" x2="60" y2="415" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="61" y="374" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">I</text><line x1="120" y1="326" x2="180" y2="415" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="189" y="374" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">D</text><line x1="405" y1="326" x2="300" y2="415" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="330" y="374" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">I</text><line x1="405" y1="326" x2="455" y2="405" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="480" y="374" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">D</text><line x1="455" y1="501" x2="370" y2="615" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="390" y="568" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">X</text><line x1="455" y1="501" x2="500" y2="615" stroke="#c8b9d8" stroke-width="2.5" marker-end="url(#s)"/><text x="510" y="568" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">Y</text><rect x="193.0" y="70" width="174" height="90" rx="12" fill="#262245" stroke="#55ddff" stroke-width="2"/><text x="280" y="97" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle">s₀ · inicio</text><text x="280" y="125" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Nuestro turno</text><text x="280" y="150" fill="#55ddff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">MAX</text><rect x="33.0" y="235" width="174" height="90" rx="12" fill="#352138" stroke="#ffd166" stroke-width="2"/><text x="120" y="262" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle">s₁</text><text x="120" y="290" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Turno rival</text><text x="120" y="315" fill="#ffd166" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">MIN</text><rect x="318.0" y="235" width="174" height="90" rx="12" fill="#352138" stroke="#ffd166" stroke-width="2"/><text x="405" y="262" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle">s₂</text><text x="405" y="290" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Turno rival</text><text x="405" y="315" fill="#ffd166" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">MIN</text><rect x="368.0" y="410" width="174" height="90" rx="12" fill="#262245" stroke="#55ddff" stroke-width="2"/><text x="455" y="437" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="600" text-anchor="middle">s₃</text><text x="455" y="465" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Nuestro turno</text><text x="455" y="490" fill="#55ddff" font-family="system-ui, sans-serif" font-size="21" font-weight="600" text-anchor="middle">MAX</text><rect x="10.0" y="420" width="100" height="70" rx="10" fill="#2d2637" stroke="#a8ff5a" stroke-width="2"/><text x="60" y="447" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">t₁</text><text x="60" y="476" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">U = +1</text><rect x="130.0" y="420" width="100" height="70" rx="10" fill="#351739" stroke="#ff5a7a" stroke-width="2"/><text x="180" y="447" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">t₂</text><text x="180" y="476" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">U = −1</text><rect x="250.0" y="420" width="100" height="70" rx="10" fill="#2d2637" stroke="#a8ff5a" stroke-width="2"/><text x="300" y="447" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">t₃</text><text x="300" y="476" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">U = +1</text><rect x="320.0" y="620" width="100" height="70" rx="10" fill="#351739" stroke="#ff5a7a" stroke-width="2"/><text x="370" y="647" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">t₄</text><text x="370" y="676" fill="#ff5a7a" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">U = −1</text><rect x="450.0" y="620" width="100" height="70" rx="10" fill="#2d2637" stroke="#a8ff5a" stroke-width="2"/><text x="500" y="647" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">t₅</text><text x="500" y="676" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="23" font-weight="600" text-anchor="middle">U = +1</text><text x="280.0" y="751" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Hojas: utilidad para nosotros</text><text x="280.0" y="785" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Una partida recorre un solo camino.</text></svg>