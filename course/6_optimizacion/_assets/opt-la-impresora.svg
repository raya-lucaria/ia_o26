<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="Tres recursos limitados entran a la impresora, que produce filtros de aire y celdas de agua; el depósito paga créditos por cada pieza"><title>Qué decide la tripulación</title><desc>A la izquierda tres recursos que se gastan y se acaban: horas de impresora, polimero y energia. En medio la impresora, donde se decide cuantos filtros y cuantas celdas hacer. A la derecha el deposito, que paga creditos por cada pieza entregada.</desc><rect x="0" y="0" width="940" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="140" y="44" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">lo que se gasta</text><text x="140" y="64" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">y se acaba</text><rect x="30" y="96" width="220" height="58" rx="10" fill="#373639" stroke="#a8ff5a" stroke-width="2"/><text x="140" y="122" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Horas de impresora</text><text x="140" y="141" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">antes de la parada</text><line x1="254" y1="125" x2="316" y2="200" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><rect x="30" y="172" width="220" height="58" rx="10" fill="#373639" stroke="#a8ff5a" stroke-width="2"/><text x="140" y="198" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Polímero</text><text x="140" y="217" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">kilos en la bodega</text><line x1="254" y1="201" x2="316" y2="201" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><rect x="30" y="248" width="220" height="58" rx="10" fill="#373639" stroke="#a8ff5a" stroke-width="2"/><text x="140" y="274" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Energía</text><text x="140" y="293" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">kilowatt-hora del reactor</text><line x1="254" y1="277" x2="316" y2="200" stroke="#a8ff5a" stroke-width="2" marker-end="url(#p)"/><rect x="320" y="96" width="220" height="214" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="430" y="44" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">lo que se decide</text><text x="430" y="64" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">y es la pregunta</text><text x="430" y="136" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">LA IMPRESORA</text><text x="430" y="176" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿cuántos filtros</text><text x="430" y="200" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">y cuántas celdas</text><text x="430" y="224" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">imprimir con esto?</text><text x="430" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">no se puede todo:</text><text x="430" y="286" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">los tres se acaban</text><line x1="544" y1="203" x2="606" y2="146" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="610" y="116" width="180" height="60" rx="10" fill="#293154" stroke="#55ddff" stroke-width="2"/><text x="700" y="143" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Filtro de aire</text><text x="700" y="162" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">4 créditos</text><line x1="794" y1="146" x2="856" y2="200" stroke="#55ddff" stroke-width="2" marker-end="url(#p)"/><line x1="544" y1="203" x2="606" y2="256" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="610" y="226" width="180" height="60" rx="10" fill="#293154" stroke="#55ddff" stroke-width="2"/><text x="700" y="253" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Celda de agua</text><text x="700" y="272" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3 créditos</text><line x1="794" y1="256" x2="856" y2="200" stroke="#55ddff" stroke-width="2" marker-end="url(#p)"/><text x="700" y="44" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">lo que se entrega</text><rect x="860" y="140" width="60" height="120" rx="10" fill="#452f3b" stroke="#ffd166" stroke-width="2"/><text x="890" y="162" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">D</text><text x="890" y="175" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">E</text><text x="890" y="188" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">P</text><text x="890" y="201" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Ó</text><text x="890" y="214" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">S</text><text x="890" y="227" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">I</text><text x="890" y="240" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">T</text><text x="890" y="253" fill="#ffd166" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">O</text><text x="890" y="292" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">paga</text><text x="890" y="310" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">créditos</text><text x="470.0" y="360" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">3 recursos que se acaban, 2 piezas que se pueden imprimir, 1 total que se quiere lo más grande posible</text></svg>