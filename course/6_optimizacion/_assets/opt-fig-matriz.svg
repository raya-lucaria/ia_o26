<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="510" viewBox="0 0 1020 510" role="img" aria-label="A la izquierda el modelo de la impresora escrito con desigualdades; a la derecha la misma informacion como la terna c, A, b, con el segundo renglon de A recuadrado y rotulado como el polimero y la primera columna recuadrada y rotulada como el filtro"><title>El modelo como terna (c, A, b)</title><desc>Dos bloques unidos por una flecha. El izquierdo tiene el modelo en forma canonica: max 4x1+3x2 sujeto a tres desigualdades de recurso y las dos de no negatividad. El derecho tiene c igual a (4,3), la matriz A de tres renglones y dos columnas, y la columna b con 10, 18 y 18. Un recuadro de trazo continuo marca el segundo renglon de A, que es el del polimero y compara piezas; otro de trazo punteado marca la primera columna, que es el filtro y arma una receta. Los dos se cruzan en la entrada A21, igual a 2, senalada con un circulo.</desc><rect x="0" y="0" width="1020" height="510" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="510.0" y="40" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">un renglón por recurso, una columna por producto</text><text x="175" y="86" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">el modelo escrito</text><rect x="30" y="104" width="290" height="238" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="106" y="150" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="end">max</text><text x="122" y="150" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">4x₁ + 3x₂</text><text x="106" y="198" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="end">s.a.</text><text x="122" y="198" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">x₁ + x₂ ≤ 10</text><text x="122" y="230" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">2x₁ + x₂ ≤ 18</text><text x="122" y="262" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">x₁ + 2x₂ ≤ 18</text><text x="122" y="310" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">x₁ ≥ 0, x₂ ≥ 0</text><text x="396" y="222" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">es exactamente</text><line x1="358" y1="238" x2="434" y2="238" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="700" y="86" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">la terna (c, A, b)</text><text x="706" y="158" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">c = (4, 3)</text><text x="706" y="190" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">A</text><path d="M 646 200 L 636 200 L 636 362 L 646 362" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 766 200 L 776 200 L 776 362 L 766 362" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="677" y="241" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">1</text><text x="735" y="241" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">1</text><text x="677" y="287" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">2</text><text x="735" y="287" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">1</text><text x="677" y="333" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">1</text><text x="735" y="333" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">2</text><text x="885" y="190" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">b</text><path d="M 854 200 L 844 200 L 844 362 L 854 362" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 916 200 L 926 200 L 926 362 L 916 362" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="885" y="241" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">10</text><text x="885" y="287" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">18</text><text x="885" y="333" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="normal" text-anchor="middle">18</text><rect x="644" y="206" width="66" height="150" rx="8" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="677" y1="360" x2="677" y2="376" stroke="#ffd166" stroke-width="2" stroke-dasharray="4 4"/><text x="677" y="396" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">columna 1 = el filtro</text><text x="677" y="414" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">arma una receta</text><rect x="642" y="254" width="128" height="54" rx="8" fill="none" stroke="#55ddff" stroke-width="2.5"/><text x="614" y="275" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">renglón 2 = el polímero</text><text x="614" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">compara piezas</text><circle cx="677" cy="281" r="17" fill="none" stroke="#c8b9d8" stroke-width="1.5"/><text x="510.0" y="468" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">A₂₁ = 2 está en los dos recorridos: por eso la misma tabla contesta las dos preguntas</text></svg>