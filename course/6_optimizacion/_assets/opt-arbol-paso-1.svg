<svg xmlns="http://www.w3.org/2000/svg" width="700" height="486" viewBox="0 0 700 486" role="img" aria-label="Nodo 1, raíz: dividido, cota 21. x₂ ≥ 2: siguiente, relajación sin resolver. x₂ ≤ 1: pendiente, relajación sin resolver."><title>Árbol después del paso 1</title><desc>Nodo 1, raíz: dividido, cota 21. x₂ ≥ 2: siguiente, relajación sin resolver. x₂ ≤ 1: pendiente, relajación sin resolver.</desc><rect x="0" y="0" width="700" height="486" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="29" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Árbol después del paso 1</text><line x1="350" y1="202" x2="560" y2="254" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="350" y1="202" x2="230" y2="254" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="252.0" y="68" width="196" height="134" rx="10" fill="#262447" stroke="#55ddff" stroke-width="2"/><text x="350" y="91" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">[1] Taller original</text><text x="350" y="113" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Problema 1 de la bitácora</text><text x="350" y="137" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DIVIDIDO</text><text x="350" y="160" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cota = 21</text><text x="350" y="183" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">óptimo relajado: (3, 3/2)</text><rect x="462.0" y="258" width="196" height="134" rx="10" fill="#372338" stroke="#ffd166" stroke-width="3" stroke-dasharray="7 4"/><text x="560" y="281" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">x₂ ≥ 2</text><text x="560" y="303" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">más restricciones del P1</text><text x="560" y="327" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SIGUIENTE</text><text x="560" y="352" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">relajación sin resolver</text><rect x="132.0" y="258" width="196" height="134" rx="10" fill="#322144" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="7 4"/><text x="230" y="281" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">x₂ ≤ 1</text><text x="230" y="303" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">más restricciones del P1</text><text x="230" y="327" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PENDIENTE</text><text x="230" y="352" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">relajación sin resolver</text><text x="350.0" y="436" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Mejor solución entera guardada: ninguna</text><text x="350.0" y="462" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Cada nodo conserva las restricciones del taller y las de su camino.</text></svg>