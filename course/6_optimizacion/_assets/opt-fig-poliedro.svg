<svg xmlns="http://www.w3.org/2000/svg" width="940" height="610" viewBox="0 0 940 610" role="img" aria-label="El poliedro de tres piezas en proyección, con sus ocho vértices rotulados; el óptimo (5,2,3) marcado con un punto lleno y el plan de la clase 1, (8,2,0), con un anillo"><title>El poliedro de la impresora con sello</title><desc>Cuerpo de ocho vertices y doce aristas. Las tres caras de recurso —horas, polimero y energia— quedan de frente y estan sombreadas; las tres aristas que salen del origen quedan detras y van punteadas. Los ocho vertices son (0,0,0), (0,9,0), (0,0,6), (2,8,0), (9,0,0), (8,2,0), (9/2,0,9/2) y (5,2,3). El optimo (5,2,3) vale 41 y el plan de la clase 1, (8,2,0), vale 38.</desc><rect x="0" y="0" width="940" height="610" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="470.0" y="40" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">ocho vértices y doce aristas: el terreno con tres piezas</text><path d="M 382.0 133.8 L 568.1 409.7 L 399.2 422.0 Z" fill="#38393a" stroke="none"/><text x="449.7800790569684" y="326.8342952744722" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">horas</text><path d="M 399.2 422.0 L 568.1 409.7 L 599.1 483.4 L 345.8 502.0 Z" fill="#2a3356" stroke="none"/><text x="478.06179982491403" y="459.281878436829" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">polímero</text><path d="M 320.0 69.7 L 382.0 133.8 L 399.2 422.0 L 345.8 502.0 L 168.4 453.7 Z" fill="#47313c" stroke="none"/><text x="247.1009399420692" y="229.25345190189057" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">energía</text><line x1="599.0845947862242" y1="483.4357089554712" x2="320.0" y2="320.0" stroke="#7d6d8e" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="168.3984917210634" y1="453.72012550902195" x2="320.0" y2="320.0" stroke="#7d6d8e" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="320.0" y1="69.68748110734012" x2="320.0" y2="320.0" stroke="#7d6d8e" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="399.2462429639896" y1="422.032674642515" x2="345.84116618390965" y2="502.0079486095021" stroke="#c8b9d8" stroke-width="2.4"/><line x1="399.2462429639896" y1="422.032674642515" x2="568.0751953655326" y2="409.6511815398278" stroke="#c8b9d8" stroke-width="2.4"/><line x1="399.2462429639896" y1="422.032674642515" x2="382.01879884138316" y2="133.8190296410737" stroke="#c8b9d8" stroke-width="2.4"/><line x1="345.84116618390965" y1="502.0079486095021" x2="599.0845947862242" y2="483.4357089554712" stroke="#c8b9d8" stroke-width="2.4"/><line x1="345.84116618390965" y1="502.0079486095021" x2="168.3984917210634" y2="453.72012550902195" stroke="#c8b9d8" stroke-width="2.4"/><line x1="568.0751953655326" y1="409.6511815398278" x2="599.0845947862242" y2="483.4357089554712" stroke="#c8b9d8" stroke-width="2.4"/><line x1="568.0751953655326" y1="409.6511815398278" x2="382.01879884138316" y2="133.8190296410737" stroke="#c8b9d8" stroke-width="2.4"/><line x1="382.01879884138316" y1="133.8190296410737" x2="320.0" y2="69.68748110734012" stroke="#c8b9d8" stroke-width="2.4"/><line x1="168.3984917210634" y1="453.72012550902195" x2="320.0" y2="69.68748110734012" stroke="#c8b9d8" stroke-width="2.4"/><text x="502.4507568717345" y="392.06142537328276" fill="#a797b7" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">x₁ filtros</text><text x="242.0" y="169.81248866440407" fill="#a797b7" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">x₂ celdas</text><text x="249.03909503263804" y="426.23207530541316" fill="#a797b7" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">x₃ sellos</text><circle cx="399.2462429639896" cy="422.032674642515" r="9" fill="#f04cff"/><text x="369.2462429639896" y="398.032674642515" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">(5, 2, 3) = 41</text><text x="369.2462429639896" y="416.032674642515" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">el óptimo</text><circle cx="345.84116618390965" cy="502.0079486095021" r="5" fill="#f7f2ff"/><text x="345.84116618390965" y="536.0079486095021" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">(9/2, 0, 9/2)</text><circle cx="568.0751953655326" cy="409.6511815398278" r="8" fill="#211033" stroke="#f7f2ff" stroke-width="3"/><text x="586.0751953655326" y="405.6511815398278" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">(8, 2, 0) = 38</text><text x="586.0751953655326" y="423.6511815398278" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">el plan de la clase 1</text><circle cx="599.0845947862242" cy="483.4357089554712" r="5" fill="#f7f2ff"/><text x="615.0845947862242" y="503.4357089554712" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(9, 0, 0)</text><circle cx="382.01879884138316" cy="133.8190296410737" r="5" fill="#f7f2ff"/><text x="368.01879884138316" y="127.81902964107371" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">(2, 8, 0)</text><circle cx="168.3984917210634" cy="453.72012550902195" r="5" fill="#f7f2ff"/><text x="154.3984917210634" y="459.72012550902195" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">(0, 0, 6)</text><circle cx="320.0" cy="69.68748110734012" r="5" fill="#f7f2ff"/><text x="336.0" y="75.68748110734012" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(0, 9, 0)</text><circle cx="320.0" cy="320.0" r="5" fill="#f7f2ff"/><text x="306.0" y="306.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">(0, 0, 0)</text><rect x="660" y="78" width="250" height="104" rx="10" fill="#2f1844" stroke="#c8b9d8" stroke-width="2"/><rect x="674" y="91" width="22" height="4" rx="2" fill="#a8ff5a"/><text x="706" y="97" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">x₁ + x₂ + x₃ ≤ 10   horas</text><rect x="674" y="117" width="22" height="4" rx="2" fill="#55ddff"/><text x="706" y="123" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">2x₁ + x₂ + 2x₃ ≤ 18   polímero</text><rect x="674" y="143" width="22" height="4" rx="2" fill="#ffd166"/><text x="706" y="149" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">x₁ + 2x₂ + 3x₃ ≤ 18   energía</text><rect x="660" y="206" width="250" height="142" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="674" y="232" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la línea punteada pasa por detrás:</text><text x="674" y="251" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">son las tres aristas del origen,</text><text x="674" y="270" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">que es la esquina de atrás.</text><text x="674" y="308" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la cara x₃ = 0 es el polígono</text><text x="674" y="327" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">de la clase 1, y aquí queda detrás.</text><text x="470.0" y="578" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">en tres dimensiones un vértice es donde se cortan tres planos, no dos</text></svg>