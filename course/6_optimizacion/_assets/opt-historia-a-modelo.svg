<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Dos columnas: a la izquierda las frases de la bitacora, a la derecha la desigualdad que produce cada una; el ultimo renglón tiene la columna izquierda vacía"><title>De la frase a la desigualdad</title><desc>Cinco renglones. Los cuatro primeros llevan una frase de la bitacora y su traduccion. El quinto tiene la izquierda vacia porque la no negatividad no la dice nadie.</desc><rect x="0" y="0" width="900" height="380" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="230" y="44" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Lo que dice la bitácora</text><text x="700" y="44" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Lo que se escribe</text><rect x="40" y="70" width="380" height="44" rx="10" fill="#311946" stroke="#78419e" stroke-width="2"/><text x="58" y="98" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cuatro créditos por filtro, tres por celda</text><line x1="430" y1="92" x2="500" y2="92" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="510" y="70" width="350" height="44" rx="10" fill="none" stroke="#ffd166" stroke-width="2"/><text x="685" y="98" fill="#ffd166" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">max 4x₁ + 3x₂</text><rect x="40" y="128" width="380" height="44" rx="10" fill="#311946" stroke="#78419e" stroke-width="2"/><text x="58" y="156" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">diez horas, y cada pieza se lleva una</text><line x1="430" y1="150" x2="500" y2="150" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="510" y="128" width="350" height="44" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="685" y="156" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">x₁ + x₂ ≤ 10</text><rect x="40" y="186" width="380" height="44" rx="10" fill="#311946" stroke="#78419e" stroke-width="2"/><text x="58" y="214" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">dieciocho kilos; el filtro dos, la celda uno</text><line x1="430" y1="208" x2="500" y2="208" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="510" y="186" width="350" height="44" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="685" y="214" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">2x₁ + x₂ ≤ 18</text><rect x="40" y="244" width="380" height="44" rx="10" fill="#311946" stroke="#78419e" stroke-width="2"/><text x="58" y="272" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el filtro gasta uno, la celda dos</text><line x1="430" y1="266" x2="500" y2="266" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="510" y="244" width="350" height="44" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><text x="685" y="272" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">x₁ + 2x₂ ≤ 18</text><rect x="40" y="302" width="380" height="44" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="5 5"/><text x="230" y="330" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">(nadie lo dice)</text><line x1="430" y1="324" x2="500" y2="324" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="510" y="302" width="350" height="44" rx="10" fill="none" stroke="#55ddff" stroke-width="2"/><text x="685" y="330" fill="#55ddff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="middle">x₁ ≥ 0,  x₂ ≥ 0</text></svg>