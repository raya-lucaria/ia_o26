<svg xmlns="http://www.w3.org/2000/svg" width="560" height="652" viewBox="0 0 560 652" role="img" aria-label="Tiempos de entrega observados, recta de ejemplo y residuos verticales"><title>Una predicción y su residuo</title><desc>Distancia en kilómetros, tiempo en minutos. Seis observaciones en x=1,2,3,4,5,6 con tiempos 15,17,23,25,31,33. La recta elegida y estimada=10+4x es un ejemplo, no la recta óptima de mínimos cuadrados. Los residuos observado menos predicho son 1,-1,1,-1,1,-1 minutos. Se destaca el tercer residuo: 23 menos 22 es un minuto.</desc><rect x="0" y="0" width="560" height="652" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Una predicción y su residuo</text><text x="280.0" y="73" fill="#f04cff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">Recta de ejemplo: ŷ = 10 + 4x</text><text x="280.0" y="109" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Recta elegida para ilustrar los residuos.</text><g transform="rotate(-90 26 320)"><text x="26" y="320" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Tiempo de entrega (min)</text></g><line x1="110" y1="470.0" x2="514" y2="470.0" stroke="#78419e" stroke-width="1"/><text x="96" y="477.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">10</text><line x1="110" y1="412.3076923076923" x2="514" y2="412.3076923076923" stroke="#78419e" stroke-wi