<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Siete pasos en dos bloques: cuatro para construir el modelo y tres para revisarlo, con una flecha de regreso del segundo al primero"><title>El lienzo de modelado</title><desc>Bloque de construir con los pasos que decido, que se, que quiero y que no puedo. Bloque de revisar con las unidades, la solucion tonta y la forma. Una flecha regresa del segundo bloque al primero.</desc><rect x="0" y="0" width="900" height="400" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><rect x="40" y="60" width="360" height="292" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="220" y="48" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Construir</text><rect x="60" y="96" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="84" cy="118" r="13" fill="#f04cff"/><text x="84" y="123" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="108" y="123" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Qué decido?</text><rect x="60" y="154" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="84" cy="176" r="13" fill="#f04cff"/><text x="84" y="181" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="108" y="181" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Qué sé?</text><rect x="60" y="212" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="84" cy="234" r="13" fill="#f04cff"/><text x="84" y="239" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="108" y="239" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Qué quiero?</text><rect x="60" y="270" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="84" cy="292" r="13" fill="#f04cff"/><text x="84" y="297" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="108" y="297" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Qué no puedo?</text><rect x="500" y="60" width="360" height="234" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="680" y="48" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Revisar</text><rect x="520" y="96" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="544" cy="118" r="13" fill="#f04cff"/><text x="544" y="123" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="568" y="123" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Cuadran las unidades?</text><rect x="520" y="154" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="544" cy="176" r="13" fill="#f04cff"/><text x="544" y="181" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="568" y="181" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Hay una tonta, y ninguna absurda?</text><rect x="520" y="212" width="320" height="44" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><circle cx="544" cy="234" r="13" fill="#f04cff"/><text x="544" y="239" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">7</text><text x="568" y="239" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">¿Qué forma tiene?</text><line x1="400" y1="140" x2="500" y2="140" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="450" y="128" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">se construye</text><line x1="500" y1="330" x2="400" y2="330" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="450" y="352" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">si algo no cuadra, vuelves</text></svg>