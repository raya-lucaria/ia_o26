<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-label="Diagrama de flujo de ramificar y acotar, de la entrada a la salida: inicializar la mejor solucion, meter el problema original en la lista de nodos vivos, y repetir un ciclo que saca un nodo, lo descarta si su relajacion es infactible o si su cota no supera a la mejor solucion, lo guarda si la relajacion salio entera, y si no lo parte en dos por una variable fraccionaria; cuando la lista se vacia devuelve la mejor solucion"><title>Ramificar y acotar, paso a paso</title><desc>Doce pasos en una columna. Los paralelogramos son la entrada y la salida, los rectangulos son calculos y los rombos son decisiones. Tres caminos vuelven al ciclo: las dos podas por la izquierda y, tras guardar o partir, tambien por la izquierda. Un carril a la derecha lleva a la salida cuando la lista de nodos vivos queda vacia.</desc><rect x="0" y="0" width="1000" height="1240" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><polygon points="242.0,56.0 640.0,56.0 618.0,108.0 220.0,108.0" fill="#393b3a" stroke="#648846" stroke-width="2"/><text x="256" y="62" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[ENTRADA]</text><text x="430" y="90" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">c, A, b, l, u</text><rect x="220" y="134" width="420" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="234" y="154" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L1]</text><text x="444" y="166" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">mejor ← −∞ ;   x* ← «ninguno»</text><rect x="220" y="199" width="420" height="74" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="234" y="219" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L2]</text><text x="444" y="242" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">L ← { el problema original }</text><text x="444" y="262" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">L es la lista de nodos vivos</text><polygon points="430,290 630,336 430,382 230,336" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="288" y="340" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L3]</text><text x="458" y="342" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿L ≠ { } ?</text><rect x="220" y="408" width="420" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="234" y="428" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L4]</text><text x="444" y="440" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">P ← saca un nodo de L</text><polygon points="430,486 630,532 430,578 230,532" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="288" y="536" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L5]</text><text x="458" y="538" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿la relajación de P es factible?</text><rect x="220" y="604" width="420" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="234" y="624" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L6]</text><text x="444" y="636" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">x̄, z̄ ← óptimo de la relajación</text><polygon points="430,682 630,728 430,774 230,728" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="288" y="732" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L7]</text><text x="458" y="734" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿z̄ &gt; mejor?</text><polygon points="430,792 630,838 430,884 230,838" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="288" y="842" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L8]</text><text x="458" y="844" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿x̄ es entera?</text><rect x="220" y="922" width="420" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="234" y="942" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L9]</text><text x="444" y="954" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">mejor ← z̄ ;   x* ← x̄</text><rect x="220" y="1024" width="420" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="234" y="1044" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L10–L11]</text><text x="444" y="1056" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">parte en xⱼ ≤ ⌊x̄ⱼ⌋  y  xⱼ ≥ ⌈x̄ⱼ⌉</text><polygon points="242.0,1110.0 640.0,1110.0 618.0,1170.0 220.0,1170.0" fill="#393b3a" stroke="#648846" stroke-width="2"/><text x="256" y="1120" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L13]</text><text x="430" y="1140" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">devuelve x*, mejor</text><text x="430" y="1162" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">«no hay factible» si x* = «ninguno»</text><line x1="430" y1="108" x2="430" y2="132" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="186" x2="430" y2="210" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="264" x2="430" y2="288" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="382" x2="430" y2="406" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="460" x2="430" y2="484" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="578" x2="430" y2="602" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="656" x2="430" y2="680" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="774" x2="430" y2="790" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="430" y1="884" x2="430" y2="920" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="448" y="786" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><text x="448" y="896" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><text x="448" y="602" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><line x1="230" y1="532" x2="90" y2="532" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="218" y="522" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">no</text><text x="100" y="552" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">poda por infactibilidad</text><line x1="230" y1="728" x2="90" y2="728" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="218" y="718" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">no</text><text x="100" y="748" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">poda por cota</text><line x1="220" y1="948" x2="90" y2="948" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="220" y1="1050" x2="90" y2="1050" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90" y1="1050" x2="90" y2="336" stroke="#c8b9d8" stroke-width="2"/><line x1="90" y1="336" x2="230" y2="336" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="100" y="310" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">vuelve al ciclo</text><line x1="630" y1="838" x2="770" y2="838" stroke="#c8b9d8" stroke-width="2"/><text x="642" y="828" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no</text><line x1="770" y1="838" x2="770" y2="1050" stroke="#c8b9d8" stroke-width="2"/><line x1="770" y1="1050" x2="640" y2="1050" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="630" y1="336" x2="910" y2="336" stroke="#c8b9d8" stroke-width="2"/><text x="642" y="326" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no</text><line x1="910" y1="336" x2="910" y2="1140" stroke="#c8b9d8" stroke-width="2"/><line x1="910" y1="1140" x2="629" y2="1140" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="430" y="1215" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">una lista, tres formas de cerrar una rama, y una salida</text></svg>