<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-label="El polígono de la clase 1 con las cinco esquinas rotuladas con su valor y dos flechas que van del origen a (9,0) y de ahí a (8,2)"><title>El camino de simplex, de esquina en esquina</title><desc>El poligono de cinco esquinas de la clase 1. Las esquinas valen (0,0)=0, (9,0)=36, (8,2)=38, (2,8)=32 y (0,9)=27. Dos flechas gruesas marcan el camino: del origen a (9,0), primer pivote, y de (9,0) a (8,2), segundo pivote. Las tres esquinas visitadas van con punto lleno y las dos que nadie visito con aro hueco. En (8,2) los dos vecinos valen 36 y 32, los dos menos que 38, y ahi para.</desc><rect x="0" y="0" width="820" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><path d="M 90.0 460.0 L 396.0 460.0 L 362.0 392.0 L 158.0 188.0 L 90.0 154.0 Z" fill="#461b58" stroke="#9686a6" stroke-width="2"/><line x1="90.0" y1="460.0" x2="90.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="460.0" x2="430.0" y2="460.0" stroke="#44245e" stroke-width="1"/><line x1="158.0" y1="460.0" x2="158.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="392.0" x2="430.0" y2="392.0" stroke="#44245e" stroke-width="1"/><line x1="226.0" y1="460.0" x2="226.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="324.0" x2="430.0" y2="324.0" stroke="#44245e" stroke-width="1"/><line x1="294.0" y1="460.0" x2="294.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="256.0" x2="430.0" y2="256.0" stroke="#44245e" stroke-width="1"/><line x1="362.0" y1="460.0" x2="362.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="188.0" x2="430.0" y2="188.0" stroke="#44245e" stroke-width="1"/><line x1="430.0" y1="460.0" x2="430.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="120.0" x2="430.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="460.0" x2="446.0" y2="460.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90.0" y1="460.0" x2="90.0" y2="136.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="460.0" y="466.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">x₁</text><text x="112.0" y="100.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">x₂</text><text x="158.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text x="78.0" y="397.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><text x="226.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><text x="78.0" y="329.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><text x="294.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text x="78.0" y="261.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">6</text><text x="362.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><text x="78.0" y="193.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">8</text><text x="430.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><text x="78.0" y="125.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><line x1="100.0" y1="460.0" x2="386.0" y2="460.0" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><line x1="391.5278640450004" y1="451.05572809000085" x2="370.4970583144992" y2="408.9941166289984" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><text x="243.0" y="446.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">pivote 1</text><text x="426.0" y="430.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">pivote 2</text><circle cx="90.0" cy="460.0" r="6" fill="#f04cff"/><text x="102.0" y="508.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(0, 0) = 0</text><circle cx="396.0" cy="460.0" r="6" fill="#f04cff"/><text x="396.0" y="508.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">(9, 0) = 36</text><circle cx="362.0" cy="392.0" r="9" fill="#f04cff"/><circle cx="362.0" cy="392.0" r="15" fill="none" stroke="#f04cff" stroke-width="2.5"/><text x="382.0" y="378.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">(8, 2) = 38</text><circle cx="158.0" cy="188.0" r="6" fill="#211033" stroke="#c8b9d8" stroke-width="2.5"/><text x="174.0" y="172.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(2, 8) = 32</text><circle cx="90.0" cy="154.0" r="6" fill="#211033" stroke="#c8b9d8" stroke-width="2.5"/><text x="106.0" y="138.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(0, 9) = 27</text><text x="410.0" y="34" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">desde el origen: dos pivotes y tres esquinas de cinco</text><rect x="506" y="66" width="280" height="78" rx="10" fill="#2f1844" stroke="#c8b9d8" stroke-width="2"/><circle cx="530" cy="96" r="6" fill="#f04cff"/><text x="556" y="101" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">esquina visitada</text><circle cx="530" cy="124" r="6" fill="#211033" stroke="#c8b9d8" stroke-width="2.5"/><text x="556" y="129" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">esquina que nadie miró</text><rect x="506" y="190" width="280" height="132" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="522" y="216" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">en (8, 2) los dos vecinos valen</text><text x="522" y="235" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">36 y 32: ninguno mejora, y ahí</text><text x="522" y="254" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">para el método.</text><text x="522" y="292" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">las dos esquinas huecas nunca</text><text x="522" y="311" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">se miraron, y ninguna ganaba.</text></svg>