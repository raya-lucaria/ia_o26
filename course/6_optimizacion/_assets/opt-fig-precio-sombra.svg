<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-label="El polígono de la clase 1 con la recta de las horas en tres posiciones, 10, 11 y 12; el mejor plan corre por la arista del polímero de (8,2) a (7,4) y a (6,6), donde las tres rectas de recurso se juntan"><title>Qué compra una hora más de impresora</title><desc>Con 10 horas la region factible tiene cinco esquinas y el mejor plan es (8, 2), que vale 38 creditos. Al subir las horas a 11 y a 12 la region crece y el mejor plan se corre por la arista del polimero a (7, 4) con 40 y a (6, 6) con 42. En (6, 6) coinciden la recta de las horas, la del polimero y la de la energia: los tres recursos se acaban exactos y una hora mas ya no compra nada.</desc><rect x="0" y="0" width="880" height="600" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><path d="M 90.0 490.0 L 396.0 490.0 L 294.0 286.0 L 90.0 184.0 Z" fill="#4a1c5c" stroke="none"/><path d="M 90.0 490.0 L 396.0 490.0 L 362.0 422.0 L 158.0 218.0 L 90.0 184.0 Z" fill="#672478" stroke="none"/><line x1="90.0" y1="490.0" x2="90.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="490.0" x2="430.0" y2="490.0" stroke="#44245e" stroke-width="1"/><line x1="158.0" y1="490.0" x2="158.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="422.0" x2="430.0" y2="422.0" stroke="#44245e" stroke-width="1"/><line x1="226.0" y1="490.0" x2="226.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="354.0" x2="430.0" y2="354.0" stroke="#44245e" stroke-width="1"/><line x1="294.0" y1="490.0" x2="294.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="286.0" x2="430.0" y2="286.0" stroke="#44245e" stroke-width="1"/><line x1="362.0" y1="490.0" x2="362.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="218.0" x2="430.0" y2="218.0" stroke="#44245e" stroke-width="1"/><line x1="430.0" y1="490.0" x2="430.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="150.0" x2="430.0" y2="150.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="490.0" x2="446.0" y2="490.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90.0" y1="490.0" x2="90.0" y2="166.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="460.0" y="496.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">x₁</text><text x="112.0" y="130.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">x₂</text><text x="158.0" y="514.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text x="78.0" y="427.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><text x="226.0" y="514.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><text x="78.0" y="359.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><text x="294.0" y="514.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text x="78.0" y="291.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">6</text><text x="362.0" y="514.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><text x="78.0" y="223.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">8</text><text x="430.0" y="514.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><text x="78.0" y="155.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><line x1="396.0" y1="490.0" x2="226.0" y2="150.0" stroke="#55ddff" stroke-width="2.5"/><line x1="90.0" y1="184.0" x2="430.0" y2="354.0" stroke="#ffd166" stroke-width="2.5"/><line x1="90.0" y1="150.0" x2="362.0" y2="422.0" stroke="#a8ff5a" stroke-width="2.5"/><line x1="124.0" y1="150.0" x2="328.0" y2="354.0" stroke="#a8ff5a" stroke-width="2.5" stroke-dasharray="9 6"/><line x1="158.0" y1="150.0" x2="294.0" y2="286.0" stroke="#a8ff5a" stroke-width="2.5" stroke-dasharray="3 4"/><line x1="356.6334368540005" y1="411.266873708001" x2="335.1554175279993" y2="368.31083505599867" stroke="#f04cff" stroke-width="3.5" marker-end="url(#p)"/><line x1="322.6334368540005" y1="343.266873708001" x2="301.1554175279993" y2="300.31083505599867" stroke="#f04cff" stroke-width="3.5" marker-end="url(#p)"/><circle cx="362.0" cy="422.0" r="6" fill="#f04cff"/><text x="380.0" y="434.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(8, 2) = 38</text><circle cx="328.0" cy="354.0" r="6" fill="#f04cff"/><text x="346.0" y="368.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">(7, 4) = 40</text><circle cx="294.0" cy="286.0" r="6" fill="#f04cff"/><circle cx="294.0" cy="286.0" r="15" fill="none" stroke="#f04cff" stroke-width="2.5"/><text x="316.0" y="264.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">(6, 6) = 42</text><text x="316.0" y="282.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">tres rectas, un punto</text><rect x="500" y="96" width="348" height="176" rx="10" fill="#2f1844" stroke="#c8b9d8" stroke-width="2"/><line x1="516" y1="126" x2="552" y2="126" stroke="#55ddff" stroke-width="3"/><text x="566" y="131" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">2x₁ + x₂ ≤ 18   polímero</text><line x1="516" y1="156" x2="552" y2="156" stroke="#ffd166" stroke-width="3"/><text x="566" y="161" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">x₁ + 2x₂ ≤ 18   energía</text><line x1="516" y1="186" x2="552" y2="186" stroke="#a8ff5a" stroke-width="3"/><text x="566" y="191" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">x₁ + x₂ ≤ 10   las horas de hoy</text><line x1="516" y1="216" x2="552" y2="216" stroke="#a8ff5a" stroke-width="3" stroke-dasharray="9 6"/><text x="566" y="221" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">x₁ + x₂ ≤ 11   con una hora más</text><line x1="516" y1="246" x2="552" y2="246" stroke="#a8ff5a" stroke-width="3" stroke-dasharray="3 5"/><text x="566" y="251" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">x₁ + x₂ ≤ 12   con dos horas más</text><rect x="500" y="292" width="348" height="190" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="520" y="320" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cada hora más corre el óptimo por la</text><text x="520" y="341" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">misma arista, la del polímero, y paga</text><text x="520" y="362" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">2 créditos más: 38, 40, 42.</text><text x="520" y="404" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">en 12 el óptimo es (6, 6), y ahí se</text><text x="520" y="425" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">juntan las tres rectas: la energía se</text><text x="520" y="446" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">acaba también, y la hora siguiente ya</text><text x="520" y="467" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no compra nada.</text><text x="440.0" y="40" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">una hora más corre el óptimo por la misma arista</text><text x="260" y="556" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">de 10 a 12 cada hora paga 2 créditos; de 12 en adelante, ninguno</text></svg>