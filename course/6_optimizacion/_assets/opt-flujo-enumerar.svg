<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1050" viewBox="0 0 760 1050" role="img" aria-label="Diagrama de flujo de la enumeracion, de la entrada a la salida: leer los datos, poner la mejor solucion en menos infinito, construir la caja de candidatos, y repetir un ciclo que toma el siguiente candidato, descarta el que no cumple las restricciones, descarta el que no supera a la mejor solucion y guarda el que si la supera; cuando la caja se agota devuelve la mejor solucion, o el aviso de que no hay ninguna factible"><title>Genera, filtra, compara</title><desc>Diagrama de flujo con diez nodos en una columna. Los paralelogramos son la entrada y la salida, los rectangulos son calculos y los rombos son decisiones. Cada nodo lleva entre corchetes la linea del pseudocodigo que representa. Un carril de retorno a la izquierda devuelve a la prueba del ciclo desde las dos respuestas negativas y desde la actualizacion; un carril a la derecha lleva a la salida cuando ya no quedan candidatos.</desc><rect x="0" y="0" width="760" height="1050" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><polygon points="212.0,56.0 570.0,56.0 548.0,108.0 190.0,108.0" fill="#393b3a" stroke="#648846" stroke-width="2"/><text x="226" y="62" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[ENTRADA]</text><text x="380" y="90" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">c, A, b, l, u</text><rect x="190" y="134" width="380" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="204" y="154" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L1]</text><text x="394" y="166" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">mejor ← −∞ ;   x* ← «ninguno»</text><rect x="190" y="212" width="380" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="204" y="232" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L2]</text><text x="394" y="244" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">X ← { l₁..u₁ } × ⋯ × { lₙ..uₙ }</text><polygon points="380,290 590,336 380,382 170,336" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="235" y="340" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L3]</text><text x="405" y="342" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿queda algún x ∈ X sin revisar?</text><rect x="190" y="408" width="380" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="204" y="428" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L3]</text><text x="394" y="440" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">x ← el siguiente de X</text><polygon points="380,486 590,532 380,578 170,532" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="235" y="536" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L4]</text><text x="405" y="538" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿Ax ≤ b?</text><rect x="190" y="604" width="380" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="204" y="624" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L5]</text><text x="394" y="636" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">z ← cᵀx</text><polygon points="380,682 590,728 380,774 170,728" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="235" y="732" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L6]</text><text x="405" y="734" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">¿z &gt; mejor?</text><rect x="190" y="800" width="380" height="52" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="204" y="820" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L7]</text><text x="394" y="832" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">mejor ← z ;   x* ← x</text><polygon points="212.0,920.0 570.0,920.0 548.0,984.0 190.0,984.0" fill="#393b3a" stroke="#648846" stroke-width="2"/><text x="226" y="930" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="normal" text-anchor="start">[L9–L10]</text><text x="380" y="950" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">devuelve x*, mejor</text><text x="380" y="972" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">«no hay factible» si x* = «ninguno»</text><line x1="380" y1="108" x2="380" y2="132" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="186" x2="380" y2="210" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="264" x2="380" y2="288" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="382" x2="380" y2="406" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="460" x2="380" y2="484" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="578" x2="380" y2="602" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="656" x2="380" y2="680" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="774" x2="380" y2="798" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="398" y="400" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><text x="398" y="596" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><text x="398" y="792" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><line x1="170" y1="532" x2="90" y2="532" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="158" y="522" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">no</text><line x1="170" y1="728" x2="90" y2="728" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="158" y="718" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">no</text><line x1="190" y1="826" x2="90" y2="826" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90" y1="826" x2="90" y2="336" stroke="#c8b9d8" stroke-width="2"/><line x1="90" y1="336" x2="170" y2="336" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="100" y="310" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">vuelve al ciclo</text><line x1="590" y1="336" x2="690" y2="336" stroke="#c8b9d8" stroke-width="2"/><text x="602" y="326" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no</text><line x1="690" y1="336" x2="690" y2="952" stroke="#c8b9d8" stroke-width="2"/><line x1="690" y1="952" x2="559" y2="952" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="126.0,1007.0 162.0,1007.0 154.0,1029.0 118.0,1029.0" fill="#393b3a" stroke="#648846" stroke-width="2"/><text x="170" y="1023" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">entrada / salida</text><rect x="320" y="1007" width="44" height="22" rx="5" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="374" y="1023" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">cálculo</text><polygon points="470,1005 496,1018 470,1031 444,1018" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="504" y="1023" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="start">decisión</text><text x="620" y="1023" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">[Ln] = línea</text></svg>