<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-label="Cuatro pasos en ciclo: tomar el siguiente candidato de la caja, comprobar si cumple las restricciones, comparar su valor con el mejor guardado y guardarlo; las dos respuestas negativas y el guardado vuelven al primer paso, y cuando la caja se agota devuelve el mejor"><title>Genera, filtra, compara</title><desc>Diagrama de flujo de la enumeracion. Un paso genera el siguiente candidato, un rombo filtra por las restricciones, otro rombo compara contra la mejor solucion guardada y un paso la actualiza. Un carril de retorno a la izquierda recoge las dos salidas negativas y cierra el ciclo. Una flecha a la derecha sale cuando ya no quedan candidatos.</desc><rect x="0" y="0" width="900" height="510" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><rect x="170" y="60" width="420" height="56" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="395" y="94" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Toma el siguiente candidato</text><circle cx="200" cy="88" r="13" fill="#f04cff"/><text x="200" y="93" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><polygon points="380,142 600,196 380,250 160,196" fill="#293154" stroke="#3b7699" stroke-width="2"/><text x="405" y="202" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">¿Cumple Ax ≤ b?</text><circle cx="225" cy="196" r="13" fill="#f04cff"/><text x="225" y="201" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><polygon points="380,272 600,326 380,380 160,326" fill="#452f3b" stroke="#90704c" stroke-width="2"/><text x="405" y="332" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">¿Vale más que el mejor?</text><circle cx="225" cy="326" r="13" fill="#f04cff"/><text x="225" y="331" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text><rect x="170" y="404" width="420" height="52" rx="10" fill="#393b3a" stroke="#648846" stroke-width="2"/><text x="395" y="436" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Guárdalo como el mejor</text><circle cx="200" cy="430" r="13" fill="#f04cff"/><text x="200" y="435" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4</text><line x1="380" y1="116" x2="380" y2="138" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="252" x2="380" y2="268" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="380" y1="382" x2="380" y2="402" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="398" y="266" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><text x="398" y="396" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sí</text><line x1="160" y1="196" x2="92" y2="196" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="148" y="186" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">no</text><line x1="160" y1="326" x2="92" y2="326" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="148" y="316" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">no</text><line x1="170" y1="430" x2="92" y2="430" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="92" y1="430" x2="92" y2="88" stroke="#c8b9d8" stroke-width="2"/><line x1="92" y1="88" x2="170" y2="88" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><line x1="590" y1="88" x2="668" y2="88" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="676" y="82" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">si ya no quedan,</text><text x="676" y="102" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">devuelve el mejor</text><text x="380" y="490" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">genera · filtra · compara</text></svg>