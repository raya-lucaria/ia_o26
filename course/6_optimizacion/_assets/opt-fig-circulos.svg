<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560" role="img" aria-label="El polígono de la clase 1 con cuatro curvas de nivel circulares concéntricas alrededor de (4,4), que está marcado como punto interior"><title>Cuando las curvas de nivel se curvan</title><desc>El mismo poligono de cinco esquinas de la clase 1. Encima, cuatro circunferencias concentricas centradas en (4,4) con valores -16, -9, -4 y -1. El punto (4,4) esta marcado con un punto lleno y vale 0: es el maximo, queda estrictamente dentro de la region y no es ninguna de las cinco esquinas, que van dibujadas como aros huecos.</desc><rect x="0" y="0" width="820" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><path d="M 90.0 470.0 L 396.0 470.0 L 362.0 402.0 L 158.0 198.0 L 90.0 164.0 Z" fill="#3f2157" stroke="#9e8faf" stroke-width="2.5"/><line x1="90.0" y1="470.0" x2="90.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="470.0" x2="430.0" y2="470.0" stroke="#44245e" stroke-width="1"/><line x1="158.0" y1="470.0" x2="158.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="402.0" x2="430.0" y2="402.0" stroke="#44245e" stroke-width="1"/><line x1="226.0" y1="470.0" x2="226.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="334.0" x2="430.0" y2="334.0" stroke="#44245e" stroke-width="1"/><line x1="294.0" y1="470.0" x2="294.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="266.0" x2="430.0" y2="266.0" stroke="#44245e" stroke-width="1"/><line x1="362.0" y1="470.0" x2="362.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="198.0" x2="430.0" y2="198.0" stroke="#44245e" stroke-width="1"/><line x1="430.0" y1="470.0" x2="430.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="130.0" x2="430.0" y2="130.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="470.0" x2="446.0" y2="470.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90.0" y1="470.0" x2="90.0" y2="146.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="460.0" y="476.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">x₁</text><text x="112.0" y="110.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">x₂</text><text x="158.0" y="494.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text x="78.0" y="407.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><text x="226.0" y="494.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><text x="78.0" y="339.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><text x="294.0" y="494.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text x="78.0" y="271.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">6</text><text x="362.0" y="494.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><text x="78.0" y="203.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">8</text><text x="430.0" y="494.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><text x="78.0" y="135.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><circle cx="226.0" cy="334.0" r="136" fill="none" stroke="#55ddff" stroke-width="2" stroke-dasharray="8 6"/><rect x="109.3" y="417.2" width="41" height="18" rx="4" fill="#3f2157"/><text x="129.8334777586295" y="430.16652224137044" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">−16</text><circle cx="226.0" cy="334.0" r="102" fill="none" stroke="#55ddff" stroke-width="2" stroke-dasharray="8 6"/><rect x="166.9" y="228.6" width="32" height="18" rx="4" fill="#3f2157"/><text x="182.89293730244867" y="241.55660572226168" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">−9</text><circle cx="226.0" cy="334.0" r="68" fill="none" stroke="#55ddff" stroke-width="2" stroke-dasharray="8 6"/><rect x="253.7" y="373.1" width="32" height="18" rx="4" fill="#3f2157"/><text x="269.7095574586847" y="386.09102213209053" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">−4</text><circle cx="226.0" cy="334.0" r="34" fill="none" stroke="#f04cff" stroke-width="3"/><rect x="193.0" y="350.4" width="32" height="18" rx="4" fill="#3f2157"/><text x="209.0" y="363.4448637286709" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−1</text><circle cx="90.0" cy="470.0" r="5" fill="#211033" stroke="#f7f2ff" stroke-width="2.5"/><circle cx="396.0" cy="470.0" r="5" fill="#211033" stroke="#f7f2ff" stroke-width="2.5"/><circle cx="362.0" cy="402.0" r="5" fill="#211033" stroke="#f7f2ff" stroke-width="2.5"/><circle cx="158.0" cy="198.0" r="5" fill="#211033" stroke="#f7f2ff" stroke-width="2.5"/><circle cx="90.0" cy="164.0" r="5" fill="#211033" stroke="#f7f2ff" stroke-width="2.5"/><line x1="238.0" y1="328.0" x2="486" y2="246" stroke="#b23ac2" stroke-width="1.5"/><circle cx="226.0" cy="334.0" r="8" fill="#f04cff"/><text x="410.0" y="34" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">objetivo −(x₁−4)² − (x₂−4)²: las curvas de nivel se curvan</text><rect x="478" y="84" width="306" height="116" rx="10" fill="none" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="6 5"/><text x="494" y="112" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">en la clase 1 las curvas de nivel</text><text x="494" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">eran rectas paralelas: se desplazaban</text><text x="494" y="156" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">sin girar, y la última tocaba</text><text x="494" y="178" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el polígono en una esquina.</text><text x="494" y="250" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">(4, 4) = 0, el máximo</text><text x="494" y="276" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cabe: 8 horas de 10, 12 kg de 18,</text><text x="494" y="297" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">12 kWh de 18. Y le sobra de los tres,</text><text x="494" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">así que está estrictamente por dentro.</text><text x="494" y="360" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">ninguna de las cinco esquinas lo alcanza.</text><text x="410.0" y="528" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">los círculos se encogen hasta cerrarse sobre un punto de adentro: ahí no hay ninguna esquina</text></svg>