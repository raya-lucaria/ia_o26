<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="Arbol de cinco nodos: la raiz con cota veintiuno se parte en dos ramas, la de arriba cierra con una solucion entera de dieciocho, la de abajo se vuelve a partir y da la solucion entera de veinte y una poda por cota"><title>El árbol del taller</title><desc>Cada caja es un subproblema con su cota. Verde, la relajacion salio entera y cierra la rama. Rojo, la cota no supera a la mejor solucion y se poda. Azul, hay que partir. El numero entre corchetes es el orden en que se abrieron, que no es el de izquierda a derecha.</desc><rect x="0" y="0" width="940" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><line x1="470" y1="124" x2="250" y2="202" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="470" y1="124" x2="720" y2="202" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="250" y1="298" x2="130" y2="376" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="250" y1="298" x2="390" y2="376" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="361" y="28" width="218" height="96" rx="10" fill="#293154" stroke="#3e81a3" stroke-width="2"/><text x="373" y="48" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">[1]</text><text x="480" y="48" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">raíz</text><text x="470" y="80" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cota = 21</text><text x="470" y="112" fill="#52d3f5" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">x₂ = 3/2 → parte</text><rect x="141" y="202" width="218" height="96" rx="10" fill="#293154" stroke="#3e81a3" stroke-width="2"/><text x="153" y="222" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">[3]</text><text x="260" y="222" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">x₂ ≤ 1</text><text x="250" y="254" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cota = 62/3 ≈ 20.67</text><text x="250" y="286" fill="#52d3f5" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">x₁ = 10/3 → parte</text><rect x="611" y="202" width="218" height="96" rx="10" fill="#373639" stroke="#6b9348" stroke-width="2"/><text x="623" y="222" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">[2]</text><text x="730" y="222" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">x₂ ≥ 2</text><text x="720" y="254" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cota = 18</text><text x="720" y="286" fill="#a1f358" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">entera (2, 2) → mejor 18</text><rect x="21" y="376" width="218" height="96" rx="10" fill="#451c3e" stroke="#9b395a" stroke-width="2"/><text x="33" y="396" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">[5]</text><text x="140" y="396" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">x₁ ≤ 3</text><text x="130" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cota = 19</text><text x="130" y="460" fill="#f45676" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">19 ≤ 20 → poda</text><rect x="281" y="376" width="218" height="96" rx="10" fill="#373639" stroke="#6b9348" stroke-width="2"/><text x="293" y="396" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start">[4]</text><text x="400" y="396" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">x₁ ≥ 4</text><text x="390" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cota = 20</text><text x="390" y="460" fill="#a1f358" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">entera (4, 0) → mejor 20</text><rect x="640" y="400" width="270" height="104" rx="10" fill="#2f1844" stroke="#c8b9d8" stroke-width="2"/><rect x="654" y="413" width="22" height="4" rx="2" fill="#50c8eb"/><text x="686" y="419" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">hay que partir</text><rect x="654" y="439" width="22" height="4" rx="2" fill="#9ae756"/><text x="686" y="445" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">entera: cierra la rama</text><rect x="654" y="465" width="22" height="4" rx="2" fill="#e95373"/><text x="686" y="471" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">poda por cota</text><text x="470" y="538" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cinco nodos, y el óptimo es (4, 0) = 20</text></svg>