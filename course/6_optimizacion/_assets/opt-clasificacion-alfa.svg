<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1158" viewBox="0 0 560 1158" role="img" aria-label="Dos paneles frente al intercepto alfa, con beta cero: pérdida promedio y proporción de aciertos. Tres reglas elegidas a mano, no iteraciones de entrenamiento"><title>El intercepto cambia la regla constante</title><desc>Eje horizontal alfa real, mostrado de -4 a 4, con flechas de continuación. Dos tercios de los casos son de clase 1. Arriba, L(alfa,0) = ln(1+exp(alfa)) - dos tercios por alfa, en nats por caso. No hay asíntotas verticales: la curva continúa hacia ambos lados fuera de la ventana. Abajo, accuracy es un tercio para alfa negativa y dos tercios para alfa mayor o igual a cero. En cero, el punto inferior está abierto y el superior cerrado. Las marcas son ln(0.49/0.51), ln(2) y ln(9), correspondientes a los scores constantes 0.49, dos tercios y 0.9. Sus pérdidas son 0.700, 0.637 y 0.838; no se presentan como óptimos del modelo completo.</desc><rect x="0" y="0" width="560" height="1158" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="27" font-weight="700" text-anchor="middle">El intercepto cambia la regla</text><text x="280.0" y="70" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">β = 0 · 2/3 de casos con clase 1</text><text x="280.0" y="102" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Tres valores de α elegidos a mano</text><text x="280.0" y="150" fill="#f04cff" font-family="system-ui, sans-serif" font-size="25" font-we