<svg xmlns="http://www.w3.org/2000/svg" width="560" height="538" viewBox="0 0 560 538" role="img" aria-label="Sigmoide de z igual a alfa más beta por x; el score normalizado p se interpreta como probabilidad estimada. Sube de 0 a 1 sin alcanzar esos límites y vale 0.5 cuando z es cero"><title>La sigmoide convierte z en un score normalizado p</title><desc>Curva calculada p = 1 / (1 + exp(-z)) para z entre -4 y 4. El score p se interpreta como probabilidad estimada del modelo; su normalización no garantiza calibración con frecuencias reales. El eje horizontal es z = alfa + beta por x. Las líneas discontinuas p = 0 y p = 1 son asíntotas. El punto central es z = 0, p = 0.5. Para todo z real finito, 0 &lt; p &lt; 1.</desc><rect x="0" y="0" width="560" height="538" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="38" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">La sigmoide</text><text x="280.0" y="77" fill="#55ddff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">p = 1 / (1 + exp(−z))</text><g transform="rotate(-90 26 247)"><text x="26" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Score normalizado p</text></g><line x1="110" y1="366" x2="514" y2="366" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="7 7"/><text x="96" y="373" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">0</text><line x1="110" y1="247.0" x2="514" y2="247.0" stroke="#78419e" stroke-width="1.5" stroke-dasharray="7 7"/><text x="96" y="254.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">0.5</text><line x1="110" y1="128" x2="514" y2="128" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="7 7"/><text x="96" y="135" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">1</text><line x1="110" y1="366" x2="110" y2="116" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><line x1="514" y1="366" x2="534" y2="366" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><line x1="312.0" y1="128" x2="312.0" y2="366" stroke="#78419e" stroke-width="1"/><line x1="110.0" y1="371" x2="110.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="110.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−4</text><line x1="211.0" y1="371" x2="211.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="211.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−2</text><line x1="312.0" y1="371" x2="312.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="312.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0</text><line x1="413.0" y1="371" x2="413.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="413.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">2</text><line x1="514.0" y1="371" x2="514.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="514.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">4</text><path d="M 110.0 361.7 L 112.5 361.5 L 115.1 361.3 L 117.6 361.0 L 120.1 360.8 L 122.6 360.5 L 125.1 360.3 L 127.7 360.0 L 130.2 359.7 L 132.7 359.4 L 135.2 359.0 L 137.8 358.7 L 140.3 358.3 L 142.8 357.9 L 145.4 357.5 L 147.9 357.1 L 150.