<svg xmlns="http://www.w3.org/2000/svg" width="560" height="506" viewBox="0 0 560 506" role="img" aria-label="Sigmoide de z igual a alfa más beta por x; el score normalizado p se interpreta como probabilidad estimada. Sube de 0 a 1 sin alcanzar esos límites y vale 0.5 cuando z es cero"><title>La sigmoide convierte z en un score normalizado p</title><desc>Curva calculada p = 1 / (1 + exp(-z)) para z entre -4 y 4. El score p se interpreta como probabilidad estimada del modelo; su normalización no garantiza calibración con frecuencias reales. El eje horizontal es z = alfa + beta por x. Las líneas discontinuas p = 0 y p = 1 son asíntotas. El punto central es z = 0, p = 0.5. Para todo z real finito, 0 &lt; p &lt; 1.</desc><rect x="0" y="0" width="560" height="506" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="38" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">La sigmoide</text><text x="280.0" y="77" fill="#55ddff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">p = 1 / (1 + exp(−z))</text><text x="78" y="110" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="end">p</text><line x1="78" y1="366" x2="514" y2="366" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="7 7"/><text x="64" y="373" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">0</text><line x1="78" y1="247.0" x2="514" y2="247.0" stroke="#78419e" stroke-width="1.5" stroke-dasharray="7 7"/><text x="64" y="254.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">0.5</text><line x1="78" y1="128" x2="514" y2="128" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="7 7"/><text x="64" y="135" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">1</text><line x1="78" y1="128" x2="78" y2="366" stroke="#c8b9d8" stroke-width="1.5"/><line x1="296.0" y1="128" x2="296.0" y2="366" stroke="#78419e" stroke-width="1"/><line x1="78.0" y1="371" x2="78.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="78.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−4</text><line x1="187.0" y1="371" x2="187.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="187.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−2</text><line x1="296.0" y1="371" x2="296.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="296.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0</text><line x1="405.0" y1="371" x2="405.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="405.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">2</text><line x1="514.0" y1="371" x2="514.0" y2="378" stroke="#c8b9d8" stroke-width="1.5"/><text x="514.0" y="402" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">4</text><path d="M 78.0 361.7 L 80.7 361.5 L 83.5 361.3 L 86.2 361.0 L 88.9 360.8 L 91.6 360.5 L 94.3 360.3 L 97.1 360.0 L 99.8 359.7 L 102.5 359.4 L 105.2 359.0 L 108.0 358.7 L 110.7 358.3 L 113.4 357.9 L 116.2 357.5 L 118.9 357.1 L 121.6 356.7 L 124.3 356.2 L 127.0 355.7 L 129.8 355.2 L 132.5 354.7 L 135.2 354.2 L 137.9 353.6 L 140.7 353.0 L 143.4 352.4 L 146.1 351.7 L 148.8 351.0 L 151.6 350.3 L 154.3 349.5 L 157.0 348.8 L 159.8