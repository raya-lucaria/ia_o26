ily="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">(0, 0.5)</text><text x="280.0" y="444" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="normal" text-anchor="middle">z = α + βx</text><text x="280.0" y="486" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Asíntotas: p = 0 y p = 1</text></svg>