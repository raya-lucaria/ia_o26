<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560" role="img" aria-label="La forma canónica del modelo con cada parte señalada: sentido, función objetivo, coeficientes, variables de decisión, restricciones, lados derechos y dominio"><title>Las partes de un problema de optimización</title><desc>El modelo de la impresora escrito en forma canonica. Flechas y etiquetas nombran el sentido max, la funcion objetivo, los coeficientes de precio, las variables de decision, las tres restricciones de recurso, sus coeficientes de consumo, los lados derechos con lo disponible, y el dominio.</desc><rect x="0" y="0" width="940" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="312" y="156" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="normal" text-anchor="end">max</text><text x="338" y="156" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="normal" text-anchor="start">4x₁ + 3x₂</text><text x="312" y="238" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="normal" text-anchor="end">sujeto a</text><text x="338" y="238" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="normal" text-anchor="start">x₁ +  x₂  ≤ 10</text><text x="338" y="286" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="normal" text-anchor="start">2x₁ +  x₂  ≤ 18</text><text x="338" y="334" fill="#a8ff5a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="normal" text-anchor="start">x₁ + 2x₂  ≤ 18</text><text x="338" y="406" fill="#55ddff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="normal" text-anchor="start">x₁ ≥ 0,  x₂ ≥ 0</text><rect x="322" y="214" width="320" height="148" rx="10" fill="none" stroke="#729f4a" stroke-width="2" stroke-dasharray="6 5"/><rect x="322" y="380" width="320" height="40" rx="10" fill="none" stroke="#408bad" stroke-width="2" stroke-dasharray="6 5"/><line x1="196" y1="118" x2="300" y2="143" stroke="#c8b9d8" stroke-width="1.6" marker-end="url(#s)"/><text x="190" y="123" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">el sentido:</text><text x="190" y="136" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">máximo o mínimo</text><line x1="300" y1="200" x2="360" y2="224" stroke="#a8ff5a" stroke-width="1.6" marker-end="url(#p)"/><text x="294" y="205" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">una restricción por recurso</text><line x1="258" y1="300" x2="338" y2="284" stroke="#a8ff5a" stroke-width="1.6" marker-end="url(#p)"/><text x="252" y="305" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">coeficientes:</text><text x="252" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">cuánto consume cada pieza</text><line x1="240" y1="400" x2="322" y2="400" stroke="#55ddff" stroke-width="1.6" marker-end="url(#p)"/><text x="234" y="405" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="end">el dominio</text><text x="234" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">con qué números</text><text x="234" y="434" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">se trabaja</text><line x1="700" y1="116" x2="560" y2="143" stroke="#f04cff" stroke-width="1.6" marker-end="url(#p)"/><text x="706" y="121" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">la función objetivo:</text><text x="706" y="134" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lo que se quiere</text><text x="706" y="150" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lo más grande posible</text><line x1="700" y1="196" x2="430" y2="168" stroke="#ffd166" stroke-width="1.6" marker-end="url(#p)"/><text x="706" y="201" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">coeficientes del objetivo:</text><text x="706" y="214" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cuánto vale cada pieza</text><line x1="700" y1="300" x2="620" y2="284" stroke="#a8ff5a" stroke-width="1.6" marker-end="url(#p)"/><text x="706" y="305" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lado derecho:</text><text x="706" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">cuánto hay de ese recurso</text><line x1="700" y1="412" x2="580" y2="402" stroke="#f04cff" stroke-width="1.6" marker-end="url(#p)"/><text x="706" y="417" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">variables de decisión:</text><text x="706" y="430" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lo único que eliges</text><text x="470.0" y="40" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">las siete partes de un problema de optimización</text><text x="470.0" y="505" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">si puedes nombrar cada símbolo, ya sabes leer un modelo</text></svg>