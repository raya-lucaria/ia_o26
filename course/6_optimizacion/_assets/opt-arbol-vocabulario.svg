<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-label="Arbol generico de tres niveles: una raiz arriba, dos hijos debajo, y el hijo de la izquierda con dos hijos propios; un recuadro punteado encierra al hijo de la izquierda con todo lo que cuelga de el"><title>Cómo se llama cada parte</title><desc>Esquema sin numeros para nombrar las partes de un arbol de subproblemas: la raiz es el problema original, cada circulo es un nodo, los dos que salen de uno son sus hijos, un nodo que no se partio es una hoja, y un nodo con todo lo que cuelga de el es una rama.</desc><rect x="0" y="0" width="860" height="500" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><rect x="146" y="172" width="268" height="216" rx="18" fill="#3a174b" stroke="#f04cff" stroke-width="2" stroke-dasharray="7 6"/><text x="150" y="160" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">rama</text><line x1="430" y1="110" x2="280" y2="192" stroke="#c8b9d8" stroke-width="2"/><line x1="430" y1="110" x2="600" y2="192" stroke="#c8b9d8" stroke-width="2"/><line x1="280" y1="240" x2="200" y2="312" stroke="#c8b9d8" stroke-width="2"/><line x1="280" y1="240" x2="360" y2="312" stroke="#c8b9d8" stroke-width="2"/><circle cx="430" cy="86" r="24" fill="#3b7699"/><circle cx="280" cy="216" r="24" fill="#3b7699"/><circle cx="600" cy="216" r="24" fill="#3b7699"/><circle cx="200" cy="336" r="24" fill="#3b7699"/><circle cx="360" cy="336" r="24" fill="#3b7699"/><text x="470" y="91" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">raíz</text><text x="524" y="91" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">el problema original</text><text x="640" y="221" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">hoja</text><text x="698" y="221" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">no se partió</text><text x="430" y="156" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">hijos</text><text x="430" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">cada círculo es un nodo, es decir, un subproblema</text><text x="430" y="472" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">abrir un nodo es resolver su relajación</text></svg>