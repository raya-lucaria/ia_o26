<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-label="Dos regiones superpuestas: la que queda al quitar la restricción de energía, más grande, y la real dentro de ella; la esquina (8,2) pertenece a las dos"><title>El techo no depende de la energía</title><desc>Al tachar la restriccion de energia la region crece y pasa a tener cuatro esquinas: (0,0), (0,10), (8,2) y (9,0), que valen 0, 30, 38 y 36. La esquina (8,2) sigue siendo la mejor, y esta tambien en la region real.</desc><rect x="0" y="0" width="720" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><path d="M 90.0 460.0 L 396.0 460.0 L 362.0 392.0 L 90.0 120.0 Z" fill="#2b395c" stroke="#55ddff" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M 90.0 460.0 L 396.0 460.0 L 362.0 392.0 L 158.0 188.0 L 90.0 154.0 Z" fill="#5f2270" stroke="#c740d6" stroke-width="2"/><line x1="90.0" y1="460.0" x2="90.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="460.0" x2="430.0" y2="460.0" stroke="#44245e" stroke-width="1"/><line x1="158.0" y1="460.0" x2="158.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="392.0" x2="430.0" y2="392.0" stroke="#44245e" stroke-width="1"/><line x1="226.0" y1="460.0" x2="226.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="324.0" x2="430.0" y2="324.0" stroke="#44245e" stroke-width="1"/><line x1="294.0" y1="460.0" x2="294.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="256.0" x2="430.0" y2="256.0" stroke="#44245e" stroke-width="1"/><line x1="362.0" y1="460.0" x2="362.0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="9