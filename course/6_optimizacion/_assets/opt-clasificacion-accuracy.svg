<svg xmlns="http://www.w3.org/2000/svg" width="560" height="690" viewBox="0 0 560 690" role="img" aria-label="Accuracy frente al intercepto alfa para cuatro casos, con beta fija en uno"><title>La accuracy cambia a saltos</title><desc>Casos x=(0,1,2,3), y=(0,0,1,1). Predicción uno si alfa+x es mayor o igual a cero. Beta se fija en uno solo para visualizar un corte del problema original, donde alfa y beta son libres. La accuracy vale un medio antes de -3, tres cuartos en [-3,-2), uno en [-2,-1), tres cuartos en [-1,0) y un medio desde cero. Los círculos cerrados incluyen el extremo y los abiertos lo excluyen. Alfa=-2.5 da tres cuartos. La ventana es [-4,1], pero alfa tiene dominio real. No son iteraciones de entrenamiento.</desc><rect x="0" y="0" width="560" height="690" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="27" font-weight="700" text-anchor="middle">La accuracy cambia a saltos</text><text x="280.0" y="72" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="middle">β = 1 · cuatro casos</text><text x="280.0" y="108" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">x = (0, 1, 2, 3)</text><text x="280.0" y="139" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">y = (0, 0, 1, 1)</text><g transform="rotate(-90 26 330)"><text x="26" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Aciertos (proporción)</text></g><line x1="110" y1="450" x2="514" y2="450" stroke="#78419e" stroke-width="1"/><text x="96" y="457" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">0</text><line x1="110" y1="390.0" x2="514" y2="390.0" stroke="#78419e" stroke-width="1"/><text x="96" y="397.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">1/4</text><line x1="110" y1="330.0" x2="514" y2="330.0" stroke="#78419e" stroke-width="1"/><text x="96" y="337.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">1/2</text><line x1="110" y1="270.0" x2="514" y2="270.0" stroke="#78419e" stroke-width="1"/><text x="96" y="277.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">3/4</text><line x1="110" y1="210" x2="514" y2="210" stroke="#78419e" stroke-width="1"/><text x="96" y="217" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">1</text><line x1="110" y1="450" x2="110" y2="195" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><line x1="110" y1="450" x2="534" y2="450" stroke="#c8b9d8" stroke-width="1.5" marker-end="url(#s)"/><line x1="110.0" y1="450" x2="110.0" y2="458" stroke="#c8b9d8" stroke-width="1.5"/><text x="110.0" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−4</text><line x1="190.8" y1="450" x2="190.8" y2="458" stroke="#c8b9d8" stroke-width="1.5"/><text x="190.8" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−3</text><line x1="271.6" y1="450" x2="271.6" y2="458" stroke="#c8b9d8" stroke-width="1.5"/><text x="271.6" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−2</text><line x1="352.4" y1="450" x2="352.4" y2="458" stroke="#c8b9d8" stroke-width="1.5"/><text x="352.4" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">−1</text><line x1="433.20000000000005" y1="450" x2="433.20000000000005" y2="458" stroke="#c8b9d8" stroke-width="1.5"/><text x="433.20000000000005" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">0</text><line x1="514.0" y1="450" x2="514.0" y2="458" stroke="#c8b9d8" stroke-width="1.5"/><text x="514.0" y="485" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">1</text><text x="280.0" y="524" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24" font-weight="normal" text-anchor="middle">α (intercepto)</text><line x1="110.0" y1="330.0" x2="190.8" y2="330.0" stroke="#f04cff" stroke-width="4"/><circle cx="190.8" cy="330.0" r="6" fill="#211033" stroke="#f04cff" stroke-width="2.5"/><line x1="190.8" y1="270.0" x2="271.6" y2="270.0" stroke="#f04cff" stroke-width="4"/><circle cx="190.8" cy="270.0" r="6" fill="#f04cff"/><circle cx="271.6" cy="270.0" r="6" fill="#211033" stroke="#f04cff" stroke-width="2.5"/><line x1="271.6" y1="210.0" x2="352.4" y2="210.0" stroke="#55ddff" stroke-width="4"/><circle cx="271.6" cy="210.0" r="6" fill="#55ddff"/><circle cx="352.4" cy="210.0" r="6" fill="#211033" stroke="#55ddff" stroke-width="2.5"/><line x1="352.4" y1="270.0" x2="433.20000000000005" y2="270.0" stroke="#f04cff" stroke-width="4"/><circle cx="352.4" cy="270.0" r="6" fill="#f04cff"/><circle cx="433.20000000000005" cy="270.0" r="6" fill="#211033" stroke="#f04cff" stroke-width="2.5"/><line x1="433.20000000000005" y1="330.0" x2="514.0" y2="330.0" stroke="#f04cff" stroke-width="4"/><circle cx="433.20000000000005" cy="330.0" r="6" fill="#f04cff"/><path d="M 120.0 325.0 L 110.0 330.0 L 120.0 335.0" fill="none" stroke="#f04cff" stroke-width="3"/><path d="M 504.0 325.0 L 514.0 330.0 L 504.0 335.0" fill="none" stroke="#f04cff" stroke-width="3"/><text x="312.0" y="184" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">A = 1 en [−2, −1)</text><line x1="231.2" y1="277.0" x2="217" y2="290" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="231.2" cy="270.0" r="6" fill="#a8ff5a"/><text x="214" y="315" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">α = −2.5: A = 3/4</text><circle cx="122" cy="567" r="6" fill="#f7f2ff"/><text x="140" y="574" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Incluido</text><circle cx="325" cy="567" r="6" fill="#211033" stroke="#f7f2ff" stroke-width="2.5"/><text x="343" y="574" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">Excluido</text><text x="280.0" y="615" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">α varía; β = 1 solo en esta vista.</text><text x="280.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">No son iteraciones de entrenamiento.</text><text x="280.0" y="677" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Ventana: [−4, 1]; dominio: α real.</text></svg>