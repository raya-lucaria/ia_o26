<svg xmlns="http://www.w3.org/2000/svg" width="560" height="570" viewBox="0 0 560 570" role="img" aria-label="Pérdida logarítmica frente al score normalizado p de clase 1: si y es 1, menos ln p decrece; si y es 0, menos ln uno menos p crece. Ambas divergen hacia infinito al asignar un score casi cero a la clase correcta"><title>La pérdida depende de la clase correcta</title><desc>Dos curvas calculadas para 0 &lt; p &lt; 1. El score normalizado p se interpreta como probabilidad estimada de clase 1 bajo el modelo. La verde, y = 1, representa -ln(p) y crece sin límite cuando p tiende a 0. La azul, y = 0, representa -ln(1-p) y crece sin límite cuando p tiende a 1. Las flechas superiores indican continuación sin cota, no un máximo. Los círculos abiertos en pérdida cero muestran límites no incluidos.</desc><rect x="0" y="0" width="560" height="570" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="280.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Pérdida logarítmica</text><line x1="82" y1="70" x2="123" y2="70" stroke="#a8ff5a" stroke-width="4"/><text x="142" y="77" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="start">y = 1:  −ln(p)</text><line x1="82" y1="104" x2="123" y2="104" stroke="#55ddff" stroke-width="4"/><text x="142" y="111" fill="#55ddff" font-family="system-ui, sans-serif" font-size="23" font-weight="normal" text-anchor="start">y = 0:  −ln(1 − p)</text><g transform="rotate(-90 26 300)"><text x="26" y="300" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="midd