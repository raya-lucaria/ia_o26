<svg xmlns="http://www.w3.org/2000/svg" width="700" height="296" viewBox="0 0 700 296" role="img" aria-label="raíz: por resolver, relajación sin resolver."><title>Antes de resolver el primer nodo</title><desc>raíz: por resolver, relajación sin resolver.</desc><rect x="0" y="0" width="700" height="296" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="29" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Antes de resolver el primer nodo</text><rect x="252.0" y="68" width="196" height="134" rx="10" fill="#372338" stroke="#ffd166" stroke-width="3" stroke-dasharray="7 4"/><text x="350" y="91" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">[1] Taller original</text><text x="350" y="113" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Problema 1 de la bitácora</text><text x="350" y="137" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">POR RESOLVER</text><text x="350" y="162" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">relajación sin resolver</text><text x="350.0" y="246" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Mejor solución entera guardada: ninguna</text><text x="350.0" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Cada nodo conserva las restricciones del taller y las de su camino.</text></svg>