<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="El poligono de la clase 1 con su esquina optima; desde ella salen las dos normales de las restricciones activas y la flecha del objetivo, que es la diagonal del paralelogramo que forman"><title>El gradiente, escrito con las normales activas</title><desc>En la esquina (8,2) del poligono, la flecha del objetivo c=(4,3) es la diagonal del paralelogramo que forman dos veces la normal de horas (1,1) y una vez la normal de polimero (2,1). Los coeficientes 2 y 1 son los precios sombra de esos dos recursos.</desc><rect x="0" y="0" width="900" height="580" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><line x1="90" y1="470" x2="506" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90" y1="470" x2="90" y2="54" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="516" y="475" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">filtros x₁</text><text x="86" y="44" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">celdas x₂</text><polygon points="90.0,470.0 414.0,470.0 378.0,398.0 162.0,182.0 90.0,146.0" fill="#293154" stroke="#408bad" stroke-width="2"/><text x="183.60000000000002" y="354.8" fill="#52d3f5" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">región factible</text><line x1="162" y1="182" x2="378" y2="398" stroke="#ffd166" stroke-width="3.5"/><text x="176.39999999999998" y="172.0" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lado de horas</text><line x1="378" y1="398" x2="414" y2="470" stroke="#a8ff5a" stroke-width="3.5"/><text x="421.2" y="455.6" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">lado de polímero</text><line x1="450" y1="326" x2="522" y2="290" stroke="#80b74e" stroke-width="2" stroke-dasharray="6 5"/><line x1="450" y1="362" x2="522" y2="290" stroke="#bc9757" stroke-width="2" stroke-dasharray="6 5"/><defs><marker id="na" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd166"/></marker></defs><line x1="378.0" y1="398.0" x2="450.0" y2="326.0" stroke="#ffd166" stroke-width="3" marker-end="url(#na)"/><defs><marker id="nb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8ff5a"/></marker></defs><line x1="378.0" y1="398.0" x2="450.0" y2="362.0" stroke="#a8ff5a" stroke-width="3" marker-end="url(#nb)"/><defs><marker id="nc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker></defs><line x1="378.0" y1="398.0" x2="522.0" y2="290.0" stroke="#f04cff" stroke-width="3.5" marker-end="url(#nc)"/><circle cx="378" cy="398" r="7" fill="#f7f2ff"/><text x="366" y="422" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">(8, 2)</text><text x="444" y="314" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">2 × (1,1)</text><text x="460" y="382" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">1 × (2,1)</text><text x="534" y="284" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">∇f = c = (4,3)</text><text x="450.0" y="538" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2 y 1 son los precios sombra de la clase 2: horas 2, polímero 1</text><text x="450.0" y="562" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">con un coeficiente negativo la flecha apuntaría hacia dentro, y todavía se podría mejorar</text></svg>