<text x="576" y="197" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Reconstruir, sin opinar todavia</text>
<rect x="530" y="222" width="420" height="62" rx="10" fill="none" stroke="#78419e"/>
<text x="552" y="247" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">2</text>
<text x="576" y="247" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start" font-weight="600">Interpretacion</text>
<text x="576" y="267" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Que decide contar cada texto</text>
<rect x="530" y="292" width="420" height="62" rx="10" fill="none" stroke="#78419e"/>
<text x="552" y="317" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">3</text>
<text x="576" y="317" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start" font-weight="600">Comparacion</text>
<text x="576" y="337" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Contra los modulos 1, 2 y 3</text>
<rect x="530" y="362" width="420" height="62" rx="10" fill="none" stroke="#78419e"/>
<text x="552" y="387" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">4</text>
<text x="576" y="387" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start" font-weight="600">Desacuerdo</text>
<text x="576" y="407" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">En que paso se rompe la cadena</text>
<rect x="530" y="432" width="420" height="62" rx="10" fill="none" stroke="#78419e"/>
<text x="552" y="457" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="start" font-weight="700">5</text>
<text x="576" y="457" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start" font-weight="600">Aplicacion</text>
<text x="576" y="477" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Que tiene esto que ver con la IA</text>
<rect x="50" y="592" width="900" height="74" rx="12" fill="#f04cff" opacity="0.10" stroke="#78419e"/>
<text x="500" y="620" fill="#f04cff" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">La pregunta que une las seis</text>
<text x="500" y="644" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="middle">Si el futuro se puede contar: quien queda dentro de la cuenta, y quien decide como se cuenta.</text>
