<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Matriz de las seis lecturas del modulo 4 con tres columnas: que cuenta cada una, quien queda fuera de la cuenta y que se sigue de ello. Alexander cuenta a todos los atrapados en la trampa, no deja a nadie fuera porque describe en vez de repartir, y de ahi se sigue que hace falta un coordinador. Yudkowsky cuenta las creencias y los objetivos propios, todavia no deja a nadie fuera, y de ahi se sigue pensar mejor antes de decidir. La Declaracion cuenta a toda sintiencia incluida la futura, no excluye a nadie por principio, y de ahi se sigue que ampliar capacidades es un deber. El handout cuenta a los muertos en el caso de Fedorov, y lo que cuenta cambia en cada linaje. Bostrom cuenta las vidas posibles perdidas por cada ano de retraso, con lo que quien vive hoy pesa poco, y de ahi se sigue bajar el riesgo antes que acelerar. Greaves y MacAskill cuentan a todas las personas futuras esperadas, con lo que el presente queda casi entero fuera, y de ahi se sigue actuar hoy pensando en el ano 3000."><rect x="0" y="0" width="1000" height="600" rx="16" fill="#211033"/>

<text x="500" y="38" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle" font-weight="600">Quien cuenta, en cada lectura</text>
<text x="500" y="60" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Que entra en la cuenta, que se queda fuera, y que se sigue de eso</text>

<text x="62" y="104" fill="#f04cff" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="start" font-weight="700">LECTURA</text>
<text x="245" y="104" fill="#f04cff" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="start" font-weight="700">QUE CUENTA</text>
<text x="520" y="104" fill="#f04cff" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="start" font-weight="700">QUIEN QUEDA FUERA</text>
<text x="722" y="104" fill="#f04cff" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="start" font-weight="700">QUE SE SIGUE</text>
<path d="M 50 114 L 950 114" stroke="#78419e" stroke-width="1"/>
<rect x="50" y="128" width="900" height="62" rx="10" fill="#f04cff" opacity="0.05" stroke="#78419e"/>
<text x="62" y="155" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="600">Alexander</text>
<text x="245" y="155" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Todos los atrapados en la trampa</text>
<text x="520" y="155" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Nadie: describe, no reparte</text>
<text x="722" y="155" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Hace falta un coordinador</text>
<text x="60" y="176" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="start"></text>
<rect x="50" y="198" width="900" height="62" rx="10" fill="#f04cff" opacity="0.05" stroke="#78419e"/>
<text x="62" y="225" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="600">Yudkowsky</text>
<text x="245" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Creencias y objetivos propios</text>
<text x="520" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Nadie, todavia</text>
<text x="722" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Piensa mejor antes de decidir</text>
<text x="60" y="246" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="start"></text>
<rect x="50" y="268" width="900" height="62" rx="10" fill="#f04cff" opacity="0.05" stroke="#78419e"/>
<text x="62" y="295" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="600">Declaracion</text>
<text x="245" y="295" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Toda sintiencia, futura incluida</text>
<text x="520" y="295" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Nadie por principio</text>
<text x="722" y="295" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Ampliar capacidades es un deber</text>
<text x="60" y="316" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="start"></text>
<rect x="50" y="338" width="900" height="62" rx="10" fill="#f04cff" opacity="0.05" stroke="#78419e"/>
<text x="62" y="365" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="600">Handout</text>
<text x="245" y="365" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Los muertos, en Fedorov</text>
<text x="520" y="365" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Cambia en cada linaje</text>
<text x="722" y="365" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">La meta tiene historia y varia</text>
<text x="60" y="386" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="start"></text>
<rect x="50" y="408" width="900" height="62" rx="10" fill="#f04cff" opacity="0.05" stroke="#78419e"/>
<text x="62" y="435" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="600">Bostrom</text>
<text x="245" y="435" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Las vidas posibles por ano de retraso</text>
<text x="520" y="435" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Quien vive hoy pesa poco</text>
<text x="722" y="435" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Bajar el riesgo antes que acelerar</text>
<text x="60" y="456" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="start"></text>
<rect x="50" y="478" width="900" height="62" rx="10" fill="#f04cff" opacity="0.05" stroke="#78419e"/>
<text x="62" y="505" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12" text-anchor="start" font-weight="600">Greaves y MacAskill</text>
<text x="245" y="505" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Todas las personas futuras esperadas</text>
<text x="520" y="505" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">El presente, casi entero</text>
<text x="722" y="505" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Pensar hoy en el ano 3000</text>
<text x="60" y="526" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="11" text-anchor="start"></text>
<text x="500" y="572" fill="#f04cff" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">La tercera columna es la que se discute en la hora 2.</text>
</svg>
