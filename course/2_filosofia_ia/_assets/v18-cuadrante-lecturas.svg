<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-label="Cuadrante esquematico de las seis lecturas del modulo en dos ejes: acelerar el capital contra acelerar la tecnologia, y sujeto colectivo contra proceso sin sujeto. Deleuze y Guattari se dibujan como region ancha que cruza el eje, y Barbrook y Cameron quedan fuera del plano."><rect x="0" y="0" width="1000" height="720" rx="16" fill="#211033"/>

<text x="500" y="38" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">Quien discute con quien</text>
<text x="500" y="60" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Regiones, no puntos: el mapa es esquematico y discutible</text>

<!-- Axes -->
<line x1="90" y1="350" x2="930" y2="350" stroke="#78419e" stroke-width="2"/>
<!-- Vertical axis, broken into two segments so it leaves the Deleuze y Guattari box (x 330-700, y 280-410) clear, the same treatment the horizontal axis gets via its text layout -->
<line x1="510" y1="100" x2="510" y2="270" stroke="#78419e" stroke-width="2"/>
<line x1="510" y1="420" x2="510" y2="600" stroke="#78419e" stroke-width="2"/>
<polygon points="930,350 916,343 916,357" fill="#78419e"/>
<polygon points="90,350 104,343 104,357" fill="#78419e"/>
<polygon points="510,100 503,114 517,114" fill="#78419e"/>
<polygon points="510,600 503,586 517,586" fill="#78419e"/>

<text x="98" y="375" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="start">Acelerar el capital</text>
<text x="922" y="375" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">Acelerar la tecnologia</text>
<text x="510" y="92" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Sujeto colectivo</text>
<text x="510" y="618" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Proceso sin sujeto</text>

<!-- Region: Deleuze y Guattari (2), drawn first so the axis reads as crossing through it -->
<rect x="330" y="280" width="370" height="130" rx="26" fill="#9b6dff" opacity="0.10" stroke="#9b6dff" stroke-width="2" stroke-dasharray="6 5"/>
<text x="515" y="310" fill="#9b6dff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Deleuze y Guattari (2)</text>
<text x="515" y="333" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">no distinguen capital de tecnica</text>
<!-- Gap here is deliberate: the horizontal axis crosses at y=350 and would strike through a text line. The two lines around it are independent phrases now, not one clause split by a comma across the hole -->
<text x="515" y="372" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">el sujeto esta en disolucion</text>
<text x="515" y="392" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">esa ambiguedad es la que Land explota y Fisher denuncia</text>

<!-- Region: Marx (1), moved up from the brief's y=185 to y=140 so its box clears Deleuze y Guattari's -->
<rect x="560" y="140" width="200" height="120" rx="26" fill="#a8ff5a" opacity="0.16" stroke="#a8ff5a" stroke-width="1.5"/>
<text x="660" y="175" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Marx (1)</text>
<text x="660" y="199" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">hay sujeto: la clase</text>
<text x="660" y="214" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">lo que crece es capacidad</text>
<text x="660" y="229" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">productiva colectiva</text>

<!-- Region: Fisher (4) -->
<rect x="775" y="110" width="185" height="120" rx="26" fill="#ffd166" opacity="0.16" stroke="#ffd166" stroke-width="1.5"/>
<text x="867" y="145" fill="#ffd166" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Fisher (4)</text>
<text x="867" y="169" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">la tecnica contra</text>
<text x="867" y="184" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">el capital, con una</text>
<text x="867" y="199" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">politica que la dirija</text>

<!-- Region: Land (3) -->
<rect x="110" y="420" width="200" height="130" rx="26" fill="#f04cff" opacity="0.16" stroke="#f04cff" stroke-width="1.5"/>
<text x="210" y="455" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Land (3)</text>
<text x="210" y="479" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">sin sujeto, y lo que</text>
<text x="210" y="494" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">acelera es el capital</text>
<text x="210" y="509" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">mismo</text>

<!-- Region: CCRU (5) -->
<rect x="620" y="440" width="220" height="130" rx="26" fill="#55ddff" opacity="0.16" stroke="#55ddff" stroke-width="1.5"/>
<text x="730" y="475" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CCRU (5)</text>
<text x="730" y="499" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">sin sujeto, pero la</text>
<text x="730" y="514" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">potencia no es el capital:</text>
<text x="730" y="529" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">es el enjambre</text>

<!-- Barbrook y Cameron (6): outside the plane, no position on either axis -->
<rect x="60" y="645" width="880" height="58" rx="14" fill="#c8b9d8" opacity="0.08" stroke="#c8b9d8" stroke-dasharray="6 5"/>
<text x="500" y="670" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Barbrook y Cameron (6) - fuera del plano</text>
<text x="500" y="690" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">no proponen acelerar nada: describen a quien beneficia el dibujo</text>
</svg>
