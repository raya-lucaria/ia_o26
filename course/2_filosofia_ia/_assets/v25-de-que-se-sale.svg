<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="668" viewBox="0 0 1000 668" role="img" aria-label="Matriz de las cuatro lecturas del modulo 3 en tres columnas: la lectura, de que se sale, y a quien le sale junto con que pasa con quien se queda. Fila uno, Formalismo, Yarvin 2007: se sale de la discusion sobre quien deberia mandar, sustituida por un registro de quien manda ya; le sale a quien tiene poder que se pueda escriturar, y queda atras quien lo tenga y no aparezca en el papel, y quien no tenga ninguno. Fila dos, Patchwork, Yarvin 2008: se sale del reino, por contrato, porque el derecho de salida es una clausula del servicio al cliente y no un derecho; le sale a quien no sea peligroso y pueda pagarlo, y solo si otro parche lo acepta, y es la unica lectura que pregunta a donde van los demas. Fila tres, Escape, Thiel 2009: se sale de la politica entera, no de un gobierno concreto, hacia el mar, el espacio o el ciberespacio; le sale a quien pueda pagar la infraestructura de la salida, y el propio texto dice que puede depender de una sola persona. Fila cuatro, Dark Enlightenment, Land 2012: se sale de la democracia como forma de vida y no como sistema electoral, y la parte 4a incluye mudarse de barrio; le sale a quien tenga a donde irse, y si describe al que se queda -casas fortificadas, calles evitadas, pandillas- pero no lo liga a la salida. Abajo, lo que el propio diseno deja abierto: Patchwork pregunta a donde van los que no pueden pagar, y contesta en el capitulo que no leemos."><rect x="0" y="0" width="1000" height="668" rx="16" fill="#211033"/>

<text x="500" y="38" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="600" text-anchor="middle">De que se sale, segun cada lectura</text>
<text x="500" y="60" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Las cuatro dicen salir. No dicen salir de lo mismo, ni le sale a la misma gente</text>

<text x="70" y="98" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">LECTURA</text>
<text x="330" y="98" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">SE SALE DE...</text>
<text x="650" y="98" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="start">...LE SALE A, Y QUE PASA CON QUIEN SE QUEDA</text>
<line x1="60" y1="110" x2="940" y2="110" stroke="#78419e" stroke-width="1.5"/>

<!-- fila 1 -->
<rect x="60" y="122" width="880" height="106" rx="14" fill="#f04cff" opacity="0.12" stroke="#f04cff" stroke-width="1.5"/>
<text x="80" y="150" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">1 - Formalismo</text>
<text x="80" y="170" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Yarvin</text>
<text x="80" y="187" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">2007</text>
<text x="330" y="154" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">la discusion sobre quien</text>
<text x="330" y="173" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">deberia mandar, sustituida</text>
<text x="330" y="192" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">por un registro de quien</text>
<text x="330" y="211" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">manda ya</text>
<text x="650" y="154" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">quien tiene poder que se pueda</text>
<text x="650" y="173" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">escriturar. Queda atras quien lo</text>
<text x="650" y="192" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">tenga y no aparezca en el papel,</text>
<text x="650" y="211" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">y quien no tenga ninguno</text>

<!-- fila 2 -->
<rect x="60" y="240" width="880" height="106" rx="14" fill="#9b6dff" opacity="0.14" stroke="#9b6dff" stroke-width="1.5"/>
<text x="80" y="268" fill="#9b6dff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">2 - Patchwork</text>
<text x="80" y="288" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Yarvin</text>
<text x="80" y="305" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">2008</text>
<text x="330" y="272" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">del reino, por contrato: el</text>
<text x="330" y="291" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">derecho de salida es una</text>
<text x="330" y="310" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">clausula del servicio al</text>
<text x="330" y="329" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">cliente, no un derecho</text>
<text x="650" y="272" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">quien no sea peligroso y pueda</text>
<text x="650" y="291" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">pagarlo, y solo si otro parche lo</text>
<text x="650" y="310" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">acepta. Es la unica lectura que</text>
<text x="650" y="329" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">pregunta a donde van los demas</text>

<!-- fila 3 -->
<rect x="60" y="358" width="880" height="106" rx="14" fill="#55ddff" opacity="0.12" stroke="#55ddff" stroke-width="1.5"/>
<text x="80" y="386" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">3 - Escape</text>
<text x="80" y="406" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Thiel</text>
<text x="80" y="423" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">2009</text>
<text x="330" y="390" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">la politica entera, no de un</text>
<text x="330" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">gobierno concreto: hacia el</text>
<text x="330" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">mar, el espacio o el</text>
<text x="330" y="447" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">ciberespacio</text>
<text x="650" y="390" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">quien pueda pagar la</text>
<text x="650" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">infraestructura de la salida. El</text>
<text x="650" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">propio texto lo dice: puede</text>
<text x="650" y="447" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">depender de una sola persona</text>

<!-- fila 4 -->
<rect x="60" y="476" width="880" height="106" rx="14" fill="#ffd166" opacity="0.12" stroke="#ffd166" stroke-width="1.5"/>
<text x="80" y="504" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" text-anchor="start">4 - Dark Enlightenment</text>
<text x="80" y="524" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">Land</text>
<text x="80" y="541" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="start">2012</text>
<text x="330" y="508" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">la democracia como forma</text>
<text x="330" y="527" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">de vida, no como sistema</text>
<text x="330" y="546" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">electoral: la parte 4a incluye</text>
<text x="330" y="565" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">mudarse de barrio</text>
<text x="650" y="508" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">quien tenga a donde irse. Si</text>
<text x="650" y="527" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">describe al que se queda: casas</text>
<text x="650" y="546" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">fortificadas, calles evitadas,</text>
<text x="650" y="565" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="12.5" text-anchor="start">pandillas. No lo liga a la salida</text>

<!-- cierre -->
<rect x="60" y="596" width="880" height="52" rx="12" fill="#9b6dff" opacity="0.16" stroke="#9b6dff" stroke-width="1.5"/>
<text x="500" y="618" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">LO QUE EL PROPIO DISENO DEJA ABIERTO</text>
<text x="500" y="638" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13.5" text-anchor="middle">Patchwork pregunta a donde van los que no pueden pagar, y contesta en el capitulo que no leemos</text>
