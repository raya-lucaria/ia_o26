content:
  title: Leer el cuadernillo del módulo 2
  instructions: >-
    Antes de la sesión, leer las cuatro lecturas del cuadernillo «The Left
    Takes the Future Back»: Williams y Srnicek, «#ACCELERATE: Manifesto for
    an Accelerationist Politics»; Fisher, Capitalist Realism (cap. 4);
    Srnicek y Williams, Inventing the Future (cap. 6); y Terranova, «Red
    Stack Attack!». Van las cuatro en un solo archivo de 53 páginas, entre
    tres horas y media y cuatro; cada una trae su portadilla con la razón
    por la que se lee. Se lee en el navegador o se descarga desde la página
    del módulo. Esta tarea es leer: no hay cuestionario ni nada que
    entregar.
  due: "2026-08-17"
  status: published
  tags:
    - lectura
    - aceleracionismo
    - izquierda
