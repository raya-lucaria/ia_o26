id: leer-cuadernillo-long-future
type: task
authority: official
content:
  title: Preparar las lecturas del módulo 4
  instructions: >-
    Antes de la sesión, leer cinco textos y leer o escuchar el primero del
    cuadernillo «Moloch, Rationality & the Long Future»: Alexander,
    «Meditations on Moloch»; Yudkowsky, «What Do We Mean By "Rationality"?»;
    la Declaración Transhumanista de Humanity+; el apunte del curso
    «Genealogies of the Engineered Future»; Bostrom, «Astronomical Waste»; y
    Greaves y MacAskill, «The Case for Strong Longtermism», secciones 1 a 4 y
    10. Van las seis en
    un solo archivo de 78 páginas, entre tres horas y tres y media; cada una
    trae su portadilla con la razón por la que se lee. Se lee en el navegador
    o se descarga desde la página del módulo. Aviso: la primera lectura es la
    más larga de la unidad —catorce mil trescientas palabras, casi la mitad
    del cuadernillo—, así que conviene empezar temprano y no dejarla para la
    noche anterior. Para «Meditations on Moloch» puedes leer el texto del
    cuadernillo o escuchar las ocho partes en YouTube:
    https://www.youtube.com/watch?v=SeohwQls2GE. El apunte del curso se
    escribió con ayuda de un modelo de lenguaje, y lo dice en su primera
    página. La tarea es preparar las seis lecturas: no hay cuestionario ni nada
    que entregar.
  due: "2026-08-24"
  status: published
  tags:
    - lectura
