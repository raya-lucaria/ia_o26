id: leer-cuadernillo-exit-nrx
type: task
authority: official
content:
  title: Leer el cuadernillo del módulo 3
  instructions: >-
    Antes de la sesión, leer las cuatro lecturas del cuadernillo «Exit, NRx &
    Dark Enlightenment»: Yarvin (como «Mencius Moldbug»), «A Formalist
    Manifesto»; Yarvin, Patchwork, cap. 1 «A Positive Vision»; Thiel, «The
    Education of a Libertarian»; y Land, The Dark Enlightenment, partes 1 y
    4a. Van las cuatro en un solo archivo de 45 páginas, entre una hora y
    treinta y cinco y una hora y cincuenta; cada una trae su portadilla con la
    razón por la que se lee. Se lee en el navegador o se descarga desde la
    página del módulo. Aviso: la parte 4a de Land habla de raza en términos
    que este curso no comparte, y va en el cuadernillo como fuente primaria;
    la página del módulo explica por qué se lee y con qué criterio. Esta tarea
    es leer: no hay cuestionario ni nada que entregar.
  due: "2026-08-19"
  status: published
  tags:
    - lectura
    - aceleracionismo
    - neorreaccion
