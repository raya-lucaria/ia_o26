id: leer-cuadernillo-accelerate
type: task
authority: official
content:
  title: Leer los documentos del módulo 1
  instructions: >-
    Leer las seis lecturas del cuadernillo «¿Accelerate What?» antes de la
    sesión: Marx, «Fragmento sobre las máquinas»; CCRU, «Swarmachines»; Land,
    «Meltdown»; Barbrook y Cameron, «La ideología californiana»; Deleuze y
    Guattari, El Anti-Edipo; y Fisher, «Terminator vs Avatar». Van las seis en
    un solo archivo de 55 páginas, entre tres horas y media y cuatro. Se lee en
    el navegador o se descarga desde la página del módulo. No hay nada que
    entregar: llega con la pregunta de Fisher en la cabeza, si hay que
    acelerar, ¿acelerar qué?
  status: published
  tags:
    - lectura
    - aceleracionismo
