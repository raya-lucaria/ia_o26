id: leer-cuadernillo-accelerate
type: task
authority: official
content:
  title: Leer el cuadernillo y contestar el cuestionario
  instructions: >-
    Antes de la sesión, dos cosas. Primero, leer las seis lecturas del
    cuadernillo «¿Accelerate What?»: Marx, «Fragmento sobre las máquinas»; CCRU,
    «Swarmachines»; Land, «Meltdown»; Barbrook y Cameron, «La ideología
    californiana»; Deleuze y Guattari, El Anti-Edipo; y Fisher, «Terminator vs
    Avatar». Van las seis en un solo archivo de 55 páginas, entre tres horas y
    media y cuatro; se lee en el navegador o se descarga desde la página del
    módulo. Segundo, contestar el cuestionario en
    https://forms.gle/bBHJVMfvKFEr599s5 — es lo único que se entrega, y se
    contesta después de leer, no antes. Llega a clase con la pregunta de Fisher
    en la cabeza: si hay que acelerar, ¿acelerar qué?
  status: published
  tags:
    - lectura
    - cuestionario
    - aceleracionismo
