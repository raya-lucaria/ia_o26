content:
  title: Leer el cuadernillo del módulo 1
  instructions: >-
    Leer las seis lecturas del cuadernillo «¿Accelerate What?» antes de la
    sesión. Son 55 páginas, entre tres horas y media y cuatro. Se lee en el
    navegador o se descarga desde la página del módulo; no hay nada que
    entregar. Llega con la pregunta de Fisher en la cabeza: si hay que
    acelerar, ¿acelerar qué?
  status: published
  tags:
    - lectura
    - aceleracionismo
