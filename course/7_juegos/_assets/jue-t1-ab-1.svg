<svg xmlns="http://www.w3.org/2000/svg" width="600" height="938" viewBox="0 0 600 938" role="img" aria-label="DECIDIR-ALFA-BETA sobre la etapa 1 del árbol T, paso 1 (fila 5 de la traza). Arriba, la banda del pseudocódigo: línea 4: w ← ALFA-BETA(T(s, a), α, +∞); línea 5: if w &gt; α: α ← w ; mejor_jugada ← a. I devuelve w = 3. Recuadro: mejor_jugada = izq · α = 3. En el árbol: R en la pila; I ya devolvió v = 3; D por mirar. Abajo, la recta numérica: w = 3 &gt; α = −∞: α ← 3. R ya tiene asegurado 3: a D le pasa α = 3."><title>Alfa-beta en T1 · paso 1. I devuelve 3: α = 3</title><desc>DECIDIR-ALFA-BETA sobre la etapa 1 del árbol T, paso 1 (fila 5 de la traza). Arriba, la banda del pseudocódigo: línea 4: w ← ALFA-BETA(T(s, a), α, +∞); línea 5: if w &gt; α: α ← w ; mejor_jugada ← a. I devuelve w = 3. Recuadro: mejor_jugada = izq · α = 3. En el árbol: R en la pila; I ya devolvió v = 3; D por mirar. Abajo, la recta numérica: w = 3 &gt; α = −∞: α ← 3. R ya tiene asegurado 3: a D le pasa α = 3.</desc><rect x="0" y="0" width="600" height="938" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">Alfa-beta en T1 · paso 1</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">I devuelve 3: α = 3</text><rect x="12" y="80" width="576" height="89" rx="8" fill="#361647" stroke="#f04cff" stroke-width="1.5"/><text x="40" y="105" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="end">4</text><text x