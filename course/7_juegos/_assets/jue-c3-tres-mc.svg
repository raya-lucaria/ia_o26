<svg xmlns="http://www.w3.org/2000/svg" width="300" height="736" viewBox="0 0 300 736" role="img" aria-label="Los tres Monte Carlo en el árbol de resultados, por jugada de la raíz. Exactos: Q(s_raíz, a), con juego óptimo: izq −1, centro 0, der −1; Q_azar, si los dos juegan al azar: izq 0, centro −1/4, der +1/3. Con 40 partidas o vueltas y semilla 0: Monte Carlo plano, que tiende a Q_azar: izq +0.75, centro 0, der +0.22, con N 8, 14, 18; entrega izq. Actualización minimax, que tiende a Q: izq −1, centro 0, der −1, con N 8, 14, 18; entrega centro. UCT con c = 1, que tiende a Q: izq −0.6, centro 0, der −0.33, con N 5, 26, 9; entrega centro, la más visitada. Con más partidas, el plano iría a der; los otros dos, a centro."><title>Tres Monte Carlo · en el árbol de resultados cada jugada de la raíz</title><desc>Los tres Monte Carlo en el árbol de resultados, por jugada de la raíz. Exactos: Q(s_raíz, a), con juego óptimo: izq −1, centro 0, der −1; Q_azar, si los dos juegan al azar: izq 0, centro −1/4, der +1/3. Con 40 partidas o vueltas y semilla 0: Monte Carlo plano, que tiende a Q_azar: izq +0.75, centro 0, der +0.22, con N 8, 14, 18; entrega izq. Actualización minimax, que tiende a Q: izq −1, centro 0, der −1, con N 8, 14, 18; entrega centro. UCT con c = 1, que tiende a Q: izq −0.6, centro 0, der −0.33, con N 5, 26, 9; entrega centro, la más visitada. Con más partidas, el plano iría a der; los otros dos, a centro.</desc><rect x="0" y="0" width="300" height="736" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Tres Monte Carlo</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">en el árbol de resultados</text><text x="20" y="77" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">cada jugada de la raíz</text><text x="176" y="120" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">izq</text><text x="226" y="120" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">centro</text><text x="274" y="120" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">der</text><line x1="20" y1="136" x2="280" y2="136" stroke="#78419e" stroke-width="1.5"/><text x="20" y="160" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Exactos</text><text x="20" y="188" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Q</text><text x="20" y="208" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">juego óptimo</text><text x="176" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−1</text><rect x="215.0" y="176.0" width="22" height="26" rx="7" fill="#f04cff" stroke="#f04cff" stroke-width="1.5"/><text x="226" y="194.0" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">0</text><text x="274" y="194" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−1</text><text x="20" y="254" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start"><tspan>Q</tspan><tspan dy="4.8" font-size="11.5">azar</tspan></text><text x="20" y="279" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">los dos al azar</text><text x="176" y="260" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">0</text><text x="226" y="260" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−1/4</text><rect x="251.0" y="242.0" width="46" height="26" rx="7" fill="#f04cff" stroke="#f04cff" stroke-width="1.5"/><text x="274" y="260.0" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">+1/3</text><line x1="20" y1="300" x2="280" y2="300" stroke="#78419e" stroke-width="1.5"/><text x="20" y="324" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">40 partidas, semilla 0</text><text x="20" y="346" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">40 partidas; la raíz también al azar</text><text x="20" y="370" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Monte Carlo</text><text x="20" y="389" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">plano</text><text x="20" y="409" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start"><tspan>tiende a </tspan><tspan>Q</tspan><tspan dy="3.9" font-size="9.4">azar</tspan></text><rect x="148.5" y="380.0" width="55" height="26" rx="7" fill="#f04cff" stroke="#f04cff" stroke-width="1.5"/><text x="176" y="398.0" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">+0.75</text><text x="176" y="424" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">N 8</text><text x="226" y="398" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight=