" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="start">tiende a Q</text><text x="176" y="552" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−0.6</text><text x="176" y="578" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">N 5</text><rect x="215.0" y="534.0" width="22" height="26" rx="7" fill="#f04cff" stroke="#f04cff" stroke-width="1.5"/><text x="226" y="552.0" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">0</text><text x="226" y="578" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">N 26</text><text x="274" y="552" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">−0.33</text><text x="274" y="578" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">N 9</text><text x="20" y="616" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Resaltada: la jugada de cada</text><text x="20" y="640" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">fila (UCT entrega la más</text><text x="20" y="664" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">visitada). Con más partidas,</text><text x="20" y="688" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">el plano iría a der; los otros</text><text x="20" y="712" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">dos, a centro.</text></svg>