<svg xmlns="http://www.w3.org/2000/svg" width="300" height="749" viewBox="0 0 300 749" role="img" aria-label="Diagrama de flujo de minimax, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo y repite con él desde arriba. 3: Al volver de él: MAX se queda con el mayor; MIN, el menor. 4, pregunta: ¿Quedan hijos? Si no, sigue abajo. 5: Vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 6: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 4 (sí), vuelve al paso 2."><title>Minimax, en palabras · recorre todo el árbol</title><desc>Diagrama de flujo de minimax, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo y repite con él desde arriba. 3: Al volver de él: MAX se queda con el mayor; MIN, el menor. 4, pregunta: ¿Quedan hijos? Si no, sigue abajo. 5: Vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 6: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 4 (sí), vuelve al paso 2.</desc><rect x="0" y="0" width="300" height="749" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Minimax, en palabras</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">recorre todo el árbol</text><text x="40" y="91" fill="#c8b9d8