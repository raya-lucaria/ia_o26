amily="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">queda bajo el corte y no se ve.</text><text x="20" y="728.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Es una trampa.</text><text x="20" y="755.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Finales en la escala 100·U.</text><rect x="16" y="778.0" width="30" height="20" rx="4" fill="#311e37" stroke="#ffd166" stroke-width="2" stroke-dasharray="5 4"/><text x="56" y="794.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de corte, con EVAL</text><circle cx="230" cy="788.0" r="11" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="4 3"/><text x="230" y="794.0" fill="#78419e" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">?</text><text x="256" y="794.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">no se genera</text></svg>