 x="28" y="162.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">mejor_jugada = der</text><text x="28" y="188.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">mejor_valor = 7</text><line x1="16" y1="366.0" x2="584" y2="366.0" stroke="#f04cff" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="331.5" y="353.0" width="161" height="26" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="412" y="371.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">horizonte: d = 1</text><text x="20" y="647.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">der parece valer 7 (EVAL);</text><text x="20" y="674.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">su valor real es 2.</text><text x="20" y="701.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">El horizonte esconde lo que pasa</text><text x="20" y="728.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">abajo: es una trampa.</text></svg>