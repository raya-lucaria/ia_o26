eight="700" text-anchor="middle">α = 3</text><text x="330" y="234" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">ya tiene 3</text><rect x="70.0" y="340.0" width="200" height="120" rx="10" fill="#311e37" stroke="#ffd166" stroke-width="2"/><text x="170" y="370" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MIN</text><text x="170" y="410" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">= 3</text><text x="170" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">min{3, 5}</text><rect x="390.0" y="340.0" width="200" height="120" rx="10" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="8 6"/><text x="490" y="378" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MIN</text><text x="490" y="420" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">por mirar</text><circle cx="90" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="90" cy="600" r="34" fill="#2a2136" stroke="#a8ff5a" stroke-width="2"/><text x="90" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text><circle cx="250" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="250" cy="600" r="34" fill="#2a2136" stroke="#a8ff5a" stroke-width="2"/><text x="250" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text><circle cx="410" cy="600" r="34" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="7 6"/><text x="410" y="610" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">2</text><circle cx="570" cy="600" r