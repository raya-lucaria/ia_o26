<svg xmlns="http://www.w3.org/2000/svg" width="300" height="648" viewBox="0 0 300 648" role="img" aria-label="El árbol T±: la forma del árbol T, con 15 nodos porque D tiene 3 hijos y no 2. La raíz R es de MAX; izq lleva a I, centro a C y der a D, los tres de MIN. I tiene las hojas i1 = +1 y ix = −1; ix es una captura de MIN. C tiene dos hijos de MAX: C1, con c1a = 0 y c1b = −1, y C2, con c2a = +1 y c2b = −1. D tiene las hojas d1 = −1, d2 = +1 y d3 = +1. Cada hoja es un final con su U: +1 gana MAX, −1 gana MIN, 0 empate."><title>El árbol T± · T con finales en U</title><desc>El árbol T±: la forma del árbol T, con 15 nodos porque D tiene 3 hijos y no 2. La raíz R es de MAX; izq lleva a I, centro a C y der a D, los tres de MIN. I tiene las hojas i1 = +1 y ix = −1; ix es una captura de MIN. C tiene dos hijos de MAX: C1, con c1a = 0 y c1b = −1, y C2, con c2a = +1 y c2b = −1. D tiene las hojas d1 = −1, d2 = +1 y d3 = +1. Cada hoja es un final con su U: +1 gana MAX, −1 gana MIN, 0 empate.</desc><rect x="0" y="0" width="300" height="648" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">El árbol T±</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">T con finales en U</text><line x1="98" y1="146" x2="38" y2="222.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="45.0" y="171.0" width="46" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="68.0" y="189.0" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regula