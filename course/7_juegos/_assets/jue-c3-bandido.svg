<svg xmlns="http://www.w3.org/2000/svg" width="520" height="702" viewBox="0 0 520 702" role="img" aria-label="Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: fracción de las primeras N(s) vueltas que fueron a la mejor jugada, x, de 0 a 1, acumulada desde la vuelta 1. Cada punto es el promedio de 40 corridas con semilla fija; promedios verdaderos x: 0.6, y: 0.3, z: −0.2. De N(s) = 10 a N(s) = 10 000: siempre el mejor promedio, 0.61 a 0.85; a veces al azar (10 %), 0.60 a 0.93; UCB, c = 2√2, 0.42 a 0.94; UCB, c = 1, 0.54 a 0.99. Siempre el mejor promedio se aplana; a veces al azar se queda cerca de 0.93 porque sigue tirando al azar; UCB empieza abajo, porque explora, y sigue subiendo; con c = 1 explora menos y llega antes."><title>Cuánto va a la mejor jugada μ de x, y, z: 0.6, 0.3, −0.2</title><desc>Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: fracción de las primeras N(s) vueltas que fueron a la mejor jugada, x, de 0 a 1, acumulada desde la vuelta 1. Cada punto es el promedio de 40 corridas con semilla fija; promedios verdaderos x: 0.6, y: 0.3, z: −0.2. De N(s) = 10 a N(s) = 10 000: siempre el mejor promedio, 0.61 a 0.85; a veces al azar (10 %), 0.60 a 0.93; UCB, c = 2√2, 0.42 a 0.94; UCB, c = 1, 0.54 a 0.99. Siempre el mejor promedio se aplana; a veces al azar se queda cerca de 0.93 porque sigue tirando al azar; UCB empieza abajo, porque explora, y sigue subiendo; con c = 1 explora menos y llega antes.</desc><rect x="0" y="0" width="520" height="702" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" fo