<svg xmlns="http://www.w3.org/2000/svg" width="520" height="658" viewBox="0 0 520 658" role="img" aria-label="Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: fracción de las vueltas que fueron a la mejor jugada, x, de 0 a 1. Promedio de 40 corridas con semilla fija; promedios verdaderos x: 0.6, y: 0.3, z: −0.2. De N(s) = 10 a N(s) = 10 000: siempre el mejor promedio, 0.61 a 0.85; a veces al azar (10 %), 0.60 a 0.93; UCB, c = 2√2, 0.42 a 0.94; UCB, c = 1, 0.54 a 0.99. Siempre el mejor promedio se aplana; a veces al azar no pasa de 0.93 porque sigue tirando al azar; UCB empieza abajo, porque explora, y sigue subiendo; con c = 1 explora menos y llega antes."><title>Cuánto va a la mejor jugada μ de x, y, z: 0.6, 0.3, −0.2</title><desc>Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: fracción de las vueltas que fueron a la mejor jugada, x, de 0 a 1. Promedio de 40 corridas con semilla fija; promedios verdaderos x: 0.6, y: 0.3, z: −0.2. De N(s) = 10 a N(s) = 10 000: siempre el mejor promedio, 0.61 a 0.85; a veces al azar (10 %), 0.60 a 0.93; UCB, c = 2√2, 0.42 a 0.94; UCB, c = 1, 0.54 a 0.99. Siempre el mejor promedio se aplana; a veces al azar no pasa de 0.93 porque sigue tirando al azar; UCB empieza abajo, porque explora, y sigue subiendo; con c = 1 explora menos y llega antes.</desc><rect x="0" y="0" width="520" height="658" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Cuánto va a la mejor jugada</text><text x="20" y="59" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">μ de x, y, z: 0.6, 0.3, −0.2</text><line x1="78" y1="396.0" x2="490" y2="396.0" stroke="#5e327e" stroke-width="1"/><text x="70" y="401.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">0</text><line x1="78" y1="326.0" x2="490" y2="326.0" stroke="#5e327e" stroke-width="1"/><text x="70" y="331.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">0.25</text><line x1="78" y1="256.0" x2="490" y2="256.0" stroke="#5e327e" stroke-width="1"/><text x="70" y="261.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">0.5</text><line x1="78" y1="186.0" x2="490" y2="186.0" stroke="#5e327e" stroke-width="1"/><text x="70" y="191.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">0.75</text><line x1="78" y1="116.0" x2="490" y2="116.0" stroke="#5e327e" stroke-width="1"/><text x="70" y="121.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="end">1</text><line x1="78.0" y1="116" x2="78.0" y2="396" stroke="#5e327e" stroke-width="1"/><text x="78.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10</text><line x1="215.3" y1="116" x2="215.3" y2="396" stroke="#5e327e" stroke-width="1"/><text x="215.3" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">100</text><line x1="352.7" y1="116" x2="352.7" y2="396" stroke="#5e327e" stroke-width="1"/><text x="352.7" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1 000</text><line x1="490.0" y1="116" x2="490.0" y2="396" stroke="#5e327e" stroke-width="1"/><text x="490.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-s