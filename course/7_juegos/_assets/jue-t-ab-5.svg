<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1119" viewBox="0 0 600 1119" role="img" aria-label="DECIDIR-ALFA-BETA sobre el árbol base, paso 5: el final (fila 20). Arriba, la banda del pseudocódigo: línea 6: return mejor_jugada. Decidir devuelve centro. Recuadro: mejor_jugada = centro · α = 5. En el árbol: I ya devolvió v = 3; C ya devolvió v = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 7 (una cota); la hoja 8 no se genera; D ya devolvió v = 2 (una cota); la hoja 12 no se genera. Abajo, la recta numérica: la ventana de R, (5, +∞). Dos cortes, dos hojas sin generar: 12 de 14 nodos. La misma jugada que minimax: centro."><title>Alfa-beta en el árbol base · paso 5 · 12 de 14 nodos, juega centro</title><desc>DECIDIR-ALFA-BETA sobre el árbol base, paso 5: el final (fila 20). Arriba, la banda del pseudocódigo: línea 6: return mejor_jugada. Decidir devuelve centro. Recuadro: mejor_jugada = centro · α = 5. En el árbol: I ya devolvió v = 3; C ya devolvió v = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 7 (una cota); la hoja 8 no se genera; D ya devolvió v = 2 (una cota); la hoja 12 no se genera. Abajo, la recta numérica: la ventana de R, (5, +∞). Dos cortes, dos hojas sin generar: 12 de 14 nodos. La misma jugada que minimax: centro.</desc><rect x="0" y="0" width="600" height="1119" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">Alfa-beta en el árbol base</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">paso 5 · 12 de 14 nodos,</text><