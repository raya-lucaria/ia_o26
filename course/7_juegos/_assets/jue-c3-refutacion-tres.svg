<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1374" viewBox="0 0 300 1374" role="img" aria-label="La refutación descubierta tarde, en tres paneles con el mismo eje y: Q̂ en la escala del juego, de +10 a −30. MAX elige A o B; tras A, MIN elige entre +10, +10 y una jugada r que lleva a −30; B es un final −10. Lo correcto es B. Paneles 1 y 2, la misma secuencia impuesta, no una corrida: B una vez, 29 partidas por A que terminan en +10 y al final la que descubre el −30. 1, promedio, Monte Carlo plano: Q̂(A) baja de 10 a 8.67 y sigue entregando A; su límite es Q_azar(A) = −10/3, mayor que −10. 2, actualización minimax: Q̂(A) salta de 10 a −30 y entrega B. 3, UCT, una corrida real con c = 1, semilla 0 y 60 vueltas, que corre con los pagos divididos entre 30 y se dibuja de vuelta en la escala del juego: el primer −30 sale en la vuelta 5; Q̂(A) baja poco a poco hasta −20, con N(A) = 12 y N(B) = 48; entrega B, la más visitada, desde la vuelta 15."><title>Una refutación que · aparece tarde A: +10, +10 o −30; B: −10</title><desc>La refutación descubierta tarde, en tres paneles con el mismo eje y: Q̂ en la escala del juego, de +10 a −30. MAX elige A o B; tras A, MIN elige entre +10, +10 y una jugada r que lleva a −30; B es un final −10. Lo correcto es B. Paneles 1 y 2, la misma secuencia impuesta, no una corrida: B una vez, 29 partidas por A que terminan en +10 y al final la que descubre el −30. 1, promedio, Monte Carlo plano: Q̂(A) baja de 10 a 8.67 y sigue entregando A; su límite es Q_azar(A) = −10/3, mayor que −10. 2, actualización minimax: Q̂(A) salta de 10 a −30 y entrega B. 3, UCT, una corrida real con c = 1, semilla 0 y 60 vueltas, que corre con los pagos divididos entre 30 y se dibuja de vuelta en la escala del juego: el primer −30 sale en la vuelta 5; Q̂(A) baja poco a poco hasta −20, con N(A) = 12 y N(B) = 48; entrega B, la más visitada, desde la vuelta 15.</desc><rect x="0" y="0" width="300" height="1374" rx="16" fill="#211033"/><defs><marker id="p" vie