<svg xmlns="http://www.w3.org/2000/svg" width="600" height="872" viewBox="0 0 600 872" role="img" aria-label="DECIDIR-MINIMAX sobre el árbol T, paso 2 (fila 12 de la traza): a media ejecución, con la pila R, C, C2. Arriba, la banda del pseudocódigo: línea 12: w ← MINIMAX(T(s, a)); línea 13: v ← max(v, w). La hoja 7 devuelve w = 7. Recuadro: mejor_jugada = izq · mejor_valor = 3. En el árbol: R en la pila; I ya devolvió v = 3; C en la pila con v = 5; C1 ya devolvió v = 5; C2 en la pila con v = 7; D por mirar. En la pila, solo el camino R, C, C2. C1 ya devolvió 5: su llamada terminó; en C solo queda su v = 5."><title>Minimax en T · paso 2. A media ejecución: R›C›C2</title><desc>DECIDIR-MINIMAX sobre el árbol T, paso 2 (fila 12 de la traza): a media ejecución, con la pila R, C, C2. Arriba, la banda del pseudocódigo: línea 12: w ← MINIMAX(T(s, a)); línea 13: v ← max(v, w). La hoja 7 devuelve w = 7. Recuadro: mejor_jugada = izq · mejor_valor = 3. En el árbol: R en la pila; I ya devolvió v = 3; C en la pila con v = 5; C1 ya devolvió v = 5; C2 en la pila con v = 7; D por mirar. En la pila, solo el camino R, C, C2. C1 ya devolvió 5: su llamada terminó; en C solo queda su v = 5.</desc><rect x="0" y="0" width="600" height="872" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">Minimax en T · paso 2</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">A media ejecución: R›C›C2</text><rect x="12" y="80" width="576" height="64" rx="8" fill="#361647" stroke="#f