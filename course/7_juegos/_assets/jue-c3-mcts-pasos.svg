<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-label="Cuatro paneles con el mismo árbol; cada nodo dice victorias de MAX entre simulaciones. 1, selección: desde la raíz se baja por el camino resaltado, eligiendo en cada nodo al hijo con mejor puntaje para quien mueve ahí: MAX en la raíz, MIN en el nodo 3/6, que baja por 0/2, donde MAX ganó menos. 2, expansión: se agrega un hijo nuevo, 0/0. 3, simulación: desde ese hijo se juega una partida al azar hasta un final, que aquí gana MAX, U = +1. 4, retropropagación: el resultado sube por el camino y cada nodo suma una simulación y una victoria: 4/10 pasa a 5/11."><title>Una vuelta de MCTS, en cuatro pasos</title><desc>Cuatro paneles con el mismo árbol; cada nodo dice victorias de MAX entre simulaciones. 1, selección: desde la raíz se baja por el camino resaltado, eligiendo en cada nodo al hijo con mejor puntaje para quien mueve ahí: MAX en la raíz, MIN en el nodo 3/6, que baja por 0/2, donde MAX ganó menos. 2, expansión: se agrega un hijo nuevo, 0/0. 3, simulación: desde ese hijo se juega una partida al azar hasta un final, que aquí gana MAX, U = +1. 4, retropropagación: el resultado sube por el camino y cada nodo suma una simulación y una victoria: 4/10 pasa a 5/11.</desc><rect x="0" y="0" width="700" height="940" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Una vuelta de MCTS, en cuatro pasos</text><rect x="17" y="66" width="325" height="400" rx="12" fill="#2b1640" stroke="#78419e" stroke-width="2"/><text x="179