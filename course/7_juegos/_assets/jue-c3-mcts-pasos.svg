<svg xmlns="http://www.w3.org/2000/svg" width="600" height="986" viewBox="0 0 600 986" role="img" aria-label="Cuatro paneles con el mismo árbol; cada nodo dice victorias de MAX entre simulaciones. 1, selección: desde la raíz se baja por el camino resaltado, eligiendo en cada nodo al hijo con mejor puntaje para quien mueve ahí: MAX en la raíz, MIN en el nodo 3/6, que baja por 0/2, donde MAX ganó menos. 2, expansión: se agrega un hijo nuevo, 0/0. 3, simulación: desde ese hijo se juega una partida al azar hasta un final, que aquí gana MAX, U = +1. 4, retropropagación: el resultado sube por el camino y cada nodo suma una simulación y una victoria: 4/10 pasa a 5/11."><title>Una vuelta de MCTS, en cuatro pasos</title><desc>Cuatro paneles con el mismo árbol; cada nodo dice victorias de MAX entre simulaciones. 1, selección: desde la raíz se baja por el camino resaltado, eligiendo en cada nodo al hijo con mejor puntaje para quien mueve ahí: MAX en la raíz, MIN en el nodo 3/6, que baja por 0/2, donde MAX ganó menos. 2, expansión: se agrega un hijo nuevo, 0/0. 3, simulación: desde ese hijo se juega una partida al azar hasta un final, que aquí gana MAX, U = +1. 4, retropropagación: el resultado sube por el camino y cada nodo suma una simulación y una victoria: 4/10 pasa a 5/11.</desc><rect x="0" y="0" width="600" height="986" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Una vuelta de MCTS,</text><text x="20" y="59" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">en cuatro pasos</text><rect x="12" y="90" width="282" height="400" rx="12" fill="#2b1640" stroke="#78419e" stroke-width="2"/><text x="153.0" y="122" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">1 · Selección</text><text x="153.0" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">baja por el mejor puntaje</text><line x1="168.0" y1="195" x2="113.0" y2="260" stroke="#f04cff" stroke-width="3"/><line x1="168.0" y1="195" x2="223.0" y2="260" stroke="#c8b9d8" stroke-width="2"/><line x1="113.0" y1="260" x2="73.0" y2="325" stroke="#c8b9d8" stroke-width="2"/><line x1="113.0" y1="260" x2="153.0" y2="325" stroke="#f04cff" stroke-width="3"/><circle cx="168.0" cy="195" r="24" fill="#211033" stroke="#f04cff" stroke-width="3"/><text x="168.0" y="200" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4/10</text><circle cx="113.0" cy="260" r="24" fill="#211033" stroke="#f04cff" stroke-width="3"/><text x="113.0" y="265" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3/6</text><circle cx="223.0" cy="260" r="24" fill="#211033" stroke="#55ddff" stroke-width="2"/><text x="223.0" y="265" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1/4</text><circle cx="73.0" cy="325" r="24" fill="#211033" stroke="#55ddff" stroke-width="2"/><text x="73.0" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2/3</text><circle cx="153.0" cy="325" r="24" fill="#211033" stroke="#f04cff" stroke-width="3"/><text x="153.0" y="330" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">0/2</text><text x="153.0" y="468" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle"