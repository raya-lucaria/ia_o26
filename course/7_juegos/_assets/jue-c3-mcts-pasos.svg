<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1070" viewBox="0 0 600 1070" role="img" aria-label="Cuatro paneles con el mismo árbol; cada nodo dice G/N: victorias de MAX entre simulaciones que pasaron por él. La raíz no simula: sus cuentas son la suma de las de sus hijos; cada otro nodo, su propia simulación más las de sus hijos. 1, selección: desde la raíz, 2/4, se baja por el camino resaltado eligiendo en cada nodo al hijo de mejor promedio para quien mueve ahí: MAX en la raíz elige 2/3; MIN en ese nodo elige 0/1, donde MAX ganó menos. 2, expansión: se agrega un hijo nuevo, 0/0. 3, simulación: desde ese hijo se juega una partida al azar hasta un final, que aquí gana MAX, U = +1. 4, retropropagación: cada nodo del camino suma una simulación y, como ganó MAX, una victoria: 2/4 pasa a 3/5, 2/3 pasa a 3/4, 0/1 pasa a 1/2, 0/0 pasa a 1/1."><title>Una vuelta de MCTS: la raíz pasa de 2/4 a 3/5</title><desc>Cuatro paneles con el mismo árbol; cada nodo dice G/N: victorias de MAX entre simulaciones que pasaron por él. La raíz no simula: sus cuentas son la suma de las de sus hijos; cada otro nodo, su propia simulación más las de sus hijos. 1, selección: desde la raíz, 2/4, se baja por el camino resaltado eligiendo en cada nodo al hijo de mejor promedio para quien mueve ahí: MAX en la raíz elige 2/3; MIN en ese nodo elige 0/1, donde MAX ganó menos. 2, expansión: se agrega un hijo nuevo, 0/0. 3, simulación: desde ese hijo se juega una partida al azar hasta un final, que aquí gana MAX, U = +1. 4, retropropagación: cada nodo del camino suma una simulación y, como ganó MAX, una victoria: 2/4 pasa a 3/5, 2/3 pasa a 3/4, 0/1 pasa a 1/2, 0/0 pasa a 1/1.</desc><rect x="0" y="0" width="600" height="1070" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" m