<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1206" viewBox="0 0 640 1206" role="img" aria-label="DECIDIR-ALFA-BETA sobre el árbol T, paso 3 (fila 12 de la traza). Arriba, la banda del pseudocódigo: línea 12: w ← ALFA-BETA(T(s, a), α, β); línea 13: v ← max(v, w); línea 14: if v ≥ β: return v. La hoja 7 devuelve w = 7. Recuadro: mejor_jugada = izq · α = 3. En el árbol: R en la pila; I ya devolvió v = 3; C en la pila con v = 5, α = 3, β = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 7 (una cota); la hoja 8 no se genera; D por mirar. Abajo, la recta numérica: v = 7 ≥ β = 5: corte beta. C2 compara su v con β, el número del rival que heredó; α es el suyo. C2 devuelve 7: una cota (su valor exacto es 8). A C le basta: con 7 ≥ 5, C no cambia su 5."><title>Alfa-beta en T · paso 3. Corte beta en C2</title><desc>DECIDIR-ALFA-BETA sobre el árbol T, paso 3 (fila 12 de la traza). Arriba, la banda del pseudocódigo: línea 12: w ← ALFA-BETA(T(s, a), α, β); línea 13: v ← max(v, w); línea 14: if v ≥ β: return v. La hoja 7 devuelve w = 7. Recuadro: mejor_jugada = izq · α = 3. En el árbol: R en la pila; I ya devolvió v = 3; C en la pila con v = 5, α = 3, β = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 7 (una cota); la hoja 8 no se genera; D por mirar. Abajo, la recta numérica: v = 7 ≥ β = 5: corte beta. C2 compara su v con β, el número del rival que heredó; α es el suyo. C2 devuelve 7: una cota (su valor exacto es 8). A C le basta: con 7 ≥ 5, C no cambia su 5.</desc><rect x="0" y="0" width="640" height="1206" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-wei