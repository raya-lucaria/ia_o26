<svg xmlns="http://www.w3.org/2000/svg" width="700" height="660" viewBox="0 0 700 660" role="img" aria-label="Una recta numérica de −∞ a +∞ con dos marcas, α y β. La banda entre ellas va resaltada: aquí el valor importa. A la izquierda de α, v ≤ α: corte alfa, en un nodo de MIN. A la derecha de β, v ≥ β: corte beta, en un nodo de MAX. El igual cuenta. Abajo, los dos árboles: en A, el MIN de la derecha tiene la ventana [3, +∞] y su hoja 2 cae a la izquierda; en B, el MAX de la derecha tiene [−∞, 8] y su hoja 9 cae a la derecha."><title>La ventana [α, β]</title><desc>Una recta numérica de −∞ a +∞ con dos marcas, α y β. La banda entre ellas va resaltada: aquí el valor importa. A la izquierda de α, v ≤ α: corte alfa, en un nodo de MIN. A la derecha de β, v ≥ β: corte beta, en un nodo de MAX. El igual cuenta. Abajo, los dos árboles: en A, el MIN de la derecha tiene la ventana [3, +∞] y su hoja 2 cae a la izquierda; en B, el MAX de la derecha tiene [−∞, 8] y su hoja 9 cae a la derecha.</desc><rect x="0" y="0" width="700" height="660" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">La ventana [α, β]</text><rect x="240" y="132" width="220" height="78" rx="6" fill="#4f1d60" stroke="#f04cff" stroke-width="2"/><text x="350.0" y="164" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">aquí el valor</text><text x="350.0" y="192" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">importa</text><line x1="30" y1="210" x2="240" y2="210" stroke="#c8b9d8" stroke-width="4"/><line x1="460" y1="210" x2="670" y2="210" stroke="#c8b9d8" stroke-width="4"/><line x1="240" y1="210" x2="460" y2="210" stroke="#f04cff" stroke-width="6"/><line x1="240" y1="196" x2="240" y2="224" stroke="#f04cff" stroke-width="3"/><text x="240" y="254" fill="#f04cff" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">α</text><line x1="460" y1="196" x2="460" y2="224" stroke="#f04cff" stroke-width="3"/><text x="460" y="254" fill="#f04cff" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">β</text><text x="30" y="254" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">−∞</text><text x="670" y="254" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">+∞</text><text x="135.0" y="164" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">v ≤ α:</text><text x="135.0" y="194" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">corte alfa</text><text x="135.0" y="288" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">(nodo de MIN)</text><text x="565.0" y="164" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">v ≥ β:</text><text x="565.0" y="194" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">corte beta</text><text x="565.0" y="288" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">(nodo de MAX)</text><text x="350.0" y="326" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">El igual cuenta: v = α o v = β ya corta.</text><text x="30" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">A · MIN derecho, [3, +∞]</text><line x1="30" y1="430" x2="670" y2="430" stroke="#c8b9d8" stroke-width="3"/><rect x="330" y="421" width="340" height="18" rx="4" fill="#4f1d60" stroke="#f04cff" stroke-width="2"/><line x1="330" y1="416" x2="330" y2="444" stroke="#f04cff" stroke-width="3"/><text x="330" y="470" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">α = 3</text><circle cx="250" cy="430" r="11" fill="#f7f2ff"/><text x="250" y="470" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">2</text><text x="670" y="386" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="end">2 ≤ 3: corte alfa</text><text x="30" y="526" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">B · MAX derecho, [−∞, 8]</text><line x1="30" y1="570" x2="670" y2="570" stroke="#c8b9d8" stroke-width="3"/><rect x="30" y="561" width="340" height="18" rx="4" fill="#4f1d60" stroke="#f04cff" stroke-width="2"/><line x1="370" y1="556" x2="370" y2="584" stroke="#f04cff" stroke-width="3"/><text x="370" y="610" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">β = 8</text><circle cx="450" cy="570" r="11" fill="#f7f2ff"/><text x="450" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">9</text><text x="670" y="526" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="end">9 ≥ 8: corte beta</text></svg>