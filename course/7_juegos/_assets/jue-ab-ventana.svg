<svg xmlns="http://www.w3.org/2000/svg" width="640" height="686" viewBox="0 0 640 686" role="img" aria-label="Una recta numérica de −∞ a +∞ con dos marcas, α y β. La banda entre ellas va resaltada: aquí el valor importa. A la izquierda de α, o en α, v ≤ α: corte alfa, en un nodo de MIN. A la derecha de β, o en β, v ≥ β: corte beta, en un nodo de MAX. El igual cuenta. Abajo, los dos cortes del árbol T: D llega con (5, +∞) y su hoja 2 cae a la izquierda de α; C2 llega con (3, 5) y su hoja 7 cae a la derecha de β."><title>La ventana (α, β)</title><desc>Una recta numérica de −∞ a +∞ con dos marcas, α y β. La banda entre ellas va resaltada: aquí el valor importa. A la izquierda de α, o en α, v ≤ α: corte alfa, en un nodo de MIN. A la derecha de β, o en β, v ≥ β: corte beta, en un nodo de MAX. El igual cuenta. Abajo, los dos cortes del árbol T: D llega con (5, +∞) y su hoja 2 cae a la izquierda de α; C2 llega con (3, 5) y su hoja 7 cae a la derecha de β.</desc><rect x="0" y="0" width="640" height="686" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="start">La ventana (α, β)</text><rect x="222" y="88" width="196" height="78" rx="6" fill="#4f1d60" stroke="#f04cff" stroke-width="2"/><text x="320.0" y="120" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">aquí el valor</text><text x="320.0" y="148" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">importa</text><line x1="24" y1="166" x2="222" y2="166" stroke="#c8b9d8" stroke-width="4"/><line x1="418" y1="166" x2="616" y2="166" stroke="#c8b9d8" stroke-width="4"/><line x1="222" y1="166" x2="418" y2="166" stroke="#f04cff" stroke-width="6"/><line x1="222" y1="152" x2="222" y2="180" stroke="#f04cff" stroke-width="3"/><text x="222" y="210" fill="#f04cff" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">α</text><line x1="418" y1="152" x2="418" y2="180" stroke="#f04cff" stroke-width="3"/><text x="418" y="210" fill="#f04cff" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">β</text><text x="24" y="210" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">−∞</text><text x="616" y="210" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="end">+∞</text><text x="123.0" y="120" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">v ≤ α:</text><text x="123.0" y="150" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">corte alfa</text><text x="123.0" y="244" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">(nodo de MIN)</text><text x="517.0" y="120" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">v ≥ β:</text><text x="517.0" y="150" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">corte beta</text><text x="517.0" y="244" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">(nodo de MAX)</text><text x="20" y="286" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">El igual cuenta:</text><text x="20" y="316" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">v = α o v = β ya corta.</text><text x="20" y="380" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">D llega con (5, +∞)</text><text x="20" y="410" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">2 ≤ 5: corte alfa</text><line x1="24" y1="456" x2="616" y2="456" stroke="#c8b9d8" stroke-width="3"/><rect x="274" y="447" width="332" height="18" rx="4" fill="#4f1d60" stroke="#f04cff" stroke-width="2"/><line x1="274" y1="442" x2="274" y2="470" stroke="#f04cff" stroke-width="3"/><text x="274" y="496" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">α = 5</text><circle cx="148" cy="456" r="11" fill="#f7f2ff"/><text x="148" y="438" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">v = 2</text><text x="20" y="550" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="start">C2 llega con (3, 5)</text><text x="20" y="580" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">7 ≥ 5: corte beta</text><line x1="24" y1="626" x2="616" y2="626" stroke="#c8b9d8" stroke-width="3"/><rect x="190" y="617" width="84" height="18" rx="4" fill="#4f1d60" stroke="#f04cff" stroke-width="2"/><line x1="190" y1="612" x2="190" y2="640" stroke="#f04cff" stroke-width="3"/><text x="190" y="666" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">α = 3</text><line x1="274" y1="612" x2="274" y2="640" stroke="#f04cff" stroke-width="3"/><text x="274" y="666" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">β = 5</text><circle cx="358" cy="626" r="11" fill="#f7f2ff"/><text x="358" y="608" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">v = 7</text></svg>