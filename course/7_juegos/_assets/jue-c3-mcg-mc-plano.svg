109" y="498" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">U</text><line x1="104" y1="129" x2="176" y2="167" stroke="#c8b9d8" stroke-width="2"/><polyline points="171.0,223.0 177.3,241.3 162.6,258.7 175.9,277.3 161.1,294.7 174.4,313.3 159.7,330.7 173.0,349.3 158.3,366.7 171.6,385.3 156.9,402.7 170.1,421.3 155.4,438.7 168.7,457.3 161.0,475.0" fill="none" stroke="#b23ac2" stroke-width="2" stroke-linejoin="round"/><circle cx="161" cy="493" r="12.5" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="161" cy="493" r="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="2"/><text x="161" y="498" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">U</text><polyline points="181.0,223.0 186.7,240.8 177.4,259.2 188.1,276.8 178.9,295.2 189.6,312.8 180.3,331.2 191.0,348.8 181.7,367.2 192.4,384.8 183.1,403.2 193.9,420.8 184.6,439.2 195.3,456.8 191.0,475.0" fill="none" stroke="#b23ac2" stroke-width="2" stroke-linejoin="round"/><circle cx="191" cy="493" r="12.5" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="191" cy="493" r="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="2"/><text x="191" y="498" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">U</text><circle cx="104" cy="113" r="15" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="104" y="118" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">s₀</text><rect x="7" y="169" width="54" height="54" rx="10" fill="#331f37" stroke="#ffd166" stroke-width="2"/><text x="34" y="190" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">N</text><text x="34" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q̂</text><text x="14" y="161" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">a₁</text><rect x="67" y="169" width="54" height="54" rx="10" fill="#331f37" stroke="#ffd166" stroke-width="2"/><text x="94" y="190" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">N</text><text x="94" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q̂</text><text x="74" y="161" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">a₂</text><circle cx="127" cy="197" r="2.5" fill="#c8b9d8"/><circle cx="135" cy="197" r="2.5" fill="#c8b9d8"/><circle cx="143" cy="197" r="2.5" fill="#c8b9d8"/><circle cx="127" cy="345.0" r="2.5" fill="#c8b9d8"/><circle cx="135" cy="345.0" r="2.5" fill="#c8b9d8"/><circle cx="143" cy="345.0" r="2.5" fill="#c8b9d8"/><rect x="149" y="169" width="54" height="54" rx="10" fill="#331f37" stroke="#ffd166" stroke-width="2"/><text x="176" y="190" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">N</text><text x="176" y="212" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Q̂</text><text x="166" y="161" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start"><tspan>a</tspan><tspan dy="4.2" font-size="10.1">b</tspan></text><text x="212" y="191" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">solo esto</text><text x="212" y="209" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">se guarda</text><text x="212" y="315.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">partidas</text><text x="212" y="333.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">al azar,</text><text x="212" y="351.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">para los</text><text x="212" y="369.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">dos; no se</text><text x="212" y="387.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">guardan</text><text x="212" y="498" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">finales</text><text x="20" y="543" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Cada final suma su U al</text><text x="20" y="567" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">contador de su jugada, y la</text><text x="20" y="591" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">partida se olvida. Con</text><text x="20" y="615" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">partidas independientes y la</text><text x="20" y="639" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">misma regla, Q̂ tiende al</text><text x="20" y="663" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">valor con todos al azar,</text><text x="20" y="687" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">no a V.</text></svg>