<svg xmlns="http://www.w3.org/2000/svg" width="300" height="711" viewBox="0 0 300 711" role="img" aria-label="Monte Carlo plano en un árbol grande, sin números: en la raíz s₀, cada jugada a₁, a₂, …, a_b tiene solo dos contadores, N y Q̂. Desde cada jugada bajan caminos quebrados, partidas jugadas al azar para los dos, hasta finales lejanos con su U; esos caminos no se guardan. Cada final suma su U al contador de su jugada. Con más partidas independientes y la misma regla, Q̂ converge a Q_azar, el valor con todos al azar, no a V."><title>Monte Carlo plano · en un árbol grande</title><desc>Monte Carlo plano en un árbol grande, sin números: en la raíz s₀, cada jugada a₁, a₂, …, a_b tiene solo dos contadores, N y Q̂. Desde cada jugada bajan caminos quebrados, partidas jugadas al azar para los dos, hasta finales lejanos con su U; esos caminos no se guardan. Cada final suma su U al contador de su jugada. Con más partidas independientes y la misma regla, Q̂ converge a Q_azar, el valor con todos al azar, no a V.</desc><rect x="0" y="0" width="300" height="711" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Monte Carlo plano</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">en un árbol grande</text><line x1="104" y1="129" x2="34" y2="167" stroke="#c8b9d8" stroke-width="2"/><polyline points="29.0,223.0 33.3,241.2 22.6,258.8 31.9,277.2 21.1,294.8 30.4,313.2 19.7,330.8 29.0,349.2 18.3,366.8 27.6,385.2 16.9,402.8 26.1,421.2 15.4,438.8 24.7,457.2 19.0,47