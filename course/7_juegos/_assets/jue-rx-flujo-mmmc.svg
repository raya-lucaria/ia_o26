<svg xmlns="http://www.w3.org/2000/svg" width="300" height="893" viewBox="0 0 300 893" role="img" aria-label="Diagrama de flujo de la actualización minimax, en palabras. 1: 1 · Una partida jugadas al azar, todas con la misma probabilidad, hasta un final. 2: 2 · Guarda lo nuevo agrega al árbol los estados que descubrió. 3: 3 · En el final z V̂(z) = U(z), exacto. 4: 4 · Sube por el camino Q̂(s,a) = V̂(T(s,a)); V̂(s): máximo en MAX, mínimo en MIN, solo sobre lo visitado. 5, pregunta: ¿Se acabó el tiempo? Si sí, sigue abajo. 6: Juega la jugada de la raíz con mayor Q̂. Desde el paso 5, si no: otra partida, vuelve al paso 1. Una jugada sin visitar es desconocida, nunca cero."><title>Actualización minimax, · en palabras</title><desc>Diagrama de flujo de la actualización minimax, en palabras. 1: 1 · Una partida jugadas al azar, todas con la misma probabilidad, hasta un final. 2: 2 · Guarda lo nuevo agrega al árbol los estados que descubrió. 3: 3 · En el final z V̂(z) = U(z), exacto. 4: 4 · Sube por el camino Q̂(s,a) = V̂(T(s,a)); V̂(s): máximo en MAX, mínimo en MIN, solo sobre lo visitado. 5, pregunta: ¿Se acabó el tiempo? Si sí, sigue abajo. 6: Juega la jugada de la raíz con mayor Q̂. Desde el paso 5, si no: otra partida, vuelve al paso 1. Una jugada sin visitar es desconocida, nunca cero.</desc><rect x="0" y="0" width="300" height="893" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Actualización minimax,</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">en palabras</text><rect x="46" y="95" width="242" height="104" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">1 · Una partida</text><text x="58" y="142" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">jugadas al azar, todas</text><text x="58" y="163" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con la misma probabilidad,</text><text x="58" y="184" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">hasta un final</text><line x1="116" y1="199" x2="116" y2="231" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="235" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="261" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">2 · Guarda lo nuevo</text><text x="58" y="282" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">agrega al árbol los</text><text x="58" y="303" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">estados que descubrió</text><line x1="116" y1="318" x2="116" y2="350" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="354" width="242" height="62" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="380" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">3 · En el final z</text><text x="58" y="401" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">V̂(z) = U(z), exacto</text><line x1="116" y1="416" x2="116" y2="448" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="452" width="242" height="125" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="478" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">4 · Sube por el camino</text><text x="58" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Q̂(s,a) = V̂(T(s,a));</text><text x="58" y="520" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">V̂(s): máximo en MAX,</text><text x="58" y="541" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">mínimo en MIN, solo</text><text x="58" y="562" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">sobre lo visitado</text><line x1="116" y1="577" x2="116" y2="609" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="116,613 186,663 116,713 46,663" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="116" y="658" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Se acabó</text><text x="116" y="678" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">el tiempo?</text><line x1="116" y1="713" x2="116" y2="745" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="124" y="731" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">sí</text><rect x="46" y="749" width="242" height="62" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="58" y="775" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="58" y="796" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de la raíz con mayor Q̂</text><polyline points="46,663 28,663 28,147.0" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="28" y1="147.0" x2="43" y2="147.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="19" y="405.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 19 405.0)">no: otra partida</text><text x="20" y="845" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Una jugada sin visitar es</text><text x="20" y="869" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">desconocida, nunca cero.</text></svg>