<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-label="Árbol A, paso 3. El MIN de la derecha ya se generó: llega con [3, +∞]. Su primera hoja, 2, va resaltada, y el nodo muestra v = 2 ≤ 3. La segunda hoja, «?», aún no se mira."><title>Árbol A · 3. La derecha empieza con 2</title><desc>Árbol A, paso 3. El MIN de la derecha ya se generó: llega con [3, +∞]. Su primera hoja, 2, va resaltada, y el nodo muestra v = 2 ≤ 3. La segunda hoja, «?», aún no se mira.</desc><rect x="0" y="0" width="700" height="780" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Árbol A · 3. La derecha empieza con 2</text><line x1="330" y1="250.0" x2="170" y2="332.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="170" y1="460.0" x2="90" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="170" y1="460.0" x2="250" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="330" y1="250.0" x2="490" y2="332.0" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><rect x="352.5" y="275.0" width="115" height="32" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="410.0" y="298.9" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle">[3, +∞]</text><line x1="490" y1="460.0" x2="410" y2="553" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><line x1="490" y1="460.0" x2="570" y2="561" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><rect x="230.0" y="130.0" width="200" height="120" rx="10" fill="#251e41" stroke="#55ddff" stroke-width="2"/><text x="330" y="160" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MAX</text><text x="330" y="200" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">α = 3</text><text x="330" y="234" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">ya tiene 3</text><rect x="70.0" y="340.0" width="200" height="120" rx="10" fill="#311e37" stroke="#ffd166" stroke-width="2"/><text x="170" y="370" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MIN</text><text x="170" y="410" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">= 3</text><text x="170" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">min{3, 5}</text><rect x="390.0" y="340.0" width="200" height="120" rx="10" fill="#452f3b" stroke="#f04cff" stroke-width="3.5"/><text x="490" y="370" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MIN</text><text x="490" y="418" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">v = 2 ≤ 3</text><circle cx="90" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="90" cy="600" r="34" fill="#2a2136" stroke="#a8ff5a" stroke-width="2"/><text x="90" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">3</text><circle cx="250" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="250" cy="600" r="34" fill="#2a2136" stroke="#a8ff5a" stroke-width="2"/><text x="250" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">5</text><circle cx="410" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="410" cy="600" r="34" fill="#373639" stroke="#f04cff" stroke-width="3.5"/><text x="410" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">2</text><circle cx="570" cy="600" r="34" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="7 6"/><text x="570" y="610" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">?</text><text x="350.0" y="710" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">El MIN de la derecha llega con [3, +∞].</text><text x="350.0" y="742" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Su primera hoja da 2, y 2 ≤ 3.</text></svg>