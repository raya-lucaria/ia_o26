<svg xmlns="http://www.w3.org/2000/svg" width="300" height="823" viewBox="0 0 300 823" role="img" aria-label="Dos paneles del mismo nodo de MIN, al que lleva la jugada A, con sus dos respuestas: una a un final +1 y otra a un final −1. El grosor de cada rama es cuántas vueltas pasaron por ella. Con pocas vueltas, las dos ramas tienen grosor parecido, mitad y mitad, y el promedio ū(A) es cercano a 0. Con muchas vueltas, la rama a −1 es muy gruesa y la de +1 delgada: casi todas van a −1, y ū(A) tiende a −1, el mínimo. Las proporciones son ilustrativas: UCT elige cada vez más la respuesta buena para MIN."><title>Un promedio que · se vuelve un mínimo</title><desc>Dos paneles del mismo nodo de MIN, al que lleva la jugada A, con sus dos respuestas: una a un final +1 y otra a un final −1. El grosor de cada rama es cuántas vueltas pasaron por ella. Con pocas vueltas, las dos ramas tienen grosor parecido, mitad y mitad, y el promedio ū(A) es cercano a 0. Con muchas vueltas, la rama a −1 es muy gruesa y la de +1 delgada: casi todas van a −1, y ū(A) tiende a −1, el mínimo. Las proporciones son ilustrativas: UCT elige cada vez más la respuesta buena para MIN.</desc><rect x="0" y="0" width="300" height="823" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Un promedio que</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">se vuelve un mínimo</text><line x1="20" y1="101" x2="280" y2="101" stroke="#78419e" stroke-width="1.5"/><text x="20" y="127" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">Pocas vueltas</text><line x1="110" y1="163" x2="110" y2="229" stroke="#c8b9d8" stroke-width="2.5"/><rect x="116.5" y="184.0" width="79" height="24" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="156" y="201.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">jugada A</text><line x1="110" y1="229" x2="52" y2="333" stroke="#c8b9d8" stroke-width="6" stroke-linecap="round"/><line x1="110" y1="229" x2="168" y2="333" stroke="#c8b9d8" stroke-width="6" stroke-linecap="round"/><circle cx="110" cy="163" r="13" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="110" y="168" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">s</text><circle cx="110" cy="229" r="16" fill="#3c2739" stroke="#ffd166" stroke-width="2"/><text x="110" y="234" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">A</text><text x="136" y="234" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">MIN</text><circle cx="52" cy="333" r="18.5" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="52" cy="333" r="16" fill="#2c2336" stroke="#a8ff5a" stroke-width="2"/><text x="52" y="338" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+1</text><circle cx="168" cy="333" r="18.5" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="168" cy="333" r="16" fill="#2c2336" stroke="#a8ff5a" stroke-width="2"/><text x="168" y="338" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">−1</text><text x="196" y="277.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">≈ mitad</text><text x="196" y="295.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">y mitad</text><rect x="66.0" y="365.0" width="88" height="28" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="110" y="384.8" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ū(A) ≈ 0</text><line x1="20" y1="423" x2="280" y2="423" stroke="#78419e" stroke-width="1.5"/><text x="20" y="449" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">Muchas vueltas</text><line x1="110" y1="485" x2="110" y2="551" stroke="#c8b9d8" stroke-width="2.5"/><rect x="116.5" y="506.0" width="79" height="24" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="156" y="523.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">jugada A</text><line x1="110" y1="551" x2="52" y2="655" stroke="#c8b9d8" stroke-width="2" stroke-linecap="round"/><line x1="110" y1="551" x2="168" y2="655" stroke="#c8b9d8" stroke-width="14" stroke-linecap="round"/><circle cx="110" cy="485" r="13" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="110" y="490" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">s</text><circle cx="110" cy="551" r="16" fill="#3c2739" stroke="#ffd166" stroke-width="2"/><text x="110" y="556" fill="#ffd166" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">A</text><text x="136" y="556" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">MIN</text><circle cx="52" cy="655" r="18.5" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="52" cy="655" r="16" fill="#2c2336" stroke="#a8ff5a" stroke-width="2"/><text x="52" y="660" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+1</text><circle cx="168" cy="655" r="18.5" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="168" cy="655" r="16" fill="#2c2336" stroke="#a8ff5a" stroke-width="2"/><text x="168" y="660" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">−1</text><text x="196" y="599.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">casi todas</text><text x="196" y="617.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">a −1</text><rect x="61.0" y="687.0" width="98" height="28" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="110" y="706.8" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">ū(A) → −1</text><text x="20" y="751" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Proporciones ilustrativas:</text><text x="20" y="775" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">UCT elige cada vez más la</text><text x="20" y="799" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">respuesta buena para MIN.</text></svg>