"system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Baja al siguiente</text><text x="50" y="273" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">hijo y repite con él</text><text x="50" y="294" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">desde arriba</text><line x1="100" y1="308" x2="100" y2="336" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">cuando vuelve</text><rect x="40" y="340" width="218" height="60" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="365" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Al volver de él</text><text x="50" y="386" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con su valor w:</text><line x1="100" y1="400" x2="100" y2="428" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,432 158,468 100,504 42,468" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="473" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿AZAR?</text><line x1="158" y1="468" x2="171" y2="468" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="166.0" y="460" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="174" y="442.0" width="84" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="216.0" y="463.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">suma</text><text x="216.0" y="482.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Pr(a|s)·w</text><line x1="100" y1="504" x2="100" y2="532" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="524" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="536" width="194" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="561" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Se queda con:</text><text x="50" y="582" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MAX, el mayor;</text><text x="50" y="603" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MIN, el menor</text><line x1="100" y1="617" x2="100" y2="645" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,649 158,695 100,741 42,695" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="690" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Quedan</text><text x="100" y="710" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">hijos?</text><line x1="100" y1="741" x2="100" y2="769" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="761" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="773" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="798" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Si no es la raíz:</text><text x="50" y="819" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">vuelve al padre</text><text x="50" y="840" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con su valor</text><line x1="258" y1="813.5" x2="276" y2="813.5" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="854" x2="100" y2="882" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="874" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">si es la raíz</text><rect x="40" y="886" width="218" height="60" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="911" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="50" y="932" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de mayor valor</text><line x1="246" y1="494.0" x2="246" y2="695" stroke="#c8b9d8" stroke-width="2"/><line x1="246" y1="695" x2="161" y2="695" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="159" x2="276" y2="370.0" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="256.5" x2="276" y2="268.5" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="813.5" x2="276" y2="370.0" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="599.75" x2="276" y2="587.75" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="370.0" x2="261" y2="370.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="288" y="264.5" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(90 288 264.5)">vuelve al padre</text><polyline points="40,251.3 24,251.3 24,159" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="159" x2="39" y2="159" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="205.15" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 205.15)">con el hijo</text><polyline points="42,695 24,695 24,285.32" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="285.32" x2="37" y2="285.32" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="490.15999999999997" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 490.15999999999997)">sí</text><text x="20" y="980" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Un nodo de AZAR no elige:</text><text x="20" y="1004" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">promedia sus hijos con su</text><text x="20" y="1028" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">probabilidad Pr(a|s).</text></svg>