<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1052" viewBox="0 0 300 1052" role="img" aria-label="Diagrama de flujo de expectiminimax, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo y repite con él desde arriba. 3: Al volver de él con su valor w:. 4, pregunta: ¿AZAR? Si sí: suma Pr(a|s)·w,. Si no, sigue abajo. 5: Se queda con: MAX, el mayor; MIN, el menor. 6, pregunta: ¿Quedan hijos? Si no, sigue abajo. 7: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 8: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 6 (sí), vuelve al paso 2. Desde «suma Pr(a|s)·w» sigue al paso 6, ¿Quedan hijos?. Un nodo de AZAR no elige: promedia sus hijos con su probabilidad Pr(a|s)."><title>Expectiminimax, · en palabras</title><desc>Diagrama de flujo de expectiminimax, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo y repite con él desde arriba. 3: Al volver de él con su valor w:. 4, pregunta: ¿AZAR? Si sí: suma Pr(a|s)·w,. Si no, sigue abajo. 5: Se queda con: MAX, el mayor; MIN, el menor. 6, pregunta: ¿Quedan hijos? Si no, sigue abajo. 7: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 8: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 6 (sí), vuelve al paso 2. Desde «suma Pr(a|s)·w» sigue al paso 6, ¿Quedan hijos?. Un nodo de AZAR no elige: promedia sus hijos con su probabilidad Pr(a|s).</desc><rect x="0" y="0" width="300" height="1052" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" re