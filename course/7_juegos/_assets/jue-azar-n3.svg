<svg xmlns="http://www.w3.org/2000/svg" width="700" height="800" viewBox="0 0 700 800" role="img" aria-label="n3 dibujado como nodo de azar: nadie elige, cada una de las tres jugadas de Negras sale con probabilidad 1/3. Sus hijos valen n4 = +1, n6 = +1, n13 = −1. El nodo vale su promedio, 1/3."><title>Si Negras eligiera al azar en n3</title><desc>n3 dibujado como nodo de azar: nadie elige, cada una de las tres jugadas de Negras sale con probabilidad 1/3. Sus hijos valen n4 = +1, n6 = +1, n13 = −1. El nodo vale su promedio, 1/3.</desc><rect x="0" y="0" width="700" height="800" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Si Negras eligiera al azar en n3</text><text x="350.0" y="68" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Desde s₀ con las jugadas a1-a2, b3-b2, c1xb2 se llega a n3</text><line x1="350.0" y1="305.0" x2="120.0" y2="407.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="184.0" y="342.0" width="102" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="235.0" y="361.0" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">a3xb2: ⅓</text><line x1="350.0" y1="305.0" x2="350.0" y2="407.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="299.0" y="342.0" width="102" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="350.0" y="361.0" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">c3-c2: ⅓</text><line x1="350.0" y1="305.0" x2="580.0" y2="407.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="414.0" y="342.0" width="102" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="465.0" y="361.0" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">c3xb2: ⅓</text><rect x="260.0" y="115.0" width="180" height="190" rx="45" fill="#433454" stroke="#f04cff" stroke-width="3.5"/><text x="350.0" y="141.4" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19.2" font-weight="700" text-anchor="middle">n3</text><rect x="302.0" y="153.4" width="96" height="96" rx="3" fill="#3f2158" stroke="#c8b9d8" stroke-width="1"/><line x1="334.0" y1="153.4" x2="334.0" y2="249.4" stroke="#c8b9d8" stroke-width="1"/><line x1="302.0" y1="185.4" x2="398.0" y2="185.4" stroke="#c8b9d8" stroke-width="1"/><line x1="366.0" y1="153.4" x2="366.0" y2="249.4" stroke="#c8b9d8" stroke-width="1"/><line x1="302.0" y1="217.4" x2="398.0" y2="217.4" stroke="#c8b9d8" stroke-width="1"/><circle cx="350.0" cy="233.4" r="13.4" fill="#f7f2ff"/><text x="350.0" y="240.3" fill="#211033" font-family="system-ui, sans-serif" font-size="19.2" font-weight="700" text-anchor="middle">B</text><circle cx="318.0" cy="201.4" r="13.4" fill="#f7f2ff"/><text x="318.0" y="208.3" fill="#211033" font-family="system-ui, sans-serif" font-size="19.2" font-weight="700" text-anchor="middle">B</text><circle cx="350.0" cy="201.4" r="13.4" fill="#f7f2ff"/><text x="350.0" y="208.3" fill="#211033" font-family="system-ui, sans-serif" font-size="19.2" font-weight="700" text-anchor="middle">B</text><circle cx="318.0" cy="169.4" r="13.4" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="318.0" y="176.3" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19.2" font-weight="700" text-anchor="middle">N</text>