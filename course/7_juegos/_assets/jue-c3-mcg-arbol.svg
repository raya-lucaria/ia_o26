<svg xmlns="http://www.w3.org/2000/svg" width="300" height="495" viewBox="0 0 300 495" role="img" aria-label="Un árbol de juego grande, dibujado sin números: desde la raíz s₀, de MAX, salen b jugadas (se dibujan tres y unos puntos suspensivos); cada nodo de MIN vuelve a tener b hijos, y así, con puntos suspensivos hacia abajo, hasta los finales, cada uno con su U. Una flecha marca la profundidad: a lo más m jugadas de la raíz a un final. MAX y MIN se turnan nivel por nivel."><title>Un árbol grande · b por nodo, m de hondo</title><desc>Un árbol de juego grande, dibujado sin números: desde la raíz s₀, de MAX, salen b jugadas (se dibujan tres y unos puntos suspensivos); cada nodo de MIN vuelve a tener b hijos, y así, con puntos suspensivos hacia abajo, hasta los finales, cada uno con su U. Una flecha marca la profundidad: a lo más m jugadas de la raíz a un final. MAX y MIN se turnan nivel por nivel.</desc><rect x="0" y="0" width="300" height="495" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Un árbol grande</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">b por nodo, m de hondo</text><line x1="102" y1="128" x2="32" y2="178" stroke="#c8b9d8" stroke-width="2"/><line x1="32" y1="200" x2="15" y2="242" stroke="#c8b9d8" stroke-width="2"/><line x1="32" y1="200" x2="49" y2="242" stroke="#c8b9d8" stroke-width="2"/><circle cx="32" cy="287" r="2.5" fill="#c8b9d8"/><circle cx="32" cy="295" r="2.5" fill="#c8b9d8"/><circle cx="32" cy="303" r="2.5" fill="