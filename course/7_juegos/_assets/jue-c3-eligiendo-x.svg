<svg xmlns="http://www.w3.org/2000/svg" width="300" height="698" viewBox="0 0 300 698" role="img" aria-label="Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: porcentaje de las 40 corridas que eligen x en esa vuelta, no acumulado, de 40 % a 100 %; cada punto cuenta las vueltas N(s) − 9 a N(s) de las 40 corridas, 400 elecciones. En N(s) = 10, 100, 1 000 y 10 000: siempre el mejor promedio, 61.3 %, 85 %, 85 % y 85 %; a veces al azar (10 %), 60.3 %, 84 %, 93 % y 92.5 %; UCB, c = 2√2, 41.8 %, 65 %, 91.8 % y 98.8 %; UCB, c = 1, 54.5 %, 83.3 %, 99.5 % y 100 %. Siempre el mejor promedio se aplana en 34 de 40, 85 %: las 6 atoradas nunca eligen x. A veces al azar se queda cerca de 0.9 + 0.1/3 = 93.3 %. Las dos UCB suben hacia 100 %."><title>¿Cuántas corridas eligen x? cada punto: % de las 40 corridas que eligen x en esa vuelta (promedio de las vueltas N(s) − 9 a N(s))</title><desc>Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: porcentaje de las 40 corridas que eligen x en esa vuelta, no acumulado, de 40 % a 100 %; cada punto cuenta las vueltas N(s) − 9 a N(s) de las 40 corridas, 400 elecciones. En N(s) = 10, 100, 1 000 y 10 000: siempre el mejor promedio, 61.3 %, 85 %, 85 % y 85 %; a veces al azar (10 %), 60.3 %, 84 %, 93 % y 92.5 %; UCB, c = 2√2, 41.8 %, 65 %, 91.8 % y 98.8 %; UCB, c = 1, 54.5 %, 83.3 %, 99.5 % y 100 %. Siempre el mejor promedio se aplana en 34 de 40, 85 %: las 6 atoradas nunca eligen x. A veces al azar se queda cerca de 0.9 + 0.1/3 = 93.3 %. Las dos UCB suben hacia 100 %.</desc><rect x="0" y="0" width="300" height="698" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="