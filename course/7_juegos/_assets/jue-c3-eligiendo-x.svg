-size="14" font-weight="normal" text-anchor="middle">100</text><line x1="198.7" y1="162" x2="198.7" y2="402" stroke="#5e327e" stroke-width="1"/><text x="198.7" y="424" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1 000</text><line x1="270.0" y1="162" x2="270.0" y2="402" stroke="#5e327e" stroke-width="1"/><text x="270.0" y="424" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10 000</text><line x1="56" y1="402" x2="270" y2="402" stroke="#c8b9d8" stroke-width="2"/><line x1="56" y1="162" x2="56" y2="402" stroke="#c8b9d8" stroke-width="2"/><text x="163.0" y="450" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">N(s): vueltas (escala log)</text><text x="12" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">elecciones que van a x (%),</text><text x="12" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">en esas 10 vueltas</text><polyline points="56.0,317.0 77.5,258.0 105.9,223.0 127.3,222.0 148.8,222.0 177.2,222.0 198.7,222.0 220.1,222.0 248.5,222.0 270.0,222.0" fill="none" stroke="#ffd166" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/><rect x="52.0" y="313.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="73.5" y="254.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="101.9" y="219.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="123.3" y="218.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="144.8" y="218.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="173.2" y="218.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="194.7" y="218.0" width="8" height="