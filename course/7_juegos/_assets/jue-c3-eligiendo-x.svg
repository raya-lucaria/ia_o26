 stroke="#5e327e" stroke-width="1"/><text x="127.3" y="446" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">100</text><line x1="198.7" y1="184" x2="198.7" y2="424" stroke="#5e327e" stroke-width="1"/><text x="198.7" y="446" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">1 000</text><line x1="270.0" y1="184" x2="270.0" y2="424" stroke="#5e327e" stroke-width="1"/><text x="270.0" y="446" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">10 000</text><line x1="56" y1="424" x2="270" y2="424" stroke="#c8b9d8" stroke-width="2"/><line x1="56" y1="184" x2="56" y2="424" stroke="#c8b9d8" stroke-width="2"/><text x="163.0" y="472" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">N(s): vueltas (escala log)</text><text x="12" y="146" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">corridas que eligen x (%),</text><text x="12" y="168" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">en esa vuelta, no acumulado</text><polyline points="56.0,339.0 77.5,280.0 105.9,245.0 127.3,244.0 148.8,244.0 177.2,244.0 198.7,244.0 220.1,244.0 248.5,244.0 270.0,244.0" fill="none" stroke="#ffd166" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/><rect x="52.0" y="335.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="73.5" y="276.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="101.9" y="241.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="123.3" y="240.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="144.8" y="240.0" width="8" height="8" fill="#211033" stroke="#ffd166" stroke-width="2"/><rect x="173.2" y=