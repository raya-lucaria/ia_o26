<svg xmlns="http://www.w3.org/2000/svg" width="300" height="712" viewBox="0 0 300 712" role="img" aria-label="Diagrama de flujo de corte, en palabras. 1: Baja un nivel y resta 1 a d. 2, pregunta: ¿Es un final? Si sí: vale 100·U. Si no, sigue abajo. 3, pregunta: ¿Se acabó d? Si sí: vale EVAL. Si no, sigue abajo. 4: Sube su valor MAX toma el mayor; MIN, el menor. 5: Juega la mejor jugada de la raíz. Desde el paso 4, si quedan jugadas, vuelve al paso 1. Por reloj: repite con d = 1, 2, 3… y juega la de la última búsqueda completa."><title>Corte, en palabras · minimax que para en d</title><desc>Diagrama de flujo de corte, en palabras. 1: Baja un nivel y resta 1 a d. 2, pregunta: ¿Es un final? Si sí: vale 100·U. Si no, sigue abajo. 3, pregunta: ¿Se acabó d? Si sí: vale EVAL. Si no, sigue abajo. 4: Sube su valor MAX toma el mayor; MIN, el menor. 5: Juega la mejor jugada de la raíz. Desde el paso 4, si quedan jugadas, vuelve al paso 1. Por reloj: repite con d = 1, 2, 3… y juega la de la última búsqueda completa.</desc><rect x="0" y="0" width="300" height="712" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Corte, en palabras</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">minimax que para en d</text><rect x="46" y="95" width="242" height="62" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Baja un nivel</text><text x="58" y="142" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">y resta 1 a d</text><line x1="116" y1="157" x2="116" y2="189" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="116,193 186,233 116,273 46,233" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="116" y="238" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Es un final?</text><line x1="186" y1="233" x2="209" y2="233" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="199.0" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="212" y="207.0" width="76" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="250.0" y="228.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">vale</text><text x="250.0" y="247.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">100·U</text><line x1="116" y1="273" x2="116" y2="305" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="124" y="291" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><polygon points="116,309 186,349 116,389 46,349" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="116" y="354" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Se acabó d?</text><line x1="186" y1="349" x2="209" y2="349" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="199.0" y="341" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="212" y="323.0" width="76" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="250.0" y="344.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">vale</text><text x="250.0" y="363.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">EVAL</text><line x1="116" y1="389" x2="116" y2="421" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="124" y="407" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="46" y="425" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="451" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Sube su valor</text><text x="58" y="472" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MAX toma el mayor;</text><text x="58" y="493" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MIN, el menor</text><line x1="116" y1="508" x2="116" y2="540" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="544" width="242" height="62" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="58" y="570" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la mejor</text><text x="58" y="591" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">jugada de la raíz</text><polyline points="46,466.5 28,466.5 28,126.0" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="28" y1="126.0" x2="43" y2="126.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="19" y="296.25" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 19 296.25)">quedan jugadas</text><text x="20" y="640" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Por reloj: repite con d = 1, 2,</text><text x="20" y="664" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">3… y juega la de la última</text><text x="20" y="688" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">búsqueda completa.</text></svg>