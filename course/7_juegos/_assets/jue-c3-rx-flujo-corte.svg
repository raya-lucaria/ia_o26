<svg xmlns="http://www.w3.org/2000/svg" width="300" height="960" viewBox="0 0 300 960" role="img" aria-label="Diagrama de flujo de corte, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale 100·U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2, pregunta: ¿d = 0? Si sí: vale EVAL, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 3: Baja al siguiente hijo con d − 1 y repite desde arriba. 4: Al volver de él: MAX se queda con el mayor; MIN, el menor. 5, pregunta: ¿Quedan hijos? Si no, sigue abajo. 6: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 7: Juega la jugada de mayor valor. Desde el paso 3 (con el hijo), vuelve al paso 1. Desde el paso 5 (sí), vuelve al paso 3. Por reloj: repite con d = 1, 2, 3… y juega la de la última búsqueda completa."><title>Corte, en palabras · minimax que para en d</title><desc>Diagrama de flujo de corte, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale 100·U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2, pregunta: ¿d = 0? Si sí: vale EVAL, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 3: Baja al siguiente hijo con d − 1 y repite desde arriba. 4: Al volver de él: MAX se queda con el mayor; MIN, el menor. 5, pregunta: ¿Quedan hijos? Si no, sigue abajo. 6: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 7: Juega la jugada de mayor valor. Desde el paso 3 (con el hijo), vuelve al paso 1. Desde el paso 5 (sí), vuelve al paso 3. Por reloj: repite con d = 1, 2, 3… y juega la de la última búsqueda completa.</desc><rect x="0" y="0" width="300" height="960" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Corte, en palabras</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">minimax que para en d</text><text x="40" y="91" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza en la raíz</text><line x1="100" y1="101" x2="100" y2="119" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,123 158,159 100,195 42,159" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="164" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Es final?</text><line x1="158" y1="159" x2="171" y2="159" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="166.0" y="151" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="174" y="133.0" width="84" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="216.0" y="154.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">vale</text><text x="216.0" y="173.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">100·U</text><line x1="258" y1="159" x2="276" y2="159" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="195" x2="100" y2="223" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="215" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><polygon points="100,227 158,263 100,299 42,263" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="268" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿d = 0?</text><line x1="158" y1="263" x2="171" y2="263" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="166.0" y="255" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="174" y="237.0" width="84" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="216.0" y="258.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">vale</text><text x="216.0" y="277.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">EVAL</text><line x1="258" y1="263" x2="276" y2="263" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="299" x2="100" y2="327" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="319" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="331" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Baja al siguiente</text><text x="50" y="377" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">hijo con d − 1 y</text><text x="50" y="398" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">repite desde arriba</text><line x1="100" y1="412" x2="100" y2="440" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="432" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">cuando vuelve</text><rect x="40" y="444" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="469" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Al volver de él:</text><text x="50" y="490" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MAX se queda con el</text><text x="50" y="511" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">mayor; MIN, el menor</text><line x1="100" y1="525" x2="100" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,557 158,603 100,649 42,603" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="598" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Quedan</text><text x="100" y="618" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">hijos?</text><line x1="100" y1="649" x2="100" y2="677" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="669" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="681" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="706" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Si no es la raíz:</text><text x="50" y="727" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">vuelve al padre</text><text x="50" y="748" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con su valor</text><line x1="258" y1="721.5" x2="276" y2="721.5" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="762" x2="100" y2="790" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="782" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">si es la raíz</text><rect x="40" y="794" width="218" height="60" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="819" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="50" y="840" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de mayor valor</text><line x1="276" y1="159" x2="276" y2="484.5" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="313.75" x2="276" y2="325.75" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="721.5" x2="276" y2="484.5" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="611.0" x2="276" y2="599.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="484.5" x2="261" y2="484.5" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="288" y="321.75" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(90 288 321.75)">vuelve al padre</text><polyline points="40,355.3 24,355.3 24,159" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="159" x2="39" y2="159" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="257.15" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 257.15)">con el hijo</text><polyline points="42,603 24,603 24,389.32" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="389.32" x2="37" y2="389.32" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="496.15999999999997" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 496.15999999999997)">sí</text><text x="20" y="888" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Por reloj: repite con d = 1, 2,</text><text x="20" y="912" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">3… y juega la de la última</text><text x="20" y="936" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">búsqueda completa.</text></svg>