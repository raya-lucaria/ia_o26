<svg xmlns="http://www.w3.org/2000/svg" width="600" height="845" viewBox="0 0 600 845" role="img" aria-label="El árbol de resultados con corte a profundidad 2; sus finales van en la escala 100·U: +100 gana MAX, −100 gana MIN, 0 empate. Una línea punteada marca dónde se corta, bajo el nivel 2; lo que queda debajo no se genera y va en caja o círculo punteado con «?». C1 recibe EVAL = 10; C2 recibe EVAL = 50; finales alcanzados arriba del corte: 100, −100. I vale −100; C vale 10; D todavía por mirar. Tramo 1: R recibe w = 10 de C, y mejor_jugada pasa de izq a centro. Se han generado 7 de 15 nodos."><title>Corte con d = 2, tramo 1 · centro sube a 10</title><desc>El árbol de resultados con corte a profundidad 2; sus finales van en la escala 100·U: +100 gana MAX, −100 gana MIN, 0 empate. Una línea punteada marca dónde se corta, bajo el nivel 2; lo que queda debajo no se genera y va en caja o círculo punteado con «?». C1 recibe EVAL = 10; C2 recibe EVAL = 50; finales alcanzados arriba del corte: 100, −100. I vale −100; C vale 10; D todavía por mirar. Tramo 1: R recibe w = 10 de C, y mejor_jugada pasa de izq a centro. Se han generado 7 de 15 nodos.</desc><rect x="0" y="0" width="600" height="845" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">Corte con d = 2, tramo 1</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">centro sube a 10</text><text x="20" y="96" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-an