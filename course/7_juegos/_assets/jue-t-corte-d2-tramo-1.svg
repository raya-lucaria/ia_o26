3" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="375" y="586.0" fill="#78419e" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">?</text><rect x="456.0" y="284.0" width="108" height="70" rx="10" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="8 6"/><text x="510" y="311.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">D · MIN</text><circle cx="450" cy="449.0" r="24" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="450" y="454.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">−100</text><circle cx="510" cy="449.0" r="24" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="510" y="456.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">100</text><circle cx="570" cy="449.0" r="24" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="570" y="456.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">100</text><rect x="16" y="137.0" width="232" height="64" rx="6" fill="#211033" stroke="#f7f2ff" stroke-width="1.5"/><text x="28" y="162.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">mejor_jugada = centro</text><text x="28" y="188.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">mejor_valor = 10</text><line x1="16" y1="514.0" x2="584" y2="514.0" stroke="#f04cff" stroke-width="2.5" stroke-dasharray="10 7"/><rect x="354.5" y="501.0" width="231" height="26" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="470" y="519.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">corte (d = 2 en la raíz)</text><text x="20" y="647.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Tras izq y centro: centro vale 10;</text><text x="20" y="674.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">su valor real es 0. D todavía</text><text x="20" y="701.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">no se mira: es el tramo 2.</text><text x="20" y="728.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Finales en la escala 100·U.</text><rect x="16" y="751.0" width="30" height="20" rx="4" fill="#452f3b" stroke="#f04cff" stroke-width="3"/><text x="56" y="767.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">en la pila</text><line x1="231" y1="771.0" x2="231" y2="753.0" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><text x="256" y="767.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">acaba de devolver</text><rect x="16" y="781.0" width="30" height="20" rx="4" fill="none" stroke="#78419e" stroke-width="2" stroke-dasharray="5 4"/><text x="56" y="797.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">por mirar</text><rect x="216" y="781.0" width="30" height="20" rx="4" fill="#251e41" stroke="#55ddff" stroke-width="2" stroke-dasharray="5 4"/><text x="256" y="797.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de corte, con EVAL</text><circle cx="30" cy="821.0" r="11" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="4 3"/><text x="30" y="827.0" fill="#78419e" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="