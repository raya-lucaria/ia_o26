<svg xmlns="http://www.w3.org/2000/svg" width="600" height="625" viewBox="0 0 600 625" role="img" aria-label="El árbol T, sin valores en los nodos internos. La raíz R es de MAX y tiene tres jugadas: izq lleva a I, centro a C y der a D, los tres de MIN. I tiene las hojas 3 y 6. C tiene dos hijos de MAX: C1, por c1, con las hojas 5 y 2, y C2, por c2, con las hojas 7 y 8. D tiene las hojas 2 y 12. Las hojas, de izquierda a derecha: 3, 6, 5, 2, 7, 8, 2, 12. En total, 14 nodos. Cada hoja es un final: su número es lo que vale ese final."><title>El árbol T</title><desc>El árbol T, sin valores en los nodos internos. La raíz R es de MAX y tiene tres jugadas: izq lleva a I, centro a C y der a D, los tres de MIN. I tiene las hojas 3 y 6. C tiene dos hijos de MAX: C1, por c1, con las hojas 5 y 2, y C2, por c2, con las hojas 7 y 8. D tiene las hojas 2 y 12. Las hojas, de izquierda a derecha: 3, 6, 5, 2, 7, 8, 2, 12. En total, 14 nodos. Cada hoja es un final: su número es lo que vale ese final.</desc><rect x="0" y="0" width="600" height="625" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">El árbol T</text><line x1="314" y1="142.0" x2="68" y2="216.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="186.7" y="162.6" width="48" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="210.7" y="180.6" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">izq</text><line x1="68" y1="292.0" x2="38" y2="353.0" stroke="#c8b9d8"