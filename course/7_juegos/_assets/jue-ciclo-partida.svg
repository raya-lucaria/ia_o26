<svg xmlns="http://www.w3.org/2000/svg" width="700" height="745" viewBox="0 0 700 745" role="img" aria-label="Diagrama de flujo de una partida. Se entra con el estado inicial s₀. En cada vuelta se pregunta si el estado s terminó, es decir, si está en S_F; si sí, la partida sale con U(s), lo que vale el resultado. Si no, Pl(s) dice a quién le toca, A(s) qué jugadas puede hacer, el jugador elige una jugada a, y T(s, a) da el nuevo estado, con el que se vuelve arriba. La caja de elegir está resaltada: es la única que no dan las reglas, y es lo que queremos decidir."><title>Una partida, vuelta por vuelta</title><desc>Diagrama de flujo de una partida. Se entra con el estado inicial s₀. En cada vuelta se pregunta si el estado s terminó, es decir, si está en S_F; si sí, la partida sale con U(s), lo que vale el resultado. Si no, Pl(s) dice a quién le toca, A(s) qué jugadas puede hacer, el jugador elige una jugada a, y T(s, a) da el nuevo estado, con el que se vuelve arriba. La caja de elegir está resaltada: es la única que no dan las reglas, y es lo que queremos decidir.</desc><rect x="0" y="0" width="700" height="745" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Una partida, vuelta por vuelta</text><rect x="170" y="58" width="260" height="44" rx="22" fill="#343138" stroke="#a8ff5a" stroke-width="2"/><text x="300" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Empieza: s = s₀</text><line x1="300" y1="102" x2="300" y2="123" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="130.0" y="125.0" width="340" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="300" y="150" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Estado s</text><text x="300" y="174" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>un elemento de S</tspan></text><line x1="300" y1="185.0" x2="300" y2="208" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="300,210 450,262 300,314 150,262" fill="#293154" stroke="#408bad" stroke-width="2"/><text x="300" y="257" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿Terminó?</text><text x="300" y="281" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>¿s ∈ S</tspan><tspan dy="4.8" font-size="11.5">F</tspan><tspan dy="-4.8">?</tspan></text><line x1="450" y1="262" x2="496.0" y2="262" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="470" y="252" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">sí</text><rect x="495.0" y="205.0" width="190" height="114" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><rect x="500.0" y="210.0" width="180" height="104" rx="10" fill="#312d38" stroke="#a8ff5a" stroke-width="2"/><text x="590" y="244" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Fin de la partida</text><text x="590" y="270" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">U(s):</text><text x="590" y="294" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">cuánto vale</text><line x1="300" y1="314" x2="300" y2="337.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="314" y="336" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">no</text><rect x="130.0" y="339.0" width="340" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="300" y="364" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿A quién le toca?</text><text x="300" y="388" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>Pl(s): MAX o MIN</tspan></text><line x1="300" y1="399.0" x2="300" y2="424.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="130.0" y="426.0" width="340" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="300" y="451" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿Qué puede hacer?</text><text x="300" y="475" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>A(s): las jugadas permitidas</tspan></text><line x1="300" y1="486.0" x2="300" y2="509" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="130.0" y="511.0" width="340" height="72" rx="10" fill="#4a1c5c" stroke="#f04cff" stroke-width="4"/><text x="300" y="542" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Elige una jugada a ∈ A(s)</text><text x="300" y="566" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan>ninguna regla dice cuál</tspan></text><text x="492.0" y="521" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">Lo único que</text><text x="492.0" y="543" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">no dan las reglas:</text><text x="492.0" y="565" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">es lo que queremos</text><text x="492.0" y="587" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">decidir</text><line x1="300" y1="583" x2="300" y2="608.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="130.0" y="610.0" width="340" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="300" y="635" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿A dónde lleva?</text><text x="300" y="659" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>el nuevo estado T(s, a)</tspan></text><line x1="130.0" y1="640" x2="62" y2="640" stroke="#c8b9d8" stroke-width="2"/><line x1="62" y1="640" x2="62" y2="155" stroke="#c8b9d8" stroke-width="2"/><line x1="62" y1="155" x2="128.0" y2="155" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="48" y="397.5" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 48 397.5)">otra vuelta con el nuevo estado</text><rect x="110" y="699" width="30" height="22" rx="5" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="150" y="716" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">lo contestan las reglas</text><rect x="400" y="699" width="30" height="22" rx="5" fill="#4a1c5c" stroke="#f04cff" stroke-width="3"/><text x="440" y="716" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">lo decide el jugador</text></svg>