<svg xmlns="http://www.w3.org/2000/svg" width="600" height="769" viewBox="0 0 600 769" role="img" aria-label="Diagrama de flujo de una partida. Se entra con el estado inicial s₀. En cada vuelta se pregunta si el estado s terminó, es decir, si está en S_F; si sí, la partida sale con U(s), lo que vale el resultado. Si no, Pl(s) dice a quién le toca, A(s) qué jugadas puede hacer, el jugador elige una jugada a, y T(s, a) da el nuevo estado, con el que se vuelve arriba. La caja de elegir está resaltada: es la única que no dan las reglas, y es lo que queremos decidir."><title>Una partida, vuelta por vuelta</title><desc>Diagrama de flujo de una partida. Se entra con el estado inicial s₀. En cada vuelta se pregunta si el estado s terminó, es decir, si está en S_F; si sí, la partida sale con U(s), lo que vale el resultado. Si no, Pl(s) dice a quién le toca, A(s) qué jugadas puede hacer, el jugador elige una jugada a, y T(s, a) da el nuevo estado, con el que se vuelve arriba. La caja de elegir está resaltada: es la única que no dan las reglas, y es lo que queremos decidir.</desc><rect x="0" y="0" width="600" height="769" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Una partida,</text><text x="20" y="59" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">vuelta por vuelta</text><rect x="110" y="82" width="260" height="44" rx="22" fill="#343138" stroke="#a8ff5a" stroke-width="2"/><text x="240" y="111" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Empieza: s = s₀</text><line x1="240" y1="126" x2="240" y2="147" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="80.0" y="149.0" width="320" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="240" y="174" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Estado s</text><text x="240" y="198" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>un elemento de S</tspan></text><line x1="240" y1="209.0" x2="240" y2="232" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="240,234 380,286 240,338 100,286" fill="#293154" stroke="#408bad" stroke-width="2"/><text x="240" y="281" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿Terminó?</text><text x="240" y="305" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>¿s ∈ S</tspan><tspan dy="4.8" font-size="11.5">F</tspan><tspan dy="-4.8">?</tspan></text><line x1="380" y1="286" x2="421.0" y2="286" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="398" y="276" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">sí</text><rect x="420.0" y="229.0" width="170" height="114" rx="10" fill="none" stroke="#a8ff5a" stroke-width="2"/><rect x="425.0" y="234.0" width="160" height="104" rx="10" fill="#312d38" stroke="#a8ff5a" stroke-width="2"/><text x="505" y="268" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Fin de la partida</text><text x="505" y="294" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">U(s):</text><text x="505" y="318" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">cuánto vale</text><line x1="240" y1="338" x2="240" y2="361.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="254" y="360" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">no</text><rect x="80.0" y="363.0" width="320" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="240" y="388" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿A quién le toca?</text><text x="240" y="412" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>Pl(s): MAX o MIN</tspan></text><line x1="240" y1="423.0" x2="240" y2="448.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="80.0" y="450.0" width="320" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="240" y="475" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿Qué puede hacer?</text><text x="240" y="499" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>A(s): las jugadas permitidas</tspan></text><line x1="240" y1="510.0" x2="240" y2="533" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="80.0" y="535.0" width="320" height="72" rx="10" fill="#4a1c5c" stroke="#f04cff" stroke-width="4"/><text x="240" y="566" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Elige una jugada a ∈ A(s)</text><text x="240" y="590" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan>ninguna regla dice cuál</tspan></text><text x="416.0" y="535" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">Lo único que</text><text x="416.0" y="557" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">no dan las</text><text x="416.0" y="579" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">reglas: es lo</text><text x="416.0" y="601" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">que queremos</text><text x="416.0" y="623" fill="#f04cff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">decidir</text><line x1="240" y1="607" x2="240" y2="632.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="80.0" y="634.0" width="320" height="60" rx="10" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="240" y="659" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">¿A dónde lleva?</text><text x="240" y="683" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan>el nuevo estado T(s, a)</tspan></text><line x1="80.0" y1="664" x2="48" y2="664" stroke="#c8b9d8" stroke-width="2"/><line x1="48" y1="664" x2="48" y2="179" stroke="#c8b9d8" stroke-width="2"/><line x1="48" y1="179" x2="78.0" y2="179" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="34" y="421.5" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 34 421.5)">otra vuelta con el nuevo estado</text><rect x="20" y="723" width="30" height="22" rx="5" fill="#341b4b" stroke="#78419e" stroke-width="2"/><text x="60" y="740" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">lo contestan las reglas</text><rect x="300" y="723" width="30" height="22" rx="5" fill="#4a1c5c" stroke="#f04cff" stroke-width="3"/><text x="340" y="740" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">lo decide el jugador</text></svg>