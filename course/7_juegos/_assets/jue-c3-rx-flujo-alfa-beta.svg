<svg xmlns="http://www.w3.org/2000/svg" width="300" height="688" viewBox="0 0 300 688" role="img" aria-label="Diagrama de flujo de alfa-beta, en palabras. 1: Baja un nivel y lleva α y β. 2, pregunta: ¿Es un final? Si sí: vale su U. Si no, sigue abajo. 3: Sube su valor v MAX toma el mayor y sube α si lo supera. 4, pregunta: ¿v ≥ β? Si sí: poda: no genera los demás. Si no, sigue abajo. 5: Juega la jugada de la raíz con mayor V. Desde el paso 4, si quedan jugadas, vuelve al paso 1. En un nodo de MIN: baja β, y poda si v ≤ α."><title>Alfa-beta, en palabras · minimax que deja de generar</title><desc>Diagrama de flujo de alfa-beta, en palabras. 1: Baja un nivel y lleva α y β. 2, pregunta: ¿Es un final? Si sí: vale su U. Si no, sigue abajo. 3: Sube su valor v MAX toma el mayor y sube α si lo supera. 4, pregunta: ¿v ≥ β? Si sí: poda: no genera los demás. Si no, sigue abajo. 5: Juega la jugada de la raíz con mayor V. Desde el paso 4, si quedan jugadas, vuelve al paso 1. En un nodo de MIN: baja β, y poda si v ≤ α.</desc><rect x="0" y="0" width="300" height="688" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Alfa-beta, en palabras</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">minimax que deja de generar</text><rect x="46" y="95" width="242" height="62" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Baja un nivel</text><text x="58" y="142" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">y lleva α y β</text><line x1="116" y1="157" x2="116" y2="189" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="116,193 186,233 116,273 46,233" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="116" y="238" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Es un final?</text><line x1="186" y1="233" x2="209" y2="233" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="199.0" y="225" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="212" y="207.0" width="76" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="250.0" y="228.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">vale</text><text x="250.0" y="247.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">su U</text><line x1="116" y1="273" x2="116" y2="305" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="124" y="291" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="46" y="309" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="335" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Sube su valor v</text><text x="58" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MAX toma el mayor</text><text x="58" y="377" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">y sube α si lo supera</text><line x1="116" y1="392" x2="116" y2="424" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="116,428 186,468 116,508 46,468" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="116" y="473" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿v ≥ β?</text><line x1="186" y1="468" x2="209" y2="468" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="199.0" y="460" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="212" y="432.5" width="76" height="71" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="250.0" y="453.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">poda:</text><text x="250.0" y="472.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no genera</text><text x="250.0" y="491.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">los demás</text><line x1="116" y1="508" x2="116" y2="540" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="124" y="526" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="46" y="544" width="242" height="62" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="58" y="570" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="58" y="591" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de la raíz con mayor V</text><polyline points="46,468 28,468 28,126.0" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="28" y1="126.0" x2="43" y2="126.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="19" y="297.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 19 297.0)">quedan jugadas</text><text x="20" y="640" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">En un nodo de MIN: baja β,</text><text x="20" y="664" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">y poda si v ≤ α.</text></svg>