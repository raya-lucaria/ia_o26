<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1052" viewBox="0 0 300 1052" role="img" aria-label="Diagrama de flujo de alfa-beta, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo con α y β, y repite desde arriba. 3: Al volver con w: MAX se queda con v = max(v, w). 4, pregunta: ¿v ≥ β? Si sí: poda: no genera los demás, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 5: Sube α a v si v lo supera. 6, pregunta: ¿Quedan hijos? Si no, sigue abajo. 7: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 8: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 6 (sí), vuelve al paso 2. En un nodo de MIN: se queda con el menor, poda si v ≤ α y, si no, baja β."><title>Alfa-beta, en palabras · minimax que deja de generar</title><desc>Diagrama de flujo de alfa-beta, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo con α y β, y repite desde arriba. 3: Al volver con w: MAX se queda con v = max(v, w). 4, pregunta: ¿v ≥ β? Si sí: poda: no genera los demás, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 5: Sube α a v si v lo supera. 6, pregunta: ¿Quedan hijos? Si no, sigue abajo. 7: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 8: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 6 (sí), vuelve al paso 2. En un nodo de MIN: se queda con el menor, poda si v ≤ α y, si no, baja β.</desc><rect x="0" y="0" width="300" height="1052" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Alfa-beta, en palabras</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">minimax que deja de generar</text><text x="40" y="91" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Empieza en la raíz</text><line x1="100" y1="101" x2="100" y2="119" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,123 158,159 100,195 42,159" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="164" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Es final?</text><line x1="158" y1="159" x2="171" y2="159" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="166.0" y="151" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="174" y="133.0" width="84" height="52" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="216.0" y="154.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">vale</text><text x="216.0" y="173.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">su U</text><line x1="258" y1="159" x2="276" y2="159" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="195" x2="100" y2="223" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="215" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="227" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="252" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Baja al siguiente</text><text x="50" y="273" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">hijo con α y β, y</text><text x="50" y="294" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">repite desde arriba</text><line x1="100" y1="308" x2="100" y2="336" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">cuando vuelve</text><rect x="40" y="340" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="365" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Al volver con w:</text><text x="50" y="386" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MAX se queda con</text><text x="50" y="407" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">v = max(v, w)</text><line x1="100" y1="421" x2="100" y2="449" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,453 158,489 100,525 42,489" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="494" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿v ≥ β?</text><line x1="158" y1="489" x2="171" y2="489" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="166.0" y="481" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="174" y="453.5" width="84" height="71" rx="10" fill="#2c2336" stroke="#a8ff5a" stroke-width="1.5"/><text x="216.0" y="474.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">poda:</text><text x="216.0" y="493.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no genera</text><text x="216.0" y="512.5" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">los demás</text><line x1="258" y1="489" x2="276" y2="489" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="525" x2="100" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="545" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="557" width="218" height="60" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="582" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Sube α a v</text><text x="50" y="603" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">si v lo supera</text><line x1="100" y1="617" x2="100" y2="645" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,649 158,695 100,741 42,695" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="690" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Quedan</text><text x="100" y="710" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">hijos?</text><line x1="100" y1="741" x2="100" y2="769" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="110" y="761" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">no</text><rect x="40" y="773" width="218" height="81" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="798" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Si no es la raíz:</text><text x="50" y="819" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">vuelve al padre</text><text x="50" y="840" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con su valor</text><line x1="258" y1="813.5" x2="276" y2="813.5" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="854" x2="100" y2="882" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="874" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">si es la raíz</text><rect x="40" y="886" width="218" height="60" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="911" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="50" y="932" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de mayor valor</text><line x1="276" y1="159" x2="276" y2="380.5" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="261.75" x2="276" y2="273.75" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="813.5" x2="276" y2="380.5" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="605.0" x2="276" y2="593.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="380.5" x2="261" y2="380.5" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="288" y="269.75" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(90 288 269.75)">vuelve al padre</text><polyline points="40,251.3 24,251.3 24,159" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="159" x2="39" y2="159" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="205.15" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 205.15)">con el hijo</text><polyline points="42,695 24,695 24,285.32" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="285.32" x2="37" y2="285.32" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="490.15999999999997" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 490.15999999999997)">sí</text><text x="20" y="980" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">En un nodo de MIN: se queda</text><text x="20" y="1004" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con el menor, poda si v ≤ α</text><text x="20" y="1028" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">y, si no, baja β.</text></svg>