76" y2="742.5" stroke="#c8b9d8" stroke-width="2"/><line x1="100" y1="783" x2="100" y2="811" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="803" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">si es la raíz</text><rect x="40" y="815" width="218" height="60" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="50" y="840" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="50" y="861" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de mayor valor</text><line x1="276" y1="159" x2="276" y2="391.0" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="267.0" x2="276" y2="279.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="742.5" x2="276" y2="391.0" stroke="#c8b9d8" stroke-width="2"/><line x1="276" y1="574.75" x2="276" y2="562.75" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="276" y1="391.0" x2="261" y2="391.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="288" y="275.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(90 288 275.0)">vuelve al padre</text><polyline points="40,251.3 24,251.3 24,159" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="159" x2="39" y2="159" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="205.15" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 205.15)">con el hijo</text><polyline points="42,624 24,624 24,285.32" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="24" y1="285.32" x2="37" y2="285.32" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="15" y="454.65999999999997" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 15 454.65999999999997)">sí</text><text x="20" y="909" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">En un nodo de MIN: se queda</text><text x="20" y="933" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con el menor, baja β, y poda</text><text x="20" y="957" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">si v ≤ α.</text></svg>