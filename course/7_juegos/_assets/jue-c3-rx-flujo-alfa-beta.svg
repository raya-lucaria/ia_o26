<svg xmlns="http://www.w3.org/2000/svg" width="300" height="981" viewBox="0 0 300 981" role="img" aria-label="Diagrama de flujo de alfa-beta, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo con α y β, y repite desde arriba. 3: Al volver con v: MAX se queda con el mayor y sube α si lo supera. 4, pregunta: ¿v ≥ β? Si sí: poda: no genera los demás, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 5, pregunta: ¿Quedan hijos? Si no, sigue abajo. 6: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 7: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 5 (sí), vuelve al paso 2. En un nodo de MIN: se queda con el menor, baja β, y poda si v ≤ α."><title>Alfa-beta, en palabras · minimax que deja de generar</title><desc>Diagrama de flujo de alfa-beta, en palabras. Empieza en la raíz. 1, pregunta: ¿Es final? Si sí: vale su U, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 2: Baja al siguiente hijo con α y β, y repite desde arriba. 3: Al volver con v: MAX se queda con el mayor y sube α si lo supera. 4, pregunta: ¿v ≥ β? Si sí: poda: no genera los demás, y vuelve al padre: a su paso «Al volver». Si no, sigue abajo. 5, pregunta: ¿Quedan hijos? Si no, sigue abajo. 6: Si no es la raíz: vuelve al padre con su valor. Vuelve al padre: a su paso «Al volver». 7: Juega la jugada de mayor valor. Desde el paso 2 (con el hijo), vuelve al paso 1. Desde el paso 5 (sí), vuelve al paso 2. En un nodo de MIN: se queda con el menor, baja β, y poda si v ≤ α.</desc><rect x="0" y="0" width="300" height="981" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerH