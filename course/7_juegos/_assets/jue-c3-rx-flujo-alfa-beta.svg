-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Baja al siguiente</text><text x="50" y="273" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">hijo con α y β, y</text><text x="50" y="294" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">repite desde arriba</text><line x1="100" y1="308" x2="100" y2="336" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#s)"/><text x="110" y="328" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">cuando vuelve</text><rect x="40" y="340" width="218" height="102" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="50" y="365" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Al volver con v:</text><text x="50" y="386" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MAX se queda con el</text><text x="50" y="407" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">mayor y sube α si</text><text x="50" y="428" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">lo supera</text><line x1="100" y1="442" x2="100" y2="470" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="100,474 158,510 100,546 42,510" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="100" y="515" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿v ≥ β?</text><line x1="158" y1="510" x2="171" y2="510" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="166.0" y="502" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sí</text><rect x="174" y="474.5" width="84" height="71" rx="10" 