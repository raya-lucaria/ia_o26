l="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">a veces al azar (10 %): 0.564</text><line x1="18" y1="528" x2="48" y2="528" stroke="#f04cff" stroke-width="3"/><circle cx="33" cy="528" r="4" fill="#f04cff"/><text x="52" y="533" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">UCB, c = 2√2: 0.580</text><line x1="18" y1="554" x2="48" y2="554" stroke="#a8ff5a" stroke-width="3" stroke-dasharray="10 4 2 4"/><circle cx="33" cy="554" r="4" fill="#a8ff5a"/><text x="52" y="559" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">UCB, c = 1: 0.598</text><text x="12" y="602" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">Sin bono, 34 corridas se quedan en x,</text><text x="12" y="624" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">5 en y y 1 en z; se espera</text><text x="12" y="646" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">(34·0.6 + 5·0.3 − 0.2)/40 = 0.5425.</text></svg>