<svg xmlns="http://www.w3.org/2000/svg" width="300" height="664" viewBox="0 0 300 664" role="img" aria-label="Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: pago promedio por vuelta, el promedio de los U de las vueltas 1 a N(s), de 0.25 a 0.65. Cada punto es el promedio de 40 corridas con semilla fija; μ de x, y, z: 0.6, 0.3, −0.2. Una raya horizontal en 0.6: siempre x, lo mejor posible. En N(s) = 10, 100, 1 000 y 10 000: siempre el mejor promedio, 0.400, 0.533, 0.544 y 0.543; a veces al azar (10 %), 0.385, 0.522, 0.561 y 0.564; UCB, c = 2√2, 0.295, 0.397, 0.519 y 0.580; UCB, c = 1, 0.340, 0.514, 0.583 y 0.598. UCB empieza abajo, porque explora, y termina arriba; ninguna llega a 0.6. Sin bono, 34 corridas se quedan en x, 5 en y y 1 en z: se espera (34·0.6 + 5·0.3 − 0.2)/40 = 0.5425; simulado, 0.543."><title>¿Cuánto gana cada regla? cada punto: promedio de 40 corridas μ de x, y, z: 0.6, 0.3, −0.2</title><desc>Gráfica con eje x logarítmico. Eje x: N(s), vueltas, de 10 a 10 000. Eje y: pago promedio por vuelta, el promedio de los U de las vueltas 1 a N(s), de 0.25 a 0.65. Cada punto es el promedio de 40 corridas con semilla fija; μ de x, y, z: 0.6, 0.3, −0.2. Una raya horizontal en 0.6: siempre x, lo mejor posible. En N(s) = 10, 100, 1 000 y 10 000: siempre el mejor promedio, 0.400, 0.533, 0.544 y 0.543; a veces al azar (10 %), 0.385, 0.522, 0.561 y 0.564; UCB, c = 2√2, 0.295, 0.397, 0.519 y 0.580; UCB, c = 1, 0.340, 0.514, 0.583 y 0.598. UCB empieza abajo, porque explora, y termina arriba; ninguna llega a 0.6. Sin bono, 34 corridas se quedan en x, 5 en y y 1 en z: se espera (34·0.6 + 5·0.3 − 0.2)/40 = 0.5425; simulado, 0.543.</desc><rect x="0" y="0" width="300" height="664" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" 