<svg xmlns="http://www.w3.org/2000/svg" width="300" height="492" viewBox="0 0 300 492" role="img" aria-label="Diagrama de flujo de Monte Carlo plano, en palabras. 1: Toma una jugada de la raíz. 2: Juega k partidas al azar, para los dos, hasta un final. 3: Promedia sus U: Q̂ y olvida las partidas. 4: Juega la jugada de la raíz con mayor Q̂. Desde el paso 3, si quedan jugadas, vuelve al paso 1."><title>Monte Carlo plano, · en palabras</title><desc>Diagrama de flujo de Monte Carlo plano, en palabras. 1: Toma una jugada de la raíz. 2: Juega k partidas al azar, para los dos, hasta un final. 3: Promedia sus U: Q̂ y olvida las partidas. 4: Juega la jugada de la raíz con mayor Q̂. Desde el paso 3, si quedan jugadas, vuelve al paso 1.</desc><rect x="0" y="0" width="300" height="492" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Monte Carlo plano,</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">en palabras</text><rect x="46" y="95" width="242" height="62" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Toma una jugada</text><text x="58" y="142" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de la raíz</text><line x1="116" y1="157" x2="116" y2="189" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="193" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="219" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega k partidas</text><text x="58" y="240" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">al azar, para los dos,</text><text x="58" y="261" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">hasta un final</text><line x1="116" y1="276" x2="116" y2="308" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="312" width="242" height="62" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="338" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Promedia sus U: Q̂</text><text x="58" y="359" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">y olvida las partidas</text><line x1="116" y1="374" x2="116" y2="406" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="410" width="242" height="62" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="58" y="436" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="58" y="457" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de la raíz con mayor Q̂</text><polyline points="46,343.0 28,343.0 28,126.0" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="28" y1="126.0" x2="43" y2="126.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="19" y="234.5" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 19 234.5)">quedan jugadas</text></svg>