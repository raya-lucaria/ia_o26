<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-label="Árbol B, paso 2, terminado. El MAX de la derecha llega con [−∞, 8]; su primera hoja, 9, va resaltada con 9 ≥ 8. Su segunda hoja es un círculo punteado con «?»: no se genera. Una barra de acento con la leyenda «corte beta» va bajo ese nodo, que muestra ≥ 9. La raíz muestra = 8. Se generan 6 de 7 nodos."><title>Árbol B · 2. Corte beta: 6 de 7 nodos</title><desc>Árbol B, paso 2, terminado. El MAX de la derecha llega con [−∞, 8]; su primera hoja, 9, va resaltada con 9 ≥ 8. Su segunda hoja es un círculo punteado con «?»: no se genera. Una barra de acento con la leyenda «corte beta» va bajo ese nodo, que muestra ≥ 9. La raíz muestra = 8. Se generan 6 de 7 nodos.</desc><rect x="0" y="0" width="700" height="780" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Árbol B · 2. Corte beta: 6 de 7 nodos</text><line x1="330" y1="250.0" x2="170" y2="332.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="170" y1="460.0" x2="90" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="170" y1="460.0" x2="250" y2="553" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="330" y1="250.0" x2="490" y2="332.0" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><rect x="352.5" y="275.0" width="115" height="32" rx="8" fill="#211033" stroke="#f04cff" stroke-width="2"/><text x="410.0" y="298.9" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" text-anchor="middle">[−∞, 8]</text><line x1="490" y1="460.0" x2="410" y2="553" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><line x1="490" y1="460.0" x2="570" y2="561" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><line x1="488.0" y1="490.3" x2="540.0" y2="490.3" stroke="#f04cff" stroke-width="7"/><rect x="548.0" y="474.3" width="141" height="32" rx="8" fill="#f04cff" stroke="#f04cff" stroke-width="2"/><text x="618.5" y="498.2" fill="#211033" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">corte beta</text><rect x="230.0" y="130.0" width="200" height="120" rx="10" fill="#452f3b" stroke="#f04cff" stroke-width="3.5"/><text x="330" y="160" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MIN</text><text x="330" y="200" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">= 8</text><text x="330" y="234" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">se queda con 8</text><rect x="70.0" y="340.0" width="200" height="120" rx="10" fill="#251e41" stroke="#55ddff" stroke-width="2"/><text x="170" y="370" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MAX</text><text x="170" y="410" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">= 8</text><text x="170" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">max{8, 6}</text><rect x="390.0" y="340.0" width="200" height="120" rx="10" fill="#293154" stroke="#f04cff" stroke-width="3.5"/><text x="490" y="370" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MAX</text><text x="490" y="410" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">≥ 9</text><text x="490" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">al menos 9</text><circle cx="90" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="90" cy="600" r="34" fill="#2a2136" stroke="#a8ff5a" stroke-width="2"/><text x="90" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">8</text><circle cx="250" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="250" cy="600" r="34" fill="#2a2136" stroke="#a8ff5a" stroke-width="2"/><text x="250" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">6</text><circle cx="410" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="410" cy="600" r="34" fill="#373639" stroke="#f04cff" stroke-width="3.5"/><text x="410" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">9</text><text x="410" y="666" fill="#f04cff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">9 ≥ 8</text><circle cx="570" cy="600" r="34" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="7 6"/><text x="570" y="610" fill="#78419e" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">?</text><text x="570" y="666" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">no se genera</text><text x="350.0" y="710" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">El MAX de la derecha llega con [−∞, 8]; su hoja 9 da 9 ≥ 8.</text><text x="350.0" y="742" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">Valdrá al menos 9: MIN no lo elegirá. 6 de 7 nodos.</text></svg>