<svg xmlns="http://www.w3.org/2000/svg" width="300" height="978" viewBox="0 0 300 978" role="img" aria-label="Dos paneles con la desigualdad de Hoeffding en la escala ±1, para una jugada, una regla de continuación fija y N muestras independientes. Panel A, la cota contra ε: eje x, ε de 0 a 0.5; eje y, la cota e^(−N·ε²/2) de la probabilidad de que Q̂ quede ε o más por debajo de su esperanza, de 0 a 1, con N = 100. La curva baja muy rápido: con ε = 0.1, 60.65 %, con ε = 0.2, 13.53 %, con ε = 0.4, 0.0335 %. Panel B, el margen contra N: eje x, N de 0 a 200; eje y, ε = √(2·ln(1/δ)/N), de 0 a 1.2, una curva por δ: δ = 0.05, continua y δ = 0.005, rayada. Con N = 100, el margen vale 0.24 con δ = 0.05 y 0.33 con δ = 0.005: pedir diez veces menos fallo lo agranda 1.33 veces, un tercio, para todo N; cuatro veces más muestras lo parten a la mitad. Es una cota, no una tasa."><title>Mover ε, mover N · Hoeffding en la escala ±1</title><desc>Dos paneles con la desigualdad de Hoeffding en la escala ±1, para una jugada, una regla de continuación fija y N muestras independientes. Panel A, la cota contra ε: eje x, ε de 0 a 0.5; eje y, la cota e^(−N·ε²/2) de la probabilidad de que Q̂ quede ε o más por debajo de su esperanza, de 0 a 1, con N = 100. La curva baja muy rápido: con ε = 0.1, 60.65 %, con ε = 0.2, 13.53 %, con ε = 0.4, 0.0335 %. Panel B, el margen contra N: eje x, N de 0 a 200; eje y, ε = √(2·ln(1/δ)/N), de 0 a 1.2, una curva por δ: δ = 0.05, continua y δ = 0.005, rayada. Con N = 100, el margen vale 0.24 con δ = 0.05 y 0.33 con δ = 0.005: pedir diez veces menos fallo lo agranda 1.33 veces, un tercio, para todo N; cuatro veces más muestras lo parten a la mitad. Es una cota, no una tasa.</desc><rect x="0" y="0" width="300" height="978" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" re