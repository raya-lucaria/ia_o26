<svg xmlns="http://www.w3.org/2000/svg" width="600" height="899" viewBox="0 0 600 899" role="img" aria-label="DECIDIR-MINIMAX sobre el árbol T, paso 4 (fila 19 de la traza), el último antes de devolver la jugada. Arriba, la banda del pseudocódigo: línea 4: w ← MINIMAX(T(s, a)); línea 5: if w &gt; mejor_valor: mejor_valor ← w ; mejor_jugada ← a. D devuelve w = 2. Recuadro: mejor_jugada = centro · mejor_valor = 5. En el árbol: R en la pila; I ya devolvió v = 3; C ya devolvió v = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 8; D ya devolvió v = 2. der vale 2, y 2 &gt; 5 es falso: mejor_jugada sigue en centro. DECIDIR-MINIMAX devuelve centro (línea 6). Se generaron 14 nodos."><title>Minimax en T · paso 4. D devuelve 2: 2 &gt; 5 es falso</title><desc>DECIDIR-MINIMAX sobre el árbol T, paso 4 (fila 19 de la traza), el último antes de devolver la jugada. Arriba, la banda del pseudocódigo: línea 4: w ← MINIMAX(T(s, a)); línea 5: if w &gt; mejor_valor: mejor_valor ← w ; mejor_jugada ← a. D devuelve w = 2. Recuadro: mejor_jugada = centro · mejor_valor = 5. En el árbol: R en la pila; I ya devolvió v = 3; C ya devolvió v = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 8; D ya devolvió v = 2. der vale 2, y 2 &gt; 5 es falso: mejor_jugada sigue en centro. DECIDIR-MINIMAX devuelve centro (línea 6). Se generaron 14 nodos.</desc><rect x="0" y="0" width="600" height="899" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">Minimax en T · paso 4</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weigh