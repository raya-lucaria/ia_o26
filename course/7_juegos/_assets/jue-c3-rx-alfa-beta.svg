-anchor="start">generado</text><circle cx="38" cy="581" r="9" fill="#211033" stroke="#78419e" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="31" y1="574" x2="45" y2="588" stroke="#f04cff" stroke-width="2.5"/><line x1="31" y1="588" x2="45" y2="574" stroke="#f04cff" stroke-width="2.5"/><text x="66" y="585" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">podado: no se genera</text><line x1="20" y1="611" x2="48" y2="611" stroke="#f04cff" stroke-width="5"/><line x1="20" y1="611" x2="54" y2="611" stroke="#f04cff" stroke-width="2.5" marker-end="url(#p)"/><text x="66" y="615" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">la jugada que juega: centro</text><text x="20" y="651" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">C2: v = +1 ≥ β = 0, poda β.</text><text x="20" y="675" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">D: v = −1 ≤ α = 0, poda α.</text><text x="20" y="699" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Por eso da cotas, no valores</text><text x="20" y="723" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">exactos: D «≤ −1», C2 «≥ +1».</text></svg>