<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1140" viewBox="0 0 300 1140" role="img" aria-label="Tres instantáneas del árbol de búsqueda de UCT, sin números. Con pocas vueltas, solo tiene la raíz y sus tres jugadas. Con más vueltas, la primera jugada, la más prometedora, ya tiene nietos; las otras, un hijo o ninguno. Con muchas vueltas, esa rama baja cuatro niveles y las demás siguen delgadas. En cada instantánea, una línea rayada sigue el contorno de su árbol: es la frontera, más honda bajo lo prometedor. Arriba de ella UCT elige con el puntaje; abajo juega partidas al azar, dibujadas como caminos quebrados hasta los finales, que no se guardan. Las ramas más gruesas son las más visitadas."><title>UCT: su árbol crece · desigual, hondo en lo prometedor</title><desc>Tres instantáneas del árbol de búsqueda de UCT, sin números. Con pocas vueltas, solo tiene la raíz y sus tres jugadas. Con más vueltas, la primera jugada, la más prometedora, ya tiene nietos; las otras, un hijo o ninguno. Con muchas vueltas, esa rama baja cuatro niveles y las demás siguen delgadas. En cada instantánea, una línea rayada sigue el contorno de su árbol: es la frontera, más honda bajo lo prometedor. Arriba de ella UCT elige con el puntaje; abajo juega partidas al azar, dibujadas como caminos quebrados hasta los finales, que no se guardan. Las ramas más gruesas son las más visitadas.</desc><rect x="0" y="0" width="300" height="1140" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">UCT: su árbol crece</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">desigual, hondo en</text><text x="20" y="77" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">lo prometedor</text><line x1="20" y1="122" x2="280" y2="122" stroke="#78419e" stroke-width="1.5"/><text x="20" y="148" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">Pocas vueltas</text><polyline points="51.7,233.0 56.0,245.1 48.3,257.6 56.7,269.6 49.0,282.1 57.3,294.1 49.7,306.6 58.0,318.6 50.3,331.1 58.7,343.1 51.0,355.6 59.3,367.6 55.7,380.0" fill="none" stroke="#b23ac2" stroke-width="1.5" stroke-linejoin="round"/><polyline points="115.0,233.0 118.7,245.4 110.3,257.4 118.0,269.9 109.7,281.9 117.3,294.4 109.0,306.4 116.7,318.9 108.3,330.9 116.0,343.4 107.7,355.4 115.3,367.9 111.0,380.0" fill="none" stroke="#b23ac2" stroke-width="1.5" stroke-linejoin="round"/><polyline points="178.3,233.0 182.7,245.1 175.0,257.6 183.3,269.6 175.7,282.1 184.0,294.1 176.3,306.6 184.7,318.6 177.0,331.1 185.3,343.1 177.7,355.6 186.0,367.6 182.3,380.0" fill="none" stroke="#b23ac2" stroke-width="1.5" stroke-linejoin="round"/><line x1="10" y1="392" x2="216" y2="392" stroke="#a8ff5a" stroke-width="2"/><polyline points="6.0,242.0 28.8,242.0 28.8,242.0 51.7,242.0 83.3,242.0 83.3,242.0 115.0,242.0 146.7,242.0 146.7,242.0 178.3,242.0 199.2,242.0 199.2,242.0 220.0,242.0" fill="none" stroke="#f04cff" stroke-width="2.5" stroke-dasharray="7 4"/><line x1="115.0" y1="180" x2="51.66666666666667" y2="220" stroke="#c8b9d8" stroke-width="2.5"/><line x1="115.0" y1="180" x2="115.00000000000001" y2="220" stroke="#c8b9d8" stroke-width="2.5"/><line x1="115.0" y1="180" x2="178.33333333333337" y2="220" stroke="#c8b9d8" stroke-width="2.5"/><circle cx="115.0" cy="180" r="9" fill="#27294b" stroke="#55ddff" stroke-width="2"/><circle cx="51.66666666666667" cy="220" r="9" fill="#3c2739" stroke="#ffd166" stroke-width="2"/