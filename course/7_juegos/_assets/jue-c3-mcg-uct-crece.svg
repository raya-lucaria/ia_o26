<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1119" viewBox="0 0 300 1119" role="img" aria-label="Tres instantáneas del árbol de búsqueda de UCT, sin números. Con pocas vueltas, solo tiene la raíz y sus tres jugadas. Con más vueltas, la primera jugada, la más prometedora, ya tiene nietos; las otras, un hijo o ninguno. Con muchas vueltas, esa rama baja cuatro niveles y las demás siguen delgadas. En cada instantánea, una línea rayada sigue el contorno de su árbol: es la frontera, más honda bajo lo prometedor. Arriba de ella UCT elige con el puntaje; abajo juega partidas al azar, dibujadas como caminos quebrados hasta los finales, que no se guardan. Las ramas más gruesas son las más visitadas."><title>UCT: su árbol crece · desigual, hondo en lo mejor</title><desc>Tres instantáneas del árbol de búsqueda de UCT, sin números. Con pocas vueltas, solo tiene la raíz y sus tres jugadas. Con más vueltas, la primera jugada, la más prometedora, ya tiene nietos; las otras, un hijo o ninguno. Con muchas vueltas, esa rama baja cuatro niveles y las demás siguen delgadas. En cada instantánea, una línea rayada sigue el contorno de su árbol: es la frontera, más honda bajo lo prometedor. Arriba de ella UCT elige con el puntaje; abajo juega partidas al azar, dibujadas como caminos quebrados hasta los finales, que no se guardan. Las ramas más gruesas son las más visitadas.</desc><rect x="0" y="0" width="300" height="1119" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">UCT: su árbol crece</text><text x="20" y="56" fill="#c8b9d8"