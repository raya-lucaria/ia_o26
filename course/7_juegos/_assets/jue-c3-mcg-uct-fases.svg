<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1915" viewBox="0 0 300 1915" role="img" aria-label="Las fases de una vuelta de UCT en un árbol grande, sin números, en cinco paneles con el mismo árbol de búsqueda: la raíz, de MAX; dos hijos de MIN y un final ya agregado; dos nietos de MAX; y, rayadas, jugadas que aún no están en su árbol, su frontera. 1, selección: baja por el camino resaltado eligiendo con el puntaje UCT hasta un nodo con una jugada sin agregar. 2, expansión: la agrega como un hijo nuevo. 3, simulación: desde el hijo nuevo juega al azar hasta un final, y esa partida no se guarda. 4, retropropagación: sube ese U por el camino; cada nodo suma una visita a N y mete U en su promedio Q̂. Último panel: si la selección llega a un final que ya está en su árbol, no agrega nada ni simula: retropropaga su U directamente."><title>UCT en un árbol grande · una vuelta, fase por fase</title><desc>Las fases de una vuelta de UCT en un árbol grande, sin números, en cinco paneles con el mismo árbol de búsqueda: la raíz, de MAX; dos hijos de MIN y un final ya agregado; dos nietos de MAX; y, rayadas, jugadas que aún no están en su árbol, su frontera. 1, selección: baja por el camino resaltado eligiendo con el puntaje UCT hasta un nodo con una jugada sin agregar. 2, expansión: la agrega como un hijo nuevo. 3, simulación: desde el hijo nuevo juega al azar hasta un final, y esa partida no se guarda. 4, retropropagación: sube ese U por el camino; cada nodo suma una visita a N y mete U en su promedio Q̂. Último panel: si la selección llega a un final que ya está en su árbol, no agrega nada ni simula: retropropaga su U directamente.</desc><rect x="0" y="0" width="300" height="1915" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">UCT en un árbol grande</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">una vuelta, fase por fase</text><line x1="20" y1="87" x2="280" y2="87" stroke="#78419e" stroke-width="1.5"/><text x="20" y="117" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">1 · Selección</text><text x="20" y="137" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">baja por su árbol con el</text><text x="20" y="156" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">puntaje, hasta la frontera</text><line x1="140" y1="195" x2="80" y2="251" stroke="#f04cff" stroke-width="4"/><line x1="140" y1="195" x2="140" y2="251" stroke="#c8b9d8" stroke-width="2"/><line x1="140" y1="195" x2="200" y2="251" stroke="#c8b9d8" stroke-width="2"/><line x1="80" y1="251" x2="50" y2="307" stroke="#c8b9d8" stroke-width="2"/><line x1="80" y1="251" x2="110" y2="307" stroke="#f04cff" stroke-width="4"/><line x1="50" y1="307" x2="38" y2="347" stroke="#78419e" stroke-width="2" stroke-dasharray="5 4"/><circle cx="38" cy="355" r="8" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="4 3"/><line x1="110" y1="307" x2="122" y2="355" stroke="#78419e" stroke-width="2" stroke-dasharray="5 4"/><circle cx="122" cy="363" r="8" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="4 3"/><line x1="140" y1="251" x2="162" y2="299" stroke="#78419e" stroke-width="2" stroke-dasharray="5 4"/><circle cx="162" cy="307" r="8" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="4 3"/><circle cx="140" cy="195" r="11" fill="#27294b" stroke="#55ddff" s