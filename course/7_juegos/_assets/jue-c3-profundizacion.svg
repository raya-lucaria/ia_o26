<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img" aria-label="Tres búsquedas seguidas sobre la posición de la clase, con d = 1, 2 y 3; el largo de cada barra es el número de nodos que genera: 4 con d = 1, 12 con d = 2, 33 con d = 3. Cada búsqueda completa deja lista una jugada: d = 1: d2xc3 (+13), d = 2: d2-d3 (+1), d = 3: d2-d3 (+100). Si el reloj se acaba a media búsqueda, se entrega la jugada de la anterior."><title>Profundizar mientras haya tiempo</title><desc>Tres búsquedas seguidas sobre la posición de la clase, con d = 1, 2 y 3; el largo de cada barra es el número de nodos que genera: 4 con d = 1, 12 con d = 2, 33 con d = 3. Cada búsqueda completa deja lista una jugada: d = 1: d2xc3 (+13), d = 2: d2-d3 (+1), d = 3: d2-d3 (+100). Si el reloj se acaba a media búsqueda, se entrega la jugada de la anterior.</desc><rect x="0" y="0" width="700" height="560" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Profundizar mientras haya tiempo</text><text x="350.0" y="64" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">El largo de cada barra: nodos que genera esa búsqueda</text><rect x="60.0" y="130" width="47.3469387755102" height="30" rx="5" fill="#33587a" stroke="#55ddff" stroke-width="2"/><text x="60.0" y="120" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">d = 1 · 4 nodos</text><text x="117.34693877551021" y="151" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">deja lista: d2xc3</text><rect x="107.34693877551021" y="225" width="142.0408163265306" height="30" rx="5" fill="#33587a" stroke="#55ddff" stroke-width="2"/><text x="107.34693877551021" y="215" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">d = 2 · 12 nodos</text><text x="259.38775510204084" y="246" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">deja lista: d2-d3</text><rect x="249.3877551020408" y="320" width="390.61224489795916" height="30" rx="5" fill="#33587a" stroke="#55ddff" stroke-width="2"/><text x="249.3877551020408" y="310" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">d = 3 · 33 nodos</text><text x="640.0" y="372" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">deja lista: d2-d3 (gana)</text><line x1="178.3673469387755" y1="217" x2="178.3673469387755" y2="405" stroke="#f04cff" stroke-width="2" stroke-dasharray="6 5"/><circle cx="178.4" cy="419" r="13" fill="#f04cff"/><text x="178.4" y="424" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="40" y="467" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Reloj 1: se acaba durante d = 2, así que entrega d2xc3</text><line x1="438.7755102040816" y1="312" x2="438.7755102040816" y2="405" stroke="#f04cff" stroke-width="2" stroke-dasharray="6 5"/><circle cx="438.8" cy="419" r="13" fill="#f04cff"/><text x="438.8" y="424" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="40" y="495" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Reloj 2: se acaba durante d = 3, así que entrega d2-d3</text></svg>