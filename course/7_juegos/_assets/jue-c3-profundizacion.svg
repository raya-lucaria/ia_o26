<svg xmlns="http://www.w3.org/2000/svg" width="600" height="626" viewBox="0 0 600 626" role="img" aria-label="Tres búsquedas seguidas sobre la posición de la clase, con d = 1, 2 y 3; el largo de cada barra es el número de nodos que genera: 4 con d = 1, 12 con d = 2, 33 con d = 3. Cada búsqueda completa deja lista una jugada: d = 1: d2xc3 (+13), d = 2: d2-d3 (+1), d = 3: d2-d3 (+100). Si el reloj se acaba a media búsqueda, se entrega la jugada de la anterior."><title>Profundizar mientras haya tiempo</title><desc>Tres búsquedas seguidas sobre la posición de la clase, con d = 1, 2 y 3; el largo de cada barra es el número de nodos que genera: 4 con d = 1, 12 con d = 2, 33 con d = 3. Cada búsqueda completa deja lista una jugada: d = 1: d2xc3 (+13), d = 2: d2-d3 (+1), d = 3: d2-d3 (+100). Si el reloj se acaba a media búsqueda, se entrega la jugada de la anterior.</desc><rect x="0" y="0" width="600" height="626" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Profundizar mientras</text><text x="20" y="59" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">haya tiempo</text><text x="20" y="85" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">El largo de cada barra: nodos que</text><text x="20" y="107" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">genera esa búsqueda</text><rect x="40.0" y="176" width="42.44897959183673" height="30" rx="5" fill="#33587a" stroke="#55ddff" stroke-width="2"/><text x="40.0" y="166" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">d = 1 · 4 nodos</text><text x="92.44897959183673" y="197" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">deja lista: d2xc3</text><rect x="82.44897959183673" y="271" width="127.3469387755102" height="30" rx="5" fill="#33587a" stroke="#55ddff" stroke-width="2"/><text x="82.44897959183673" y="261" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">d = 2 · 12 nodos</text><text x="219.79591836734693" y="292" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">deja lista: d2-d3</text><rect x="209.79591836734693" y="366" width="350.204081632653" height="30" rx="5" fill="#33587a" stroke="#55ddff" stroke-width="2"/><text x="209.79591836734693" y="356" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">d = 3 · 33 nodos</text><text x="560.0" y="418" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">deja lista: d2-d3 (gana)</text><line x1="146.12244897959184" y1="269" x2="146.12244897959184" y2="451" stroke="#f04cff" stroke-width="2" stroke-dasharray="6 5"/><circle cx="146.1" cy="465" r="13" fill="#f04cff"/><text x="146.1" y="470" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="20" y="513" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Reloj 1: se acaba durante d = 2,</text><text x="20" y="535" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">así que entrega d2xc3</text><line x1="379.59183673469386" y1="364" x2="379.59183673469386" y2="451" stroke="#f04cff" stroke-width="2" stroke-dasharray="6 5"/><circle cx="379.6" cy="465" r="13" fill="#f04cff"/><text x="379.6" y="470" fill="#211033" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="20" y="569" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Reloj 2: se acaba durante d = 3,</text><text x="20" y="591" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">así que entrega d2-d3</text></svg>