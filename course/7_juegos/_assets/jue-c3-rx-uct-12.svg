<svg xmlns="http://www.w3.org/2000/svg" width="300" height="892" viewBox="0 0 300 892" role="img" aria-label="UCT en el árbol de resultados con c = 1 y semilla 0, tras 12 vueltas: su árbol tiene 10 nodos. Visitas y promedios: R N 12, I N 1 V̂ −1, C N 4 V̂ −0.25, D N 7 V̂ −0.14, C1 N 2 V̂ −0.5, C2 N 1 V̂ −1, d1 N 4 V̂ −1, d2 N 1 V̂ +1, d3 N 1 V̂ +1, c1a N 1 V̂ 0. El Q̂ de una jugada es el V̂ del nodo al que lleva. Aún no agrega: i1, ix, c1b, c2a, c2b. Al acabarse las vueltas, juega der: la jugada de la raíz con más visitas, con N = 7."><title>UCT: vuelta 12 · árbol de resultados c = 1, semilla 0: 10 nodos</title><desc>UCT en el árbol de resultados con c = 1 y semilla 0, tras 12 vueltas: su árbol tiene 10 nodos. Visitas y promedios: R N 12, I N 1 V̂ −1, C N 4 V̂ −0.25, D N 7 V̂ −0.14, C1 N 2 V̂ −0.5, C2 N 1 V̂ −1, d1 N 4 V̂ −1, d2 N 1 V̂ +1, d3 N 1 V̂ +1, c1a N 1 V̂ 0. El Q̂ de una jugada es el V̂ del nodo al que lleva. Aún no agrega: i1, ix, c1b, c2a, c2b. Al acabarse las vueltas, juega der: la jugada de la raíz con más visitas, con N = 7.</desc><rect x="0" y="0" width="300" height="892" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">UCT: vuelta 12</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">árbol de resultados</text><text x="20" y="77" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">c = 1, semilla 0: 10 nodos</text><line x1="98" y1="174.5" x2="38" y2="240.0" stroke="#c8b9d8" stro