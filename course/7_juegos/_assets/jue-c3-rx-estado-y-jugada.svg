<svg xmlns="http://www.w3.org/2000/svg" width="300" height="699" viewBox="0 0 300 699" role="img" aria-label="Un estado s, de MAX, con dos jugadas, A y B, cada una hacia un hijo: el estado T(s, A) y el estado T(s, B). Dentro de cada hijo va el número de esa jugada. El valor de la jugada es el valor del hijo al que lleva: Q(s, a) = V(T(s, a)). Qué número guarda ahí cada algoritmo: minimax, V; alfa-beta, V o una cota; expectiminimax, un valor esperado, E[·], que es V del juego con azar; el corte, el valor con corte o una cota, con poda; Monte Carlo plano, Q̂, que estima Q_azar; la actualización minimax, Q̂, que tiende a Q bajo su contrato; UCT, Q̂, que tiende a Q."><title>El valor de una jugada · vive en el hijo al que lleva</title><desc>Un estado s, de MAX, con dos jugadas, A y B, cada una hacia un hijo: el estado T(s, A) y el estado T(s, B). Dentro de cada hijo va el número de esa jugada. El valor de la jugada es el valor del hijo al que lleva: Q(s, a) = V(T(s, a)). Qué número guarda ahí cada algoritmo: minimax, V; alfa-beta, V o una cota; expectiminimax, un valor esperado, E[·], que es V del juego con azar; el corte, el valor con corte o una cota, con poda; Monte Carlo plano, Q̂, que estima Q_azar; la actualización minimax, Q̂, que tiende a Q bajo su contrato; UCT, Q̂, que tiende a Q.</desc><rect x="0" y="0" width="300" height="699" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">El valor de una jugada</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">vive en el hijo al que lleva</text><line x1="150" y1="129" x2="78" y2="197" stroke="#c8b9d8" stroke-width="2.5"/><line x1="150" y1="129" x2="222" y2="197" stroke="#c8b9d8" stroke-width="2.5"/><rect x="60.5" y="150.0" width="79" height="24" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="100.0" y="167.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">jugada A</text><rect x="160.5" y="150.0" width="79" height="24" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="200.0" y="167.0" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">jugada B</text><circle cx="150" cy="113" r="16" fill="#27294b" stroke="#55ddff" stroke-width="2"/><text x="150" y="118" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">s</text><text x="174" y="118" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">MAX</text><rect x="16" y="197" width="124" height="72" rx="10" fill="#3c2739" stroke="#ffd166" stroke-width="2"/><text x="78" y="221" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">T(s, A)</text><line x1="28" y1="233" x2="128" y2="233" stroke="#78419e" stroke-width="1.5"/><text x="78" y="256" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">número de A</text><rect x="160" y="197" width="124" height="72" rx="10" fill="#3c2739" stroke="#ffd166" stroke-width="2"/><text x="222" y="221" fill="#ffd166" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">T(s, B)</text><line x1="172" y1="233" x2="272" y2="233" stroke="#78419e" stroke-width="1.5"/><text x="222" y="256" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">número de B</text><text x="20" y="307" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">valor de la jugada = valor del hijo:</text><rect x="59.5" y="323.0" width="181" height="28" rx="7" fill="#211033" stroke="#f04cff" stroke-width="1.5"/><text x="150" y="342.4" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">Q(s,a) = V(T(s,a))</text><line x1="20" y1="367" x2="280" y2="367" stroke="#78419e" stroke-width="1.5"/><text x="20" y="389" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">Qué número guarda ahí</text><text x="20" y="409" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">cada algoritmo:</text><text x="20" y="439" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">minimax</text><text x="280" y="439" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">V</text><text x="20" y="463" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">alfa-beta</text><text x="280" y="463" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">V o cota</text><text x="20" y="487" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">expectiminimax</text><text x="280" y="487" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">E[·]</text><text x="280" y="509" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">V del juego con azar</text><text x="20" y="533" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">corte</text><text x="280" y="533" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">valor con corte</text><text x="280" y="555" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">o cota</text><text x="20" y="579" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Monte Carlo plano</text><text x="280" y="601" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end"><tspan>Q̂ estima </tspan><tspan>Q</tspan><tspan dy="4.5" font-size="10.8">azar</tspan></text><text x="20" y="625" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">actualización minimax</text><text x="280" y="647" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">Q̂ → Q, bajo su contrato</text><text x="20" y="671" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">UCT</text><text x="280" y="671" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">Q̂ → Q</text></svg>