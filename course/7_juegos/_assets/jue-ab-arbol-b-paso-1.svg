<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-label="Árbol B, paso 1. Raíz de MIN con dos hijos de MAX. El MAX de la izquierda y sus hojas, 8 y 6, van resaltados: vale 8. La raíz lleva β = 8. La rama de la derecha sigue punteada: aún no se mira."><title>Árbol B · 1. La izquierda vale 8</title><desc>Árbol B, paso 1. Raíz de MIN con dos hijos de MAX. El MAX de la izquierda y sus hojas, 8 y 6, van resaltados: vale 8. La raíz lleva β = 8. La rama de la derecha sigue punteada: aún no se mira.</desc><rect x="0" y="0" width="700" height="780" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="44" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Árbol B · 1. La izquierda vale 8</text><line x1="330" y1="250.0" x2="170" y2="332.0" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><line x1="170" y1="460.0" x2="90" y2="553" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><line x1="170" y1="460.0" x2="250" y2="553" stroke="#f04cff" stroke-width="3" marker-end="url(#p)"/><line x1="330" y1="250.0" x2="490" y2="340.0" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><line x1="490" y1="460.0" x2="410" y2="561" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><line x1="490" y1="460.0" x2="570" y2="561" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><rect x="230.0" y="130.0" width="200" height="120" rx="10" fill="#452f3b" stroke="#f04cff" stroke-width="3.5"/><text x="330" y="160" fill="#ffd166" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MIN</text><text x="330" y="200" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">β = 8</text><text x="330" y="234" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">ya tiene 8</text><rect x="70.0" y="340.0" width="200" height="120" rx="10" fill="#293154" stroke="#f04cff" stroke-width="3.5"/><text x="170" y="370" fill="#55ddff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MAX</text><text x="170" y="410" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="26" font-weight="700" text-anchor="middle">= 8</text><text x="170" y="444" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">max{8, 6}</text><rect x="390.0" y="340.0" width="200" height="120" rx="10" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="8 6"/><text x="490" y="378" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">MAX</text><text x="490" y="420" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">por mirar</text><circle cx="90" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="90" cy="600" r="34" fill="#373639" stroke="#f04cff" stroke-width="3.5"/><text x="90" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">8</text><circle cx="250" cy="600" r="39" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="250" cy="600" r="34" fill="#373639" stroke="#f04cff" stroke-width="3.5"/><text x="250" y="610" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle">6</text><circle cx="410" cy="600" r="34" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="7 6"/><text x="410" y="610" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">9</text><circle cx="570" cy="600" r="34" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="7 6"/><text x="570" y="610" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="30" font-weight="700" text-anchor="middle">?</text><text x="350.0" y="710" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">MAX, a la izquierda, toma el mayor: max{8, 6} = 8.</text><text x="350.0" y="742" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="normal" text-anchor="middle">MIN ya tiene asegurado 8: β = 8.</text></svg>