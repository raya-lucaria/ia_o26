<svg xmlns="http://www.w3.org/2000/svg" width="300" height="838" viewBox="0 0 300 838" role="img" aria-label="MIN volteado: tres jugadas p, q y r bajo un nodo donde mueve MIN, con N(s) = 50 y c = 2√2. p: Q̂ −0.2, N(s,a) 30, bono 1.02; q: Q̂ +0.25, N(s,a) 16, bono 1.40; r: Q̂ +0.5, N(s,a) 4, bono 2.80. Arriba, si eligiera MAX: cada jugada es un punto en Q̂ con su bono como raya hacia la derecha, hasta Q̂ + bono: p 0.82, q 1.65, r 3.30; elegiría el mayor, r. Abajo, lo que hace MIN: la misma raya hacia la izquierda, hasta Q̂ − bono: p −1.22, q −1.15, r −2.30; elige el menor, r. La c y el bono son los mismos: MIN no les cambia el signo, solo voltea el lado y busca el extremo opuesto."><title>MIN, volteado · la misma c, el bigote al otro lado</title><desc>MIN volteado: tres jugadas p, q y r bajo un nodo donde mueve MIN, con N(s) = 50 y c = 2√2. p: Q̂ −0.2, N(s,a) 30, bono 1.02; q: Q̂ +0.25, N(s,a) 16, bono 1.40; r: Q̂ +0.5, N(s,a) 4, bono 2.80. Arriba, si eligiera MAX: cada jugada es un punto en Q̂ con su bono como raya hacia la derecha, hasta Q̂ + bono: p 0.82, q 1.65, r 3.30; elegiría el mayor, r. Abajo, lo que hace MIN: la misma raya hacia la izquierda, hasta Q̂ − bono: p −1.22, q −1.15, r −2.30; elige el menor, r. La c y el bono son los mismos: MIN no les cambia el signo, solo voltea el lado y busca el extremo opuesto.</desc><rect x="0" y="0" width="300" height="838" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">MIN, volteado</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">la misma c, el bigote</text><text x="20" y="77" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">al otro lado</text><text x="20" y="132" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">N(s) = 50, c = 2√2. Bajo s mueve MIN.</text><text x="20" y="156" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">p: Q̂ −0.2 · N(s,a) 30 · bono 1.02</text><text x="20" y="176" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">q: Q̂ +0.25 · N(s,a) 16 · bono 1.40</text><text x="20" y="196" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" font-weight="normal" text-anchor="start">r: Q̂ +0.5 · N(s,a) 4 · bono 2.80</text><line x1="20" y1="220" x2="280" y2="220" stroke="#78419e" stroke-width="1.5"/><text x="20" y="246" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">Si eligiera MAX: Q̂ + bono</text><text x="20" y="266" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">elige el mayor: r, 3.30</text><line x1="169.0" y1="288" x2="169.0" y2="394" stroke="#c8b9d8" stroke-width="1" stroke-dasharray="3 4"/><text x="20" y="313" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">p</text><line x1="162.2" y1="308" x2="196.9" y2="308" stroke="#55ddff" stroke-width="2.5"/><line x1="196.9" y1="300" x2="196.9" y2="316" stroke="#55ddff" stroke-width="2.5"/><circle cx="162.2" cy="308" r="5" fill="#55ddff"/><text x="196.9" y="296" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0.82</text><text x="20" y="349" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">q</text><line x1="177.5" y1="344" x2="225.1" y2="344" stroke="#55ddff" stroke-width="2.5"/><line x1="225.1" y1="336" x2="225.1" y2="352" stroke="#55ddff" stroke-width="2.5"/><circle cx="177.5" cy="344" r="5" fill="#55ddff"/><text x="225.1" y="332" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1.65</text><text x="20" y="385" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">r</text><line x1="186.0" y1="380" x2="281.1" y2="380" stroke="#f04cff" stroke-width="3.5"/><line x1="281.1" y1="372" x2="281.1" y2="388" stroke="#f04cff" stroke-width="3.5"/><circle cx="186.0" cy="380" r="5" fill="#f04cff"/><text x="281.1" y="368" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3.30</text><line x1="84" y1="398" x2="288" y2="398" stroke="#c8b9d8" stroke-width="1.5"/><line x1="101.0" y1="394" x2="101.0" y2="402" stroke="#c8b9d8" stroke-width="1.5"/><text x="101.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">−2</text><line x1="135.0" y1="394" x2="135.0" y2="402" stroke="#c8b9d8" stroke-width="1.5"/><text x="135.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">−1</text><line x1="169.0" y1="394" x2="169.0" y2="402" stroke="#c8b9d8" stroke-width="1.5"/><text x="169.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="203.0" y1="394" x2="203.0" y2="402" stroke="#c8b9d8" stroke-width="1.5"/><text x="203.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">+1</text><line x1="237.0" y1="394" x2="237.0" y2="402" stroke="#c8b9d8" stroke-width="1.5"/><text x="237.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">+2</text><line x1="271.0" y1="394" x2="271.0" y2="402" stroke="#c8b9d8" stroke-width="1.5"/><text x="271.0" y="418" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">+3</text><line x1="20" y1="448" x2="280" y2="448" stroke="#78419e" stroke-width="1.5"/><text x="20" y="474" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">Elige MIN: Q̂ − bono</text><text x="20" y="494" fill="#f04cff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">elige el menor: r, −2.30</text><line x1="169.0" y1="516" x2="169.0" y2="622" stroke="#c8b9d8" stroke-width="1" stroke-dasharray="3 4"/><text x="20" y="541" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">p</text><line x1="162.2" y1="536" x2="127.5" y2="536" stroke="#55ddff" stroke-width="2.5"/><line x1="127.5" y1="528" x2="127.5" y2="544" stroke="#55ddff" stroke-width="2.5"/><circle cx="162.2" cy="536" r="5" fill="#55ddff"/><text x="127.5" y="524" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">−1.22</text><text x="20" y="577" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">q</text><line x1="177.5" y1="572" x2="129.9" y2="572" stroke="#55ddff" stroke-width="2.5"/><line x1="129.9" y1="564" x2="129.9" y2="580" stroke="#55ddff" stroke-width="2.5"/><circle cx="177.5" cy="572" r="5" fill="#55ddff"/><text x="129.9" y="560" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">−1.15</text><text x="20" y="613" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">r</text><line x1="186.0" y1="608" x2="90.9" y2="608" stroke="#f04cff" stroke-width="3.5"/><line x1="90.9" y1="600" x2="90.9" y2="616" stroke="#f04cff" stroke-width="3.5"/><circle cx="186.0" cy="608" r="5" fill="#f04cff"/><text x="90.9" y="596" fill="#f04cff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">−2.30</text><line x1="84" y1="626" x2="288" y2="626" stroke="#c8b9d8" stroke-width="1.5"/><line x1="101.0" y1="622" x2="101.0" y2="630" stroke="#c8b9d8" stroke-width="1.5"/><text x="101.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">−2</text><line x1="135.0" y1="622" x2="135.0" y2="630" stroke="#c8b9d8" stroke-width="1.5"/><text x="135.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">−1</text><line x1="169.0" y1="622" x2="169.0" y2="630" stroke="#c8b9d8" stroke-width="1.5"/><text x="169.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">0</text><line x1="203.0" y1="622" x2="203.0" y2="630" stroke="#c8b9d8" stroke-width="1.5"/><text x="203.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">+1</text><line x1="237.0" y1="622" x2="237.0" y2="630" stroke="#c8b9d8" stroke-width="1.5"/><text x="237.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">+2</text><line x1="271.0" y1="622" x2="271.0" y2="630" stroke="#c8b9d8" stroke-width="1.5"/><text x="271.0" y="646" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">+3</text><text x="20" y="670" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Punto: Q̂; raya: el bono, al lado</text><text x="20" y="694" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">que conviene a quien mueve.</text><text x="20" y="718" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">MIN no cambia el signo de c:</text><text x="20" y="742" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">voltea el bigote y busca el</text><text x="20" y="766" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">extremo opuesto. El bono</text><text x="20" y="790" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">siempre empuja hacia lo que</text><text x="20" y="814" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">aún podría ser bueno para él.</text></svg>