<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1152" viewBox="0 0 640 1152" role="img" aria-label="DECIDIR-ALFA-BETA sobre el árbol T, paso 4 (fila 16 de la traza). Arriba, la banda del pseudocódigo: línea 20: w ← ALFA-BETA(T(s, a), α, β); línea 21: v ← min(v, w); línea 22: if v ≤ α: return v. La hoja 2 devuelve w = 2. Recuadro: mejor_jugada = centro · α = 5. En el árbol: R en la pila; I ya devolvió v = 3; C ya devolvió v = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 7 (una cota); la hoja 8 no se genera; D ya devolvió v = 2 (una cota); la hoja 12 no se genera. Abajo, la recta numérica: v = 2 ≤ α = 5: corte alfa. D compara su v con α, el número del rival que heredó; β es el suyo. D valdrá a lo más 2, y R ya tiene 5: la hoja 12 no se genera."><title>Alfa-beta en T · paso 4. Corte alfa en D</title><desc>DECIDIR-ALFA-BETA sobre el árbol T, paso 4 (fila 16 de la traza). Arriba, la banda del pseudocódigo: línea 20: w ← ALFA-BETA(T(s, a), α, β); línea 21: v ← min(v, w); línea 22: if v ≤ α: return v. La hoja 2 devuelve w = 2. Recuadro: mejor_jugada = centro · α = 5. En el árbol: R en la pila; I ya devolvió v = 3; C ya devolvió v = 5; C1 ya devolvió v = 5; C2 ya devolvió v = 7 (una cota); la hoja 8 no se genera; D ya devolvió v = 2 (una cota); la hoja 12 no se genera. Abajo, la recta numérica: v = 2 ≤ α = 5: corte alfa. D compara su v con α, el número del rival que heredó; β es el suyo. D valdrá a lo más 2, y R ya tiene 5: la hoja 12 no se genera.</desc><rect x="0" y="0" width="640" height="1152" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weig