<svg xmlns="http://www.w3.org/2000/svg" width="300" height="831" viewBox="0 0 300 831" role="img" aria-label="Diagrama de flujo de uct, en palabras. 1: 1 · Selección baja por su árbol con el puntaje UCT. 2: 2 · Expansión agrega un hijo nuevo (en un final, salta a 4). 3: 3 · Simulación al azar hasta un final; no se guarda. 4: 4 · Retropropagación cada nodo del camino suma una visita a N y actualiza su promedio Q̂ con la U. 5, pregunta: ¿Se acabó el tiempo? Si sí, sigue abajo. 6: Juega la jugada de la raíz más visitada. Desde el paso 5, si no: otra vuelta, vuelve al paso 1."><title>UCT, en palabras · una vuelta, cuatro fases</title><desc>Diagrama de flujo de uct, en palabras. 1: 1 · Selección baja por su árbol con el puntaje UCT. 2: 2 · Expansión agrega un hijo nuevo (en un final, salta a 4). 3: 3 · Simulación al azar hasta un final; no se guarda. 4: 4 · Retropropagación cada nodo del camino suma una visita a N y actualiza su promedio Q̂ con la U. 5, pregunta: ¿Se acabó el tiempo? Si sí, sigue abajo. 6: Juega la jugada de la raíz más visitada. Desde el paso 5, si no: otra vuelta, vuelve al paso 1.</desc><rect x="0" y="0" width="300" height="831" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="32" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">UCT, en palabras</text><text x="20" y="56" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="start">una vuelta, cuatro fases</text><rect x="46" y="95" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="121" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">1 · Selección</text><text x="58" y="142" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">baja por su árbol</text><text x="58" y="163" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">con el puntaje UCT</text><line x1="116" y1="178" x2="116" y2="210" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="214" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="240" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">2 · Expansión</text><text x="58" y="261" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">agrega un hijo nuevo</text><text x="58" y="282" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">(en un final, salta a 4)</text><line x1="116" y1="297" x2="116" y2="329" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="333" width="242" height="83" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="359" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">3 · Simulación</text><text x="58" y="380" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">al azar hasta un final;</text><text x="58" y="401" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">no se guarda</text><line x1="116" y1="416" x2="116" y2="448" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="46" y="452" width="242" height="125" rx="10" fill="#311946" stroke="#c8b9d8" stroke-width="1.5"/><text x="58" y="478" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">4 · Retropropagación</text><text x="58" y="499" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">cada nodo del camino suma</text><text x="58" y="520" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">una visita a N y</text><text x="58" y="541" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">actualiza su promedio</text><text x="58" y="562" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Q̂ con la U</text><line x1="116" y1="577" x2="116" y2="609" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><polygon points="116,613 186,663 116,713 46,663" fill="#252043" stroke="#55ddff" stroke-width="2"/><text x="116" y="658" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">¿Se acabó</text><text x="116" y="678" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">el tiempo?</text><line x1="116" y1="713" x2="116" y2="745" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="124" y="731" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">sí</text><rect x="46" y="749" width="242" height="62" rx="10" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="58" y="775" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Juega la jugada</text><text x="58" y="796" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">de la raíz más visitada</text><polyline points="46,663 28,663 28,136.5" fill="none" stroke="#c8b9d8" stroke-width="2"/><line x1="28" y1="136.5" x2="43" y2="136.5" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="19" y="399.75" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" transform="rotate(-90 19 399.75)">no: otra vuelta</text></svg>