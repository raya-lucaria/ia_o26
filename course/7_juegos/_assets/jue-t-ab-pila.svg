.5"/><text x="320" y="412.0" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C · MIN</text><text x="320" y="442.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">v = 5</text><rect x="153.0" y="517.0" width="110" height="70" rx="10" fill="#211033" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="2 5"/><text x="208" y="544.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C1 · MAX</text><text x="208" y="572.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">devolvió 5</text><circle cx="172" cy="682.0" r="24" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="2 4"/><text x="172" y="689.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">5</text><circle cx="244" cy="682.0" r="24" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="2 4"/><text x="244" y="689.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">2</text><rect x="364.0" y="517.0" width="110" height="70" rx="10" fill="#293154" stroke="#f04cff" stroke-width="3.5"/><text x="419" y="542.0" fill="#55ddff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C2 · MAX</text><text x="419" y="572.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">v = 7 · cota</text><circle cx="383" cy="682.0" r="28" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="383" cy="682.0" r="24" fill="#373639" stroke="#a8ff5a" stroke-width="3.5"/><text x="383" y="689.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">7</text><circle cx="455" cy="682.0" r="24" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="455" y="689.0" fill="#78419e" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">?</text><rect x="504.0" y="387.0" width="110" height="70" rx="10" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="8 6"/><text x="559" y="414.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">D · MIN</text><circle cx="518" cy="552.0" r="24" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="518" y="559.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><circle cx="599" cy="552.0" r="24" fill="#211033" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><text x="599" y="559.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">12</text><rect x="379.0" y="392.0" width="84" height="60" rx="6" fill="#3a174b" stroke="#f04cff" stroke-width="1.5"/><text x="421.0" y="414.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">α = 3</text><text x="421.0" y="442.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">β = 5</text><rect x="276.0" y="522.0" width="84" height="60" rx="6" fill="#3a174b" stroke="#f04cff" stroke-width="1.5"/><text x="318.0" y="544.0" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">α = 3</text><rect x="280.0" y="554.0" width="76" height="25" rx="4" fill="#f04cff" stroke="#f04cff" stroke-width="1"/><text x="318.0" y="572.0" fill="#211033" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">β = 5</text><rect x="16" y="240.0" width="203" height="64" rx="6" fill="#211033" stroke="#f7f2ff" stroke-width="1.5"/><text x="28" y="265.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">mejor_jugada = izq</text><text x="28" y="291.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">α = 3</text><text x="20" y="782.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">La pila: lo único en memoria</text><rect x="12" y="802.0" width="192" height="150" rx="8" fill="#321543" stroke="#f04cff" stroke-width="1.5"/><text x="108.0" y="828.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">R · DECIDIR</text><text x="24" y="858.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">α = 3</text><text x="24" y="884.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">mejor_jugada = izq</text><text x="24" y="910.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">va en: centro</text><rect x="220" y="802.0" width="192" height="150" rx="8" fill="#321543" stroke="#f04cff" stroke-width="1.5"/><text x="316.0" y="828.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C · MIN</text><text x="232" y="858.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">α = 3</text><text x="232" y="884.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">β = 5</text><text x="232" y="910.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">v = 5</text><text x="232" y="936.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">va en: c2</text><line x1="205" y1="877.0" x2="218" y2="877.0" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="428" y="802.0" width="192" height="150" rx="8" fill="#321543" stroke="#f04cff" stroke-width="2.5"/><text x="524.0" y="828.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C2 · MAX</text><text x="440" y="858.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">α = 3</text><text x="440" y="884.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">β = 5</text><text x="440" y="910.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">v = 7</text><text x="440" y="936.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">v ≥ β: corta</text><line x1="413" y1="877.0" x2="426" y2="877.0" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="20" y="986.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">I y C1 ya regresaron:</text><text x="20" y="1013.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">sus marcos ya no existen.</text><text x="20" y="1040.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">C1 había subido su α a 5;</text><text x="20" y="1067.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">se perdió al regresar.</text><text x="20" y="1094.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">A C le llegó w = 5,</text><text x="20" y="1121.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">y con él C puso β = 5.</text></svg>