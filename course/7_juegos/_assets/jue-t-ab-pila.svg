.5"/><text x="286" y="412.0" fill="#ffd166" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C · MIN</text><text x="286" y="442.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">v = 5</text><rect x="136.0" y="517.0" width="108" height="70" rx="10" fill="#211033" stroke="#c8b9d8" stroke-width="2" stroke-dasharray="2 5"/><text x="190" y="544.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C1 · MAX</text><text x="190" y="572.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">devolvió 5</text><circle cx="158" cy="682.0" r="24" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="2 4"/><text x="158" y="689.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">5</text><circle cx="222" cy="682.0" r="24" fill="#211033" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="2 4"/><text x="222" y="689.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="middle">2</text><rect x="328.0" y="517.0" width="108" height="70" rx="10" fill="#293154" stroke="#f04cff" stroke-width="3.5"/><text x="382" y="542.0" fill="#55ddff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C2 · MAX</text><text x="382" y="572.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">v = 7 · cota</text><circle cx="350" cy="682.0" r="28" fill="none" stroke="#a8ff5a" stroke-width="1.5"/><circle cx="350" cy="682.0" r="24" fill="#373639" stroke="#a8ff5a" stroke-width="3.5"/><text x="350" y="689.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">7</text><circle cx="414" cy="682.0" r="24" fill="#211033" stroke="#78419e" stroke-wid