<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1136" viewBox="0 0 600 1136" role="img" aria-label="El árbol T a media ejecución de DECIDIR-ALFA-BETA (fila 12 de la traza): el instante del corte beta en C2. En el árbol, resaltado, el camino R, C, C2. I y C1 aparecen tenues, con «devolvió 3» y «devolvió 5»: ya regresaron y se olvidaron. La hoja 7 acaba de devolver w = 7; la hoja 8 es un círculo punteado con «?»: no se generará. D y sus hojas siguen por mirar. C2 compara su v con β, el número del rival; su α es el suyo. Abajo, la pila de llamadas, tres marcos: R, con α = 3 y mejor_jugada = izq, va en centro; C, con α = 3, β = 5 y v = 5, va en c2; C2, con α = 3, β = 5 y v = 7: v ≥ β, corta. El α = 5 que C1 alcanzó se perdió al regresar: a C le llegó w = 5."><title>ALFA-BETA en T. a media ejecución: pila R›C›C2</title><desc>El árbol T a media ejecución de DECIDIR-ALFA-BETA (fila 12 de la traza): el instante del corte beta en C2. En el árbol, resaltado, el camino R, C, C2. I y C1 aparecen tenues, con «devolvió 3» y «devolvió 5»: ya regresaron y se olvidaron. La hoja 7 acaba de devolver w = 7; la hoja 8 es un círculo punteado con «?»: no se generará. D y sus hojas siguen por mirar. C2 compara su v con β, el número del rival; su α es el suyo. Abajo, la pila de llamadas, tres marcos: R, con α = 3 y mejor_jugada = izq, va en centro; C, con α = 3, β = 5 y v = 5, va en c2; C2, con α = 3, β = 5 y v = 7: v ≥ β, corta. El α = 5 que C1 alcanzó se perdió al regresar: a C le llegó w = 5.</desc><rect x="0" y="0" width="600" height="1136" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">ALFA-BETA en T</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">a media ejecución: pila R›C›C2</text><rect x="12" y="80" width="576" height="89" rx="8" fill="#361647" stroke="#f04cff" stroke-width="1.5"/><text x="40" y="105" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="end">12</text><text x="50" y="105" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">w ← ALFA-BETA(T(s, a), α, β)</text><text x="40" y="130" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="end">13</text><text x="50" y="130" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">v ← max(v, w)</text><text x="40" y="155" fill="#f04cff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="end">14</text><text x="50" y="155" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="normal" text-anchor="start">if v ≥ β: return v</text><text x="20" y="199" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">la hoja 7 devuelve w = 7</text><line x1="314" y1="307.0" x2="68" y2="387.0" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="2 4"/><rect x="186.7" y="327.6" width="48" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="210.7" y="345.6" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">izq</text><line x1="68" y1="457.0" x2="36" y2="524.0" stroke="#c8b9d8" stroke-width="1.5" stroke-dasharray="2 4"/><line