ke="#f7f2ff" stroke-width="1.5"/><text x="28" y="265.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">mejor_jugada = izq</text><text x="28" y="291.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start">α = 3</text><text x="20" y="782.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">La pila: lo único en memoria</text><rect x="12" y="802.0" width="200" height="150" rx="8" fill="#321543" stroke="#f04cff" stroke-width="1.5"/><text x="112.0" y="828.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">R · DECIDIR</text><text x="22" y="858.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">α = 3</text><text x="22" y="884.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">mejor_jugada = izq</text><text x="22" y="910.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">va en: centro</text><rect x="232" y="802.0" width="168" height="150" rx="8" fill="#321543" stroke="#f04cff" stroke-width="1.5"/><text x="316.0" y="828.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C · MIN</text><text x="242" y="858.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">α = 3</text><text x="242" y="884.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">β = 5</text><text x="242" y="910.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">v = 5</text><text x="242" y="936.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">va en: c2</text><line x1="213" y1="877.0" x2="230" y2="877.0" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><rect x="420" y="802.0" width="168" height="150" rx="8" fill="#321543" stroke="#f04cff" stroke-width="2.5"/><text x="504.0" y="828.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">C2 · MAX</text><text x="430" y="858.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">α = 3</text><text x="430" y="884.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">β = 5</text><text x="430" y="910.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">v = 7</text><text x="430" y="936.0" fill="#f7f2ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="normal" text-anchor="start">v ≥ β: corta</text><line x1="401" y1="877.0" x2="418" y2="877.0" stroke="#f04cff" stroke-width="2" marker-end="url(#p)"/><text x="20" y="986.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">I y C1 ya regresaron:</text><text x="20" y="1013.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">sus marcos ya no existen.</text><text x="20" y="1040.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">C1 había subido su α a 5;</text><text x="20" y="1067.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">se perdió al regresar.</text><text x="20" y="1094.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">A C le llegó w = 5,</text><text x="20" y="1121.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="start">y con él C puso β = 5.</text></svg>