<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-label="El estado inicial s₀ dibujado en grande: el tablero con tres peones blancos en la fila 1 y tres negros en la fila 3, y el turno de Blancas, que es MAX. El borde punteado indica que todavía no se calcularon sus jugadas."><title>Paso 1 · Un nodo: el estado inicial</title><desc>El estado inicial s₀ dibujado en grande: el tablero con tres peones blancos en la fila 1 y tres negros en la fila 3, y el turno de Blancas, que es MAX. El borde punteado indica que todavía no se calcularon sus jugadas.</desc><rect x="0" y="0" width="600" height="540" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Paso 1 · Un nodo:</text><text x="20" y="59" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">el estado inicial</text><rect x="45.0" y="129.0" width="250" height="290" rx="10" fill="#251e41" stroke="#55ddff" stroke-width="2" stroke-dasharray="8 5"/><text x="170" y="162.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24.0" font-weight="700" text-anchor="middle">s₀</text><rect x="86.0" y="177.0" width="168" height="168" rx="3" fill="#3f2158" stroke="#c8b9d8" stroke-width="1"/><line x1="142.0" y1="177.0" x2="142.0" y2="345.0" stroke="#c8b9d8" stroke-width="1"/><line x1="86.0" y1="233.0" x2="254.0" y2="233.0" stroke="#c8b9d8" stroke-width="1"/><line x1="198.0" y1="177.0" x2="198.0" y2="345.0" stroke="#c8b9d8" stroke-width="1"/><line x1="86.0" y1="289.0" x2="254.0" y2="289.0" stroke="#c8b9d8" stroke-width="1"/><circle cx="114.0" cy="317.0" r="23.5" fill="#f7f2ff"/><text x="114.0" y="329.1" fill="#211033" font-family="system-ui, sans-serif" font-size="33.6" font-weight="700" text-anchor="middle">B</text><circle cx="170.0" cy="317.0" r="23.5" fill="#f7f2ff"/><text x="170.0" y="329.1" fill="#211033" font-family="system-ui, sans-serif" font-size="33.6" font-weight="700" text-anchor="middle">B</text><circle cx="226.0" cy="317.0" r="23.5" fill="#f7f2ff"/><text x="226.0" y="329.1" fill="#211033" font-family="system-ui, sans-serif" font-size="33.6" font-weight="700" text-anchor="middle">B</text><circle cx="114.0" cy="205.0" r="23.5" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="114.0" y="217.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="33.6" font-weight="700" text-anchor="middle">N</text><circle cx="170.0" cy="205.0" r="23.5" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="170.0" y="217.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="33.6" font-weight="700" text-anchor="middle">N</text><circle cx="226.0" cy="205.0" r="23.5" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="226.0" y="217.1" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="33.6" font-weight="700" text-anchor="middle">N</text><text x="170" y="378.5" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19.5" font-weight="700" text-anchor="middle">Mueve Blancas</text><text x="170" y="404.0" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19.5" font-weight="700" text-anchor="middle">MAX</text><line x1="368" y1="157" x2="303.0" y2="156" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="378" y="156" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Nombre del nodo:</text><text x="378" y="178" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">s₀, el estado inicial</text><line x1="368" y1="259" x2="303.0" y2="256" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="378" y="258" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">El tablero τ: qué</text><text x="378" y="280" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">hay en cada casilla</text><line x1="368" y1="373" x2="303.0" y2="386" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="378" y="372" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">El turno: Blancas,</text><text x="378" y="394" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">así que Pl(s₀) = MAX</text><text x="20" y="464" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">Borde punteado: el nodo existe,</text><text x="20" y="486" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">pero todavía no sabemos qué</text><text x="20" y="508" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">jugadas salen de él.</text></svg>