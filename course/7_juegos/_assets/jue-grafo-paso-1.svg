<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" role="img" aria-label="El estado inicial s₀ dibujado en grande: el tablero con tres peones blancos en la fila 1 y tres negros en la fila 3, y el turno de Blancas, que es MAX. El borde punteado indica que todavía no se calcularon sus jugadas."><title>Paso 1 · Un nodo: el estado inicial</title><desc>El estado inicial s₀ dibujado en grande: el tablero con tres peones blancos en la fila 1 y tres negros en la fila 3, y el turno de Blancas, que es MAX. El borde punteado indica que todavía no se calcularon sus jugadas.</desc><rect x="0" y="0" width="700" height="520" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="350.0" y="36" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Paso 1 · Un nodo: el estado inicial</text><rect x="70.0" y="100.0" width="270" height="300" rx="10" fill="#251e41" stroke="#55ddff" stroke-width="2" stroke-dasharray="8 5"/><text x="205" y="133.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="24.0" font-weight="700" text-anchor="middle">s₀</text><rect x="115.0" y="148.0" width="180" height="180" rx="3" fill="#3f2158" stroke="#c8b9d8" stroke-width="1"/><line x1="175.0" y1="148.0" x2="175.0" y2="328.0" stroke="#c8b9d8" stroke-width="1"/><line x1="115.0" y1="208.0" x2="295.0" y2="208.0" stroke="#c8b9d8" stroke-width="1"/><line x1="235.0" y1="148.0" x2="235.0" y2="328.0" stroke="#c8b9d8" stroke-width="1"/><line x1="115.0" y1="268.0" x2="295.0" y2="268.0" stroke="#c8b9d8" stroke-width="1"/><circle cx="145.0" cy="298.0" r="25.2" fill="#f7f2ff"/><text x="145.0" y="311.0" fill="#211033" font-family="system-ui, sans-serif" font-size="36.0" font-weight="700" text-anchor="middle">B</text><circle cx="205.0" cy="298.0" r="25.2" fill="#f7f2ff"/><text x="205.0" y="311.0" fill="#211033" font-family="system-ui, sans-serif" font-size="36.0" font-weight="700" text-anchor="middle">B</text><circle cx="265.0" cy="298.0" r="25.2" fill="#f7f2ff"/><text x="265.0" y="311.0" fill="#211033" font-family="system-ui, sans-serif" font-size="36.0" font-weight="700" text-anchor="middle">B</text><circle cx="145.0" cy="178.0" r="25.2" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="145.0" y="191.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="36.0" font-weight="700" text-anchor="middle">N</text><circle cx="205.0" cy="178.0" r="25.2" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="205.0" y="191.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="36.0" font-weight="700" text-anchor="middle">N</text><circle cx="265.0" cy="178.0" r="25.2" fill="#211033" stroke="#f7f2ff" stroke-width="2"/><text x="265.0" y="191.0" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="36.0" font-weight="700" text-anchor="middle">N</text><text x="205" y="359.5" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19.5" font-weight="700" text-anchor="middle">Mueve Blancas</text><text x="205" y="385.0" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19.5" font-weight="700" text-anchor="middle">MAX</text><line x1="440" y1="125" x2="348.0" y2="122" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="450" y="124" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Nombre del nodo: s₀,</text><text x="450" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">el estado inicial</text><line x1="440" y1="235" x2="348.0" y2="230" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="450" y="234" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">El tablero τ: qué hay</text><text x="450" y="256" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">en cada casilla</text><line x1="440" y1="365" x2="348.0" y2="372" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="450" y="364" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">El turno: mueve Blancas,</text><text x="450" y="386" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">así que Pl(s₀) = MAX</text><text x="350.0" y="450" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Borde punteado: el nodo existe, pero todavía</text><text x="350.0" y="472" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">no sabemos qué jugadas salen de él.</text></svg>