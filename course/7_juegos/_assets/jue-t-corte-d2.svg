<svg xmlns="http://www.w3.org/2000/svg" width="600" height="812" viewBox="0 0 600 812" role="img" aria-label="El árbol de resultados con corte a profundidad 2; sus finales van en la escala 100·U: +100 gana MAX, −100 gana MIN, 0 empate. Una línea punteada marca dónde se corta, bajo el nivel 2; lo que queda debajo no se genera y va en caja o círculo punteado con «?». C1 recibe EVAL = 10; C2 recibe EVAL = 50; finales alcanzados arriba del corte: 100, −100, −100, 100, 100. I vale −100; C vale 10; D vale −100. Tramo 2: R recibe w = −100 de D, que no mejora 10: mejor_jugada sigue en centro, y R juega centro, con 10. Se han generado 11 de 15 nodos."><title>Corte con d = 2, tramo 2 · D devuelve −100: sigue centro</title><desc>El árbol de resultados con corte a profundidad 2; sus finales van en la escala 100·U: +100 gana MAX, −100 gana MIN, 0 empate. Una línea punteada marca dónde se corta, bajo el nivel 2; lo que queda debajo no se genera y va en caja o círculo punteado con «?». C1 recibe EVAL = 10; C2 recibe EVAL = 50; finales alcanzados arriba del corte: 100, −100, −100, 100, 100. I vale −100; C vale 10; D vale −100. Tramo 2: R recibe w = −100 de D, que no mejora 10: mejor_jugada sigue en centro, y R juega centro, con 10. Se han generado 11 de 15 nodos.</desc><rect x="0" y="0" width="600" height="812" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker></defs><text x="20" y="34" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="start">Corte con d = 2, tramo 2</text><text x="20" y="60" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="start">D devuelve −100: sigue centro</text><text x="20" y="96" fill="#f04cff" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="start">11 de 15 nodos</text><line x1="316" y1="204.0" x2="74" y2="278.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="190.4" y="224.6" width="48" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="214.4" y="242.6" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">izq</text><line x1="74" y1="354.0" x2="40" y2="415.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="74" y1="354.0" x2="108" y2="415.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="316" y1="204.0" x2="280" y2="278.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="262.9" y="224.6" width="76" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="300.9" y="242.6" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">centro</text><line x1="280" y1="354.0" x2="215" y2="408.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="233.2" y="366.2" width="39" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="252.7" y="384.2" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">c1</text><line x1="215" y1="484.0" x2="185" y2="551.0" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><line x1="215" y1="484.0" x2="245" y2="551.0" stroke="#78419e" stroke-width="2" stroke-dasharray="6 5"/><line x1="280" y1="354.0" x2="345" y2="408.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><rect x="287.8" y="366.2" width="39" height="26" rx="7" fill="#211033" stroke="#c8b9d8" stroke-width="1.5"/><text x="307.3" y="384.2" fill="#c8b9d8" font-family="ui-monospace, SFMono-Regular, Menlo, monos