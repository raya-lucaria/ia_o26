<svg xmlns="http://www.w3.org/2000/svg" width="300" height="1148.0" viewBox="0 0 300 1148.0" role="img" aria-label="Gráfica de puntos, una fila por regla. Eje x: fracción de las 10 000 vueltas que fueron a x, de 0 a 1. Cada punto es una corrida de 10 000 vueltas: 40 por fila, con semillas 1 a 40. La posición horizontal de cada punto es su valor, a ±0.01; las corridas de valor cercano se apilan en vertical, en una columna; una raya vertical marca el promedio de la fila. Atorada: menos de la mitad de sus vueltas en x. Siempre el mejor promedio: 34 corridas en 0.99 o más y 6 atoradas en 0.001 o menos (5 en y, 1 en z), promedio 0.85. A veces al azar (10 %): ninguna atorada, de 0.903 a 0.938, promedio 0.93. UCB, c = 2√2: ninguna atorada, de 0.923 a 0.959, promedio 0.94. UCB, c = 1: ninguna atorada, de 0.955 a 0.999, promedio 0.99."><title>Dónde termina cada corrida cada punto es una corrida de 10 000 vueltas</title><desc>Gráfica de puntos, una fila por regla. Eje x: fracción de las 10 000 vueltas que fueron a x, de 0 a 1. Cada punto es una corrida de 10 000 vueltas: 40 por fila, con semillas 1 a 40. La posición horizontal de cada punto es su valor, a ±0.01; las corridas de valor cercano se apilan en vertical, en una columna; una raya vertical marca el promedio de la fila. Atorada: menos de la mitad de sus vueltas en x. Siempre el mejor promedio: 34 corridas en 0.99 o más y 6 atoradas en 0.001 o menos (5 en y, 1 en z), promedio 0.85. A veces al azar (10 %): ninguna atorada, de 0.903 a 0.938, promedio 0.93. UCB, c = 2√2: ninguna atorada, de 0.923 a 0.959, promedio 0.94. UCB, c = 1: ninguna atorada, de 0.955 a 0.999, promedio 0.99.</desc><rect x="0" y="0" width="300" height="1148.0" rx="16" fill="#211033"/><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="a