<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="La red como una cadena de funciones: x entra a f⁽¹⁾ y sale a⁽¹⁾; a⁽¹⁾ entra a f⁽²⁾ y sale a⁽²⁾; a⁽²⁾ entra a f⁽³⁾ y sale ŷ; ŷ y la etiqueta y entran a la pérdida ℓ. A cada caja f⁽ˡ⁾ le entran sus parámetros W⁽ˡ⁾ y b⁽ˡ⁾. Debajo de cada vector, su espacio: x en ℝ², a⁽¹⁾ en ℝ³, a⁽²⁾ en ℝ², ŷ en ℝ¹; g⁽¹⁾ y g⁽²⁾ son ReLU y g⁽³⁾ la identidad. Abajo: ŷ = f⁽³⁾(f⁽²⁾(f⁽¹⁾(x))) = f_θ(x), con f⁽ˡ⁾(u) = g⁽ˡ⁾(W⁽ˡ⁾u + b⁽ˡ⁾)."><title>La red como composición</title><rect x="0" y="0" width="600" height="300" rx="16" fill="#211033"/><defs><marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker><marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8fab"/></marker><marker id="ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55ddff"/></marker><marker id="ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8ff5a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#675778"/></marker></defs><text x="34" y="119" fill="#55ddff" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-weight="700">x</tspan></text><text x="34" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">ℝ²</text><line x1="56" y1="112" x2="75" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><rect x="77" y="89" width="64" height="46" rx="8" fill="#2e1e40" stroke="#c8b9d8" stroke-width="2"/><text x="109" y="119" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-style="italic">f </tspan>⁽¹⁾</text><text x="109" y="46" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600"><tspan font-weight="700">W</tspan>⁽¹⁾, <tspan font-weight="700">b</tspan>⁽¹⁾</text><line x1="109" y1="54" x2="109" y2="86" stroke="#ff8fab" stroke-width="2" marker-end="url(#pa)"/><text x="109" y="152" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle"><tspan font-style="italic">g</tspan>⁽¹⁾: ReLU</text><line x1="143" y1="112" x2="162" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><text x="184" y="119" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-weight="700">a</tspan>⁽¹⁾</text><text x="184" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">ℝ³</text><line x1="206" y1="112" x2="225" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><rect x="227" y="89" width="64" height="46" rx="8" fill="#2e1e40" stroke="#c8b9d8" stroke-width="2"/><text x="259" y="119" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-style="italic">f </tspan>⁽²⁾</text><text x="259" y="46" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600"><tspan font-weight="700">W</tspan>⁽²⁾, <tspan font-weight="700">b</tspan>⁽²⁾</text><line x1="259" y1="54" x2="259" y2="86" stroke="#ff8fab" stroke-width="2" marker-end="url(#pa)"/><text x="259" y="152" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle"><tspan font-style="italic">g</tspan>⁽²⁾: ReLU</text><line x1="293" y1="112" x2="312" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><text x="334" y="119" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-weight="700">a</tspan>⁽²⁾</text><text x="334" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">ℝ²</text><line x1="356" y1="112" x2="375" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><rect x="377" y="89" width="64" height="46" rx="8" fill="#2e1e40" stroke="#c8b9d8" stroke-width="2"/><text x="409" y="119" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-style="italic">f </tspan>⁽³⁾</text><text x="409" y="46" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600"><tspan font-weight="700">W</tspan>⁽³⁾, <tspan font-weight="700">b</tspan>⁽³⁾</text><line x1="409" y1="54" x2="409" y2="86" stroke="#ff8fab" stroke-width="2" marker-end="url(#pa)"/><text x="409" y="152" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle"><tspan font-style="italic">g</tspan>⁽³⁾: identidad</text><line x1="443" y1="112" x2="462" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><text x="484" y="119" fill="#ffd166" font-family="system-ui, sans-serif" font-size="19" text-anchor="middle"><tspan font-weight="700">ŷ</tspan></text><text x="484" y="146" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">ℝ¹</text><line x1="506" y1="112" x2="525" y2="112" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><rect x="527" y="89" width="46" height="46" rx="8" fill="#3e1850" stroke="#f04cff" stroke-width="2.5"/><text x="550" y="120" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle"><tspan font-style="italic">ℓ</tspan></text><text x="550" y="182" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle"><tspan font-weight="700">y</tspan></text><line x1="550" y1="166" x2="550" y2="138" stroke="#c8b9d8" stroke-width="2" marker-end="url(#fw)"/><line x1="30" y1="218" x2="570" y2="218" stroke="#463557" stroke-width="1"/><text x="300" y="250" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-weight="700">ŷ</tspan> = <tspan font-style="italic">f </tspan>⁽³⁾(<tspan font-style="italic">f </tspan>⁽²⁾(<tspan font-style="italic">f </tspan>⁽¹⁾(<tspan font-weight="700">x</tspan>))) = <tspan font-style="italic">f </tspan><tspan dy="5.1" font-size="13.6"><tspan font-style="italic">θ</tspan></tspan><tspan dy="-5.1">(</tspan><tspan font-weight="700">x</tspan>)</text><text x="300" y="280" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">cada capa:  <tspan font-style="italic">f </tspan>⁽ˡ⁾(<tspan font-weight="700">u</tspan>) = <tspan font-style="italic">g</tspan>⁽ˡ⁾(<tspan font-weight="700">W</tspan>⁽ˡ⁾<tspan font-weight="700">u</tspan> + <tspan font-weight="700">b</tspan>⁽ˡ⁾)</text></svg>