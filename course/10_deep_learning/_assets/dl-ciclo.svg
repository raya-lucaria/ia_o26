<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="El ciclo de entrenamiento en cinco pasos, en círculo: 1, pase hacia adelante, z⁽ˡ⁾ y a⁽ˡ⁾ para cada capa hasta ŷ; 2, la pérdida promediada en el lote, L_ℬ, más μΩ(θ); 3, pase hacia atrás, de δ⁽ᴸ⁾ a δ⁽¹⁾; 4, los gradientes, δ⁽ˡ⁾ a⁽ˡ⁻¹⁾ᵀ promediado en el lote, más 2μW⁽ˡ⁾; 5, actualizar θ ← θ − η ∇_θ ℒ(θ, μ). Luego, de nuevo con el siguiente lote. Al centro, la entrada del ciclo: tomar un lote ℬ de |ℬ| pares (xₖ, yₖ). Debajo: θ son todos los W⁽ˡ⁾ y b⁽ˡ⁾; una vuelta es un paso de descenso y pasar por todos los lotes es una época."><title>El ciclo de entrenamiento</title><rect x="0" y="0" width="600" height="400" rx="16" fill="#211033"/><defs><marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker><marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8fab"/></marker><marker id="ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55ddff"/></marker><marker id="ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8ff5a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#675778"/></marker></defs><path d="M 357 106 Q 404.9 118.6 429.8 152" fill="none" stroke="#c8b9d8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fw)"/><path d="M 475.6 226 Q 474.5 268.4 445.2 302" fill="none" stroke="#f04cff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4" marker-end="url(#bw)"/><path d="M 330 340 Q 301.1 350.4 272 340" fill="none" stroke="#f04cff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 4" marker-end="url(#bw)"/><path d="M 155.6 304 Q 126.4 270.6 125.2 228" fill="none" stroke="#c8b9d8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fw)"/><path d="M 167 154 Q 191.7 120.9 239.8 108" fill="none" stroke="#c8b9d8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fw)"/><text x="181.7" y="116.9" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="13" text-anchor="end" font-weight="600">siguiente lote</text><rect x="205" y="39" width="190" height="62" rx="10" fill="#352447" stroke="#c8b9d8" stroke-width="2.5"/><text x="300" y="64" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">1 · Adelante</text><text x="300" y="87" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-weight="700">z</tspan>⁽ˡ⁾, <tspan font-weight="700">a</tspan>⁽ˡ⁾ para <tspan font-style="italic">l</tspan> = 1…<tspan font-style="italic">L</tspan>; <tspan font-weight="700">ŷ</tspan>ₖ</text><rect x="395" y="159" width="190" height="62" rx="10" fill="#3a174b" stroke="#f04cff" stroke-width="2.5"/><text x="490" y="184" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">2 · Pérdida</text><text x="490" y="207" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-style="italic">L</tspan><tspan dy="3.9" font-size="12">ℬ</tspan><tspan dy="-3.9"> + </tspan><tspan font-style="italic">μ</tspan>Ω(<tspan font-style="italic">θ</tspan>)</text><rect x="335" y="309" width="190" height="62" rx="10" fill="#3a174b" stroke="#f04cff" stroke-width="2.5" stroke-dasharray="6 3"/><text x="430" y="334" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">3 · Atrás</text><text x="430" y="357" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-weight="700">δ</tspan>⁽ᴸ⁾, …, <tspan font-weight="700">δ</tspan>⁽¹⁾</text><rect x="75" y="309" width="190" height="62" rx="10" fill="#3a174b" stroke="#f04cff" stroke-width="2.5" stroke-dasharray="6 3"/><text x="170" y="334" fill="#f04cff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">4 · Gradientes</text><text x="170" y="357" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-weight="700">δ</tspan>⁽ˡ⁾<tspan font-weight="700">a</tspan>⁽ˡ⁻¹⁾ᵀ en ℬ + 2<tspan font-style="italic">μ</tspan><tspan font-weight="700">W</tspan>⁽ˡ⁾</text><rect x="15" y="159" width="190" height="62" rx="10" fill="#3c1f41" stroke="#ff8fab" stroke-width="2.5"/><text x="110" y="184" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">5 · Actualizar</text><text x="110" y="207" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> − <tspan font-style="italic">η</tspan> ∇<tspan dy="3.9" font-size="12"><tspan font-style="italic">θ</tspan></tspan><tspan dy="-3.9">ℒ(</tspan><tspan font-style="italic">θ</tspan>, <tspan font-style="italic">μ</tspan>)</text><rect x="215" y="133" width="170" height="54" rx="10" fill="#27294b" stroke="#55ddff" stroke-width="2.5"/><text x="300" y="155" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="700">Tomar un lote ℬ</text><text x="300" y="175" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">|ℬ| pares (<tspan font-weight="700">x</tspan>ₖ, <tspan font-weight="700">y</tspan>ₖ)</text><line x1="300" y1="130" x2="300" y2="107" stroke="#55ddff" stroke-width="2.5" marker-end="url(#ci)"/><text x="300" y="222" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600"><tspan font-style="italic">θ</tspan> = todos los <tspan font-weight="700">W</tspan>⁽ˡ⁾ y <tspan font-weight="700">b</tspan>⁽ˡ⁾</text><text x="300" y="246" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">una vuelta = un paso de descenso</text><text x="300" y="266" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">todos los lotes = una época</text></svg>