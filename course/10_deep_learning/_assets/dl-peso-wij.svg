<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Una sola conexión vista de cerca. A la izquierda la neurona de origen j en la capa l − 1, con su activación aⱼ⁽ˡ⁻¹⁾; a la derecha la neurona de destino i en la capa l, con su preactivación zᵢ⁽ˡ⁾. La flecha entre ellas es el peso wᵢⱼ⁽ˡ⁾ y aporta wᵢⱼ⁽ˡ⁾ · aⱼ⁽ˡ⁻¹⁾ a zᵢ⁽ˡ⁾. Abajo: zᵢ⁽ˡ⁾ = Σⱼ wᵢⱼ⁽ˡ⁾ aⱼ⁽ˡ⁻¹⁾ + bᵢ⁽ˡ⁾, y la lectura de los índices: el primero, i, es el destino; el segundo, j, el origen; (l) es la capa a la que llega."><title>Un peso de cerca</title><rect x="0" y="0" width="600" height="330" rx="16" fill="#211033"/><defs><marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker><marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8fab"/></marker><marker id="ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55ddff"/></marker><marker id="ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8ff5a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#675778"/></marker></defs><text x="112" y="52" fill="#55ddff" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">origen <tspan font-style="italic">j</tspan></text><text x="112" y="71" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">capa <tspan font-style="italic">l</tspan> − 1</text><text x="488" y="52" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle" font-weight="700">destino <tspan font-style="italic">i</tspan></text><text x="488" y="71" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">capa <tspan font-style="italic">l</tspan></text><circle cx="112" cy="130" r="40" fill="#282d50" stroke="#55ddff" stroke-width="2.5"/><circle cx="488" cy="130" r="40" fill="#343138" stroke="#a8ff5a" stroke-width="2.5"/><text x="112" y="136" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">a</tspan>ⱼ⁽ˡ⁻¹⁾</text><text x="488" y="136" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">z</tspan>ᵢ⁽ˡ⁾</text><line x1="158" y1="130" x2="442" y2="130" stroke="#ff8fab" stroke-width="3.5" marker-end="url(#pa)"/><text x="300" y="114" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle" font-weight="700"><tspan font-style="italic">w</tspan>ᵢⱼ⁽ˡ⁾</text><text x="300" y="160" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">aporta  <tspan font-style="italic">w</tspan>ᵢⱼ⁽ˡ⁾ · <tspan font-style="italic">a</tspan>ⱼ⁽ˡ⁻¹⁾</text><text x="300" y="180" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">a la suma del destino</text><line x1="40" y1="210" x2="560" y2="210" stroke="#463557" stroke-width="1"/><text x="300" y="240" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">z</tspan>ᵢ⁽ˡ⁾ = Σⱼ <tspan font-style="italic">w</tspan>ᵢⱼ⁽ˡ⁾ <tspan font-style="italic">a</tspan>ⱼ⁽ˡ⁻¹⁾ + <tspan font-style="italic">b</tspan>ᵢ⁽ˡ⁾</text><text x="300" y="272" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Cómo leer <tspan font-style="italic">w</tspan>ᵢⱼ⁽ˡ⁾:</text><text x="150" y="298" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600"><tspan font-style="italic">i</tspan> = destino</text><text x="300" y="298" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600"><tspan font-style="italic">j</tspan> = origen</text><text x="450" y="298" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" font-weight="600">(<tspan font-style="italic">l</tspan>) = capa a la que llega</text><text x="150" y="316" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">primer índice</text><text x="300" y="316" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">segundo índice</text><text x="450" y="316" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">superíndice</text></svg>