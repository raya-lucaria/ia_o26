<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-label="La matriz W⁽¹⁾ en forma general, de 3 filas por 2 columnas, con entradas w₁₁⁽¹⁾ a w₃₂⁽¹⁾. Las filas se rotulan destino i = 1, 2, 3 (las neuronas a₁⁽¹⁾, a₂⁽¹⁾, a₃⁽¹⁾ de la capa 1) y las columnas origen j = 1, 2 (las entradas x₁ y x₂). Se destaca la fila 3, que son las flechas que llegan a a₃⁽¹⁾; la columna 2, que son las flechas que salen de x₂; y su cruce w₃₂⁽¹⁾, que es la flecha de x₂ a a₃⁽¹⁾ en la red dibujada a la derecha. W⁽¹⁾ está en ℝ³ˣ²: d₁ = 3 filas, d₀ = 2 columnas."><title>La matriz W⁽¹⁾</title><rect x="0" y="0" width="600" height="430" rx="16" fill="#211033"/><defs><marker id="fw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c8b9d8"/></marker><marker id="bw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f04cff"/></marker><marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8fab"/></marker><marker id="ci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55ddff"/></marker><marker id="ve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8ff5a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#675778"/></marker></defs><rect x="238" y="125" width="76" height="150" rx="6" fill="#2a3558" stroke="none" stroke-width="0"/><rect x="158" y="229" width="156" height="46" rx="6" fill="#3c403b" stroke="none" stroke-width="0"/><rect x="238" y="229" width="76" height="46" rx="6" fill="#5b3152" stroke="#ff8fab" stroke-width="2"/><path d="M 161 119 H 152 V 281 H 161" fill="none" stroke="#f7f2ff" stroke-width="2" stroke-linecap="round"/><path d="M 311 119 H 320 V 281 H 311" fill="none" stroke="#f7f2ff" stroke-width="2" stroke-linecap="round"/><text x="196" y="154" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">w</tspan>₁₁⁽¹⁾</text><text x="276" y="154" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">w</tspan>₁₂⁽¹⁾</text><text x="196" y="206" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">w</tspan>₂₁⁽¹⁾</text><text x="276" y="206" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">w</tspan>₂₂⁽¹⁾</text><text x="196" y="258" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle"><tspan font-style="italic">w</tspan>₃₁⁽¹⁾</text><text x="276" y="258" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="17" text-anchor="middle" font-weight="700"><tspan font-style="italic">w</tspan>₃₂⁽¹⁾</text><text x="236" y="52" fill="#55ddff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700">origen <tspan font-style="italic">j</tspan></text><text x="196" y="76" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle"><tspan font-style="italic">j</tspan> = 1</text><text x="196" y="96" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">(<tspan font-weight="700">x</tspan>₁)</text><text x="276" y="76" fill="#55ddff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle"><tspan font-style="italic">j</tspan> = 2</text><text x="276" y="96" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">(<tspan font-weight="700">x</tspan>₂)</text><text x="30" y="200" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700" transform="rotate(-90 30 200)">destino <tspan font-style="italic">i</tspan></text><text x="118" y="146" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" text-anchor="end"><tspan font-style="italic">i</tspan> = 1</text><text x="118" y="164" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">(<tspan font-style="italic">a</tspan>₁⁽¹⁾)</text><text x="118" y="198" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" text-anchor="end"><tspan font-style="italic">i</tspan> = 2</text><text x="118" y="216" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">(<tspan font-style="italic">a</tspan>₂⁽¹⁾)</text><text x="118" y="250" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="14" text-anchor="end"><tspan font-style="italic">i</tspan> = 3</text><text x="118" y="268" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">(<tspan font-style="italic">a</tspan>₃⁽¹⁾)</text><text x="475" y="52" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">capa 0 → capa 1</text><line x1="432.9" y1="152.9" x2="517.1" y2="127.1" stroke="#675778" stroke-width="1.4" marker-end="url(#ar)"/><line x1="432.9" y1="167.1" x2="517.1" y2="192.9" stroke="#675778" stroke-width="1.4" marker-end="url(#ar)"/><line x1="427.6" y1="176.3" x2="522.4" y2="263.7" stroke="#a8ff5a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ve)"/><line x1="427.6" y1="223.7" x2="522.4" y2="136.3" stroke="#55ddff" stroke-width="2.2" marker-end="url(#ci)"/><line x1="432.9" y1="232.9" x2="517.1" y2="207.1" stroke="#55ddff" stroke-width="2.2" marker-end="url(#ci)"/><line x1="432.9" y1="247.1" x2="517.1" y2="272.9" stroke="#ff8fab" stroke-width="3.5" marker-end="url(#pa)"/><text x="468" y="292" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" font-weight="700"><tspan font-style="italic">w</tspan>₃₂⁽¹⁾</text><circle cx="410" cy="160" r="22" fill="#282d50" stroke="#55ddff" stroke-width="2.5"/><text x="410" y="165" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">x</tspan>₁</text><circle cx="410" cy="240" r="22" fill="#282d50" stroke="#55ddff" stroke-width="2.5"/><text x="410" y="245" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle"><tspan font-weight="700">x</tspan>₂</text><circle cx="540" cy="120" r="22" fill="#343138" stroke="#a8ff5a" stroke-width="2.5"/><text x="540" y="125" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-style="italic">a</tspan>₁⁽¹⁾</text><circle cx="540" cy="200" r="22" fill="#343138" stroke="#a8ff5a" stroke-width="2.5"/><text x="540" y="205" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-style="italic">a</tspan>₂⁽¹⁾</text><circle cx="540" cy="280" r="22" fill="#343138" stroke="#a8ff5a" stroke-width="2.5"/><text x="540" y="285" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle"><tspan font-style="italic">a</tspan>₃⁽¹⁾</text><rect x="132" y="320" width="18" height="14" rx="3" fill="#3c403b" stroke="#a8ff5a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="156" y="332" fill="#a8ff5a" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">fila 3: las flechas que llegan a <tspan font-style="italic">a</tspan>₃⁽¹⁾ (punteadas)</text><rect x="132" y="344" width="18" height="14" rx="3" fill="#2a3558" stroke="#55ddff" stroke-width="1.5"/><text x="156" y="356" fill="#55ddff" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">columna 2: las flechas que salen de <tspan font-weight="700">x</tspan>₂ (continuas)</text><rect x="132" y="368" width="18" height="14" rx="3" fill="#5b3152" stroke="#ff8fab" stroke-width="1.5"/><text x="156" y="380" fill="#ff8fab" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">su cruce <tspan font-style="italic">w</tspan>₃₂⁽¹⁾: una sola flecha, de <tspan font-weight="700">x</tspan>₂ a <tspan font-style="italic">a</tspan>₃⁽¹⁾</text><text x="300" y="412" fill="#f7f2ff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle"><tspan font-weight="700">W</tspan>⁽¹⁾ ∈ ℝ³ˣ²:  <tspan font-style="italic">d</tspan>₁ = 3 filas (destinos), <tspan font-style="italic">d</tspan>₀ = 2 columnas (orígenes)</text></svg>