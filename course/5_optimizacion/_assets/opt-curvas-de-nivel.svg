0" y2="120.0" stroke="#44245e" stroke-width="1"/><line x1="90.0" y1="460.0" x2="446.0" y2="460.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><line x1="90.0" y1="460.0" x2="90.0" y2="136.0" stroke="#c8b9d8" stroke-width="2" marker-end="url(#s)"/><text x="460.0" y="466.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">x₁</text><text x="112.0" y="100.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="start">x₂</text><text x="158.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">2</text><text x="78.0" y="397.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">2</text><text x="226.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">4</text><text x="78.0" y="329.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">4</text><text x="294.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">6</text><text x="78.0" y="261.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">6</text><text x="362.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">8</text><text x="78.0" y="193.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">8</text><text x="430.0" y="484.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">10</text><text x="78.0" y="125.0" fill="#c8b9d8" font-family="system-ui, sans-serif" font-size="12" font-weight="normal" text-anchor="end">10</text><line x1="90.0" y1="324.0" x2="192.0" y2="460.0" stroke