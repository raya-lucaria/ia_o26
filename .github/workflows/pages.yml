name: Verify and publish course

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Guardas de regresión del contenido: créditos completos, imágenes en uso,
  # fechas verificadas, SVG legibles. Las que necesitan el CLI `raya` o un
  # artifact/ construido se saltan solas — de eso se encarga course-pages.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # pypdf: las guardas de los cuadernillos abren el PDF publicado para
      # comparar su número real de páginas con la cifra que declaran la página
      # del curso, la tarea, el visor y los dos READMEs.
      - run: pip install pytest pillow pyyaml pypdf
      - run: pip install -r tools/requirements-regresion.txt
      - run: python -m pytest tools/ -q

  # `needs: checks` es lo que convierte las pruebas en una compuerta real. Sin
  # esa línea ambos trabajos corren en paralelo y el sitio se publica aunque la
  # suite falle — que es exactamente lo que pasaba antes de añadirla.
  # El SHA fijado es el commit del framework que construye el sitio. Subirlo
  # trae los cambios del framework; 4566103 es el que deja de partir palabras
  # letra por letra dentro de las celdas de tabla (las trazas de juegos), y
  # trae también los enlaces externos en pestaña nueva de af1dfe9.
  course-pages:
    needs: checks
    uses: raya-lucaria/raya-lucaria.github.io/.github/workflows/reusable-course-pages.yml@45661034e3cbc68f889e2e1f4a3b87b5e8ba59df
    with:
      course_path: .
    permissions:
      contents: read
      pages: write
      id-token: write
