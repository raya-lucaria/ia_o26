name: Verify and publish course

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Guardas de regresión del contenido: créditos completos, imágenes en uso,
  # fechas verificadas, SVG legibles. Las que necesitan el CLI `raya` o un
  # artifact/ construido se saltan solas — de eso se encarga course-pages.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # pypdf: las guardas de los cuadernillos abren el PDF publicado para
      # comparar su número real de páginas con la cifra que declaran la página
      # del curso, la tarea, el visor y los dos READMEs.
      - run: pip install pytest pillow pyyaml pypdf
      - run: python -m pytest tools/ -q

  # `needs: checks` es lo que convierte las pruebas en una compuerta real. Sin
  # esa línea ambos trabajos corren en paralelo y el sitio se publica aunque la
  # suite falle — que es exactamente lo que pasaba antes de añadirla.
  course-pages:
    needs: checks
    uses: raya-lucaria/raya-lucaria.github.io/.github/workflows/reusable-course-pages.yml@6b8b29b1c73648490a733b3a6344fc37f24dbf00
    with:
      course_path: .
    permissions:
      contents: read
      pages: write
      id-token: write
